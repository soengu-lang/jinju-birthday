<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2b3a67">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="우리집 가계부">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>우리집 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ed; --card:#fffdf8; --ink:#1e2430; --muted:#6f7683;
  --navy:#2b3a67; --navy-d:#212d51; --soft:#e9edf7; --soft-d:#d4dcef;
  --spend:#d1543f; --spend-s:#fceeea; --income:#2e7d6b; --income-s:#e6f2ee;
  --gold:#e08b2e; --gold-s:#fdf1e0;
  --line:#e5e2d8; --shadow:0 1px 2px rgba(30,36,48,.06), 0 8px 22px rgba(30,36,48,.06);
  --r:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--soft-d);outline-offset:1px}
textarea{resize:vertical;min-height:80px}
.wrap{max-width:920px;margin:0 auto;padding:0 14px}
.hidden{display:none !important}

/* ---------- header ---------- */
header{background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.head-in{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:14px 0 12px}
.brand{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.02em}
h1{font-size:clamp(17px,4.6vw,22px);font-weight:900;letter-spacing:-.03em;margin-top:2px;white-space:nowrap}
.head-meta{text-align:right;font-size:clamp(9.5px,2.6vw,11.5px);color:var(--muted);white-space:nowrap}
.head-meta b{color:var(--navy);font-weight:700}
.gear{font-size:18px;padding:4px 6px;border-radius:8px}
.gear:hover{background:var(--soft)}

/* ---------- tabs ---------- */
nav.tabs{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 0 8px;
  box-shadow:0 6px 14px -12px rgba(0,0,0,.4)}
.tabbar{display:flex;gap:4px;background:var(--soft);border-radius:14px;padding:4px}
.tabbar button{flex:1;padding:9px 4px;border-radius:11px;font-size:12.5px;font-weight:700;color:var(--navy-d);
  white-space:nowrap;transition:.15s}
.tabbar button.on{background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(43,58,103,.3)}

/* ---------- generic ---------- */
main{padding-top:6px}
section.pane{padding-bottom:34px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px}
.stack>*+*{margin-top:12px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 2px 8px}
.sec-title h2{font-size:15px;font-weight:900}
.sec-title p{font-size:11.5px;color:var(--muted);font-weight:400}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{background:var(--navy);color:#fff;border-radius:11px;padding:10px 14px;font-size:13px;font-weight:700;
  display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:.15s}
.btn:hover{background:var(--navy-d)}
.btn.gold{background:var(--gold)}.btn.gold:hover{background:#c9781f}
.btn.red{background:var(--spend)}.btn.red:hover{background:#b94733}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:9px}
.btn.block{width:100%}
.chip{background:var(--soft);color:var(--navy-d);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;
  white-space:nowrap}
.chip.on{background:var(--navy);color:#fff}
.chip.line{background:#fff;border:1px solid var(--line)}
.tag{background:var(--soft);color:var(--navy-d);border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:700}
.tag.warn{background:var(--spend-s);color:var(--spend)}
.tag.ok{background:var(--income-s);color:var(--income)}
.tag.soon{background:var(--gold-s);color:#b5701c}
.muted{color:var(--muted)}
.tiny{font-size:11px}
.empty{text-align:center;color:var(--muted);font-size:12.5px;padding:26px 10px;line-height:1.7}
.scroller{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}

/* ---------- banner ---------- */
.banner{background:var(--navy);color:#fff;border-radius:var(--r);padding:15px 16px}
.banner .b1{font-size:11.5px;opacity:.8;font-weight:700}
.banner .b2{font-size:29px;font-weight:900;letter-spacing:-.03em;margin-top:2px}
.banner .b3{font-size:12px;opacity:.88;margin-top:6px;line-height:1.6}
.banner b{color:#ffd9a8}
.bar{height:9px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;border-radius:99px;background:#8fb8ff;transition:width .3s}
.bar>i.over{background:#ff9b86}
.bar.plain{background:var(--soft)}
.bar.plain>i{background:var(--navy)}
.bar.plain>i.over{background:var(--spend)}

/* ---------- kpi ---------- */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 8px;text-align:center}
.kpi .n{font-size:16px;font-weight:900;letter-spacing:-.02em}
.kpi .l{font-size:10.5px;color:var(--muted);margin-top:2px}
.kpi .n.red{color:var(--spend)}.kpi .n.blue{color:var(--income)}.kpi .n.gold{color:var(--gold)}

/* ---------- quick input ---------- */
.amt-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:10px 13px}
.amt-box input{border:none;padding:0;font-size:26px;font-weight:900;text-align:right;letter-spacing:-.02em;
  background:transparent}
.amt-box input:focus{outline:none}
.amt-box .won{font-size:15px;font-weight:800;color:var(--muted);flex:none}
.type-seg{display:flex;gap:4px;background:var(--soft);border-radius:11px;padding:3px}
.type-seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:12px;font-weight:800;color:var(--navy-d)}
.type-seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.type-seg button.on.spend{color:var(--spend)}
.type-seg button.on.income{color:var(--income)}

/* ---------- list ---------- */
.day-head{display:flex;justify-content:space-between;align-items:baseline;padding:9px 12px 5px;
  font-size:11.5px;font-weight:800;color:var(--muted)}
.tx{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);width:100%;
  text-align:left}
.tx:last-child{border-bottom:none}
.tx:hover{background:#faf9f3}
.ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:none;
  background:var(--soft)}
.tx .nm{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.tx .sub{font-size:11px;color:var(--muted);margin-top:1px}
.tx .amt{font-size:14px;font-weight:900;white-space:nowrap;letter-spacing:-.02em}
.amt.spend{color:var(--ink)}
.amt.income{color:var(--income)}

/* ---------- month nav ---------- */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mnav .t{font-size:15px;font-weight:900}
.arrow{width:32px;height:32px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;font-size:14px;flex:none}
.arrow:hover{background:var(--soft)}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);padding:3px 0}
.cal .wd.sun{color:var(--spend)}.cal .wd.sat{color:#4a6fa8}
.cell{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:58px;padding:5px 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.cell.pad{background:transparent;border-color:transparent}
.cell .d{font-size:10.5px;font-weight:800;color:var(--muted)}
.cell.today{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-s)}
.cell.sel{border-color:var(--navy);box-shadow:0 0 0 2px var(--soft-d)}
.cell .v{font-size:10px;font-weight:800;color:var(--spend);letter-spacing:-.03em;line-height:1.25}
.cell .vi{font-size:10px;font-weight:800;color:var(--income);letter-spacing:-.03em;line-height:1.25}
.cell .zero{font-size:12px}

/* ---------- analysis ---------- */
.catrow{display:flex;align-items:center;gap:9px;margin-top:10px}
.catrow .cl{font-size:11.5px;font-weight:700;width:82px;flex:none;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.catrow .cv{font-size:11.5px;font-weight:800;width:92px;text-align:right;flex:none;letter-spacing:-.02em}
.catbar{height:9px;border-radius:99px;background:var(--soft);overflow:hidden;flex:1}
.catbar>i{display:block;height:100%;border-radius:99px}
.wkbars{display:flex;align-items:flex-end;gap:7px;height:92px;margin-top:8px}
.wkbars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.wkbars .bb{width:100%;background:var(--soft-d);border-radius:6px 6px 0 0;min-height:3px}
.wkbars .bb.max{background:var(--navy)}
.donut{width:132px;height:132px;flex:none}
.legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.legend .lg{display:flex;align-items:center;gap:7px;font-size:11.5px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.delta{font-size:11px;font-weight:800}
.delta.up{color:var(--spend)}.delta.down{color:var(--income)}

/* ---------- budget ---------- */
.bline{padding:11px 12px;border-bottom:1px solid var(--line)}
.bline:last-child{border-bottom:none}
.bline .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bline .t .n{font-size:13px;font-weight:800}
.bline .t .v{font-size:11.5px;color:var(--muted);font-weight:700}
.bline .t .v b{color:var(--ink)}
.bline .t .v.over b{color:var(--spend)}
.bw{width:96px;flex:none}
.fx{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
.fx:last-child{border-bottom:none}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(22,27,38,.55);backdrop-filter:blur(2px);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.mask{align-items:center;padding:20px}}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;max-height:92vh;
  overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@media(min-width:640px){.modal{border-radius:20px;max-height:88vh}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.mhead h3{font-size:18px;font-weight:900;letter-spacing:-.02em}
.x{font-size:19px;color:var(--muted);padding:2px 6px;line-height:1}
.field{margin-top:11px}
.field label{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.box{background:#fbfaf3;border:1px solid var(--line);border-radius:12px;padding:11px}
.note{background:var(--gold-s);border-radius:10px;padding:9px 11px;font-size:11.5px;font-weight:700;color:#a2661c;
  line-height:1.6}
.note b{color:var(--gold)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.keypad button{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 0;font-size:16px;
  font-weight:800}
.keypad button:hover{background:var(--soft)}
.keypad button.act{background:var(--soft);font-size:13px;font-weight:800}
.imp-table{width:100%;border-collapse:collapse;font-size:11px}
.imp-table th,.imp-table td{border:1px solid var(--line);padding:4px 6px;text-align:left;white-space:nowrap;
  max-width:110px;overflow:hidden;text-overflow:ellipsis}
.imp-table th{background:var(--soft);font-weight:800}
.imp-scroll{overflow-x:auto;border-radius:10px;margin-top:8px}
.map-row{display:grid;grid-template-columns:1fr 1.1fr;gap:7px;align-items:center;margin-top:6px}
.map-row .h{font-size:11.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-row .h span{display:block;font-weight:400;color:var(--muted);font-size:10.5px}
.map-row select{padding:7px 9px;font-size:12px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));
  background:var(--navy-d);color:#fff;padding:11px 18px;border-radius:999px;font-size:12.5px;font-weight:700;
  z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s;max-width:88vw;
  text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;padding:14px 20px;
  font-size:14px;border-radius:999px;box-shadow:0 8px 20px rgba(43,58,103,.42)}

/* ---------- v2: 매트릭스 · 자산 · 고정비 · 목표 ---------- */
.line-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);
  width:100%;text-align:left}
.line-item:last-child{border-bottom:none}
.line-item:hover{background:#faf9f3}
.line-item .nm{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.line-item .sub{font-size:11px;color:var(--muted);margin-top:1px}
.line-item .val{font-size:14px;font-weight:900;white-space:nowrap;letter-spacing:-.02em}
.line-item .val.zero{color:#c3c0b4;font-weight:700}
.line-item .val.carry{color:var(--muted);font-weight:700}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;
  background:var(--soft);border-radius:15px 15px 0 0}
.sec-head .t{font-size:13px;font-weight:900}
.sec-head .v{font-size:13px;font-weight:900}
.sec-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;
  border-top:1px solid var(--line);font-size:12px;font-weight:800;color:var(--muted)}
.sum4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sum4>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.sum4 .l{font-size:11px;color:var(--muted);font-weight:700}
.sum4 .n{font-size:17px;font-weight:900;letter-spacing:-.03em;margin-top:2px}
.mx-scroll{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--card)}
table.mx{border-collapse:collapse;font-size:11.5px;white-space:nowrap;min-width:100%}
table.mx th,table.mx td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right}
table.mx th:first-child,table.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--card);
  font-weight:700;box-shadow:1px 0 0 var(--line)}
table.mx thead th{background:var(--soft);font-weight:800;font-size:11px;color:var(--navy-d);
  position:sticky;top:0;z-index:1}
table.mx thead th:first-child{z-index:2;background:var(--soft)}
table.mx tr.sec td{background:#f6f4ec;font-weight:900;color:var(--navy-d)}
table.mx tr.sec td:first-child{background:#f6f4ec}
table.mx tr.tot td{font-weight:900;background:#fbfaf3}
table.mx tr.tot td:first-child{background:#fbfaf3}
table.mx td.z{color:#c9c6b8}
table.mx td.now{background:var(--gold-s)}
.spark{width:100%;height:74px;display:block}
.stat-line{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;
  border-bottom:1px dashed var(--line);font-size:12.5px}
.stat-line:last-child{border-bottom:none}
.stat-line b{font-weight:900;font-size:13.5px}
.badge{border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:800;white-space:nowrap}
.badge.keep{background:var(--income-s);color:var(--income)}
.badge.check{background:var(--gold-s);color:#b5701c}
.badge.alert{background:var(--spend-s);color:var(--spend)}
.badge.auto{background:var(--soft);color:var(--navy-d)}
.who{font-size:10.5px;font-weight:800;color:var(--muted)}
.habit{padding:11px 12px;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:none}
.habit .top{display:flex;align-items:center;gap:9px}
.habit .nm{font-size:13px;font-weight:800;flex:1;min-width:0}
.habit .cnt{font-size:13px;font-weight:900;min-width:34px;text-align:center}
.rbtn{width:30px;height:30px;border-radius:9px;background:var(--soft);font-weight:900;color:var(--navy-d);
  display:grid;place-items:center;flex:none;font-size:15px}
.rbtn:hover{background:var(--soft-d)}
.rbtn.on{background:var(--navy);color:#fff}
.simrow{display:grid;grid-template-columns:38px 1fr 1fr 74px;gap:6px;align-items:center;padding:7px 2px;
  border-bottom:1px dashed var(--line);font-size:11.5px}
.simrow:last-child{border-bottom:none}
.simrow .y{font-weight:800;color:var(--muted)}
.simrow .b{font-weight:800;text-align:right}
.pillbar{height:7px;border-radius:99px;background:var(--soft);overflow:hidden}
.pillbar>i{display:block;height:100%;border-radius:99px;background:var(--navy)}
.mtitle{display:inline-flex;align-items:center;gap:5px;font-size:15px;font-weight:900;padding:6px 12px;
  border-radius:11px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.mtitle:hover{background:var(--soft)}
.mtitle .caret{font-size:10px;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:4px}
.mgrid button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.mgrid button .mm{font-size:13.5px;font-weight:800}
.mgrid button .mv{font-size:10.5px;color:var(--muted);margin-top:2px;font-weight:700}
.mgrid button.on{background:var(--navy);border-color:var(--navy)}
.mgrid button.on .mm,.mgrid button.on .mv{color:#fff}
.mgrid button.today{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-s)}
.mgrid button.empty .mm{color:var(--muted)}
.memo-card{background:var(--gold-s);border:1px solid #f0dcbb;border-radius:var(--r);padding:13px 14px;
  font-size:12.5px;line-height:1.75;white-space:pre-wrap;color:#7a5514}
</style>
</head>
<body>

<header>
  <div class="wrap head-in">
    <div>
      <div class="brand">부부 자산 관리</div>
      <h1>우리집 가계부</h1>
    </div>
    <div class="row" style="gap:4px">
      <div class="head-meta" id="headMeta"></div>
      <button class="gear" data-act="settings" title="설정">⚙️</button>
    </div>
  </div>
</header>

<nav class="tabs">
  <div class="wrap">
    <div class="tabbar" id="tabbar">
      <button data-tab="home">🏠 홈</button>

function parseAmount(s){
  if(typeof s === 'number') return s;
  let t = String(s??'').trim();
  if(!t) return NaN;
  const neg = /^\(.*\)$/.test(t) || /^-/.test(t);
  t = t.replace(/[()\s,원]/g,'').replace(/^-/,'');
  if(!t) return NaN;
  let v;
  if(/[억만]/.test(t)){
    let sum = 0, rest = t;
    const e = rest.match(/^([0-9.]+)억/);
    if(e){ sum += parseFloat(e[1])*100000000; rest = rest.slice(e[0].length); }
    const m = rest.match(/^([0-9.]+)만/);
    if(m){ sum += parseFloat(m[1])*10000; rest = rest.slice(m[0].length); }
    else if(e && /^[0-9.]+$/.test(rest)){ sum += parseFloat(rest)*10000; rest = ''; }
    if(/^[0-9.]+$/.test(rest)) sum += parseFloat(rest);
    v = sum;
  } else {
    v = parseFloat(t.replace(/[^0-9.]/g,''));
  }
  if(!isFinite(v)) return NaN;
  v = Math.abs(v);
  return neg ? -v : v;
}

/* 붙여넣은 글 → [{date, memo, amount, type, skip}] */
function parseStatement(raw){
  const text = String(raw||'').replace(/\r/g,'');
  const smsMode = /web발신/i.test(text) || /\n\s*\n/.test(text);
  const out = [];
  const clean = line => {
    let t = line.replace(/\t/g,' ').trim();
    STMT_NOISE.forEach(re=>{ t = t.replace(re,' '); });
    return t.replace(/\s+/g,' ').trim();
  };
  const rest = (t, d, a) => {
    let r = t;
    if(d) r = r.replace(new RegExp(DATE_PAT.source,'g'),' ');
    /* 금액 자리는 모두 지운다 — 남은 숫자는 잔액·누적 칸이라 내용이 아니다 */
    if(a) r = r.replace(/([-+])?\s*((?:[0-9]{1,3}(?:,[0-9]{3})+)|[0-9]{3,})\s*원?/g,' ');
    return cleanMemo(r.replace(/,/g,' '));
  };
  if(smsMode){
    /* 문자 여러 통: 빈 줄이나 [Web발신]로 나눠 한 통을 한 건으로 */
    const blocks = text.split(/\n\s*\n|(?=\[?\s*web발신)/i).map(b=>b.trim()).filter(Boolean);
    blocks.forEach(b=>{
      const cancel = /취소/.test(b);
      let date='', amount=NaN, income=false, memo=[];
      b.split('\n').forEach(line0=>{
        const t = clean(line0);
        if(!t || /^(잔액|누적|합계|총액)/.test(t)) return;
        const d = grabDate(t);
        if(d && !date) date = d;
        const tNoDate = d ? t.replace(new RegExp(DATE_PAT.source,'g'),' ') : t;
        const a = grabAmount(tNoDate);
        if(a && !isFinite(amount)){ amount = a.v; income = a.income; }
        const m = rest(t, d, a);
        if(m) memo.push(m);
      });
      if(isFinite(amount) && amount>0)
        out.push({ date: date || iso(today()), memo: cleanMemo(memo.join(' ')), raw: memo.join(' '),
                   amount, type: income?'income':'expense', skip: cancel?'취소 건':'' });
    });
    return out;
  }
  /* 표(엑셀·CSV) 머리글을 만나면 칸 역할을 기억해 둔다 */
  let cols = null;
  const cellsOf = line => {
    const hasTab = /\t/.test(line);
    let raw = line;
    for(let i=0;i<5;i++) raw = raw.replace(/(\d),(\d{3})(?!\d)/g,'$1$2');   /* 1,234,567 → 1234567 */
    raw = raw.replace(/\t/g,',');
    if(!hasTab && (raw.match(/,/g)||[]).length < 2) return null;
    const cs = raw.split(',').map(c=>c.trim());
    return cs.length >= 3 ? cs : null;
  };
  const readHeader = cs => {
    if(!cs || cs.some(c=>grabAmount(c))) return null;
    const role = cs.map(c=>{
      if(/거래\s*일|이용\s*일|승인\s*일|일자|날짜|date/i.test(c)) return 'date';
      if(/입금|수입/.test(c)) return 'in';        /* 입금액에 '금액'이 들어 있어 먼저 본다 */
      if(/출금|사용|이용\s*금액|결제\s*금액|지출|금액|amount/i.test(c)) return 'out';
      if(/적요|내용|가맹점|상호|메모|摘要|내역|사용처/.test(c)) return 'memo';
      return '';
    });
    return role.includes('date') && (role.includes('out') || role.includes('in')) ? role : null;
  };
  const parseRow = cs => {
    let date='', amount=NaN, income=false, memo='', texts=[];
    cs.forEach((c,i)=>{
      if(!c) return;
      const role = cols? cols[i] : '';
      const d = grabDate(c);
      const isNum = /^[-+]?[0-9][0-9,]*$/.test(c.replace(/\s|원/g,''));
      if(role==='date' || (!cols && d && !date && !isNum)){ if(d && !date) date = d; return; }
      if(isNum){
        const v = Math.abs(parseInt(c.replace(/[^0-9\-]/g,''),10));
        if(!isFinite(v) || v < 100) return;
        if(role==='in'){ if(!isFinite(amount)){ amount=v; income=true; } return; }
        if(role==='out'){ if(!isFinite(amount)){ amount=v; income=false; } return; }
        if(!cols && !isFinite(amount)){ amount=v; income=/^\+/.test(c); }
        return;
      }
      if(d && !date){ date = d; return; }
      if(role==='memo') memo = c; else texts.push(c);
    });
    if(!memo) memo = texts.sort((a,b)=>b.length-a.length)[0] || '';
    if(!isFinite(amount) || amount<=0) return null;
    return { date: date||'', memo: cleanMemo(memo), raw: memo, amount,
             type: income?'income':'expense', skip: cs.some(c=>/취소/.test(c))? '취소 건':'' };
  };

  /* 앱에서 복사한 목록: 금액이 나오면 한 건이 끝난 것으로 본다 */
  let cur = null, lastDate = '';
  const start = () => ({ date:lastDate, memo:'', amount:NaN, type:'expense', skip:'' });
  const close = () => {
    if(cur && isFinite(cur.amount) && cur.amount>0){
      cur.memo = cleanMemo(cur.memo);
      if(!cur.date) cur.date = lastDate || iso(today());
      out.push(cur);
    }
    cur = null;
  };
  text.split('\n').forEach(line0=>{
    const t = clean(line0);
    if(!t || /^(잔액|누적|합계|총액|거래내역|전체|검색)/.test(t)) return;
    if(/조회기간|조회일|출력일|이용내역|거래내역|고객명|카드번호|계좌번호|기간\s*:/.test(t)) return;
    /* 표 한 줄이면 칸 단위로 읽는다 */
    const cs = cellsOf(line0);
    if(cs){
      const head = readHeader(cs);
      if(head){ cols = head; return; }
      const row = parseRow(cs);
      if(row){
        close();
        if(!row.date) row.date = lastDate || iso(today()); else lastDate = row.date;
        out.push(row);
        return;
      }
      if(cols) return;               /* 표인데 못 읽은 줄은 건너뛴다 */
    }
    const cancel = /취소/.test(t);
    const d = grabDate(t);
    const tNoDate = d ? t.replace(new RegExp(DATE_PAT.source,'g'),' ') : t;
    const a = grabAmount(tNoDate);
    if(!cur) cur = start();
    if(d){
      if(isFinite(cur.amount)){ close(); cur = start(); }
      cur.date = d; lastDate = d;
    }
    const m = rest(t, d, a);
    if(a){
      if(isFinite(cur.amount)){ close(); cur = start(); }
      cur.amount = a.v; cur.type = a.income? 'income':'expense';
      if(cancel) cur.skip = '취소 건';
      if(m) cur.memo = (cur.memo? cur.memo+' ':'') + m;
      if(d) close();
    } else if(m){
      cur.memo = (cur.memo? cur.memo+' ':'') + m;
    }
  });
  close();
  return out;
}

function monthsToGoal(now, target, rate, monthly){
  const i = rate/12; let v = now, n = 0;
  if(v >= target) return 0;
  while(n < 1200){ v = v*(1+i) + monthly; n++; if(v >= target) return n; }
  return Infinity;
}
function goalSim(now, rate, monthly, years=10){
  const out = []; let base = now;
  for(let y=1; y<=years; y++){
    const yearSave = monthly*12;
    const gain = base*rate + yearSave*rate/2;
    const end = base + yearSave + gain;
    out.push({ y, year: state.year + y - 1, base, yearSave, gain, end });
    base = end;
  }
  return out;
}

  const m = state.inv?.map || {};
  const sig = invSig(r);
  if(Object.prototype.hasOwnProperty.call(m, sig))
    return (m[sig] && state.assetRows.some(x=>x.id===m[sig])) ? m[sig] : '';
  const os = state.settings.owners || [];
  /* 공동 명의는 첫 번째 사람 칸으로 보냅니다 (직접 바꿀 수 있어요) */
  const owner = os.includes(r.owner) ? r.owner : os[0];
  const pool = state.assetRows.filter(x=>x.owner===owner);
  /* ① ISA·연금저축·IRP 계좌에 든 것은 종목이 무엇이든 연금·ISA 칸으로 */
  if(/^(ISA|연금저축|IRP)$/.test(String(r.atype||''))){
    const hitP = pool.find(x=>/연금|ISA|IRP|퇴직/.test(x.name));
    if(hitP) return hitP.id;
  }
  /* ② 이름이 겹치는 항목 (예: '우리집 아파트' → '아파트') */
  const n = String(r.name||'');
  let hit = pool.find(x => x.name && (n.includes(x.name) || x.name.includes(n)));
  if(hit) return hit.id;
  /* ③ 종류 규칙으로 */
  hit = pool.find(x => invCat(r.cat).match.test(x.name));
  return hit ? hit.id : '';
}
/* 반영할 것들을 항목별로 묶기 → [{ rowId, name, owner, sum, from:[] }] */
function invPlan(){
  const V = state.inv;
  if(!V?.enabled || !V.rows?.length) return [];
  const g = {};
  V.rows.forEach(r=>{
    if(!(+r.value > 0)) return;
    const id = invRowTarget(r);
    (g[id] = g[id] || { rowId:id, sum:0, from:[] });
    g[id].sum += +r.value || 0;
    g[id].from.push(r);
  });
  return Object.values(g).map(x=>{
    const row = state.assetRows.find(y=>y.id===x.rowId);
    return { ...x, name: row? row.name : '', owner: row? row.owner : '', ok: !!row };
  }).sort((a,b)=>b.sum-a.sum);
}

/* ============================================================
   3. 공통 그리기 조각
   ============================================================ */
function donut(parts, total, centerTop, centerBottom){
  const R=54, C=2*Math.PI*R; let off=0;
  const arcs = parts.slice(0,7).map(p=>{
    const len = total? C*p.v/total : 0;
    const s = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${p.color}" stroke-width="21"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 70 70)"></circle>`;
    off += len; return s;
  }).join('');
  return `<svg class="donut" viewBox="0 0 140 140">
    <circle r="${R}" cx="70" cy="70" fill="none" stroke="#e9edf7" stroke-width="21"></circle>${arcs}
    <text x="70" y="66" text-anchor="middle" font-size="10" fill="#6f7683" font-weight="700">${esc(centerTop)}</text>
    <text x="70" y="84" text-anchor="middle" font-size="13" fill="#1e2430" font-weight="900">${esc(centerBottom)}</text>
  </svg>`;
}
function sparkline(vals, labels){
  const W=320, H=74, P=6;
  const mn = Math.min(...vals), mx = Math.max(...vals), sp = (mx-mn)||1;
  const x = i => P + i*(W-2*P)/Math.max(1,vals.length-1);
  const y = v => H-P - (v-mn)/sp*(H-2*P-10);
  const pts = vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area = `${P},${H-P} ${pts} ${x(vals.length-1).toFixed(1)},${H-P}`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polygon points="${area}" fill="#2b3a67" opacity=".10"></polygon>
    <polyline points="${pts}" fill="none" stroke="#2b3a67" stroke-width="2" stroke-linejoin="round"></polyline>
    ${vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i===vals.length-1?3.4:2}"
      fill="${i===vals.length-1?'#e08b2e':'#2b3a67'}"></circle>`).join('')}
  </svg>`;
}

/* ---------- 4-3. 자산 ---------- */
function viewAsset(){
  const keys = assetKeys();
  if(!ui.aKey || !keys.includes(ui.aKey)) ui.aKey = latestAssetKey();
  const i = keys.indexOf(ui.aKey), prev = keys[Math.max(0,i-1)];
  const cur = ui.aKey;
  const tot = assetTotal(cur), debt = debtTotal(cur), nw = netWorth(cur);
  const dNw = nw - netWorth(prev);
  const mix = assetMix(cur), mixTot = mix.reduce((a,b)=>a+b.v,0);
  const trendKeys = keys.slice(0, Math.max(1, latestAssetKey()==='init'?1:keys.indexOf(latestAssetKey())+1));
  const owners = [...(state.settings.owners||[]), '부채'];
  if(ui.aAnnual) return viewAssetAnnual();

  return `<section class="pane">
    <div class="mnav">
      <button class="arrow" data-act="aMove" data-d="-1" ${i<=0?'disabled style="opacity:.35"':''}>‹</button>
      <button class="mtitle" data-act="pickAsset">${assetKeyLabel(cur)} 자산<span class="caret">▼</span></button>
      <button class="arrow" data-act="aMove" data-d="1" ${i>=keys.length-1?'disabled style="opacity:.35"':''}>›</button>
    </div>
    <div class="banner">
      <div class="b1">💎 순자산</div>
      <div class="b2">${bigWon(nw)}<span style="font-size:17px">원</span></div>
      <div class="b3">총자산 ${bigWon(tot)}원 − 부채 ${bigWon(debt)}원
        · 지난달 대비 <b>${dNw>=0?'+':''}${bigWon(dNw)}원</b></div>
    </div>

    ${invCard(cur)}

    ${owners.map(o=>{
      const rows = ownerRows(o);
      if(!rows.length && o==='부채') return '';
      const sub = ownerTotal(o,cur);
      const emoji = o==='부채' ? '💳' : (o===(state.settings.owners||[])[0] ? '👩' : '👨');
      return `<div class="card" style="margin-top:12px">
        <div class="sec-head"><div class="t">${emoji} ${esc(o)}${o==='부채'?'':' 자산'}</div>
          <div class="v" style="color:${o==='부채'?'var(--spend)':'var(--navy)'}">${bigWon(sub)}원</div></div>
        ${rows.map(r=>{
          const c = assetCarry(r.id, cur), raw = assetRaw(r.id,cur);
          return `<button class="line-item" data-act="aCell" data-id="${r.id}">
            <div class="grow"><div class="nm">${esc(r.name)}</div>
              ${c.carried && c.v? `<div class="sub">${assetKeyLabel(lastKeyWithValue(r.id,cur))} 값 이어짐</div>`:''}</div>
            <div class="val ${raw===undefined? (c.v?'carry':'zero') : ''}">${c.v? num(c.v):'—'}</div></button>`;
        }).join('')}
        <div class="sec-foot"><button class="chip line" data-act="addAssetRow" data-owner="${esc(o)}">＋ 항목 추가</button>
          ${i>0? `<button class="chip line" data-act="aFillPrev" data-owner="${esc(o)}">지난달 값 채우기</button>`:''}</div>
      </div>`;
    }).join('')}

    ${mixTot? `<div class="sec-title"><h2>자산 구성</h2></div>
      <div class="card pad">
        <div class="row" style="gap:14px">
          ${donut(mix, mixTot, '총자산', bigWon(mixTot))}
          <div class="legend">
            ${mix.map(p=>`<div class="lg"><span class="dot" style="background:${p.color}"></span>
              <span class="grow">${esc(p.label)}</span><b>${pctS(p.v/mixTot,0)}</b></div>`).join('')}

        </div>
        ${mix.map(p=>`<div class="catrow"><div class="cl">${esc(p.label)}</div>
          <div class="catbar"><i style="width:${(p.v/mix[0].v*100).toFixed(1)}%;background:${p.color}"></i></div>
          <div class="cv">${bigWon(p.v)}</div></div>`).join('')}
      </div>`:''}

    ${trendKeys.length>1? `<div class="sec-title"><h2>순자산 추이</h2></div>
      <div class="card pad">${sparkline(trendKeys.map(k=>netWorth(k)))}
        <div class="row" style="justify-content:space-between;margin-top:4px">
          <span class="tiny muted">${assetKeyLabel(trendKeys[0])}</span>
          <span class="tiny muted">${assetKeyLabel(trendKeys[trendKeys.length-1])}</span></div>
      </div>`:''}

    <button class="btn ghost block sm" style="margin-top:14px" data-act="aAnnual">📅 1년 전체 보기 (시트처럼)</button>
  </section>`;
}
function lastKeyWithValue(rowId, key){
  const keys = assetKeys(), end = keys.indexOf(key);
  for(let i=end;i>=0;i--) if(assetRaw(rowId,keys[i])!==undefined) return keys[i];
  return keys[0];
}
function viewAssetAnnual(){
  const keys = assetKeys();
  const owners = [...(state.settings.owners||[]), '부채'];
  const head = `<tr><th>구분</th>${keys.map(k=>`<th>${assetKeyLabel(k).replace(/\(.*\)/,'')}</th>`).join('')}</tr>`;
  const body = owners.map(o=>{
    const rows = ownerRows(o).map(r=>`<tr><td>${esc(r.name)}</td>${keys.map(k=>{
      const raw = assetRaw(r.id,k);
      return `<td class="${raw===undefined?'z':''}">${raw!==undefined? num(raw):'·'}</td>`;

    return `<tr class="sec"><td>${o==='부채'?'💳':'👤'} ${esc(o)}</td>${'<td></td>'.repeat(keys.length)}</tr>${rows}

      빈 칸(·)은 그 달에 적지 않은 항목이에요. 소계는 가장 최근 값으로 계산합니다.</div>

/* ---------- 5-4. 시트 가져오기 (표 붙여넣기) ---------- */
function splitLine(line, delim){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(q){ if(ch === '"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur += ch; }
    else if(ch === '"') q = true;
    else if(ch === delim){ out.push(cur); cur=''; }
    else cur += ch;
  }
  out.push(cur); return out;
}
function parseTable(text){
  const lines = String(text||'').replace(/\r/g,'').split('\n').filter(l=>l.trim()!=='');
  if(!lines.length) return [];
  const delim = lines[0].includes('\t') ? '\t' : (lines[0].split(',').length>1 ? ',' : '\t');
  return lines.map(l=>splitLine(l,delim).map(c=>c.trim()));
}
const normName = s => String(s||'').replace(/[\s·・(){}\[\]]/g,'').replace(/[0-9]+\./,'').toLowerCase();
function parseNum(s){
  const t = String(s||'').replace(/[^0-9.\-]/g,'');
  if(t==='' || t==='-') return null;
  const v = parseFloat(t);
  return isFinite(v)? Math.round(v) : null;
}
/* 머리글에서 월 열 찾기 */
function monthCols(row){
  const map = {};
  row.forEach((h,i)=>{
    const t = String(h||'').replace(/\s/g,'');
    if(/초기/.test(t)){ map[i]='init'; return; }
    let m = t.match(/^(\d{1,2})월$/) || t.match(/^20\d\d[.\-\/](\d{1,2})/) || t.match(/^(\d{1,2})$/);
    if(m){ const n=+m[1]; if(n>=1 && n<=12) map[i]=mk(n); }
  });
  return map;
}

function buildImport(text){
  const rows = parseTable(text);
  if(rows.length < 2){ toast('표를 읽지 못했어요'); return; }
  let hi = -1, cols = {};
  for(let i=0;i<Math.min(6,rows.length);i++){
    const c = monthCols(rows[i]);
    if(Object.keys(c).length >= 2){ hi=i; cols=c; break; }
  }
  if(hi < 0){ toast('월(1월, 2026.1 …) 머리글을 찾지 못했어요'); return; }
  const isLedger = imp.target==='ledger';
  const pool = isLedger ? state.items : state.assetRows;
  const colIdx = Object.keys(cols).map(Number);
  const firstCol = Math.min(...colIdx);
  const plan = [];
  let section = isLedger ? 'living' : (state.settings.owners||[])[0];
  for(let r=hi+1;r<rows.length;r++){
    const row = rows[r];
    const head = row.slice(0, firstCol).filter(v=>v).join(' ');
    if(!head) continue;
    if(/수입/.test(head) && isLedger && /^\W*\d?\.?\s*수입/.test(head.replace(/[💰🔁💎🛒]/g,'').trim())) { section='income'; }
    if(isLedger){
      if(/고정비/.test(head) && !row.slice(firstCol).some(v=>parseNum(v)!==null)) { section='fixed'; continue; }
      if(/저축|투자/.test(head) && !row.slice(firstCol).some(v=>parseNum(v)!==null)) { section='save'; continue; }
      if(/생활비/.test(head) && !row.slice(firstCol).some(v=>parseNum(v)!==null)) { section='living'; continue; }
      if(/수입/.test(head) && !row.slice(firstCol).some(v=>parseNum(v)!==null)) { section='income'; continue; }
    } else {
      if(/진주|아내|👩/.test(head)) { section=(state.settings.owners||[])[0]; continue; }
      if(/성우|남편|👨/.test(head)) { section=(state.settings.owners||[])[1]; continue; }
      if(/부채|💳/.test(head)) { section='부채'; continue; }
    }
    if(/합계|소계|총자산|순자산|전월|비중|평균/.test(head)) continue;
    /* 이름 = 머리글 칸들 중 마지막 글자 칸 */
    const nameCell = row.slice(0, firstCol).filter(v=>v).pop() || '';
    const name = String(nameCell).trim();
    if(!name) continue;
    const hit = pool.find(p=>normName(p.name)===normName(name));
    const vals = {};
    colIdx.forEach(ci=>{ const v = parseNum(row[ci]); if(v!==null) vals[cols[ci]] = v; });
    if(!Object.keys(vals).length && hit) continue;
    plan.push({ name, id: hit? hit.id : null, section, vals });
  }
  imp.plan = plan;
  imp.cells = plan.reduce((s,p)=>s+Object.keys(p.vals).length, 0);
  drawImportPreview();
}

function runImport(){
  const isLedger = imp.target==='ledger';
  let filled=0, added=0;
  imp.plan.forEach(p=>{
    let id = p.id;
    if(!id){
      id = uid(); added++;
      if(isLedger) state.items.push({ id, section:p.section, name:p.name, auto:false });
      else state.assetRows.push({ id, owner:p.section, name:p.name });
    }
    Object.entries(p.vals).forEach(([k,v])=>{
      if(isLedger){
        /* 상세 기록이 있으면 그만큼 빼서, 이 달 합계가 시트 값과 똑같아지게 한다 */
        const extra = entriesOf(id,k).reduce((s2,e)=>s2+(+e.amount||0),0) + linkVal(id,k);
        state.cells[`${id}|${k}`] = Math.max(0, v - extra);
      } else state.assetCells[`${id}|${k}`] = v;
      filled++;
    });
  });
  save(); closeModal(); render();
  toast(`${filled}칸 가져왔어요${added?` · 새 항목 ${added}개`:''}`);
}

function ledgerCsv(){
  const rows = [['구분','자동이체','항목',...Array.from({length:12},(_,i)=>`${i+1}월`),'합계']];
  SECTIONS.forEach(sec=>{
    itemsOf(sec.key).forEach(i=>{
      const vals = Array.from({length:12},(_,m)=>cellVal(i.id,mk(m+1)));
      rows.push([sec.label.slice(2).trim(), i.auto?'Y':'', i.name, ...vals.map(v=>String(v||'')),
                 String(vals.reduce((a,b)=>a+b,0))]);
    });
    const tot = Array.from({length:12},(_,m)=>sectionTotal(sec.key,mk(m+1)));
    rows.push(['합계','',`${sec.label.slice(2).trim()} 합계`, ...tot.map(String), String(tot.reduce((a,b)=>a+b,0))]);
  });
  return rows;
}
function assetCsv(){
  const keys = assetKeys();
  const rows = [['구분','항목',...keys.map(assetKeyLabel)]];
  [...(state.settings.owners||[]),'부채'].forEach(o=>{
    ownerRows(o).forEach(r=>rows.push([o, r.name, ...keys.map(k=>{
      const v = assetRaw(r.id,k); return v===undefined? '' : String(v); })]));
    rows.push(['소계', `${o} 소계`, ...keys.map(k=>String(ownerTotal(o,k)))]);
  });
  rows.push(['종합','순자산', ...keys.map(k=>String(netWorth(k)))]);
  return rows;
}

/* 카드사·은행 파일은 한글이 EUC-KR(CP949)로 저장된 경우가 많아 둘 다 시도한다 */
function decodeSmart(buf){
  const utf8 = new TextDecoder('utf-8').decode(buf);
  const bad = (utf8.match(/\uFFFD/g) || []).length;
  if(!bad) return utf8;
  try{
    const kr = new TextDecoder('euc-kr').decode(buf);
    return ((kr.match(/\uFFFD/g) || []).length < bad) ? kr : utf8;
  }catch(e){ return utf8; }
}
function loadScript(src){
  return new Promise((ok, no)=>{
    const el2 = document.createElement('script');
    el2.src = src; el2.onload = ok;
    el2.onerror = ()=>no(new Error('load'));
    document.head.appendChild(el2);
  });
}
/* 엑셀(.xlsx/.xls)은 표를 읽는 도구를 그때만 내려받아 CSV로 바꾼다 */
async function excelToText(file){
  if(!window.XLSX){
    toast('엑셀 읽는 중…');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  }
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:'array' });
  return wb.SheetNames.map(n=>XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n');
}
async function readStatementFile(file){
  const name = (file.name||'').toLowerCase();
  if(/\.xlsx?$/.test(name)){
    try{ return await excelToText(file); }
    catch(e){
      toast('엑셀을 읽지 못했어요 — 엑셀에서 열어 복사·붙여넣기 해주세요');
      return null;
    }
  }
  return decodeSmart(await file.arrayBuffer());
}

function buildStmtDraft(text){
  const recs = parseStatement(text);
  if(!recs.length){ toast('날짜와 금액을 찾지 못했어요'); return; }
  const have = new Set(state.entries.map(e=>`${e.date}|${Math.round(e.amount)}|${(e.memo||'').trim()}`));
  stmtDraft = recs.map(r=>{
    const guess = guessItemFor(r.memo, r.type, r.raw);
    const dup = have.has(`${r.date}|${Math.round(r.amount)}|${r.memo}`);
    return { ...r, dup, item: (r.skip || dup) ? '__skip__' : (guess || '') };
  });
  drawStmtPreview();
}
function runStmtImport(){
  const list = (stmtDraft||[]).filter(r=>r.item && r.item!=='__skip__');
  if(!list.length){ toast('넣을 것이 없어요'); return; }
  let n = 0;
  list.forEach(r=>{
    state.entries.push({ id:uid(), itemId:r.item, date:r.date, amount:r.amount, memo:r.memo });
    if(r.memo) (state.payeeMap = state.payeeMap||{})[payeeKey(r.memo)] = r.item;   /* 다음부터 자동 */
    n++;
  });
  /* 사용자가 직접 "넣지 않음"으로 둔 가게도 기억한다 (중복·취소 건은 제외) */
  (stmtDraft||[]).filter(r=>r.item==='__skip__' && !r.dup && !r.skip && r.memo)
    .forEach(r=>{ (state.payeeMap = state.payeeMap||{})[payeeKey(r.memo)] = '__skip__'; });
  stmtDraft = null;
  save(); closeModal(); render();
  toast(`${n}건 넣었어요`);
}

document.addEventListener('click', async (e)=>{
  const b = e.target.closest('[data-act], [data-tab]');
  if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if(b.dataset.tab && (!act || act==='tab')){ ui.tab = b.dataset.tab; render(); window.scrollTo(0,0); return; }

  switch(act){
  case 'close': closeModal(); break;
  case 'settings': openSettings(); break;
  case 'mMove': ui.m = Math.min(12, Math.max(1, (ui.m||nowMonthIdx()) + (+b.dataset.d))); render(); break;
  case 'aMove': { const k=assetKeys(); ui.aKey = k[Math.min(k.length-1, Math.max(0, k.indexOf(ui.aKey)+(+b.dataset.d)))];
    render(); break; }
  case 'annual': ui.annual = !ui.annual; render(); window.scrollTo(0,0); break;
  case 'aAnnual': ui.aAnnual = !ui.aAnnual; render(); window.scrollTo(0,0); break;
  case 'fFilter': ui.fixedFilter = b.dataset.v; render(); break;

  /* ---- 가계부 ---- */
  case 'cell': openCell(id); break;
  case 'cPlus': { const el=$('#cAmt'); el.value = num((parseAmount(el.value)||0) + (+b.dataset.n)); break; }
  case 'saveCell': {
    const v = parseAmount($('#cAmt').value)||0, key = `${id}|${mk(ui.m)}`;
    if(v) state.cells[key] = v; else delete state.cells[key];
    save(); closeModal(); render(); toast('저장했어요'); break;
  }
  case 'addEntry': {
    const amt = parseAmount($('#eAmt').value)||0;
    if(!amt){ toast('금액을 넣어 주세요'); break; }
    const d = today(); const day = Math.min(d.getDate(), 28);
    const date = ui.m===nowMonthIdx()? iso(d) : `${mk(ui.m)}-${pad2(day)}`;
    state.entries.push({ id:uid(), itemId:id, date, amount:amt, memo:$('#eMemo').value.trim() });
    save(); openCell(id); render(); toast('상세 기록을 더했어요'); break;
  }
  case 'delEntry': {
    const e2 = state.entries.find(x=>x.id===id); state.entries = state.entries.filter(x=>x.id!==id);
    save(); if(e2) openCell(e2.itemId); render(); break;
  }
  case 'renameItem': { const it=itemById(id); openRename('item', id, it.name); break; }
  case 'renameAsset': { const r=state.assetRows.find(x=>x.id===id); openRename('asset', id, r.name); break; }
  case 'doRename': {
    const v = $('#rnName').value.trim(); if(!v) break;
    if(b.dataset.kind==='item'){ itemById(id).name = v; }
    else { state.assetRows.find(x=>x.id===id).name = v; }
    save(); closeModal(); render(); break;
  }
  case 'delItem': {
    if(!confirm('이 항목과 올해 값이 모두 지워져요. 계속할까요?')) break;
    state.items = state.items.filter(i=>i.id!==id);
    Object.keys(state.cells).forEach(k=>{ if(k.startsWith(id+'|')) delete state.cells[k]; });
    state.entries = state.entries.filter(e=>e.itemId!==id);
    save(); closeModal(); render(); break;
  }
  case 'addItem': openItemForm(b.dataset.sec); break;
  case 'saveNewItem': {
    const name = $('#niName').value.trim(); if(!name){ toast('이름을 넣어 주세요'); break; }
    state.items.push({ id:uid(), section:b.dataset.sec, name, auto:$('#niAuto').checked });
    save(); closeModal(); render(); toast(`${name} 추가했어요`); break;
  }
  /* ---- 📋 내역 붙여넣기 ---- */
  case 'pasteTx': openPasteTx(); break;
  case 'stmtParse': buildStmtDraft($('#stmtBox').value); break;
  case 'stmtFileBtn': $('#stmtFile').click(); break;
  case 'stmtRun': runStmtImport(); break;

  /* ---- 💳 카드 대조 ---- */
  case 'payManage': openPayManage(); break;
  case 'payAssign': openPayAssign(); break;
  case 'addPay': {
    const name = $('#npName').value.trim(); if(!name){ toast('이름을 넣어 주세요'); break; }
    (state.pays = state.pays||[]).push({ id:uid(), name, kind:$('#npKind').value, fillItem:'' });
    save(); openPayManage(); render(); break;
  }
  case 'delPay': {
    state.pays = payList().filter(p=>p.id!==id);
    Object.keys(state.itemPay||{}).forEach(k=>{ if(state.itemPay[k]===id) delete state.itemPay[k]; });
    Object.keys(state.stmt||{}).forEach(k=>{ if(k.startsWith(id+'|')) delete state.stmt[k]; });
    save(); openPayManage(); render(); break;
  }
  case 'fillDiff': {
    const key = mk(ui.m), pay = payById(id); if(!pay) break;
    /* 지난번에 넣어 둔 금액이 있으면 먼저 빼고 다시 계산한다 (여러 번 눌러도 안 쌓임) */
    const prev = fillOf(pay.id, key);
    if(prev){
      const pk = `${prev.itemId}|${key}`;
      const left = (+state.cells[pk]||0) - prev.amount;
      if(left > 0) state.cells[pk] = left; else delete state.cells[pk];
      delete state.stmtFill[`${pay.id}|${key}`];
    }
    const diff = stmtOf(pay.id,key) - paySum(pay.id,key);
    if(diff <= 0){ save(); render(); toast('넣을 차액이 없어요'); break; }
    const tid = fillTarget(pay);
    if(!tid){ toast('넣을 항목이 없어요'); break; }
    const tk = `${tid}|${key}`;
    state.cells[tk] = (+state.cells[tk]||0) + diff;
    (state.stmtFill = state.stmtFill||{})[`${pay.id}|${key}`] = { itemId:tid, amount:diff };
    save(); render();
    toast(`${num(diff)}원을 ${itemById(tid).name}에 넣었어요`); break;
  }

  case 'pickMonth': openMonthPicker(); break;
  case 'pickAsset': openAssetPicker(); break;
  case 'goMonth': ui.m = +b.dataset.m; ui.tab='ledger'; ui.annual=false;
    closeModal(); render(); window.scrollTo(0,0); break;
  case 'goAsset': ui.aKey = b.dataset.k; ui.aAnnual=false; closeModal(); render(); window.scrollTo(0,0); break;
  case 'fillFromLast': {
    /* 항목마다 가장 최근에 적었던 값을 가져온다 (월세는 5월, 차량비는 6월 … 처럼) */
    const cur = mk(ui.m);
    let n = 0;
    ['income','fixed','save'].forEach(sec=>itemsOf(sec).forEach(i=>{
      if(cellVal(i.id,cur)) return;
      for(let m=ui.m-1; m>=1; m--){
        const v = cellVal(i.id, mk(m));
        if(v){ state.cells[`${i.id}|${cur}`] = v; n++; break; }
      }
    }));
    save(); render();
    toast(n? `${n}개 항목을 이전 기록으로 채웠어요 · 금액을 확인해 주세요` : '채울 항목이 없어요'); break;
  }
  case 'fillPrev': {
    const sec = b.dataset.sec, cur = mk(ui.m), prev = mk(ui.m-1);
    let n = 0;
    itemsOf(sec).forEach(i=>{
      if(cellVal(i.id,cur)) return;
      const v = cellVal(i.id,prev);
      if(v){ state.cells[`${i.id}|${cur}`] = v; n++; }
    });
    save(); render(); toast(n? `${n}개 항목을 지난달 값으로 채웠어요` : '채울 항목이 없어요'); break;
  }

  /* ---- 홈 빠른 기록 ---- */
  case 'qItem': ui.qItem = (ui.qItem===id? '' : id); render(); break;
  case 'qSave': {
    const amt = parseAmount($('#qAmt').value)||0;
    if(!amt){ toast('금액을 넣어 주세요'); break; }
    if(!ui.qItem){ toast('항목을 골라 주세요'); break; }
    const m = ui.m||nowMonthIdx();
    const date = m===nowMonthIdx()? iso(today()) : `${mk(m)}-01`;
    state.entries.push({ id:uid(), itemId:ui.qItem, date, amount:amt, memo:$('#qMemo').value.trim() });
    const nm = itemById(ui.qItem)?.name || '';
    ui.qItem=''; save(); render(); toast(`${nm} ${num(amt)}원 기록했어요`); break;
  }
  case 'quickAdd': openQuickAdd(); break;
  case 'qaSave': {
    const amt = parseAmount($('#qaAmt').value)||0, itemId = $('#qaItem').value;
    if(!amt){ toast('금액을 넣어 주세요'); break; }
    state.entries.push({ id:uid(), itemId, date:$('#qaDate').value||iso(today()),
                         amount:amt, memo:$('#qaMemo').value.trim() });
    save(); closeModal(); render(); toast(`${num(amt)}원 기록했어요`); break;
  }

  /* ---- 자산 ---- */
  case 'aCell': openAssetCell(id); break;
  case 'saveAsset': {
    const v = parseAmount($('#aAmt').value), key = `${id}|${ui.aKey}`;
    if(isFinite(v) && $('#aAmt').value.trim()!=='') state.assetCells[key] = v; else delete state.assetCells[key];
    save(); closeModal(); render(); toast('저장했어요'); break;
  }
  case 'aSame': { state.assetCells[`${id}|${ui.aKey}`] = assetCarry(id, ui.aKey).v;
    save(); closeModal(); render(); toast('지난달 값으로 채웠어요'); break; }
  case 'delAssetRow': {
    if(!confirm('이 자산 항목과 값이 모두 지워져요. 계속할까요?')) break;
    state.assetRows = state.assetRows.filter(r=>r.id!==id);
    Object.keys(state.assetCells).forEach(k=>{ if(k.startsWith(id+'|')) delete state.assetCells[k]; });
    save(); closeModal(); render(); break;
  }
  case 'addAssetRow': openAssetRowForm(b.dataset.owner); break;
  case 'saveNewAsset': {
    const name = $('#naName').value.trim(); if(!name){ toast('이름을 넣어 주세요'); break; }
    state.assetRows.push({ id:uid(), owner:b.dataset.owner, name });
    save(); closeModal(); render(); toast(`${name} 추가했어요`); break;
  }
  case 'aFillPrev': {
    let n=0;
    ownerRows(b.dataset.owner).forEach(r=>{
      if(assetRaw(r.id, ui.aKey)!==undefined) return;
      const v = assetCarry(r.id, ui.aKey).v;
      if(v){ state.assetCells[`${r.id}|${ui.aKey}`] = v; n++; }
    });
    save(); render(); toast(n? `${n}개 항목을 지난달 값으로 채웠어요` : '채울 항목이 없어요'); break;
  }

  /* ---- 📊 자산 앱 연동 ---- */
  case 'invOn': {
    const V = state.inv = state.inv || blankInv();
    V.enabled = true; V.asked = true; V.mode = b.dataset.mode || 'local';
    if(V.mode==='remote'){
      const cfg = investFbConfig();
      const room = prompt('자산 앱 방 이름', V.room || cfg?.room || '') || '';
      V.room = room.trim().replace(/[^A-Za-z0-9_\-]/g,'');
      if(!V.room){ V.enabled = false; break; }
    }
    save(); await refreshInvest(); render();
    toast(state.inv.error ? state.inv.error : '자산 앱에서 금액을 읽어왔어요');
    break;
  }
  case 'invOff':
    state.inv = blankInv(); state.inv.asked = true; save(); render();
    toast('연동을 껐어요 — 이미 반영한 금액은 그대로 남습니다'); break;
  case 'invRefresh':
    await refreshInvest(); render();
    toast(state.inv?.error || '다시 읽었어요'); break;
  case 'invApply': {
    const v = +b.dataset.v || 0, rowId = b.dataset.row;
    if(!rowId) break;
    state.assetCells[`${rowId}|${ui.aKey}`] = v;
    save(); render(); toast(`${assetKeyLabel(ui.aKey)} 값을 ${num(v)}원으로 맞췄어요`);
    break;
  }
  case 'invApplyAll': {
    const key = b.dataset.key || ui.aKey;
    let n = 0;
    invPlan().forEach(p=>{
      if(!p.ok) return;
      const cur = assetRaw(p.rowId, key);
      if(cur !== undefined && Math.round(cur) === Math.round(p.sum)) return;
      state.assetCells[`${p.rowId}|${key}`] = Math.round(p.sum); n++;
    });
    save(); render(); toast(n? `${n}개 항목을 자산 앱 금액으로 맞췄어요` : '바꿀 게 없었어요');
    break;
  }
  case 'invPick': openInvPick(b.dataset.sig); break;
  case 'invSetRow': {
    const V = state.inv = state.inv || blankInv();
    V.map = V.map || {};
    (b.dataset.sigs||'').split('§').filter(Boolean).forEach(sig=>{ V.map[sig] = b.dataset.row || ''; });
    save(); closeModal(); render();
    break;
  }

  /* ---- 고정비 · 대출 ---- */
  case 'editFixed': openFixedForm(id); break;
  case 'saveFixed': {
    const o = { cat:$('#fxCat').value, name:$('#fxName').value.trim(), amount:parseAmount($('#fxAmt').value)||0,
                who:$('#fxWho').value, day:+$('#fxDay').value||0, status:$('#fxStatus').value,
                save:parseAmount($('#fxSave').value)||0, memo:$('#fxMemo').value.trim() };
    if(!o.name){ toast('항목 이름을 넣어 주세요'); break; }
    const f = (state.fixed||[]).find(x=>x.id===id);
    if(f) Object.assign(f,o); else (state.fixed=state.fixed||[]).push({ id:uid(), ...o });
    save(); closeModal(); render(); toast('저장했어요'); break;
  }
  case 'delFixed': state.fixed = state.fixed.filter(f=>f.id!==id); save(); closeModal(); render(); break;
  case 'editLoan': openLoanForm(id); break;
  case 'saveLoan': {
    const o = { name:$('#lnName').value.trim(), bank:$('#lnBank').value.trim(), owner:$('#lnOwner').value,
                balance:parseAmount($('#lnBal').value)||0, rate:(parseFloat($('#lnRate').value)||0)/100,
                monthly:parseAmount($('#lnMon').value)||0, priority:+$('#lnPri').value||0,
                memo:$('#lnMemo').value.trim() };
    if(!o.name){ toast('대출명을 넣어 주세요'); break; }
    const l = (state.loans||[]).find(x=>x.id===id);
    if(l) Object.assign(l,o); else (state.loans=state.loans||[]).push({ id:uid(), kind:'', ...o });
    save(); closeModal(); render(); toast('저장했어요'); break;
  }
  case 'delLoan': state.loans = state.loans.filter(l=>l.id!==id); save(); closeModal(); render(); break;

  /* ---- 목표 · 절약 ---- */
  case 'saveGoal': {
    state.goal = { target: parseAmount($('#gTarget').value)||0,
                   rate: (parseFloat($('#gRate').value)||0)/100,
                   monthlySave: parseAmount($('#gSave').value)||0 };
    save(); render(); toast('목표를 저장했어요'); break;
  }
  case 'habit': {
    const key = monthKeyOf(today());
    state.habitLog = state.habitLog||{}; state.habitLog[key] = state.habitLog[key]||{};
    const v = Math.max(0, (+state.habitLog[key][id]||0) + (+b.dataset.d));
    if(v) state.habitLog[key][id] = v; else delete state.habitLog[key][id];
    save(); render(); break;
  }
  case 'editHabit': openHabitForm(id); break;
  case 'saveHabit': {
    const o = { name:$('#hbName').value.trim(), per:parseAmount($('#hbPer').value)||0,
                target:+$('#hbTarget').value||0, memo:$('#hbMemo').value.trim() };
    if(!o.name){ toast('이름을 넣어 주세요'); break; }
    const h = (state.habits||[]).find(x=>x.id===id);
    if(h) Object.assign(h,o); else (state.habits=state.habits||[]).push({ id:uid(), ...o });
    save(); closeModal(); render(); break;
  }
  case 'delHabit': state.habits = state.habits.filter(h=>h.id!==id); save(); closeModal(); render(); break;
  case 'editMemo': openMemo(); break;
  case 'saveMemo': state.memo = $('#memoBox').value; save(); closeModal(); render(); toast('저장했어요'); break;

  /* ---- 가져오기 · 내보내기 ---- */
  case 'import': openImport(imp?.target); break;
  case 'impTarget': openImport(b.dataset.t); break;
  case 'impFileBtn': $('#impFile').click(); break;
  case 'impParse': buildImport($('#impBox').value); break;
  case 'impBack': openImport(imp.target); break;
  case 'impRun': runImport(); break;
  case 'export': openExport(); break;
  case 'expCopy': copyText(toCsv(b.dataset.t==='asset'? assetCsv() : ledgerCsv()), '복사했어요 · 시트에 붙여넣으세요'); break;
  case 'expFile': download(`${b.dataset.t==='asset'?'자산':'가계부'}_${state.year}.csv`,
      toCsv(b.dataset.t==='asset'? assetCsv():ledgerCsv()), 'text/csv;charset=utf-8'); break;
  case 'expJson': download(`가계부백업_${iso(today())}.json`, JSON.stringify(state), 'application/json'); break;
  case 'impJsonBtn': $('#jsonFile').click(); break;

  /* ---- 설정 ---- */
  case 'saveSettings': {
    const y = +$('#sYear').value || state.year;
    const owners = $('#sOwners').value.split(/[,·\s]+/).filter(Boolean).slice(0,2);
    if(owners.length===2 && (state.settings.owners||[]).join()!==owners.join()){
      const [o1,o2] = state.settings.owners||[];
      state.assetRows.forEach(r=>{ if(r.owner===o1) r.owner=owners[0]; else if(r.owner===o2) r.owner=owners[1]; });
      state.settings.owners = owners;
    }
    state.year = y;
    save(); closeModal(); render(); toast('저장했어요'); break;
  }
  case 'reseed':
    if(!confirm('지금 기록을 버리고 처음 시트에서 가져온 내용으로 되돌릴까요?')) break;
    state = Object.assign(seedState(), { sync: state.sync, link: state.link });
    save(); closeModal(); render(); toast('시트 원본으로 되돌렸어요'); break;
  case 'reset':
    if(!confirm('모든 내용을 비울까요? (되돌릴 수 없어요)')) break;
    state = Object.assign(blankState(), { sync: state.sync, link: state.link }); save(); closeModal(); render(); break;
  case 'copyBackup': copyText(JSON.stringify(state), '백업 내용을 복사했어요'); break;
  case 'pasteRestore': openPasteRestore(); break;
  case 'doPasteRestore': {
    try{ const d = JSON.parse($('#restoreBox').value.trim());
      if(!d.items && !d.assetRows) throw 0;
      state = Object.assign(blankState(), d); save(); closeModal(); render(); toast('복원했어요');
    }catch(err){ toast('올바른 백업 내용이 아니에요'); } break;
  }
  case 'selectFallback': { const t=$('#fallbackBox'); t.focus(); t.select(); break; }

  /* ---- 냉장고 연동 ---- */
  case 'linkSetup': openLinkSetup(); break;
  case 'linkOn': {
    state.link = Object.assign(blankLink(), state.link, { enabled:true, asked:true });
    if(state.link.mode!=='remote' && !fridgeHere()){
      state.link.enabled = false; writeLocal(); openLinkSetup();
      toast('이 브라우저에는 냉장고 앱 기록이 없어요'); break;
    }
    await refreshLink(); openLinkSetup(); render();
    toast(state.link.error || '냉장고 식비를 자동으로 반영해요'); break;
  }
  case 'linkOff':
    state.link.enabled = false; state.link.asked = true;
    writeLocal(); openLinkSetup(); render(); toast('연동을 껐어요'); break;
  case 'linkRefresh': await refreshLink(); openLinkSetup(); render();
    toast(state.link.error || '다시 읽었어요'); break;
  case 'linkRemote': openLinkRemote(); break;
  case 'linkRemoteSave': {
    const m = ($('#linkBox').value||'').match(/join=([A-Za-z0-9_\-]+)/);
    if(!m){ toast('초대 링크를 찾지 못했어요'); break; }
    try{
      const v = JSON.parse(b64d(m[1]));
      if(!(v.k && v.p && v.r)) throw 0;
      state.link = Object.assign(blankLink(), state.link,
        { enabled:true, asked:true, mode:'remote', remote:{ apiKey:v.k, projectId:v.p, room:v.r } });
      writeLocal(); await refreshLink(); openLinkSetup(); render();
      toast(state.link.error || '냉장고 방과 연결했어요');
    }catch(err){ toast('링크가 올바르지 않아요'); }
    break;
  }
  case 'linkRemoteOff':
    state.link.mode = 'local'; state.link.remote = null;
    await refreshLink(); openLinkSetup(); render(); break;

  /* ---- 공유 ---- */
  case 'syncSetup': openSyncSetup(); break;
  case 'syncFromFridge': {
    const cfg = fridgeFbConfig();
    if(!cfg){ toast('냉장고 앱 설정을 찾지 못했어요'); break; }
    state.sync = { enabled:true, apiKey:cfg.apiKey, projectId:cfg.projectId, room:randId(20), rev:0 };
    writeLocal(); closeModal(); render();
    await syncPush();
    if(state.sync.error) toast(state.sync.error); else { openSyncInvite(); toast('연결됐어요 · 가계부 방을 새로 만들었어요'); }
    break;
  }
  case 'copyRules': copyText($('#rulesBox').value, '보안 규칙을 복사했어요'); break;
  case 'syncConnect': {
    const cfg = parseFbConfig($('#fbBox').value);
    if(!cfg){ toast('설정값에서 apiKey와 projectId를 찾지 못했어요'); break; }
    state.sync = { enabled:true, apiKey:cfg.apiKey, projectId:cfg.projectId, room:randId(20), rev:0 };
    writeLocal(); closeModal(); render(); await syncPush();
    if(state.sync.error) toast(state.sync.error); else { openSyncInvite(); toast('연결됐어요'); }
    break;
  }
  case 'syncInvite': openSyncInvite(); break;
  case 'copyInvite': copyText($('#inviteBox').value, '초대 링크를 복사했어요'); break;
  case 'joinByLink': openJoinByLink(); break;
  case 'doJoinLink': {
    const m = ($('#joinBox').value||'').match(/join=([A-Za-z0-9_\-]+)/);
    if(!m){ toast('초대 링크를 찾지 못했어요'); break; }
    try{ const v = JSON.parse(b64d(m[1]));
      if(!(v.k&&v.p&&v.r)) throw 0;
      pendingInvite = v; closeModal(); openJoinPrompt();
    }catch(err){ toast('링크가 올바르지 않아요'); } break;
  }
  case 'joinTake': { const v=pendingInvite; if(!v) break;
    state.sync = { enabled:true, apiKey:v.k, projectId:v.p, room:v.r, rev:0 };
    writeLocal(); closeModal(); await syncPull(); syncStart(); render();
    toast(state.sync.error || '가족 방에 참여했어요'); break; }
  case 'joinPush': { const v=pendingInvite; if(!v) break;
    state.sync = { enabled:true, apiKey:v.k, projectId:v.p, room:v.r, rev:0 };
    writeLocal(); closeModal(); await syncPush(); syncStart(); render();
    toast(state.sync.error || '이 폰 기록을 방에 올렸어요'); break; }
  case 'syncNow': await syncPull(); closeModal(); render(); toast(state.sync.error || '동기화했어요'); break;
  case 'syncOff':
    if(!confirm('이 폰만 쓰는 상태로 돌릴까요?')) break;
    state.sync = { enabled:false }; clearInterval(syncTimer); syncTimer=null;
    writeLocal(); closeModal(); render(); break;
  }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.matches('[data-money]')){
    const v = t.value.replace(/[^0-9]/g,'');
    t.value = v? (+v).toLocaleString('ko-KR') : '';
  }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.stmtItem !== undefined){
    const r = (stmtDraft||[])[+t.dataset.stmtItem];
    if(r){ r.item = t.value; drawStmtPreview(); }
    return;
  }
  /* 💳 명세서 금액 · 결제수단 지정 */
  if(t.dataset.stmt !== undefined){
    const v = parseAmount(t.value)||0, k = `${t.dataset.stmt}|${mk(ui.m)}`;
    state.stmt = state.stmt||{};
    if(v) state.stmt[k] = v; else delete state.stmt[k];
    save(); setTimeout(render, 0); return;
  }
  if(t.dataset.itemPay !== undefined){
    state.itemPay = state.itemPay||{};
    if(t.value) state.itemPay[t.dataset.itemPay] = t.value; else delete state.itemPay[t.dataset.itemPay];
    save(); setTimeout(()=>{ if(!$('.modal')) render(); }, 0); return;
  }
  if(t.dataset.secPay !== undefined){
    if(!t.value) return;
    state.itemPay = state.itemPay||{};
    itemsOf(t.dataset.secPay).forEach(i=>{ state.itemPay[i.id] = t.value; });
    save(); openPayAssign(); render();
    toast(`${SEC(t.dataset.secPay).label.slice(2).trim()} 전체를 지정했어요`); return;
  }
  if(t.dataset.payName !== undefined){
    const p = payById(t.dataset.payName); if(p){ p.name = t.value.trim() || p.name; save(); render(); } return;
  }
  if(t.dataset.payKind !== undefined){
    const p = payById(t.dataset.payKind); if(p){ p.kind = t.value; save(); render(); } return;
  }
  if(t.dataset.payFill !== undefined){
    const p = payById(t.dataset.payFill); if(p){ p.fillItem = t.value; save(); } return;
  }
  if(t.dataset.linkMap === undefined) return;
  state.link = state.link || blankLink();
  state.link.map = state.link.map || {};
  state.link.map[t.dataset.linkMap] = t.value || '';   /* 빈 값 = 넣지 않음 */
  writeLocal();
  refreshLink().then(()=>{ openLinkSetup(); render(); });
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeModal(); return; }
  if(e.key!=='Enter') return;
  if(e.target.id==='qAmt' || e.target.id==='qMemo'){ e.preventDefault(); $('[data-act="qSave"]')?.click(); }
  if(e.target.id==='cAmt'){ e.preventDefault(); $('[data-act="saveCell"]')?.click(); }
  if(e.target.id==='aAmt'){ e.preventDefault(); $('[data-act="saveAsset"]')?.click(); }
});

/* ============================================================
   7. 부부가 함께 쓰기 — Firebase Firestore REST 동기화
   ------------------------------------------------------------
   · SDK 없이 fetch만 씁니다(외부 스크립트 로딩 없음).
   · rooms/{방}/state/core 문서 하나에 전체 데이터를 JSON으로 보관
   · 화면을 보고 있을 때만 15초마다 문서 1건 확인 → 바뀌었을 때만 내려받음
   ============================================================ */
const DEVICE = (()=>{ let d=localStorage.getItem('hl.device');
  if(!d){ d=uid(); localStorage.setItem('hl.device',d); } return d; })();
let syncTimer=null, pushTimer=null, syncBusy=false, pendingInvite=null;

const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
const randId = n => { const a=new Uint8Array(n); crypto.getRandomValues(a);
  return [...a].map(x=>'abcdefghijkmnpqrstuvwxyz23456789'[x%32]).join(''); };

function fsUrl(path){
  const c = state.sync;
  return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(c.projectId)}`
       + `/databases/(default)/documents/${path}?key=${encodeURIComponent(c.apiKey)}`;
}
async function fsErr(r){
  let m=''; try{ m=(await r.json()).error?.message||''; }catch(e){}
  if(r.status===403) return '권한이 거부됐어요 — Firestore 보안 규칙을 확인해 주세요';
  if(r.status===400) return 'API 키나 프로젝트 ID가 올바르지 않아요';
  if(r.status===404) return '프로젝트를 찾을 수 없어요 (Firestore 데이터베이스를 만들었는지 확인)';
  return `오류 ${r.status} ${m}`.trim();
}
async function fsGet(path){
  const r = await fetch(fsUrl(path));
  if(r.status===404) return null;
  if(!r.ok) throw new Error(await fsErr(r));
  const d = await r.json();
  return { json:d.fields?.json?.stringValue||'', rev:+(d.fields?.rev?.integerValue||0), by:d.fields?.by?.stringValue||'' };
}
async function fsPut(path, json, rev){
  const r = await fetch(fsUrl(path), { method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ fields:{ json:{stringValue:json}, rev:{integerValue:String(rev)}, by:{stringValue:DEVICE} } }) });
  if(!r.ok) throw new Error(await fsErr(r));
}
const CORE_KEYS = ['year','settings','items','cells','entries','assetRows','assetCells',
                   'fixed','loans','goal','habits','habitLog','memo',
                   'pays','itemPay','stmt','stmtFill','payeeMap'];
function corePayload(){
  const o = {}; CORE_KEYS.forEach(k=>o[k]=state[k]);
  return JSON.stringify(o);
}
function applyCore(txt){
  const d = JSON.parse(txt);
  CORE_KEYS.forEach(k=>{ if(d[k]!==undefined) state[k]=d[k]; });
}
function schedulePush(){
  if(!state.sync?.enabled) return;
  state.sync.dirty = true;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(syncPush, 1200);
}
async function syncPush(){
  const c = state.sync;
  if(!c?.enabled || syncBusy) return;
  syncBusy = true;
  try{
    const rev = Date.now();
    await fsPut(`rooms/${c.room}/state/core`, corePayload(), rev);
    c.rev = rev; c.lastAt = rev; c.error = ''; c.dirty = false;
  }catch(e){ c.error = e.message; }
  finally{ syncBusy=false; writeLocal(); renderHeadMeta(); }
}
async function syncPull(){
  const c = state.sync;
  if(!c?.enabled || syncBusy) return;
  /* 아직 못 올린 내 변경이 있으면 남의 내용으로 덮기 전에 내 것부터 올린다 */
  if(c.dirty){ await syncPush(); return; }
  syncBusy = true;
  try{
    const doc = await fsGet(`rooms/${c.room}/state/core`);
    if(doc && doc.rev > (c.rev||0) && doc.by !== DEVICE){
      applyingRemote = true; applyCore(doc.json); applyingRemote = false;
      c.rev = doc.rev; writeLocal(); render();
      toast('배우자가 바꾼 내용을 받아왔어요');
    }
    c.lastAt = Date.now(); c.error = '';
  }catch(e){ c.error = e.message; }
  finally{ syncBusy=false; writeLocal(); renderHeadMeta(); }
}
function syncStart(){
  clearInterval(syncTimer); syncTimer = null;
  if(!state.sync?.enabled) return;
  syncPull();
  syncTimer = setInterval(()=>{ if(!document.hidden) syncPull(); }, 15000);
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ syncPull(); refreshLink(); refreshInvest(); } });

function parseFbConfig(text){
  const t = String(text||'');
  const api = t.match(/apiKey["'\s:]+([A-Za-z0-9_\-]{20,})/);
  const pid = t.match(/projectId["'\s:]+([a-z0-9\-]{4,})/i);
  if(!api || !pid) return null;
  return { apiKey: api[1], projectId: pid[1] };
}
function inviteLink(){
  const c = state.sync || {};
  return location.href.split('#')[0] + '#join='
       + b64e(JSON.stringify({ k:c.apiKey, p:c.projectId, r:c.room }));
}
(function readInvite(){
  const m = location.hash.match(/join=([A-Za-z0-9_\-]+)/);
  if(!m) return;
  try{ const v = JSON.parse(b64d(m[1])); if(v.k&&v.p&&v.r) pendingInvite = v; }catch(e){}
  history.replaceState(null, '', location.pathname + location.search);
})();

/* ============================================================
   8. 시작
   ============================================================ */
state = load();
if(!state || !state.items) state = seedState();
if(!state.sync) state.sync = { enabled:false };
state.entries = state.entries || [];
state.habitLog = state.habitLog || {};
if(!state.pays) state.pays = DEF_PAYS.map(p=>({...p}));
state.itemPay = state.itemPay || {};
state.stmt = state.stmt || {};
state.stmtFill = state.stmtFill || {};
state.payeeMap = state.payeeMap || {};
/* 🧊 냉장고 앱 기록이 같은 브라우저에 있으면 처음 한 번 자동으로 켠다 */
if(!state.link) state.link = blankLink();
if(!state.link.asked && fridgeHere()){ state.link.enabled = true; state.link.asked = true; }
/* 📊 자산 앱 기록이 같은 브라우저에 있으면 처음 한 번 자동으로 켠다 */
if(!state.inv) state.inv = blankInv();
if(!state.inv.asked && investHere()){ state.inv.enabled = true; state.inv.asked = true; }
ui.m = nowMonthIdx();
ui.aKey = latestAssetKey();
writeLocal();          /* 처음 열었을 때도 바로 저장해 둔다 */
render();
syncStart();
refreshLink();
refreshInvest();
if(pendingInvite) openJoinPrompt();
</script>
