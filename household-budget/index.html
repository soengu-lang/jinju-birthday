<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2b3a67">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="우리집 가계부">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>우리집 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ed; --card:#fffdf8; --ink:#1e2430; --muted:#6f7683;
  --navy:#2b3a67; --navy-d:#212d51; --soft:#e9edf7; --soft-d:#d4dcef;
  --spend:#d1543f; --spend-s:#fceeea; --income:#2e7d6b; --income-s:#e6f2ee;
  --gold:#e08b2e; --gold-s:#fdf1e0;
  --line:#e5e2d8; --shadow:0 1px 2px rgba(30,36,48,.06), 0 8px 22px rgba(30,36,48,.06);
  --r:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--soft-d);outline-offset:1px}
textarea{resize:vertical;min-height:80px}
.wrap{max-width:920px;margin:0 auto;padding:0 14px}
.hidden{display:none !important}

/* ---------- header ---------- */
header{background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.head-in{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:14px 0 12px}
.brand{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.02em}
h1{font-size:clamp(17px,4.6vw,22px);font-weight:900;letter-spacing:-.03em;margin-top:2px;white-space:nowrap}
.head-meta{text-align:right;font-size:clamp(9.5px,2.6vw,11.5px);color:var(--muted);white-space:nowrap}
.head-meta b{color:var(--navy);font-weight:700}
.gear{font-size:18px;padding:4px 6px;border-radius:8px}
.gear:hover{background:var(--soft)}

/* ---------- tabs ---------- */
nav.tabs{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 0 8px;
  box-shadow:0 6px 14px -12px rgba(0,0,0,.4)}
.tabbar{display:flex;gap:4px;background:var(--soft);border-radius:14px;padding:4px}
.tabbar button{flex:1;padding:9px 4px;border-radius:11px;font-size:12.5px;font-weight:700;color:var(--navy-d);
  white-space:nowrap;transition:.15s}
.tabbar button.on{background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(43,58,103,.3)}

/* ---------- generic ---------- */
main{padding-top:6px}
section.pane{padding-bottom:34px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px}
.stack>*+*{margin-top:12px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 2px 8px}
.sec-title h2{font-size:15px;font-weight:900}
.sec-title p{font-size:11.5px;color:var(--muted);font-weight:400}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{background:var(--navy);color:#fff;border-radius:11px;padding:10px 14px;font-size:13px;font-weight:700;
  display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:.15s}
.btn:hover{background:var(--navy-d)}
.btn.gold{background:var(--gold)}.btn.gold:hover{background:#c9781f}
.btn.red{background:var(--spend)}.btn.red:hover{background:#b94733}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:9px}
.btn.block{width:100%}
.chip{background:var(--soft);color:var(--navy-d);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;
  white-space:nowrap}
.chip.on{background:var(--navy);color:#fff}
.chip.line{background:#fff;border:1px solid var(--line)}
.tag{background:var(--soft);color:var(--navy-d);border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:700}
.tag.warn{background:var(--spend-s);color:var(--spend)}
.tag.ok{background:var(--income-s);color:var(--income)}
.tag.soon{background:var(--gold-s);color:#b5701c}
.muted{color:var(--muted)}
.tiny{font-size:11px}
.empty{text-align:center;color:var(--muted);font-size:12.5px;padding:26px 10px;line-height:1.7}
.scroller{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}

/* ---------- banner ---------- */
.banner{background:var(--navy);color:#fff;border-radius:var(--r);padding:15px 16px}
.banner .b1{font-size:11.5px;opacity:.8;font-weight:700}
.banner .b2{font-size:29px;font-weight:900;letter-spacing:-.03em;margin-top:2px}
.banner .b3{font-size:12px;opacity:.88;margin-top:6px;line-height:1.6}
.banner b{color:#ffd9a8}
.bar{height:9px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;border-radius:99px;background:#8fb8ff;transition:width .3s}
.bar>i.over{background:#ff9b86}
.bar.plain{background:var(--soft)}
.bar.plain>i{background:var(--navy)}
.bar.plain>i.over{background:var(--spend)}

/* ---------- kpi ---------- */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 8px;text-align:center}
.kpi .n{font-size:16px;font-weight:900;letter-spacing:-.02em}
.kpi .l{font-size:10.5px;color:var(--muted);margin-top:2px}
.kpi .n.red{color:var(--spend)}.kpi .n.blue{color:var(--income)}.kpi .n.gold{color:var(--gold)}

/* ---------- quick input ---------- */
.amt-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:10px 13px}
.amt-box input{border:none;padding:0;font-size:26px;font-weight:900;text-align:right;letter-spacing:-.02em;
  background:transparent}
.amt-box input:focus{outline:none}
.amt-box .won{font-size:15px;font-weight:800;color:var(--muted);flex:none}
.type-seg{display:flex;gap:4px;background:var(--soft);border-radius:11px;padding:3px}
.type-seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:12px;font-weight:800;color:var(--navy-d)}
.type-seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.type-seg button.on.spend{color:var(--spend)}
.type-seg button.on.income{color:var(--income)}

/* ---------- list ---------- */
.day-head{display:flex;justify-content:space-between;align-items:baseline;padding:9px 12px 5px;
  font-size:11.5px;font-weight:800;color:var(--muted)}
.tx{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);width:100%;
  text-align:left}
.tx:last-child{border-bottom:none}
.tx:hover{background:#faf9f3}
.ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:none;
  background:var(--soft)}
.tx .nm{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.tx .sub{font-size:11px;color:var(--muted);margin-top:1px}
.tx .amt{font-size:14px;font-weight:900;white-space:nowrap;letter-spacing:-.02em}
.amt.spend{color:var(--ink)}
.amt.income{color:var(--income)}

/* ---------- month nav ---------- */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mnav .t{font-size:15px;font-weight:900}
.arrow{width:32px;height:32px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;font-size:14px;flex:none}
.arrow:hover{background:var(--soft)}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);padding:3px 0}
.cal .wd.sun{color:var(--spend)}.cal .wd.sat{color:#4a6fa8}
.cell{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:58px;padding:5px 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.cell.pad{background:transparent;border-color:transparent}
.cell .d{font-size:10.5px;font-weight:800;color:var(--muted)}
.cell.today{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-s)}
.cell.sel{border-color:var(--navy);box-shadow:0 0 0 2px var(--soft-d)}
.cell .v{font-size:10px;font-weight:800;color:var(--spend);letter-spacing:-.03em;line-height:1.25}
.cell .vi{font-size:10px;font-weight:800;color:var(--income);letter-spacing:-.03em;line-height:1.25}
.cell .zero{font-size:12px}

/* ---------- analysis ---------- */
.catrow{display:flex;align-items:center;gap:9px;margin-top:10px}
.catrow .cl{font-size:11.5px;font-weight:700;width:82px;flex:none;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.catrow .cv{font-size:11.5px;font-weight:800;width:92px;text-align:right;flex:none;letter-spacing:-.02em}
.catbar{height:9px;border-radius:99px;background:var(--soft);overflow:hidden;flex:1}
.catbar>i{display:block;height:100%;border-radius:99px}
.wkbars{display:flex;align-items:flex-end;gap:7px;height:92px;margin-top:8px}
.wkbars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.wkbars .bb{width:100%;background:var(--soft-d);border-radius:6px 6px 0 0;min-height:3px}
.wkbars .bb.max{background:var(--navy)}
.donut{width:132px;height:132px;flex:none}
.legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.legend .lg{display:flex;align-items:center;gap:7px;font-size:11.5px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.delta{font-size:11px;font-weight:800}
.delta.up{color:var(--spend)}.delta.down{color:var(--income)}

/* ---------- budget ---------- */
.bline{padding:11px 12px;border-bottom:1px solid var(--line)}
.bline:last-child{border-bottom:none}
.bline .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bline .t .n{font-size:13px;font-weight:800}
.bline .t .v{font-size:11.5px;color:var(--muted);font-weight:700}
.bline .t .v b{color:var(--ink)}
.bline .t .v.over b{color:var(--spend)}
.bw{width:96px;flex:none}
.fx{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
.fx:last-child{border-bottom:none}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(22,27,38,.55);backdrop-filter:blur(2px);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.mask{align-items:center;padding:20px}}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;max-height:92vh;
  overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@media(min-width:640px){.modal{border-radius:20px;max-height:88vh}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.mhead h3{font-size:18px;font-weight:900;letter-spacing:-.02em}
.x{font-size:19px;color:var(--muted);padding:2px 6px;line-height:1}
.field{margin-top:11px}
.field label{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.box{background:#fbfaf3;border:1px solid var(--line);border-radius:12px;padding:11px}
.note{background:var(--gold-s);border-radius:10px;padding:9px 11px;font-size:11.5px;font-weight:700;color:#a2661c;
  line-height:1.6}
.note b{color:var(--gold)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.keypad button{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 0;font-size:16px;
  font-weight:800}
.keypad button:hover{background:var(--soft)}
.keypad button.act{background:var(--soft);font-size:13px;font-weight:800}
.imp-table{width:100%;border-collapse:collapse;font-size:11px}
.imp-table th,.imp-table td{border:1px solid var(--line);padding:4px 6px;text-align:left;white-space:nowrap;
  max-width:110px;overflow:hidden;text-overflow:ellipsis}
.imp-table th{background:var(--soft);font-weight:800}
.imp-scroll{overflow-x:auto;border-radius:10px;margin-top:8px}
.map-row{display:grid;grid-template-columns:1fr 1.1fr;gap:7px;align-items:center;margin-top:6px}
.map-row .h{font-size:11.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-row .h span{display:block;font-weight:400;color:var(--muted);font-size:10.5px}
.map-row select{padding:7px 9px;font-size:12px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));
  background:var(--navy-d);color:#fff;padding:11px 18px;border-radius:999px;font-size:12.5px;font-weight:700;
  z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s;max-width:88vw;
  text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;padding:14px 20px;
  font-size:14px;border-radius:999px;box-shadow:0 8px 20px rgba(43,58,103,.42)}
</style>
</head>
<body>

<header>
  <div class="wrap head-in">
    <div>
      <div class="brand">구글 시트 대신, 한 손으로</div>
      <h1>우리집 가계부</h1>
    </div>
    <div class="row" style="gap:4px">
      <div class="head-meta" id="headMeta"></div>
      <button class="gear" data-act="settings" title="설정">⚙️</button>
    </div>
  </div>
</header>

<nav class="tabs">
  <div class="wrap">
    <div class="tabbar" id="tabbar">
      <button data-tab="home">🏠 홈</button>
      <button data-tab="list">📒 내역</button>
      <button data-tab="cal">📅 달력</button>
      <button data-tab="stat">📊 분석</button>
      <button data-tab="budget">💰 예산</button>
    </div>
  </div>
</nav>

<main class="wrap"><div id="view"></div></main>

<button class="btn fab" id="fab" data-act="newTx">＋ 기록</button>
<div id="modalRoot"></div>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   0. 기본값 / 유틸
   ============================================================ */
const KEY = 'homeLedger.v1';
const WD = ['일','월','화','수','목','금','토'];

const DEF_CATS = [
  {name:'식비',      emoji:'🍚', color:'#d1543f'},
  {name:'카페·간식',  emoji:'☕', color:'#c9853c'},
  {name:'마트·장보기',emoji:'🛒', color:'#2e7d6b'},
  {name:'생활용품',   emoji:'🧻', color:'#6a8f4f'},
  {name:'교통·차량',  emoji:'🚌', color:'#3f6fa8'},
  {name:'주거·통신',  emoji:'🏠', color:'#5a6dab'},
  {name:'의료·건강',  emoji:'💊', color:'#9b5aa8'},
  {name:'문화·여가',  emoji:'🎬', color:'#d0729a'},
  {name:'의류·미용',  emoji:'👕', color:'#b5657a'},
  {name:'교육',      emoji:'📚', color:'#4a7ea8'},
  {name:'경조사',     emoji:'🎁', color:'#8a6f4a'},
  {name:'기타',      emoji:'🧾', color:'#7c8390'}
];
const DEF_INCOME = [
  {name:'급여',   emoji:'💼', color:'#2e7d6b'},
  {name:'부수입', emoji:'💡', color:'#3f8f7a'},
  {name:'용돈',   emoji:'🎀', color:'#5aa08f'},
  {name:'기타수입',emoji:'💰', color:'#7fae9e'}
];
const DEF_METHODS = ['카드','체크카드','현금','계좌이체','간편결제'];
const PALETTE = ['#d1543f','#c9853c','#2e7d6b','#6a8f4f','#3f6fa8','#5a6dab','#9b5aa8','#d0729a','#b5657a','#4a7ea8','#8a6f4a','#7c8390'];

/* 내용(메모) → 분류 자동 추정 사전 */
const CAT_HINTS = [
  [/스타벅스|스벅|투썸|이디야|메가커피|커피|카페|빽다방|공차|베이커리|빵|파리바게|뚜레|디저트|아이스크림|배스킨|편의점|씨유|CU|GS25|세븐일레븐/i,'카페·간식'],
  [/이마트|홈플러스|롯데마트|코스트코|하나로|마트|쿠팡|마켓컬리|컬리|오아시스|장보기|정육|수산|농협/,'마트·장보기'],
  [/배달|배민|요기요|쿠팡이츠|치킨|피자|족발|보쌈|국밥|김밥|분식|식당|한식|중식|일식|양식|점심|저녁|외식|맥도날드|버거|롯데리아|서브웨이|스시/,'식비'],
  [/지하철|버스|택시|카카오T|기차|KTX|SRT|고속버스|주유|기름|주차|하이패스|톨게이트|렌트|자동차|정비|타이어|보험료?\s*자동차/i,'교통·차량'],
  [/월세|전세|관리비|가스|전기|수도|통신|휴대폰|핸드폰|인터넷|SKT|KT|LG유플|알뜰폰|넷플릭스|유튜브\s*프리미엄|왓챠|디즈니|스포티파이|구독/i,'주거·통신'],
  [/병원|의원|약국|치과|한의원|건강검진|영양제|보험|의료/,'의료·건강'],
  [/영화|CGV|메가박스|롯데시네마|공연|전시|여행|숙박|호텔|펜션|놀이공원|게임|스팀|도서|서점|취미|헬스|필라테스|요가|골프/i,'문화·여가'],

/* 달력 칸처럼 좁은 곳에서 쓰는 짧은 금액 표기 */
function shortWon(n){
  n = Math.round(Math.abs(n));
  if(n >= 10000000) return Math.round(n/10000000*10)/10 + '천만';
  if(n >= 10000) return (n%10000===0 ? n/10000 : Math.round(n/1000)/10) + '만';
  if(n >= 1000) return Math.round(n/100)/10 + '천';
  return String(n);
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2200); }
function guessCat(memo, type){
  const t = String(memo||'');

  for(const [re,c] of table) if(re.test(t)) return c;
  return type==='income' ? '기타수입' : '';
}
/* 문자열에서 금액 뽑기: "1,200원" "₩1200" "(3,000)"=마이너스 "3만원" */
function parseAmount(s){
  if(typeof s === 'number') return s;
  let t = String(s??'').trim();
  if(!t) return NaN;
  const neg = /^\(.*\)$/.test(t) || /^-/.test(t) || /^▲/.test(t);
  t = t.replace(/[()▲△]/g,'');
  const man = /만/.test(t);
  const cheon = /천(?!원)/.test(t) && !man;
  t = t.replace(/[^0-9.\-]/g,'');
  if(t==='' || t==='-' ) return NaN;
  let v = parseFloat(t);
  if(!isFinite(v)) return NaN;
  if(man && v < 10000) v *= 10000;
  else if(cheon && v < 1000) v *= 1000;
  v = Math.abs(v);
  return neg ? -v : v;
}
/* 문자열/숫자에서 날짜 뽑기 (엑셀 일련번호도 지원) */
function parseDate(s, fallbackYear){
  if(s instanceof Date) return iso(s);
  let t = String(s??'').trim();
  if(!t) return '';
  const Y = fallbackYear || today().getFullYear();
  let m;
  if((m = t.match(/(\d{4})\s*[-.\/년]\s*(\d{1,2})\s*[-.\/월]\s*(\d{1,2})/)))
    return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  if((m = t.match(/^(\d{1,2})\s*[-.\/월]\s*(\d{1,2})/)))
    return `${Y}-${String(+m[1]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`;
  if((m = t.match(/^(\d{8})$/)))
    return `${m[1].slice(0,4)}-${m[1].slice(4,6)}-${m[1].slice(6,8)}`;
  if(/^\d{4,5}(\.\d+)?$/.test(t)){                 // 엑셀 날짜 일련번호
    const n = parseFloat(t);
    if(n > 20000 && n < 60000){
      const d = new Date(Date.UTC(1899,11,30) + n*86400000);
      return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
    }
  }
  const d = new Date(t);
  return isNaN(d) ? '' : iso(d);
}

/* 자주 쓰는 항목: 최근 90일 기록에서 자동으로 뽑음 */
function topFavs(limit=8){
  const from = iso(addDays(today(),-90));
  const m = {};
  state.tx.filter(t=>t.type==='expense' && t.date>=from).forEach(t=>{
    const label = (t.memo||t.cat||'').trim(); if(!label) return;
    const k = label+'|'+(t.cat||'');
    (m[k] = m[k] || {label, cat:t.cat, method:t.method, n:0, last:'', amount:+t.amount||0}).n++;
    if(t.date >= m[k].last){ m[k].last=t.date; m[k].amount=+t.amount||0; m[k].method=t.method; }
  });
  return Object.values(m).filter(v=>v.n>=2).sort((a,b)=> b.n-a.n || (a.last<b.last?1:-1)).slice(0,limit);
}
function addTx(o){
  const t = { id:uid(), date:o.date||iso(today()), type:o.type||'expense',
              amount:Math.abs(+o.amount||0), cat:o.cat||(o.type==='income'?'기타수입':'기타'),
              memo:(o.memo||'').trim(), method:o.method||state.settings.defMethod||'카드',
              createdAt:Date.now() };
  state.tx.push(t);
  return t;
}

function viewCal(){
  const mk = ui.mk, [y,m] = mk.split('-').map(Number);
  const list = txOfMonth(mk);
  const byDay = {};
  list.forEach(t=>{ const d=+t.date.slice(8,10); (byDay[d]=byDay[d]||{s:0,i:0}); 
    if(t.type==='income') byDay[d].i += +t.amount||0; else byDay[d].s += +t.amount||0; });
  const first = new Date(y,m-1,1).getDay(), dim = daysInMonth(mk);
  const max = Math.max(1, ...Object.values(byDay).map(v=>v.s));
  const tIso = iso(today());
  const noSpend = [...Array(dim)].map((_,i)=>i+1)
    .filter(d=>!byDay[d]?.s && `${mk}-${String(d).padStart(2,'0')}` <= tIso).length;
  let cells = '';
  for(let i=0;i<first;i++) cells += `<div class="cell pad"></div>`;
  for(let d=1; d<=dim; d++){
    const ds = `${mk}-${String(d).padStart(2,'0')}`, v = byDay[d]||{s:0,i:0};
    const alpha = v.s? (0.10 + 0.55*Math.min(1, v.s/max)).toFixed(2) : 0;
    cells += `<button class="cell ${ds===tIso?'today':''} ${ds===ui.selDay?'sel':''}"
      data-act="selDay" data-d="${ds}" style="${v.s?`background:rgba(209,84,63,${alpha*0.35})`:''}">
      <div class="d">${d}</div>
      ${v.s? `<div class="v">${shortWon(v.s)}</div>`:''}
      ${v.i? `<div class="vi">+${shortWon(v.i)}</div>`:''}
      ${!v.s && !v.i && ds<=tIso ? `<div class="zero">☺️</div>`:''}

  }
  const sel = ui.selDay && ui.selDay.startsWith(mk) ? list.filter(t=>t.date===ui.selDay) : null;
  return `<section class="pane">
    <div class="mnav">
      <button class="arrow" data-act="month" data-d="-1">‹</button>

      </div>

      <div class="tiny muted" style="margin-top:9px;text-align:center">
        ☺️ 무지출 <b>${noSpend}일</b> · 색이 진할수록 많이 쓴 날이에요</div>
    </div>

        <p>지출 ${num(sumOf(sel,'expense'))}원</p></div>

/* ---------- 3-4. 분석 ---------- */
function donut(entries, total){
  const R=54, C=2*Math.PI*R;
  let off=0;
  const arcs = entries.slice(0,6).map(([name,v])=>{
    const len = total? C*v/total : 0;
    const s = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${catMeta(name).color}" stroke-width="21"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 70 70)"></circle>`;
    off += len; return s;
  }).join('');
  return `<svg class="donut" viewBox="0 0 140 140">
    <circle r="${R}" cx="70" cy="70" fill="none" stroke="#e9edf7" stroke-width="21"></circle>${arcs}
    <text x="70" y="66" text-anchor="middle" font-size="10" fill="#6f7683" font-weight="700">총 지출</text>
    <text x="70" y="84" text-anchor="middle" font-size="14" fill="#1e2430" font-weight="900">${shortWon(total)}원</text>
  </svg>`;
}
function viewStat(){
  const mk = ui.mk;

  const spent = sumOf(list,'expense'), prevSpent = sumOf(prevList,'expense');

  list.filter(t=>t.type==='expense').forEach(t=>{ const d=+t.date.slice(8,10);
    weeks[Math.min(4, Math.floor((d-1)/7))] += +t.amount||0; });
  const wMax = Math.max(1,...weeks);
  const methods = methodTotals(list);
  const mMax = methods.length? methods[0][1] : 1;
  const top = list.filter(t=>t.type==='expense').sort((a,b)=>b.amount-a.amount).slice(0,5);
  const over = cats.filter(([c,v])=> (state.budgets||{})[c] && v > state.budgets[c]);

  return `<section class="pane">
    <div class="mnav">
      <button class="arrow" data-act="month" data-d="-1">‹</button>

            <b>${Math.round(v/spent*100)}%</b></div>`).join('')}
        </div>
      </div>
      <div class="tiny muted" style="margin-top:10px;text-align:center">
        ${prevSpent? `지난달 ${num(prevSpent)}원 대비
          <span class="delta ${diff>0?'up':'down'}">${diff>0?'▲':'▼'} ${num(Math.abs(diff))}원</span>
          (${diff>0?'+':''}${Math.round(diff/prevSpent*100)}%)` : '지난달에는 기록이 없어요'}
      </div>
    </div>

    ${over.length? `<div class="note" style="margin-top:12px">⚠️ 예산을 넘긴 분류:
      <b>${over.map(([c,v])=>`${c} ${num(v-state.budgets[c])}원 초과`).join(', ')}</b></div>`:''}

    <div class="sec-title"><h2>분류별</h2><p>지난달과 비교</p></div>
    <div class="card pad">
      ${cats.map(([c,v])=>{
        const p = prevCats[c]||0, d = v-p;
        return `<div class="catrow">
          <div class="cl">${catMeta(c).emoji} ${esc(c)}</div>
          <div class="catbar"><i style="width:${Math.round(v/cats[0][1]*100)}%;background:${catMeta(c).color}"></i></div>
          <div class="cv">${num(v)}원
            ${p? `<span class="delta ${d>0?'up':'down'}" style="font-size:10px">${d>0?'▲':'▼'}${shortWon(d)}</span>`:''}
          </div></div>`;
      }).join('')}
    </div>

    <div class="sec-title"><h2>주차별 지출</h2></div>
    <div class="card pad">
      <div class="wkbars">
        ${weeks.map((v,i)=>`<div>
          <div class="tiny muted" style="font-weight:800">${v? shortWon(v):''}</div>
          <div class="bb ${v===wMax?'max':''}" style="height:${Math.round(v/wMax*100)}%"></div>

/* ---------- 4-4. 구글 시트 가져오기 ---------- */
const ROLES = [['skip','— 안 씀 —'],['date','날짜'],['amount','금액'],['spend','지출 금액'],['income','수입 금액'],
               ['cat','분류'],['memo','내용·메모'],['method','결제수단'],['type','수입/지출 구분']];
let imp = null;
function splitLine(line, delim){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(q){
      if(ch === '"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur += ch;
    } else if(ch === '"') q = true;
    else if(ch === delim){ out.push(cur); cur=''; }
    else cur += ch;
  }
  out.push(cur); return out;
}
function parseTable(text){
  const lines = String(text||'').replace(/\r/g,'').split('\n').filter(l=>l.trim()!=='');
  if(!lines.length) return [];
  const delim = lines[0].includes('\t') ? '\t' : (lines[0].split(',').length > 1 ? ',' : '\t');
  return lines.map(l=>splitLine(l, delim).map(c=>c.trim()));
}
function guessRoles(rows, hasHeader){
  const cols = Math.max(...rows.map(r=>r.length));
  const roles = Array(cols).fill('skip');
  const head = hasHeader ? rows[0] : [];
  const body = rows.slice(hasHeader?1:0, hasHeader?9:8);
  for(let i=0;i<cols;i++){
    const h = (head[i]||'').replace(/\s/g,'');
    if(/날짜|일자|일시|거래일|date/i.test(h)) { roles[i]='date'; continue; }
    if(/수단|카드|계좌|지불|결제방법|결제수단/.test(h)) { roles[i]='method'; continue; }
    if(/지출|출금|사용액|나간/.test(h)) { roles[i]='spend'; continue; }
    if(/수입|입금|들어온/.test(h)) { roles[i]='income'; continue; }
    if(/금액|amount|가격|비용|합계|결제금액/i.test(h)) { roles[i]='amount'; continue; }
    if(/분류|카테고리|항목|용도|계정/.test(h)) { roles[i]='cat'; continue; }
    if(/내용|메모|적요|상세|사용처|가맹점|상호|비고|품목|내역/.test(h)) { roles[i]='memo'; continue; }
    if(/구분|유형|타입|type/i.test(h)) { roles[i]='type'; continue; }
    /* 제목이 없거나 못 알아볼 때는 값을 보고 추측 */
    const vals = body.map(r=>r[i]).filter(v=>v!==undefined && v!=='');
    if(!vals.length) continue;
    const isCat = v => allCats().some(c=>c.name===v || c.name.split(/[·・\/]/).includes(v));
    if(!roles.includes('date') && vals.filter(v=>parseDate(v)).length >= Math.ceil(vals.length*0.7)) roles[i]='date';
    else if(!roles.includes('amount') && vals.filter(v=>isFinite(parseAmount(v)) && Math.abs(parseAmount(v))>=100).length >= Math.ceil(vals.length*0.7)) roles[i]='amount';
    else if(!roles.includes('cat') && vals.filter(isCat).length >= Math.ceil(vals.length*0.6)) roles[i]='cat';
    else if(!roles.includes('memo')) roles[i]='memo';
    else if(!roles.includes('cat')) roles[i]='cat';
  }
  return roles;
}
function looksLikeHeader(rows){
  if(rows.length < 2) return false;
  const r0 = rows[0].join(' ');
  if(/날짜|일자|금액|분류|내용|메모|수입|지출|항목|카테고리/.test(r0)) return true;
  return !rows[0].some(v=>parseDate(v)) && rows[1].some(v=>parseDate(v));
}

/* 시트의 분류 이름을 이미 있는 분류에 맞춰 줍니다 (마트 → 마트·장보기) */
function mapCat(name, type){
  const n = String(name||'').trim();
  if(!n) return '';
  const pool = type==='income' ? state.settings.incomeCats : state.settings.cats;
  const norm = s => s.replace(/[\s·・/,.]/g,'');
  const hit = pool.find(c=>c.name===n)
           || pool.find(c=>norm(c.name)===norm(n))
           || pool.find(c=>c.name.split(/[·・\/]/).some(tok=>tok===n));
  return hit ? hit.name : n;
}
/* 매핑대로 행 → 기록 변환 */
function previewTx(){
  const {rows, header, roles} = imp;
  const out = [];
  const start = header ? 1 : 0;
  for(let i=start;i<rows.length;i++){
    const r = rows[i];
    /* 같은 역할이 여러 칸에 잡혀 있으면 값이 들어 있는 칸을 씁니다 */
    const g = role => {
      let v = '';
      roles.forEach((rl,k)=>{ if(rl===role && !v && (r[k]||'').trim()) v = r[k].trim(); });
      return v;
    };
    const date = parseDate(g('date'));
    if(!date) continue;
    let type = 'expense', amount = NaN;
    const sp = parseAmount(g('spend')), ic = parseAmount(g('income'));
    if(isFinite(sp) && sp !== 0){ amount = Math.abs(sp); type='expense'; }
    else if(isFinite(ic) && ic !== 0){ amount = Math.abs(ic); type='income'; }
    else {
      const a = parseAmount(g('amount'));
      if(!isFinite(a) || a === 0) continue;
      amount = Math.abs(a);
      if(a < 0 && imp.negIncome) type = 'income';
    }
    const tRaw = g('type');
    if(/수입|입금|\+|income/i.test(tRaw)) type='income';
    else if(/지출|출금|사용|expense/i.test(tRaw)) type='expense';
    const memo = g('memo');
    let cat = mapCat(g('cat'), type);
    if(!cat) cat = guessCat(memo, type) || (type==='income'?'기타수입':'기타');
    out.push({ id:'p'+i, date, type, amount, cat, memo, method:g('method')||'', createdAt:0 });
  }
  return out;
}
function runImport(){
  const list = previewTx();
  if(!list.length){ toast('가져올 기록이 없어요'); return; }
  const have = new Set(state.tx.map(t=>`${t.date}|${t.type}|${Math.round(t.amount)}|${(t.memo||'').trim()}`));
  let added = 0, skipped = 0, newCats = [];
  list.forEach(t=>{
    const k = `${t.date}|${t.type}|${Math.round(t.amount)}|${(t.memo||'').trim()}`;
    if(imp.dedupe && have.has(k)){ skipped++; return; }
    have.add(k);
    const pool = t.type==='income' ? state.settings.incomeCats : state.settings.cats;
    if(t.cat && !pool.some(c=>c.name===t.cat)){
      pool.push({ name:t.cat, emoji:guessEmoji(t.cat), color:PALETTE[pool.length % PALETTE.length] });
      newCats.push(t.cat);
    }
    if(t.method && !state.settings.methods.includes(t.method)) state.settings.methods.push(t.method);
    state.tx.push({ id:uid(), date:t.date, type:t.type, amount:t.amount, cat:t.cat,
                    memo:t.memo, method:t.method||'', createdAt:Date.now() });
    added++;
  });
  save(); closeModal();
  ui.mk = list.map(t=>mOf(t)).sort().pop() || ui.mk;
  ui.tab = 'list'; render();
  toast(`${added}건 가져왔어요${skipped?` (중복 ${skipped}건 건너뜀)`:''}${newCats.length?` · 새 분류 ${newCats.length}개`:''}`);
}

function csvOf(list){
  const rows = [['날짜','구분','분류','내용','결제수단','금액']];
  list.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(t=>rows.push([
    t.date, t.type==='income'?'수입':'지출', t.cat||'', t.memo||'', t.method||'', String(Math.round(t.amount))]));
  return rows.map(r=>r.map(v=>/[",\n]/.test(v)? `"${v.replace(/"/g,'""')}"` : v).join(',')).join('\n');
}

function download(name, text, mime){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿'+text], {type:mime||'text/plain;charset=utf-8'}));
  a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);

function syncQuick(){
  const a = $('#qAmt'), m = $('#qMemo');
  if(a) ui.quick.amount = a.value;
  if(m) ui.quick.memo = m.value;
}
function resetQuick(){ ui.quick = { amount:'', cat:'', memo:'', type:ui.quick.type }; }

document.addEventListener('click', async (e)=>{
  const b = e.target.closest('[data-act], [data-tab]');
  if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;

  if(b.dataset.tab){ ui.tab = b.dataset.tab; render(); window.scrollTo(0,0); return; }

  switch(act){
  /* ---- 공통 ---- */
  case 'close': closeModal(); break;
  case 'settings': openSettings(); break;
  case 'goList': ui.tab='list'; ui.mk=mKey(today()); render(); window.scrollTo(0,0); break;
  case 'month': ui.mk = mAdd(ui.mk, +b.dataset.d); ui.selDay=''; render(); break;
  case 'filter': ui.filter = b.dataset.cat; render(); break;
  case 'selDay': ui.selDay = (ui.selDay===b.dataset.d? '' : b.dataset.d); render(); break;

  /* ---- 홈 빠른 입력 ---- */
  case 'qType': syncQuick(); ui.quick.type=b.dataset.type; ui.quick.cat=''; render(); break;
  case 'qCat':  syncQuick(); ui.quick.cat = (ui.quick.cat===b.dataset.cat? '' : b.dataset.cat); render(); break;
  case 'qPlus': syncQuick();
    ui.quick.amount = num((parseAmount(ui.quick.amount)||0) + (+b.dataset.n)); render();
    { const a=$('#qAmt'); if(a){ a.focus(); a.setSelectionRange(a.value.length,a.value.length); } } break;
  case 'fav': {
    const f = topFavs(8)[+b.dataset.i]; if(!f) break;
    ui.quick = { amount:num(f.amount), cat:f.cat, memo:f.label, type:'expense' };
    render(); toast('금액을 확인하고 기록하세요'); break;
  }
  case 'qSave': {
    syncQuick();
    const amount = parseAmount(ui.quick.amount);
    if(!amount){ toast('금액을 넣어 주세요'); $('#qAmt')?.focus(); break; }
    const type = ui.quick.type;
    const cat = ui.quick.cat || guessCat(ui.quick.memo, type) || (type==='income'?'기타수입':'기타');
    addTx({ date:iso(today()), type, amount, cat, memo:ui.quick.memo });
    resetQuick(); save(); render();
    toast(`${type==='income'?'수입':'지출'} ${num(amount)}원 기록했어요`); break;
  }

  /* ---- 기록 추가/수정 ---- */
  case 'newTx': openTxForm(null); break;
  case 'newTxOn': openTxForm(null, b.dataset.d); break;
  case 'editTx': { const t = state.tx.find(x=>x.id===id); if(t) openTxForm(t); break; }
  case 'fType': collectTxForm(); draft.type=b.dataset.type; draft.cat=''; drawTxForm(); break;
  case 'fCat': collectTxForm(); draft.cat = (draft.cat===b.dataset.cat? '' : b.dataset.cat); drawTxForm(); break;
  case 'fMethod': collectTxForm(); draft.method=b.dataset.m; drawTxForm(); break;
  case 'fPlus': collectTxForm(); draft.amount = (+draft.amount||0) + (+b.dataset.n); drawTxForm(); break;
  case 'fDay': collectTxForm(); draft.date = iso(addDays(today(), +b.dataset.d)); drawTxForm(); break;
  case 'fSave': {
    collectTxForm();
    if(!draft.amount){ toast('금액을 넣어 주세요'); break; }
    const cat = draft.cat || guessCat(draft.memo, draft.type) || (draft.type==='income'?'기타수입':'기타');
    if(draft.id){
      const t = state.tx.find(x=>x.id===draft.id);
      Object.assign(t, { type:draft.type, amount:Math.abs(draft.amount), cat, memo:draft.memo,
                         method:draft.method, date:draft.date });
    } else {
      addTx({ ...draft, cat });
    }
    save(); closeModal(); render(); toast(draft.id? '수정했어요' : `${num(Math.abs(draft.amount))}원 기록했어요`); break;
  }
  case 'fDelete': {
    if(!confirm('이 기록을 지울까요?')) break;
    state.tx = state.tx.filter(t=>t.id!==id);
    (state.fixed||[]).forEach(f=>{ for(const k in (f.done||{})) if(f.done[k]===id) delete f.done[k]; });
    save(); closeModal(); render(); toast('지웠어요'); break;
  }

  /* ---- 분류 / 결제수단 ---- */
  case 'manageCats': openCatManager(); break;
  case 'addCat': {
    const name = $('#cName').value.trim(); if(!name){ toast('이름을 넣어 주세요'); break; }
    const kind = $('#cKind').value;
    const pool = kind==='income' ? state.settings.incomeCats : state.settings.cats;
    if(pool.some(c=>c.name===name)){ toast('이미 있는 분류예요'); break; }
    pool.push({ name, emoji:guessEmoji(name), color:PALETTE[pool.length % PALETTE.length] });
    save(); openCatManager(); toast(`${name} 추가했어요`); break;
  }
  case 'delCat': {
    const kind = b.dataset.kind, name = b.dataset.name;
    const key = kind==='income' ? 'incomeCats' : 'cats';
    state.settings[key] = state.settings[key].filter(c=>c.name!==name);
    delete (state.budgets||{})[name];
    save(); openCatManager(); break;
  }
  case 'manageMethods': openMethodManager(); break;
  case 'addMethod': {
    const m = $('#mName').value.trim(); if(!m) break;
    if(!state.settings.methods.includes(m)) state.settings.methods.push(m);
    save(); openMethodManager(); break;
  }
  case 'delMethod': state.settings.methods = state.settings.methods.filter(m=>m!==b.dataset.m);
    save(); openMethodManager(); break;
  case 'defMethod': state.settings.defMethod = b.dataset.m; save(); openMethodManager(); toast('기본 결제수단으로 정했어요'); break;

  /* ---- 고정지출 ---- */
  case 'editFixed': openFixedForm(id); break;
  case 'xSave': {
    const o = { name:$('#xName').value.trim(), amount:parseAmount($('#xAmt').value)||0,
                day:Math.min(31, Math.max(1, +$('#xDay').value||1)), cat:$('#xCat').value,
                method:$('#xMethod').value, active:$('#xActive').checked };
    if(!o.name || !o.amount){ toast('이름과 금액을 넣어 주세요'); break; }
    state.fixed = state.fixed || [];
    const f = state.fixed.find(x=>x.id===id);
    if(f) Object.assign(f, o); else state.fixed.push({ id:uid(), done:{}, ...o });
    save(); closeModal(); render(); toast('저장했어요'); break;
  }
  case 'xDelete': state.fixed = state.fixed.filter(f=>f.id!==id); save(); closeModal(); render(); break;
  case 'fixedDone': { recordFixed(state.fixed.find(f=>f.id===id)); save(); render(); toast('기록했어요'); break; }
  case 'fixedAll': {
    const mk = mKey(today()), p = fixedPending(mk);
    p.forEach(recordFixed); save(); render(); toast(`고정지출 ${p.length}건 기록했어요`); break;
  }

  /* ---- 예산 ---- */
  case 'saveBudgetTotal':
    state.settings.budget = parseAmount($('#bTotal').value)||0;
    save(); render(); toast('예산을 저장했어요'); break;

  /* ---- 가져오기 / 내보내기 ---- */
  case 'import': openImport(); break;
  case 'impFileBtn': $('#impFile').click(); break;
  case 'impParse': drawImportMap($('#impBox').value); break;
  case 'impRun': runImport(); break;
  case 'export': case 'exportCsv': openExport(); break;
  case 'expCopy': {
    const list = b.dataset.scope==='all' ? state.tx : txOfMonth(ui.mk);
    copyText(csvOf(list), `${list.length}건 복사했어요 · 시트에 붙여넣으세요`); break;
  }
  case 'expFile': download(`가계부_${ui.mk}.csv`, csvOf(txOfMonth(ui.mk)), 'text/csv;charset=utf-8'); break;
  case 'expJson': download(`가계부백업_${iso(today())}.json`, JSON.stringify(state), 'application/json'); break;
  case 'impJsonBtn': $('#jsonFile').click(); break;

  /* ---- 설정 ---- */
  case 'saveSettings':
    state.settings.budget = parseAmount($('#sBudget').value)||0;
    state.settings.defMethod = $('#sMethod').value;
    save(); closeModal(); render(); toast('저장했어요'); break;
  case 'reset':
    if(!confirm('모든 기록을 지우고 처음 상태로 돌릴까요?')) break;
    state = blankState(); save(); closeModal(); render(); toast('초기화했어요'); break;
  case 'copyBackup': copyText(JSON.stringify(state), '백업 내용을 복사했어요'); break;
  case 'pasteRestore': openPasteRestore(); break;
  case 'doPasteRestore': {
    try{
      const data = JSON.parse($('#restoreBox').value.trim());
      if(!data.tx) throw 0;
      state = Object.assign(blankState(), data); save(); closeModal(); render(); toast('복원했어요');
    }catch(err){ toast('올바른 백업 내용이 아니에요'); }
    break;
  }
  case 'selectFallback': { const t=$('#fallbackBox'); t.focus(); t.select(); break; }

  /* ---- 가족과 함께 쓰기 ---- */
  case 'syncSetup': openSyncSetup(); break;
  case 'copyRules': copyText($('#rulesBox').value, '보안 규칙을 복사했어요'); break;
  case 'syncConnect': {
    const cfg = parseFbConfig($('#fbBox').value);
    if(!cfg){ toast('설정값에서 apiKey와 projectId를 찾지 못했어요'); break; }
    state.sync = { enabled:true, apiKey:cfg.apiKey, projectId:cfg.projectId, room:randId(20), rev:0 };
    writeLocal(); closeModal(); render();
    await syncPush();
    if(state.sync.error) toast(state.sync.error); else { openSyncInvite(); toast('연결됐어요'); }
    break;
  }
  case 'syncInvite': openSyncInvite(); break;
  case 'copyInvite': copyText($('#inviteBox').value, '초대 링크를 복사했어요'); break;
  case 'joinByLink': openJoinByLink(); break;
  case 'doJoinLink': {
    const m = ($('#joinBox').value||'').match(/join=([A-Za-z0-9_\-]+)/);
    if(!m){ toast('초대 링크를 찾지 못했어요'); break; }
    try{ const v = JSON.parse(b64d(m[1]));
      if(!(v.k && v.p && v.r)) throw 0;
      pendingInvite = v; closeModal(); openJoinPrompt();
    }catch(err){ toast('링크가 올바르지 않아요'); }
    break;
  }
  case 'joinTake': {
    const v = pendingInvite; if(!v) break;
    state.sync = { enabled:true, apiKey:v.k, projectId:v.p, room:v.r, rev:0 };
    writeLocal(); closeModal();
    await syncPull(); syncStart(); render();
    toast(state.sync.error || '가족 방에 참여했어요'); break;
  }
  case 'joinPush': {
    const v = pendingInvite; if(!v) break;
    state.sync = { enabled:true, apiKey:v.k, projectId:v.p, room:v.r, rev:0 };
    writeLocal(); closeModal();
    await syncPush(); syncStart(); render();
    toast(state.sync.error || '이 폰 기록을 방에 올렸어요'); break;
  }
  case 'syncNow': await syncPull(); closeModal(); render(); toast(state.sync.error || '동기화했어요'); break;
  case 'syncOff':
    if(!confirm('이 폰만 쓰는 상태로 돌릴까요? (지금까지 받은 기록은 그대로 남아요)')) break;
    state.sync = { enabled:false }; clearInterval(syncTimer); syncTimer=null;
    writeLocal(); closeModal(); render(); toast('공유를 껐어요'); break;
  }
});

function recordFixed(f){
  if(!f) return;
  const mk = mKey(today()), dim = daysInMonth(mk);
  const t = addTx({ date:`${mk}-${String(Math.min(f.day||1, dim)).padStart(2,'0')}`, type:'expense',
                    amount:f.amount, cat:f.cat, memo:f.name, method:f.method });
  (f.done = f.done||{})[mk] = t.id;
}

    if(v) state.budgets[t.dataset.catBudget] = v; else delete state.budgets[t.dataset.catBudget];
    save();
    setTimeout(render, 0);   /* blur 처리 중 화면을 갈아끼우면 브라우저가 오류를 내므로 한 박자 뒤에 */
  }
  else if(t.id==='fDate' && draft){ draft.date = t.value; }
});
/* 금액 칸에서 엔터 = 기록 */
document.addEventListener('keydown', e=>{
  if(e.key !== 'Enter') return;
  if(e.target.id==='qAmt' || e.target.id==='qMemo'){ e.preventDefault(); $('[data-act="qSave"]')?.click(); }
  if(e.target.id==='fAmt' || e.target.id==='fMemo'){ e.preventDefault(); $('[data-act="fSave"]')?.click(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ============================================================
   6. 가족과 함께 쓰기 — Firebase Firestore REST 동기화
   ------------------------------------------------------------
   · SDK 없이 fetch만 씁니다(외부 스크립트 로딩 없음).
   · rooms/{방}/state/core 문서 하나에 전체 데이터를 JSON으로 보관
   · 화면을 보고 있을 때만 15초마다 문서 1건 확인 → 바뀌었을 때만 내려받음
   ============================================================ */
const DEVICE = (()=>{ let d=localStorage.getItem('hl.device');
  if(!d){ d=uid(); localStorage.setItem('hl.device',d); } return d; })();
let syncTimer=null, pushTimer=null, syncBusy=false, pendingInvite=null;

const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
const randId = n => { const a=new Uint8Array(n); crypto.getRandomValues(a);
  return [...a].map(x=>'abcdefghijkmnpqrstuvwxyz23456789'[x%32]).join(''); };

function fsUrl(path){
  const c = state.sync;
  return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(c.projectId)}`
       + `/databases/(default)/documents/${path}?key=${encodeURIComponent(c.apiKey)}`;
}
async function fsErr(r){
  let m=''; try{ m=(await r.json()).error?.message||''; }catch(e){}
  if(r.status===403) return '권한이 거부됐어요 — Firestore 보안 규칙을 확인해 주세요';
  if(r.status===400) return 'API 키나 프로젝트 ID가 올바르지 않아요';
  if(r.status===404) return '프로젝트를 찾을 수 없어요 (Firestore 데이터베이스를 만들었는지 확인)';
  return `오류 ${r.status} ${m}`.trim();
}
async function fsGet(path){
  const r = await fetch(fsUrl(path));
  if(r.status===404) return null;
  if(!r.ok) throw new Error(await fsErr(r));
  const d = await r.json();
  return { json:d.fields?.json?.stringValue||'', rev:+(d.fields?.rev?.integerValue||0), by:d.fields?.by?.stringValue||'' };
}
async function fsPut(path, json, rev){
  const r = await fetch(fsUrl(path), { method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ fields:{ json:{stringValue:json}, rev:{integerValue:String(rev)}, by:{stringValue:DEVICE} } }) });
  if(!r.ok) throw new Error(await fsErr(r));
}
function corePayload(){
  return JSON.stringify({ tx:state.tx, budgets:state.budgets, fixed:state.fixed, settings:state.settings });
}
function applyCore(txt){
  const d = JSON.parse(txt);
  state.tx = d.tx||[]; state.budgets = d.budgets||{};
  state.fixed = d.fixed||[]; state.settings = d.settings||state.settings;
}
function schedulePush(){
  if(!state.sync?.enabled) return;
  state.sync.dirty = true;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(syncPush, 1200);
}
async function syncPush(){
  const c = state.sync;
  if(!c?.enabled || syncBusy) return;
  syncBusy = true;
  try{
    const rev = Date.now();
    await fsPut(`rooms/${c.room}/state/core`, corePayload(), rev);
    c.rev = rev; c.lastAt = rev; c.error = ''; c.dirty = false;
  }catch(e){ c.error = e.message; }
  finally{ syncBusy=false; writeLocal(); renderHeadMeta(); }
}
async function syncPull(){
  const c = state.sync;
  if(!c?.enabled || syncBusy) return;
  /* 아직 못 올린 내 변경이 있으면 남의 내용으로 덮기 전에 내 것부터 올린다 */
  if(c.dirty){ await syncPush(); return; }
  syncBusy = true;
  try{
    const doc = await fsGet(`rooms/${c.room}/state/core`);
    if(doc && doc.rev > (c.rev||0) && doc.by !== DEVICE){
      applyingRemote = true; applyCore(doc.json); applyingRemote = false;
      c.rev = doc.rev; writeLocal(); render();
      toast('가족이 적은 내용을 받아왔어요');
    }
    c.lastAt = Date.now(); c.error = '';
  }catch(e){ c.error = e.message; }
  finally{ syncBusy=false; writeLocal(); renderHeadMeta(); }
}
function syncStart(){
  clearInterval(syncTimer); syncTimer = null;
  if(!state.sync?.enabled) return;
  syncPull();
  syncTimer = setInterval(()=>{ if(!document.hidden) syncPull(); }, 15000);
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncPull(); });

function parseFbConfig(text){
  const t = String(text||'');
  const api = t.match(/apiKey["'\s:]+([A-Za-z0-9_\-]{20,})/);
  const pid = t.match(/projectId["'\s:]+([a-z0-9\-]{4,})/i);
  if(!api || !pid) return null;
  return { apiKey: api[1], projectId: pid[1] };
}
function inviteLink(){
  const c = state.sync;
  return location.href.split('#')[0] + '#join='
       + b64e(JSON.stringify({ k:c.apiKey, p:c.projectId, r:c.room }));
}
(function readInvite(){
  const m = location.hash.match(/join=([A-Za-z0-9_\-]+)/);
  if(!m) return;
  try{ const v = JSON.parse(b64d(m[1]));
    if(v.k && v.p && v.r) pendingInvite = v; }catch(e){}
  history.replaceState(null, '', location.pathname + location.search);
})();

/* ============================================================
   7. 시작
   ============================================================ */
state = load() || blankState();
if(!state.sync) state.sync = { enabled:false };
if(!state.settings.cats) state.settings.cats = DEF_CATS.map(c=>({...c}));
if(!state.settings.incomeCats) state.settings.incomeCats = DEF_INCOME.map(c=>({...c}));
if(!state.settings.methods) state.settings.methods = [...DEF_METHODS];
if(!state.seeded && !state.tx.length){ seed(); writeLocal(); }
render();
syncStart();
if(pendingInvite) openJoinPrompt();
</script>
