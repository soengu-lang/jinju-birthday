<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#274b6d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StockLens">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>StockLens AI — 투자 논리를 검증하는 AI 애널리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ed; --card:#fffdf8; --ink:#1e2430; --muted:#6f7683;
  --brand:#274b6d; --brand-d:#1c3750; --soft:#e6edf4; --soft-d:#c7d6e5;
  --up:#d1453b; --up-s:#fdeceb;      /* 국내 관례: 오르는 쪽 = 빨강 */
  --down:#2f62c4; --down-s:#eaf0fd;  /* 내려가는 쪽 = 파랑 */
  --flat:#6f7683; --flat-s:#eeeeee;
  --gold:#c9862b; --gold-s:#fdf2e2;
  --green:#3f7d4f; --green-s:#e8f3ea;
  --line:#e5e2d8; --shadow:0 1px 2px rgba(30,36,48,.06), 0 8px 22px rgba(30,36,48,.06);
  --r:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--soft-d);outline-offset:1px}
textarea{min-height:88px;resize:vertical;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
.hidden{display:none !important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.tiny{font-size:11.5px}
.small{font-size:12.5px}
.mt{margin-top:10px}
.mt2{margin-top:16px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.right{text-align:right}
.center{text-align:center}
.b{font-weight:800}
a{color:var(--brand)}

header{background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.head-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 10px}
.brand{font-size:11.5px;font-weight:700;color:var(--gold);letter-spacing:.04em}
h1{font-size:clamp(18px,5vw,22px);font-weight:900;letter-spacing:-.03em;margin-top:1px;white-space:nowrap}
.head-note{font-size:11px;color:var(--muted);line-height:1.45;text-align:right;max-width:52%}
.gear{font-size:20px;padding:6px 8px;border-radius:10px}
.gear:active{background:var(--soft)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs-in{display:flex;gap:4px;max-width:640px;margin:0 auto}
.tabs button{flex:1;padding:6px 2px 4px;border-radius:12px;font-size:10.5px;font-weight:700;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs button .ic{font-size:20px;line-height:1.2}
.tabs button.on{color:var(--brand);background:var(--soft)}

section.tab{padding-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;box-shadow:var(--shadow);margin-bottom:12px}
.card > h2, .card .h2{font-size:15px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
.card > h2 .sub{font-size:11px;font-weight:500;color:var(--muted);margin-left:auto}
.desc{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:6px}
.desc b{color:var(--ink);font-weight:700}
.divider{height:1px;background:var(--line);margin:12px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--brand);color:#fff;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:800;width:100%}
.btn:active{background:var(--brand-d)}
.btn.ghost{background:var(--soft);color:var(--brand)}
.btn.ghost:active{background:var(--soft-d)}
.btn.warn{background:var(--up-s);color:var(--up)}
.btn.sm{padding:7px 11px;font-size:12.5px;width:auto;border-radius:10px;white-space:nowrap}
.btn.xs{padding:4px 9px;font-size:11.5px;width:auto;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn-row .btn{flex:1}

.pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px;line-height:1.4;vertical-align:1px}
.pill.up{background:var(--up-s);color:var(--up)}
.pill.down{background:var(--down-s);color:var(--down)}
.pill.flat{background:var(--flat-s);color:var(--flat)}
.pill.gold{background:var(--gold-s);color:var(--gold)}
.pill.green{background:var(--green-s);color:var(--green)}
.pill.brand{background:var(--soft);color:var(--brand)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

/* 리스트 */
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.item{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);
  border-radius:13px;padding:11px 12px;text-align:left;width:100%}
.item:active{background:var(--soft)}
.item .nm{font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.item .cd{font-size:11px;color:var(--muted)}
.item .px{font-size:14px;font-weight:800}
.item .chg{font-size:11.5px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.up{background:var(--up)} .dot.down{background:var(--down)} .dot.flat{background:#c8c5bb}

/* 점수 */
.score-hero{display:flex;align-items:center;gap:16px}
.score-big{font-size:44px;font-weight:900;letter-spacing:-.04em;line-height:1}
.score-big small{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:0}
.bar{height:9px;border-radius:6px;background:#ebe8df;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:6px;background:var(--brand)}
.bars{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.bars .r{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:9px;font-size:12.5px}
.bars .r .v{font-weight:800;text-align:right}
.why{font-size:12px;color:var(--muted);line-height:1.65;margin-top:8px;padding:9px 11px;background:#faf8f3;border-radius:10px}
.why li{margin-left:15px}

/* 시나리오 */
.scen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.scen .c{border-radius:12px;padding:10px 8px;text-align:center;border:1px solid var(--line)}
.scen .c .t{font-size:11px;font-weight:800}
.scen .c .p{font-size:16px;font-weight:900;margin-top:2px;letter-spacing:-.02em}
.scen .c .d{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.scen .bull{background:var(--up-s)} .scen .base{background:#faf8f3} .scen .bear{background:var(--down-s)}
.slider{display:grid;grid-template-columns:86px 1fr 60px;gap:8px;align-items:center;font-size:12px;margin-top:8px}
.slider input[type=range]{padding:0;border:none;background:none}
.slider .v{text-align:right;font-weight:800}

/* 표 */
table.tb{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
table.tb th,table.tb td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.tb th{font-weight:700;color:var(--muted);font-size:11px}
table.tb td:first-child,table.tb th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.tbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* 변화 */
.chg-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.chg-item:last-child{border-bottom:none}
.chg-item .ico{font-size:18px;flex:none;width:24px;text-align:center}
.chg-item .t{font-size:13.5px;font-weight:800;letter-spacing:-.02em}
.chg-item .d{font-size:12px;color:var(--muted);line-height:1.55;margin-top:2px}
.lv{font-size:10px;font-weight:800;border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.lv.high{background:var(--up-s);color:var(--up)} .lv.mid{background:var(--gold-s);color:var(--gold)} .lv.low{background:var(--flat-s);color:var(--flat)}

/* 리스크 */
.risk{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line)}
.risk:last-child{border-bottom:none}
.stars{font-size:11px;letter-spacing:1px;color:var(--gold);margin-left:auto;white-space:nowrap}

/* thesis */
.assump{display:flex;gap:8px;align-items:flex-start;padding:7px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.assump:last-child{border-bottom:none}
.assump .k{flex:none;width:18px;text-align:center}
.assump .kw{font-size:10.5px;color:var(--muted);margin-top:2px}
.conf{display:flex;align-items:center;gap:10px;margin-top:10px}
.conf .bar{flex:1}
.conf .n{font-size:20px;font-weight:900;letter-spacing:-.03em;min-width:60px;text-align:right}

/* 채팅 */
.chat{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.msg{max-width:92%;padding:10px 12px;border-radius:14px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ai .src{font-size:10.5px;color:var(--muted);margin-top:6px;border-top:1px dashed var(--line);padding-top:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11.5px;font-weight:700;background:var(--soft);color:var(--brand);border-radius:20px;padding:5px 10px}
.chip:active{background:var(--soft-d)}
.ask{display:flex;gap:6px;margin-top:10px;align-items:flex-end}
.ask textarea{min-height:44px;max-height:120px}
.ask .btn{width:auto;padding:11px 13px;flex:none}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(20,24,32,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:20px;max-height:84vh}}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mhead h3{font-size:16px;font-weight:900;letter-spacing:-.02em}
.mhead .x{font-size:18px;padding:4px 8px;border-radius:8px}
.f{margin-top:10px}
.f label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.note{background:var(--gold-s);border:1px solid #f0dcbb;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.7;color:#7a5518}
.note b{font-weight:800}
.err{background:var(--up-s);border:1px solid #f3c9c5;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.6;color:#8d2b23}
.ok{background:var(--green-s);border:1px solid #c7e1cd;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.6;color:#2c5d3a}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#1e2430;color:#fff;font-size:12.5px;padding:9px 14px;border-radius:20px;z-index:99;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
.spin.dark{border-color:var(--brand);border-top-color:transparent}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 10px;line-height:1.8}
.empty .em{font-size:34px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.kv .c{background:#faf8f3;border-radius:10px;padding:8px 6px;text-align:center}
.kv .c .k{font-size:10.5px;color:var(--muted)} .kv .c .v{font-size:13.5px;font-weight:800;margin-top:1px}
.tagline{font-size:12px;color:var(--muted);line-height:1.7}
.sec-t{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em;margin:14px 0 4px}
details summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--brand)}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
pre{white-space:pre-wrap;word-break:break-all;background:#f3f1ea;border-radius:10px;padding:10px}
.newsl{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.newsl a{display:block;font-size:12.5px;line-height:1.5;color:var(--ink);text-decoration:none;padding:6px 0;border-bottom:1px solid var(--line)}
.newsl a:last-child{border-bottom:none}
.newsl .m{font-size:10.5px;color:var(--muted)}
.newsl .new{color:var(--up);font-weight:800;font-size:10px;margin-right:4px}
</style>
</head>
<body>
<header><div class="wrap head-in">
  <div>
    <div class="brand">STOCKLENS AI</div>
    <h1>투자 논리를 검증하는 AI</h1>
  </div>
  <div class="row">
    <div class="head-note">찍어 주지 않고<br>검증합니다</div>
    <button class="gear" data-act="settings" title="설정">⚙️</button>
  </div>
</div></header>

<main class="wrap">
  <section class="tab" id="tab-home"></section>
  <section class="tab hidden" id="tab-search"></section>
  <section class="tab hidden" id="tab-stock"></section>
  <section class="tab hidden" id="tab-thesis"></section>
  <section class="tab hidden" id="tab-ai"></section>
</main>

<nav class="tabs"><div class="tabs-in">
  <button data-tab="home" class="on"><span class="ic">🏠</span>홈</button>
  <button data-tab="search"><span class="ic">🔍</span>검색</button>
  <button data-tab="stock"><span class="ic">📊</span>종목</button>
  <button data-tab="thesis"><span class="ic">🧭</span>논리</button>
  <button data-tab="ai"><span class="ic">💬</span>AI</button>
</div></nav>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
/* ============================================================
   StockLens AI — 단일 파일 앱
   ------------------------------------------------------------
   원칙: 재무데이터 → 계산 모델 → 점수 → AI 설명.
   점수·목표가는 아래 순수 함수가 계산하고, AI는 그 결과를 "설명"만 합니다.
   저장은 이 폰(브라우저)의 localStorage 에만 됩니다.
   ============================================================ */
const KEY = 'stockLens.v1';
const DAY = 86400000;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d=0) => (n==null || !isFinite(n)) ? '–' : Number(n).toLocaleString('ko-KR', {maximumFractionDigits:d, minimumFractionDigits:d});
const pct = (n, d=1) => (n==null || !isFinite(n)) ? '–' : (n>0?'+':'') + Number(n).toFixed(d) + '%';
const won = n => (n==null || !isFinite(n)) ? '–' : '₩' + fmt(Math.round(n));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const iso = d => { const x = new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
const today = () => iso(Date.now());
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
/* "1,234" "12.3%" "-5" 같은 문자열을 숫자로. 못 읽으면 NaN */
function num(v){
  if(v==null) return NaN;
  if(typeof v === 'number') return v;
  const s = String(v).replace(/,/g,'').replace(/%/g,'').replace(/[^\d.\-]/g,'');
  if(s==='' || s==='-' || s==='.') return NaN;
  return Number(s);
}
const has = v => v!=null && isFinite(v);

/* ---------- 상태 ---------- */
let state = {
  watch: [],          /* [{code,name,addedAt,market}] */
  data: {},           /* code → 마지막으로 받은 원본 데이터(가공 후) */
  snaps: {},          /* code → [{t, ...핵심지표}] 날짜별 스냅샷(변화 감지용) */
  theses: [],         /* [{id,code,title,text,assumptions:[{text,keywords}],risks:[...],confidence,createdAt,history:[{t,conf,reason}],lastChecked}] */
  journal: [],        /* 투자일지 */
  chats: {},          /* code('*'=포트폴리오) → [{role,text,t}] */
  seenNews: {},       /* code → {articleId:true} 이미 본 뉴스 */
  brief: null,        /* 오늘의 AI 브리핑 캐시 {date,text} */
  settings: { provider:'anthropic', apiKey:'', model:'', relayUrl:'', relay:0, effort:'medium' },
  ui: { tab:'home', code:'', demo:false }
};
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)||'null'); if(s) state = Object.assign(state, s, {settings:Object.assign(state.settings, s.settings||{}), ui:Object.assign(state.ui, s.ui||{})}); }catch(e){}
  /* 우리집 자산 앱에서 만든 중계 주소가 있으면 그대로 물려받습니다 */
  if(!state.settings.relayUrl){
    try{ const ma = JSON.parse(localStorage.getItem('myAssets.v1')||'null'); if(ma?.relayUrl) state.settings.relayUrl = ma.relayUrl; }catch(e){}
  }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast('저장 공간이 부족해요'); } }
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* ============================================================
   1. 데이터 가져오기 — 서버가 없어서 공개 중계를 거칩니다
   (우리집 자산 앱과 같은 방식. 구글 앱스 스크립트 중계를 만들면 가장 안정적)
   ============================================================ */
const RELAYS = [
  { n:'직접',        f:u=>u },
  { n:'allorigins',  f:u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u) },
  { n:'codetabs',    f:u=>'https://api.codetabs.com/v1/proxy?quote='+encodeURIComponent(u) },
  { n:'corsproxy',   f:u=>'https://corsproxy.io/?url='+encodeURIComponent(u) },
  { n:'allorigins2', f:u=>'https://api.allorigins.win/get?url='+encodeURIComponent(u), wrap:'contents' },
];
const GAS_CODE = `function doGet(e) {
  var url = e.parameter.url;
  if (!url) return ContentService.createTextOutput('{"error":"no url"}')
    .setMimeType(ContentService.MimeType.JSON);
  var r = UrlFetchApp.fetch(url, {
    muteHttpExceptions: true,
    followRedirects: true,
    headers: { 'User-Agent': 'Mozilla/5.0', 'Referer': 'https://finance.naver.com/' }
  });
  return ContentService.createTextOutput(r.getContentText())
    .setMimeType(ContentService.MimeType.JSON);
}`;
function normRelay(u){
  u = String(u||'').trim();
  if(!u) return '';
  if(u.includes('{url}')) return u;
  if(/script\.google\.com/.test(u)) return u.replace(/[?#].*$/,'') + '?url={url}';
  return u;
}
function relayList(){
  const mine = String(state.settings.relayUrl||'').trim();
  if(!mine) return RELAYS;
  const f = mine.includes('{url}') ? u => mine.replace('{url}', encodeURIComponent(u)) : u => mine.replace(/\/+$/,'') + '/' + u;
  return [{ n:'내 중계', f }, ...RELAYS];
}
let relayBad = new Set(), relayDead = false;
function resetRelays(){ relayBad = new Set(); relayDead = false; }
async function getText(url, ms=8000){
  const ac = new AbortController(); const t = setTimeout(()=>ac.abort(), ms);
  let r;
  try{ r = await fetch(url, { signal:ac.signal, cache:'no-store' }); }
  catch(e){ const err = new Error('연결 실패'); err.net = true; throw err; }
  finally{ clearTimeout(t); }
  if(!r.ok){ const err = new Error('HTTP '+r.status); err.http = r.status; throw err; }
  return await r.text();
}
async function relayText(url){
  if(relayDead) throw new Error('데이터 서버에 닿지 못했어요');
  const L = relayList();
  const first = Math.min(state.settings.relay|0, L.length-1);
  const order = [first, ...L.map((_,i)=>i).filter(i=>i!==first)].filter(i=>!relayBad.has(i));
  if(!order.length){ relayDead = true; throw new Error('데이터 서버에 닿지 못했어요'); }
  let netFail = 0, lastErr = null;
  for(const i of order){
    try{
      let txt = await getText(L[i].f(url));
      if(L[i].wrap){ txt = JSON.parse(txt)[L[i].wrap]; }
      if(state.settings.relay !== i){ state.settings.relay = i; save(); }
      return txt;
    }catch(e){
      lastErr = e;
      if(e.net || e.http===403 || e.http===429 || e.http>=500){ relayBad.add(i); netFail++; }
    }
  }
  if(netFail >= order.length) relayDead = true;
  throw lastErr || new Error('가져오지 못했어요');
}
async function relayJSON(url){ const t = await relayText(url); try{ return JSON.parse(t); }catch(e){ throw new Error('응답이 JSON이 아니에요'); } }

/* ============================================================
   2. 계산 모델 — 점수 (0~100) · 시나리오 · 변화 감지
   ------------------------------------------------------------
   모두 순수 함수. 입력은 위의 data 한 덩어리, 출력은 숫자와 '왜' 목록입니다.
   ============================================================ */
/* 구간 보간: pts=[[x,y],...] 오름차순 x */
function interp(x, pts){
  if(!has(x)) return NaN;
  if(x <= pts[0][0]) return pts[0][1];
  for(let i=1;i<pts.length;i++){ if(x <= pts[i][0]){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; return y0 + (y1-y0)*(x-x0)/(x1-x0); } }
  return pts[pts.length-1][1];
}
const avg = a => { const b = a.filter(has); return b.length ? b.reduce((s,v)=>s+v,0)/b.length : NaN; };

/* 연간 재무표에서 실적(A) 열과 추정(E) 열을 나눠 시계열로 */
function series(fin, key){
  const row = fin?.table?.[key]; if(!row) return { a:[], e:[] };
  const cols = fin.cols.length ? fin.cols : Object.keys(row).map(k=>({key:k,title:k,est:/E/.test(k)}));
  const a=[], e=[];
  for(const c of cols){ const v = row[c.key]; if(!has(v)) continue; (c.est ? e : a).push({ k:c.title, v }); }
  return { a, e };
}
const last = arr => arr.length ? arr[arr.length-1].v : NaN;
const growth = (cur, prev) => (has(cur) && has(prev) && prev !== 0) ? (cur-prev)/Math.abs(prev)*100 : NaN;
function cagr(arr, n){ if(arr.length < n+1) return NaN; const a = arr[arr.length-1-n].v, b = arr[arr.length-1].v; if(!(a>0) || !(b>0)) return NaN; return (Math.pow(b/a, 1/n)-1)*100; }

function computeScore(d){
  const A = d.annual, why = {}, s = {};
  const rev = series(A,'revenue'), op = series(A,'op'), opm = series(A,'opm'), roe = series(A,'roe'), debt = series(A,'debt'), quick = series(A,'quick');
  const per = series(A,'per'), pbr = series(A,'pbr'), eps = series(A,'eps');
  const price = d.basic.price, I = d.integ;

  /* 성장성: 3년 매출 CAGR, 최근 영업이익 증가율, 다음 해 추정 영업이익 증가율 */
  {
    const r3 = cagr(rev.a, Math.min(3, rev.a.length-1));
    const g1 = growth(last(op.a), op.a.length>1 ? op.a[op.a.length-2].v : NaN);
    const gE = op.e.length ? growth(op.e[0].v, last(op.a)) : NaN;
    const parts = [interp(r3, [[-10,15],[0,40],[5,55],[10,68],[20,82],[35,95]]), interp(g1, [[-40,15],[-10,35],[0,48],[20,65],[50,80],[100,95]]), interp(gE, [[-30,20],[0,45],[15,65],[40,85],[80,95]])];
    s.growth = Math.round(avg(parts));
    why.growth = [ has(r3)&&`최근 ${Math.min(3,rev.a.length-1)}년 매출 연평균 ${pct(r3)}`, has(g1)&&`직전 연도 영업이익 ${pct(g1)}`, has(gE)&&`올해 추정 영업이익 ${pct(gE)} (증권사 추정)` ].filter(Boolean);
  }
  /* 수익성: 영업이익률 수준, ROE, 마진 추세 */
  {
    const m = last(opm.a), r = last(roe.a), mt = opm.a.length>1 ? m - opm.a[opm.a.length-2].v : NaN;
    const parts = [interp(m, [[-5,10],[0,30],[5,48],[10,62],[20,80],[35,95]]), interp(r, [[-5,10],[0,30],[5,45],[10,62],[15,78],[25,92]]), interp(mt, [[-10,25],[-3,40],[0,50],[3,62],[10,80]])];
    s.profit = Math.round(avg(parts));
    why.profit = [ has(m)&&`영업이익률 ${m.toFixed(1)}%`, has(r)&&`ROE ${r.toFixed(1)}%`, has(mt)&&`영업이익률 전년 대비 ${(mt>0?'+':'')+mt.toFixed(1)}%p` ].filter(Boolean);
  }
  /* 밸류에이션: PER vs 자기 과거 평균, PER vs 업종, PBR, 배당 */
  {
    const perNow = has(I.per) ? I.per : last(per.a);
    const perHist = avg(per.a.map(x=>x.v).filter(v=>v>0 && v<200));
    const perE = has(I.perE) ? I.perE : (eps.e.length && eps.e[0].v>0 ? price/eps.e[0].v : NaN);
    const rel = (has(perNow) && has(perHist) && perNow>0) ? perNow/perHist : NaN;
    const relInd = (has(perNow) && has(I.indPer) && I.indPer>0 && perNow>0) ? perNow/I.indPer : NaN;
    const pbrNow = has(I.pbr) ? I.pbr : last(pbr.a);
    const parts = [ interp(rel, [[0.5,90],[0.8,72],[1,55],[1.3,40],[2,20]]), interp(relInd, [[0.5,85],[0.8,68],[1,52],[1.5,35],[2.5,18]]),
      interp(pbrNow, [[0.5,85],[1,68],[2,52],[4,35],[8,18]]), interp(perE, [[5,90],[10,72],[15,58],[25,42],[40,25],[80,10]]), interp(I.divYield, [[0,45],[2,55],[4,68],[6,80]]) ];
    s.value = Math.round(avg(parts));
    why.value = [ has(perNow)&&`PER ${perNow.toFixed(1)}배` + (has(perHist)?` (과거 평균 ${perHist.toFixed(1)}배)`:''), has(perE)&&`추정 PER ${perE.toFixed(1)}배`, has(I.indPer)&&`동일업종 PER ${I.indPer.toFixed(1)}배`, has(pbrNow)&&`PBR ${pbrNow.toFixed(2)}배`, has(I.divYield)&&`배당수익률 ${I.divYield.toFixed(2)}%` ].filter(Boolean);
    if(has(perNow) && perNow < 0) why.value.push('적자여서 PER 로 평가하기 어려움');
  }
  /* 재무건전성: 부채비율, 당좌비율, 순이익 흑자 여부 */
  {
    const dr = last(debt.a), qr = last(quick.a), ni = last(series(A,'ni').a);
    const parts = [interp(dr, [[20,95],[50,85],[100,68],[200,42],[300,22],[500,8]]), interp(qr, [[30,20],[70,45],[100,65],[150,82],[250,95]]), has(ni) ? (ni>0 ? 75 : 25) : NaN];
    s.health = Math.round(avg(parts));
    why.health = [ has(dr)&&`부채비율 ${dr.toFixed(0)}%`, has(qr)&&`당좌비율 ${qr.toFixed(0)}%`, has(ni)&&(ni>0?'당기순이익 흑자':'당기순이익 적자') ].filter(Boolean);
  }
  /* 모멘텀: 20/60/120일 이평 대비, 3개월 수익률, 52주 위치 */
  {
    const ch = d.chart || [], n = ch.length;
    const ma = k => n>=k ? avg(ch.slice(n-k).map(x=>x.c)) : NaN;
    const m20 = ma(20), m60 = ma(60), m120 = ma(120);
    const r3m = n>63 ? growth(price, ch[n-64].c) : NaN;
    const hi = I.high52, lo = I.low52;
    const pos52 = (has(hi)&&has(lo)&&hi>lo) ? (price-lo)/(hi-lo)*100 : NaN;
    const above = [m20,m60,m120].filter(has).map(m => price>m ? 1 : 0);
    const parts = [ above.length ? 30 + avg(above)*50 : NaN, interp(r3m, [[-30,15],[-10,35],[0,50],[10,65],[30,82],[60,95]]), interp(pos52, [[0,25],[30,45],[60,62],[90,78],[100,85]]) ];
    s.momentum = Math.round(avg(parts));
    why.momentum = [ above.length&&`20·60·120일선 중 ${above.filter(x=>x).length}/${above.length}개 위`, has(r3m)&&`3개월 수익률 ${pct(r3m)}`, has(pos52)&&`52주 범위의 ${pos52.toFixed(0)}% 위치` ].filter(Boolean);
    s._mas = {m20,m60,m120,r3m,pos52};
  }
  const W = { growth:.25, profit:.25, value:.2, health:.15, momentum:.15 };
  let tot=0, wsum=0;
  for(const [k,w] of Object.entries(W)){ if(has(s[k])){ tot += s[k]*w; wsum += w; } }
  s.total = wsum ? Math.round(tot/wsum) : NaN;
  s.coverage = Math.round(wsum/1*100);
  return { s, why };
}

/* 시나리오 — EPS × PER. adj = {epsBull, epsBear, perBull, perBase, perBear} 사용자가 슬라이더로 바꿀 수 있습니다 */
function scenarios(d, adj={}){
  const A = d.annual, I = d.integ, price = d.basic.price;
  const eps = series(A,'eps'), per = series(A,'per');
  const epsA = last(eps.a), epsE = has(I.epsE) ? I.epsE : (eps.e.length ? eps.e[0].v : NaN);
  const base = has(epsE) ? epsE : epsA;
  const hist = per.a.map(x=>x.v).filter(v=>v>0 && v<150);
  const perAvg = hist.length ? avg(hist) : (has(I.indPer) ? I.indPer : (has(I.per)&&I.per>0 ? I.per : 12));
  const perLo = hist.length ? Math.min(...hist) : perAvg*0.7, perHi = hist.length ? Math.max(...hist) : perAvg*1.3;
  const a = Object.assign({ epsBull: 15, epsBear: -20, perBull: +perHi.toFixed(1), perBase: +perAvg.toFixed(1), perBear: +perLo.toFixed(1) }, adj);
  const px = (e, p) => (has(e) && e>0) ? Math.round(e*p) : NaN;
  const out = {
    epsBase: base, epsSrc: has(epsE) ? '증권사 추정 EPS' : '최근 연간 EPS', perAvg, perLo, perHi, adj:a,
    bull: px(base*(1+a.epsBull/100), a.perBull), base: px(base, a.perBase), bear: px(base*(1+a.epsBear/100), a.perBear),
    target: I.target,
  };
  out.upBull = growth(out.bull, price); out.upBase = growth(out.base, price); out.upBear = growth(out.bear, price);
  if(has(base) && base <= 0) out.note = '이익이 적자(또는 없음)라 EPS×PER 방식이 맞지 않습니다. PBR·매출 기준으로 따로 봐야 합니다.';
  return out;
}

/* 리스크 모니터 — 데이터로 잴 수 있는 것만 별 개수로 */
function riskMonitor(d, sc, sn){
  const A = d.annual, I = d.integ, price = d.basic.price, out = [];
  const add = (name, lv, why) => out.push({ name, lv, why });     /* lv 1~5 */
  const per = series(A,'per'), debt = series(A,'debt'), opm = series(A,'opm'), rev = series(A,'revenue');
  const perNow = has(I.per)?I.per:last(per.a), perAvg = avg(per.a.map(x=>x.v).filter(v=>v>0&&v<150));
  if(has(perNow) && has(perAvg)) add('밸류에이션 부담', clamp(Math.round(interp(perNow/perAvg, [[0.6,1],[0.9,2],[1.2,3],[1.6,4],[2.2,5]])),1,5), `PER ${perNow.toFixed(1)}배 vs 과거 평균 ${perAvg.toFixed(1)}배`);
  else if(has(perNow) && perNow<0) add('적자 지속', 4, 'PER 이 음수 — 이익이 나지 않고 있습니다');
  const dr = last(debt.a); if(has(dr)) add('재무 레버리지', clamp(Math.round(interp(dr, [[50,1],[100,2],[150,3],[250,4],[400,5]])),1,5), `부채비율 ${dr.toFixed(0)}%`);
  const m = opm.a.map(x=>x.v); if(m.length>=3){ const sd = Math.sqrt(avg(m.map(v=>(v-avg(m))**2))); add('이익 변동성(경기민감)', clamp(Math.round(interp(sd,[[1,1],[3,2],[6,3],[10,4],[15,5]])),1,5), `영업이익률 표준편차 ${sd.toFixed(1)}%p`); }
  const r = rev.a; if(r.length>=2){ const g = growth(last(r), r[r.length-2].v); if(has(g) && g<0) add('매출 역성장', clamp(Math.round(interp(-g,[[0,2],[5,3],[15,4],[30,5]])),2,5), `직전 연도 매출 ${pct(g)}`); }
  const pos = sc?.s?._mas?.pos52; if(has(pos)) add(pos>85?'단기 과열(52주 고점권)':'가격 위치', clamp(Math.round(interp(pos,[[0,3],[30,2],[60,1],[85,3],[100,4]])),1,5), `52주 범위 ${pos.toFixed(0)}% 위치`);
  const cs = sn?.consensusMissing; if(!has(I.target)) add('증권사 커버리지 부족', 3, '목표주가 컨센서스가 없습니다 — 정보가 적은 종목');
  return out.sort((a,b)=>b.lv-a.lv).slice(0,6);
}

/* 스냅샷 — 변화 감지용으로 하루 하나씩 남깁니다 */
function makeSnap(d, sc, sn){
  const A = d.annual, opE = series(A,'op').e, epsE = series(A,'eps').e;
  return { t: d.t, date: iso(d.t), price: d.basic.price, per: d.integ.per, pbr: d.integ.pbr, target: d.integ.target, recomm: d.integ.recomm,
    epsE: has(d.integ.epsE)?d.integ.epsE:(epsE[0]?.v), opE: opE[0]?.v, opEk: opE[0]?.k, score: sc.s.total, sub: {growth:sc.s.growth, profit:sc.s.profit, value:sc.s.value, health:sc.s.health, momentum:sc.s.momentum},
    base: sn.base, newsIds: (d.news||[]).slice(0,20).map(n=>n.id), latestCol: A.cols.length ? A.cols[A.cols.length-1].title : '' };
}
/* 두 스냅샷을 비교해 "투자 판단에 영향을 줄 만한" 변화만 뽑습니다 */
function detectChanges(prev, cur, news, seen){
  const out = [];
  const add = (impact, level, title, detail, kind) => out.push({ impact, level, title, detail, kind });
  const d = (a,b) => growth(b,a);
  if(prev){
    const days = Math.max(1, Math.round((cur.t - prev.t)/DAY));
    const pc = d(prev.price, cur.price);
    if(has(pc) && Math.abs(pc) >= (days<=1 ? 4 : 8)) add(pc>0?'up':'down', Math.abs(pc)>=10?'high':'mid', `주가 ${pct(pc)} (${days}일)`, `${won(prev.price)} → ${won(cur.price)}`, 'price');
    const tc = d(prev.target, cur.target);
    if(has(tc) && Math.abs(tc) >= 2) add(tc>0?'up':'down', Math.abs(tc)>=5?'high':'mid', `목표주가 컨센서스 ${pct(tc)}`, `${won(prev.target)} → ${won(cur.target)} — 증권사 평균 목표가가 바뀌었습니다`, 'target');
    const oc = d(prev.opE, cur.opE);
    if(has(oc) && Math.abs(oc) >= 2 && prev.opEk === cur.opEk) add(oc>0?'up':'down', Math.abs(oc)>=5?'high':'mid', `${cur.opEk||'올해'} 영업이익 추정 ${pct(oc)}`, `${fmt(prev.opE)}억 → ${fmt(cur.opE)}억 — 실적 전망이 바뀌었습니다`, 'estimate');
    const ec = d(prev.epsE, cur.epsE);
    if(has(ec) && Math.abs(ec) >= 3 && !(has(oc)&&Math.abs(oc)>=2)) add(ec>0?'up':'down', 'mid', `추정 EPS ${pct(ec)}`, `${fmt(prev.epsE)}원 → ${fmt(cur.epsE)}원`, 'estimate');
    if(has(prev.recomm) && has(cur.recomm) && Math.abs(cur.recomm-prev.recomm) >= 0.2) add(cur.recomm>prev.recomm?'up':'down', 'mid', `투자의견 평균 ${prev.recomm.toFixed(2)} → ${cur.recomm.toFixed(2)}`, '증권사 투자의견 평균이 바뀌었습니다', 'recomm');
    if(prev.latestCol && cur.latestCol && prev.latestCol !== cur.latestCol) add('flat', 'high', `새 재무제표 반영 (${cur.latestCol})`, '연간 재무 데이터가 새로 나왔습니다. 점수와 시나리오가 다시 계산됐습니다', 'filing');
    const scd = (has(prev.score)&&has(cur.score)) ? cur.score - prev.score : NaN;
    if(has(scd) && Math.abs(scd) >= 4){
      const keys = {growth:'성장성',profit:'수익성',value:'밸류에이션',health:'재무건전성',momentum:'모멘텀'};
      let big = null, bigD = 0;
      for(const k of Object.keys(keys)){ const dd = (cur.sub?.[k]??0) - (prev.sub?.[k]??0); if(Math.abs(dd) > Math.abs(bigD)){ bigD = dd; big = k; } }
      add(scd>0?'up':'down', Math.abs(scd)>=8?'high':'mid', `AI 점수 ${prev.score} → ${cur.score}`, big ? `가장 크게 움직인 항목: ${keys[big]} (${bigD>0?'+':''}${bigD})` : '', 'score');
    }
    const pcc = d(prev.per, cur.per);
    if(has(pcc) && Math.abs(pcc) >= 8 && !(has(pc)&&Math.abs(pc)>=4)) add(pcc>0?'down':'up', 'low', `PER ${prev.per.toFixed(1)} → ${cur.per.toFixed(1)}배`, '이익 기준이 바뀌었을 수 있습니다', 'valuation');
  }
  /* 새 뉴스 — 처음 보는 기사만, 중요 키워드가 있으면 등급을 올립니다 */
  const HOT = /실적|영업이익|매출|가이던스|컨센서스|목표주가|투자의견|공시|수주|계약|유상증자|무상증자|자사주|배당|합병|인수|분할|소송|리콜|규제|제재|관세|파업|화재|점유율|증설|투자 계획|CEO|대표이사|상향|하향/;
  const fresh = (news||[]).filter(n => !seen?.[n.id]);
  const hot = fresh.filter(n => HOT.test(n.title));
  if(hot.length) add('flat', hot.length>=3?'mid':'low', `주요 뉴스 ${hot.length}건`, hot.slice(0,3).map(n=>'· '+n.title).join('\n'), 'news');
  else if(fresh.length >= 5) add('flat', 'low', `새 뉴스 ${fresh.length}건`, '기업가치에 직접 닿는 키워드는 없었습니다', 'news');
  const rank = {high:3, mid:2, low:1};
  return out.sort((a,b)=>rank[b.level]-rank[a.level]);
}

/* 투자 논리(Thesis) — 가정·리스크 키워드와 새 뉴스·변화를 맞춰 봅니다 */
function thesisCheck(th, changes, news){
  const hits = [];
  const text = (n) => n.title + ' ' + (n.body||'');
  const scan = (list, kind) => list.forEach((a, i) => {
    const kws = (a.keywords||[]).filter(Boolean);
    if(!kws.length) return;
    const m = (news||[]).filter(n => kws.some(k => text(n).includes(k)));
    if(m.length) hits.push({ kind, i, text:a.text, n:m.length, titles:m.slice(0,3).map(x=>x.title) });
  });
  scan(th.assumptions||[], 'assumption'); scan(th.risks||[], 'risk');
  const bad = (changes||[]).filter(c => c.impact==='down' && c.level!=='low');
  const good = (changes||[]).filter(c => c.impact==='up' && c.level!=='low');
  return { hits, bad, good, needsReview: bad.length>0 || hits.some(h=>h.kind==='risk') };
}
/* 문장에서 키워드를 뽑는 아주 단순한 방법 (AI 없이 쓸 때) */
function guessKeywords(s){
  const stop = /^(것|수|등|및|대한|위한|통해|따라|으로|에서|이다|있다|한다|된다|같은|더|매우|계속|향후|앞으로|시장|기업|회사|성장|증가|감소|유지|전망|가능|예상|기대|리스크|위험|가정|투자|주가|실적)$/;
  const w = String(s).replace(/[^\w가-힣A-Za-z0-9 ]/g,' ').split(/\s+/).map(x=>x.replace(/(은|는|이|가|을|를|의|도|에|로|과|와|이다|입니다)$/,'')).filter(x => x.length>=2 && !stop.test(x));
  return [...new Set(w)].slice(0,4);
}

const PROVIDERS = {

const SYSTEM = `당신은 StockLens 의 AI 애널리스트입니다. 한국 개인투자자를 돕습니다.

/* 공통 호출: messages=[{role:'user'|'assistant', text}], system 문자열 → 답 텍스트 */
async function aiChat(messages, system=SYSTEM, opt={}){
  const { provider, apiKey } = state.settings;
  if(!apiKey) throw new Error('AI 키가 없어요. ⚙️ 설정에서 API 키를 넣어 주세요.');
  const model = aiModel();

    url = 'https://api.anthropic.com/v1/messages';
    headers = { 'content-type':'application/json', 'x-api-key': apiKey, 'anthropic-version':'2023-06-01',

      return (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    };
  }else if(provider === 'openai'){
    url = 'https://api.openai.com/v1/chat/completions';
    headers = { 'content-type':'application/json', 'authorization':'Bearer '+apiKey };
    body = { model, max_completion_tokens: maxTok, messages: [{role:'system', content: system}, ...messages.map(m=>({role:m.role, content:m.text}))] };
    pick = j => j.choices?.[0]?.message?.content || '';
  }else{
    url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
    headers = { 'content-type':'application/json' };
    body = { systemInstruction: { parts:[{text: system}] }, contents: messages.map(m => ({ role: m.role==='assistant'?'model':'user', parts:[{text:m.text}] })), generationConfig:{ maxOutputTokens: maxTok } };
    pick = j => (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
  }
  const ac = new AbortController(); const t = setTimeout(()=>ac.abort(), 180000);
  let r, j;
  try{ r = await fetch(url, { method:'POST', headers, body: JSON.stringify(body), signal: ac.signal }); }
  catch(e){ throw new Error('AI 서버에 연결하지 못했어요 (네트워크 또는 브라우저 차단)'); }
  finally{ clearTimeout(t); }
  try{ j = await r.json(); }catch(e){ throw new Error('AI 응답을 읽지 못했어요 (HTTP '+r.status+')'); }
  if(!r.ok){ const m = j?.error?.message || j?.error?.type || ('HTTP '+r.status); throw new Error('AI 오류: ' + m); }
  const text = pick(j);
  if(!text) throw new Error('AI 가 빈 답을 보냈어요');
  return text;
}
/* 답 속에서 JSON 한 덩어리만 꺼냅니다 (코드펜스·앞뒤 설명 무시) */
function pickJSON(text){
  const m = String(text).match(/\{[\s\S]*\}/);
  if(!m) throw new Error('AI 답에서 JSON 을 찾지 못했어요');
  return JSON.parse(m[0]);
}

  const snaps = state.snaps[code]||[]; const prev = snaps.length>1 ? snaps[snaps.length-2] : null;

      PER: d.integ.per, PBR: d.integ.pbr, 추정EPS: d.integ.epsE, 동일업종PER: d.integ.indPer, 배당수익률: d.integ.divYield, 목표주가컨센서스: d.integ.target, 투자의견평균_5만점: d.integ.recomm, 외국인비율: d.integ.foreignRatio },
    점수모델: { 총점: sc.s.total, 성장성: sc.s.growth, 수익성: sc.s.profit, 밸류에이션: sc.s.value, 재무건전성: sc.s.health, 모멘텀: sc.s.momentum, 근거: sc.why, 가중치:'성장25 수익25 밸류20 재무15 모멘텀15' },
    시나리오: { 방식:'EPS × PER', 기준EPS: sn.epsBase, EPS출처: sn.epsSrc, 과거PER_평균: +sn.perAvg.toFixed(1), 과거PER_최저: +sn.perLo.toFixed(1), 과거PER_최고: +sn.perHi.toFixed(1),
      Bull: { 가격: sn.bull, EPS조정: sn.adj.epsBull+'%', PER: sn.adj.perBull, 상승여력: pct(sn.upBull) }, Base: { 가격: sn.base, PER: sn.adj.perBase, 상승여력: pct(sn.upBase) }, Bear: { 가격: sn.bear, EPS조정: sn.adj.epsBear+'%', PER: sn.adj.perBear, 상승여력: pct(sn.upBear) }, 참고: sn.note||'' },
    리스크모니터: rk.map(r=>({ 항목:r.name, 등급_5만점:r.lv, 근거:r.why })),
    재무_억원: fin,
    최근변화: ch.map(c=>({ 방향:c.impact, 중요도:c.level, 제목:c.title, 내용:c.detail })),
    최근뉴스제목: (d.news||[]).slice(0,12).map(n=>n.title),
    내_투자논리: th,
  };
}
function portfolioPack(){
  const items = state.watch.map(w => { const p = dataPack(w.code); if(!p) return null; return { 종목: p.종목.이름, 코드: w.code, 업종: p.종목.업종, 시세: p.시세, 점수: p.점수모델, 시나리오Base: p.시나리오.Base, 리스크: p.리스크모니터.slice(0,3), 최근변화: p.최근변화, 논리: p.내_투자논리 }; }).filter(Boolean);

/* ---------- 검색 ---------- */
let searchT, searchRes = [], searchQ = '', searchSeq = 0;
function renderSearch(){
  const el = $('#tab-search');
  el.innerHTML = `<div class="card">
    <h2>🔍 종목 검색</h2>
    <div class="row mt"><input id="q" placeholder="종목명 또는 6자리 코드 (예: 삼성전자, 005930)" value="${esc(searchQ)}" autocomplete="off"><button class="btn sm" data-act="search">찾기</button></div>
    <div id="sres" class="list"></div>
    <div class="sec-t">자주 찾는 종목</div>
    <div class="chips">${BUILTIN.slice(0,12).map(([c,n])=>`<button class="chip" data-act="pick" data-code="${c}" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>
    <p class="tiny muted mt">국내 상장 주식·ETF (네이버증권 데이터). 시세가 안 붙으면 ⚙️에서 <b>구글 스크립트 중계</b>를 만들어 주세요.</p>
  </div>`;
  const q = $('#q');
  q.addEventListener('input', () => { searchQ = q.value; clearTimeout(searchT); searchT = setTimeout(doSearch, 350); });
  q.addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
  drawSearch();
}
async function doSearch(){
  const q = searchQ.trim(); const box = $('#sres'); if(!box) return;
  if(!q){ searchRes = []; drawSearch(); return; }
  searchRes = searchBuiltin(q); drawSearch();            /* 내장 목록은 바로, 네이버 검색 결과는 오면 갈아끼웁니다 */
  if(!searchRes.length) box.innerHTML = `<div class="empty"><span class="spin dark"></span> 찾는 중</div>`;
  const mine = ++searchSeq;
  try{ const r = await searchStocks(q); if(mine===searchSeq && r.length) { searchRes = r; drawSearch(); } else if(mine===searchSeq && !searchRes.length) drawSearch(); }
  catch(e){ if(mine===searchSeq) drawSearch(); }
}
function drawSearch(){
  const box = $('#sres'); if(!box) return;
  if(!searchQ.trim()){ box.innerHTML = ''; return; }
  if(!searchRes.length){ box.innerHTML = `<div class="empty">찾은 종목이 없어요.<br><span class="tiny">6자리 코드를 직접 넣어도 됩니다</span></div>`; return; }
  box.innerHTML = searchRes.map(r => `<button class="item" data-act="pick" data-code="${r.code}" data-name="${esc(r.name)}">
    <div class="grow"><div class="nm">${esc(r.name)}</div><div class="cd">${r.code} ${esc(r.market||'')}</div></div>
    <div class="pill ${W(r.code)?'flat':'brand'}">${W(r.code)?'담김':'＋ 담기'}</div></button>`).join('');
}
async function addWatch(code, name){
  if(!W(code)){ state.watch.push({ code, name: name||code, addedAt: Date.now() }); save(); }
  state.ui.code = code;
  showTab('stock');
  await refreshStock(code);
  if(W(code) && state.data[code]?.basic.name && W(code).name === code){ W(code).name = state.data[code].basic.name; save(); }
  render();
}

/* ---------- 데이터 새로고침 ---------- */
async function refreshStock(code, opts={}){
  busy['r'+code] = true; if(!opts.quiet) render();
  try{
    const d = state.ui.demo ? demoStock(code) : await fetchStock(code);
    if(!d.basic.name && W(code)) d.basic.name = W(code).name;
    state.data[code] = d;
    const sc = computeScore(d), sn = scenarios(d, state.ui.adj?.[code]);
    const snap = makeSnap(d, sc, sn);
    const arr = state.snaps[code] = state.snaps[code] || [];
    if(arr.length && arr[arr.length-1].date === snap.date) arr[arr.length-1] = snap; else arr.push(snap);
    if(arr.length > 90) arr.splice(0, arr.length-90);
    if(!state.seenNews[code]){ state.seenNews[code] = {}; d.news.forEach(n => state.seenNews[code][n.id] = 1); }   /* 처음 담을 때 있던 뉴스는 '이미 본 것'으로. 그 뒤 새로 뜨는 기사만 변화로 칩니다 */
    save();
    if(d.errs.length && !opts.quiet) toast('일부 데이터를 못 가져왔어요: ' + d.errs[0]);
  }catch(e){ if(!opts.quiet) toast(e.message); state.ui.lastErr = e.message; }
  busy['r'+code] = false; if(!opts.quiet) render();
}
async function refreshAll(){
  if(busy.refreshAll) return;
  busy.refreshAll = true; resetRelays(); render();
  for(const w of state.watch){ await refreshStock(w.code, {quiet:true}); }
  busy.refreshAll = false; save(); render();
  toast(state.ui.demo ? '샘플 데이터를 다시 만들었어요' : '새로고침 완료');
}
function markSeen(code){
  const d = state.data[code]; if(!d) return;
  const s = state.seenNews[code] = state.seenNews[code] || {};
  d.news.forEach(n => s[n.id] = 1);
}

function thesisCard(t, compact=false){
  const d = state.data[t.code];
  const fresh = (d?.news||[]).filter(n=>!state.seenNews[t.code]?.[n.id]);
  const chk = thesisCheck(t, detectChangesFor(t.code), d?.news||[]);           /* 표시용: 지금 있는 뉴스 전부와 맞춰 봅니다 */
  const need = thesisCheck(t, detectChangesFor(t.code), fresh).needsReview;   /* 경고용: 새로 뜬 뉴스·변화만 */
  const hist = t.history||[];
  const col = t.confidence>=70?'var(--green)':t.confidence>=45?'var(--gold)':'var(--up)';
  return `<div class="${compact?'mt':'card'}" data-thesis="${t.id}">
    <div class="row"><div class="grow"><div class="b" style="font-size:15px">${esc(t.title)}</div><div class="tiny muted">${esc(W(t.code)?.name||t.code)} · ${iso(t.createdAt)} 작성${t.horizon?' · '+esc(t.horizon):''}</div></div>
      ${need?'<span class="pill up">점검 필요</span>':''}</div>
    ${t.text?`<p class="desc" style="margin-top:6px">"${esc(t.text)}"</p>`:''}
    <div class="conf"><span class="tiny muted">확신도</span><div class="bar"><i style="width:${t.confidence}%;background:${col}"></i></div><span class="n num">${t.confidence}%</span></div>
    ${hist.length>1?`<div class="tiny muted">${hist.slice(-4).map(h=>h.conf).join(' → ')}${hist.length>1?' · '+esc(hist[hist.length-1].reason||''):''}</div>`:''}
    <div class="sec-t">핵심 가정</div>

function journalStats(){
  const j = state.journal.filter(x=>has(state.data[x.code]?.basic.price));
  if(!j.length) return null;
  const rs = j.map(x=>growth(x.price, state.data[x.code].basic.price));
  return { n: j.length, win: rs.filter(r=>r>0).length, avg: avg(rs) };
}

  const chat = $('#chat'); if(chat && msgs.length) chat.lastElementChild?.scrollIntoView({block:'nearest'});
}
async function sendChat(q){
  const ta = $('#ask'); q = (q || ta?.value || '').trim(); if(!q || busy.chat) return;
  if(!aiReady()){ openSettings(); return; }
  const ctx = state.ui.ctx || '*';
  const arr = state.chats[ctx] = state.chats[ctx] || [];
  arr.push({ role:'user', text:q, t:Date.now() }); if(ta) ta.value=''; busy.chat = true; save(); renderAI();
  try{
    const pack = ctx==='*' ? portfolioPack() : dataPack(ctx);
    const hist = arr.slice(-8).map(m=>({ role:m.role, text:m.text }));
    hist[0] = { role:'user', text: `[데이터]\n${JSON.stringify(pack)}\n\n[질문]\n${hist[0].text}` };
    if(hist.length>1) hist[hist.length-1] = { role:'user', text: `[최신 데이터]\n${JSON.stringify(pack)}\n\n[질문]\n${q}` };
    const text = await aiChat(hist);
    arr.push({ role:'assistant', text, t:Date.now(), model: aiModel() });
  }catch(e){ arr.push({ role:'assistant', text:'⚠️ '+e.message, t:Date.now() }); }
  busy.chat = false; save(); renderAI();
}

    case 'demoOne': { state.data[code] = demoStock(code); const d = state.data[code]; const sc = computeScore(d); const snap = makeSnap(d, sc, scenarios(d)); (state.snaps[code]=state.snaps[code]||[]).push(snap); if(!state.seenNews[code]){ state.seenNews[code]={}; d.news.forEach(n=>state.seenNews[code][n.id]=1); } save(); render(); break; }
    case 'search': doSearch(); break;
    case 'pick': addWatch(code, b.dataset.name); break;
    case 'open': state.ui.code = code; showTab('stock'); if(!state.data[code]) refreshStock(code); break;
    case 'refresh': resetRelays(); refreshStock(code); break;
    case 'refreshAll': refreshAll(); break;
    case 'unwatch': if(confirm('관심종목에서 뺄까요? (논리·기록은 남습니다)')){ state.watch = state.watch.filter(w=>w.code!==code); state.ui.code=''; save(); showTab('home'); } break;
    case 'finQ': state.ui.finQ = b.dataset.v==='1'; render(); break;
    case 'resetAdj': if(state.ui.adj) delete state.ui.adj[code]; save(); render(); break;
    case 'askAbout': state.ui.ctx = code; save(); showTab('ai'); break;
    case 'chip': state.ui.tab==='ai' ? sendChat(b.dataset.q) : null; break;
    case 'send': sendChat(); break;
    case 'clearChat': delete state.chats[state.ui.ctx||'*']; save(); renderAI(); break;
    case 'brief': {
      if(!aiReady()){ openSettings(); break; }
      busy.brief = true; render();
      try{ const text = await aiBriefing(); state.brief = { date: today(), text, model: aiModel() }; save(); }catch(err){ toast(err.message); }
      busy.brief = false; render(); break; }
    case 'explain': {
      if(!aiReady()){ openSettings(); break; }
      busy['e'+code] = true; render();
      try{ const text = await aiExplainStock(code); state.ui.explain = state.ui.explain||{}; state.ui.explain[code] = { text, date: today(), model: aiModel() }; save(); }catch(err){ toast(err.message); }
      busy['e'+code] = false; render(); break; }
    case 'newThesis': openThesisEditor(code); break;
    case 'editThesis': { const t = state.theses.find(x=>x.id===id); if(t) openThesisEditor(t.code, t); break; }
    case 'delThesis': if(confirm('이 투자 논리를 지울까요?')){ state.theses = state.theses.filter(x=>x.id!==id); save(); render(); } break;
    case 'thSave': {
      const t = readThesisForm(code, id); if(!t) break;
      /* AI가 다듬은 키워드가 있으면 그것을 씁니다 */
      try{ const ka = JSON.parse($('#thA').dataset.kw||'[]'), kr = JSON.parse($('#thR').dataset.kw||'[]');
        t.assumptions.forEach(a => { const m = ka.find(x=>x.text===a.text); if(m?.keywords?.length) a.keywords = m.keywords; });
        t.risks.forEach(a => { const m = kr.find(x=>x.text===a.text); if(m?.keywords?.length) a.keywords = m.keywords; }); }catch(_){}
      if(!t.history.length) t.history.push({ t: Date.now(), conf: t.confidence, reason: '작성' });
      const i = state.theses.findIndex(x=>x.id===t.id); if(i>=0) state.theses[i] = t; else state.theses.push(t);
      save(); closeModal(); render(); toast('논리를 저장했어요. 데이터가 바뀌면 점검합니다'); break; }
    case 'thAI': {
      const t = readThesisForm(code, ''); if(!t) break; busy.thAI = true; b.disabled = true; b.innerHTML = '<span class="spin dark"></span> 다듬는 중';
      try{ const j = await aiStructureThesis(code, [t.title, t.text, '가정: '+t.assumptions.map(a=>a.text).join(', '), '리스크: '+t.risks.map(a=>a.text).join(', ')].join('\n')); fillThesisForm(j); toast('AI가 가정·리스크를 정리했어요. 고친 뒤 저장하세요'); }
      catch(err){ toast(err.message); }
      busy.thAI = false; b.disabled = false; b.innerHTML = '✨ AI로 다듬기'; break; }
    case 'genThesis': {
      if(!aiReady()){ openSettings(); break; }
      busy['g'+code] = true; render();
      try{ const j = await aiGenerateThesis(code); openThesisEditor(code, { title:j.title, text:j.text, assumptions:j.assumptions||[], risks:j.risks||[], horizon:j.horizon, confidence:j.confidence }); fillThesisForm(j); }
      catch(err){ toast(err.message); }
      busy['g'+code] = false; render(); break; }
    case 'checkThesis': {
      if(!aiReady()){ openSettings(); break; }
      const t = state.theses.find(x=>x.id===id); if(!t) break;
      if(!state.data[t.code]){ toast('먼저 종목 데이터를 가져와 주세요'); break; }
      busy['c'+id] = true; render();
      try{ const j = await aiCheckThesis(t); const conf = clamp(Math.round(+j.confidence), 0, 100);
        if(has(conf)){ t.history.push({ t: Date.now(), conf, reason: j.delta_reason||'' }); t.confidence = conf; }
        t.lastCheck = { date: today(), verdict: j.verdict, summary: j.summary, affected: j.affected||[] }; t.lastChecked = Date.now(); save(); }
      catch(err){ toast(err.message); }
      busy['c'+id] = false; render(); break; }
    case 'newJournal': if(!state.watch.length){ toast('먼저 관심종목을 넣어 주세요'); break; } openJournal(); break;
    case 'jSave': {
      const c = $('#jCode').value, price = +$('#jPrice').value; if(!(price>0)){ toast('매수가를 넣어 주세요'); break; }
      state.journal.push({ id: uid(), code: c, name: W(c)?.name||c, price, qty: +$('#jQty').value||0, reason: $('#jReason').value.trim(), horizon: $('#jH').value.trim(), expect: $('#jE').value.trim(), stop: $('#jStop').value.trim(), t: Date.now() });
      save(); closeModal(); render(); toast('기록했어요'); break; }
    case 'delJournal': if(confirm('이 기록을 지울까요?')){ state.journal = state.journal.filter(x=>x.id!==id); save(); render(); } break;
    case 'reviewJournal': {
      if(!aiReady()){ openSettings(); break; } if(!state.journal.length){ toast('복기할 기록이 없어요'); break; }
      busy.review = true; render();
      try{ const text = await aiJournalReview(); state.ui.review = { text, date: today(), model: aiModel() }; save(); }catch(err){ toast(err.message); }
      busy.review = false; render(); break; }
    case 'export': { const blob = new Blob([JSON.stringify(state, null, 1)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `stocklens-${today()}.json`; a.click(); break; }
    case 'import': { const f = $('#impFile'); f.onchange = () => { const r = new FileReader(); r.onload = () => { try{ const s = JSON.parse(r.result); if(!s.watch) throw 0; state = Object.assign(state, s); save(); closeModal(); render(); toast('불러왔어요'); }catch(_){ toast('파일을 읽지 못했어요'); } }; r.readAsText(f.files[0]); }; f.click(); break; }
    case 'reset': if(confirm('관심종목·논리·일지·설정을 모두 지울까요?')){ localStorage.removeItem(KEY); location.reload(); } break;
  }
});
document.addEventListener('input', e => {
  const r = e.target.closest('input[data-adj]'); if(!r) return;
  const code = r.dataset.code; state.ui.adj = state.ui.adj||{}; state.ui.adj[code] = state.ui.adj[code]||{};
  state.ui.adj[code][r.dataset.adj] = +r.value;
  /* 슬라이더는 다시 그리지 않고 숫자만 바꿉니다 */
  const d = state.data[code]; const sn = scenarios(d, state.ui.adj[code]);
  r.parentElement.querySelector('.v').textContent = /eps/.test(r.dataset.adj) ? ((+r.value>0?'+':'')+r.value+'%') : (r.value+'배');
  const cards = document.querySelectorAll('.scen .c');
  if(cards.length===3){
    cards[0].innerHTML = `<div class="t up">Bull</div><div class="p">${won(sn.bull)}</div><div class="d">EPS ${sn.adj.epsBull>0?'+':''}${sn.adj.epsBull}% × ${sn.adj.perBull}배<br>${pct(sn.upBull)}</div>`;
    cards[1].innerHTML = `<div class="t">Base</div><div class="p">${won(sn.base)}</div><div class="d">EPS 그대로 × ${sn.adj.perBase}배<br>${pct(sn.upBase)}</div>`;
    cards[2].innerHTML = `<div class="t down">Bear</div><div class="p">${won(sn.bear)}</div><div class="d">EPS ${sn.adj.epsBear}% × ${sn.adj.perBear}배<br>${pct(sn.upBear)}</div>`;
  }
  clearTimeout(window._adjT); window._adjT = setTimeout(save, 400);
});
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

/* ---------- 시작 ---------- */
load();
showTab(state.ui.tab && TABS.includes(state.ui.tab) ? state.ui.tab : 'home');
(async () => {
  const stale = state.watch.filter(w => !state.data[w.code] || Date.now() - state.data[w.code].t > 6*3600000);
  if(stale.length){ busy.refreshAll = true; render(); for(const w of stale) await refreshStock(w.code, {quiet:true}); busy.refreshAll = false; save(); render(); }
})();
</script>
</body>
</html>
