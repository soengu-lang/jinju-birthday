function journalStats(){
  const j = state.journal.filter(x=>has(state.data[x.code]?.basic.price));
  if(!j.length) return null;
  const rs = j.map(x=>growth(state.data[x.code].basic.price, x.price));
  return { n: j.length, win: rs.filter(r=>r>0).length, avg: avg(rs) };
}

function renderAI(){

  const cmp = state.watch.length>=2 && ctx!=='*' ? state.watch.filter(w=>w.code!==ctx).slice(0,2).map(w=>`${W(ctx).name}랑 ${w.name} 비교해 줘`) : [];

    <p class="tiny muted mt">질문하면 <b>${esc(name)}</b>의 실제 데이터(시세·재무·점수·시나리오·리스크·변화·내 논리)가 함께 전달됩니다. 질문 → 데이터 → 계산 → AI 해석 → 근거 표시.</p>
    <div class="chips">${[...qs, ...cmp].map(q=>`<button class="chip" data-act="chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    <div class="chat" id="chat">${msgs.map(m=>`<div class="msg ${m.role==='user'?'me':'ai'}">${esc(m.text)}${m.role==='assistant'&&m.model?`<div class="src">${esc(m.model)} · ${new Date(m.t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</div>`:''}</div>`).join('')}
      ${busy.chat?`<div class="msg ai"><span class="spin dark"></span> 데이터를 읽고 답하는 중…</div>`:''}</div>
    <div class="ask"><textarea id="ask" placeholder="예: ${esc(qs[0])}" rows="1"></textarea><button class="btn" data-act="send" ${busy.chat?'disabled':''}>보내기</button></div>

  $('#ctx').addEventListener('change', e => { state.ui.ctx = e.target.value; save(); renderAI(); });
  const ta = $('#ask'); ta.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendChat(); } });
  const chat = $('#chat'); if(chat && msgs.length) chat.lastElementChild?.scrollIntoView({block:'nearest'});

async function sendChat(q){
  const ta = $('#ask'); q = (q || ta?.value || '').trim(); if(!q || busy.chat) return;
  if(!aiReady()){ openSettings(); return; }
  const ctx = state.ui.ctx || '*';
  const arr = state.chats[ctx] = state.chats[ctx] || [];
  arr.push({ role:'user', text:q, t:Date.now() }); if(ta) ta.value=''; busy.chat = true; save(); renderAI();
  try{
    const pack = ctx==='*' ? portfolioPack() : dataPack(ctx);
    const hist = arr.slice(-8).map(m=>({ role:m.role, text:m.text }));
    hist[0] = { role:'user', text: `[데이터]\n${JSON.stringify(pack)}\n\n[질문]\n${hist[0].text}` };
    if(hist.length>1) hist[hist.length-1] = { role:'user', text: `[최신 데이터]\n${JSON.stringify(pack)}\n\n[질문]\n${q}` };
    const text = await aiChat(hist);
    arr.push({ role:'assistant', text, t:Date.now(), model: aiModel() });
  }catch(e){ arr.push({ role:'assistant', text:'⚠️ '+e.message, t:Date.now() }); }
  busy.chat = false; save(); renderAI();
}

let diag = { running:false, rows:[], done:false, ok:false };
const dRow = (n, s, tip, ok) => { diag.rows.push({ n, s, tip:tip||'', ok }); drawDiag(); };
function openDiag(){
  diag = { running:false, rows:[], done:false, ok:false };
  openModal(`<div class="mhead"><h3>🩺 시세 점검</h3><button class="x" data-act="close">✕</button></div>
    <p class="desc">삼성전자(005930)를 시험 삼아 불러 보면서 <b>어디서 막히는지</b> 하나씩 확인합니다. 20~40초쯤 걸립니다.</p>
    <div id="diagBox"></div>
    <div class="btn-row"><button class="btn" data-act="runDiag">점검 시작</button></div>`);
}
function drawDiag(){
  const box = $('#diagBox'); if(!box) return;
  box.innerHTML = `${diag.rows.map(r=>`<div class="risk"><span>${r.ok===true?'🟢':r.ok===false?'🔴':'⚪'}</span>
      <div class="grow"><div class="small b">${esc(r.n)}</div><div class="tiny muted">${esc(r.s)}${r.tip?' · '+esc(r.tip):''}</div></div></div>`).join('')}
    ${diag.running?`<p class="tiny muted mt"><span class="spin dark"></span> 확인하는 중…</p>`:''}
    ${diag.done?`<div class="${diag.ok?'ok':'err'} mt">${diag.ok
      ? '시세를 받아오는 길이 열려 있습니다. 홈에서 <b>🔄 새로고침</b>을 눌러 주세요.'
      : '<b>어느 공개 중계도 살아 있지 않습니다.</b> 이건 이 앱의 문제가 아니라 남의 공짜 중계가 막힌 것이라, 기다려도 잘 안 됩니다.<br>내 구글 계정으로 <b>중계 하나</b>를 만들면 바로 해결됩니다 (3분, 무료).'}</div>
      <div class="btn-row">${diag.ok?`<button class="btn" data-act="closeRefresh">새로고침 하러 가기</button>`:`<button class="btn" data-act="relaySetup">📡 중계 만들기 (3분)</button>`}<button class="btn sm ghost" data-act="copyDiag">📋 결과 복사</button></div>`:''}`;
}
function diagText(){
  return 'StockLens 시세 점검 ' + new Date().toLocaleString('ko-KR') + '\n'
    + diag.rows.map(r=>`${r.ok===true?'OK ':r.ok===false?'X  ':'-  '}${r.n}: ${r.s}${r.tip?' ('+r.tip+')':''}`).join('\n');
}
async function runDiag(){
  if(diag.running) return;
  diag = { running:true, rows:[], done:false, ok:false }; drawDiag();
  resetRelays();
  const mine = myRelay(), maRelay = readLocalAssets(true)?.relayUrl || '';
  dRow('중계 주소', mine ? (/script\.google\.com/.test(mine) ? '구글 스크립트 있음' : '직접 넣은 주소 있음') : '없음 — 공개 중계만 씁니다',
       mine ? mine.replace('?url={url}','').slice(0,60) : '공개 중계는 자주 막힙니다. 하나 만들면 거의 안 막힙니다', mine ? true : false);
  if(!mine) dRow('자산 앱의 중계', maRelay ? '있음 — 가져다 쓰면 됩니다' : '자산 앱에도 없습니다',
       maRelay ? maRelay.replace('?url={url}','').slice(0,60) : '두 앱 모두 공개 중계에 기대고 있었습니다', !!maRelay);
  /* 인터넷 자체가 되는지 — 이 앱이 있는 곳을 불러 봅니다 */
  try{ await getText('manifest.json?t=' + Date.now(), 8000); dRow('인터넷', '됨', '', true); }
  catch(e){ dRow('인터넷', '안 됨 — ' + e.message, '와이파이나 데이터를 확인해 주세요', false); }
  /* 경로마다 시세를 불러 봅니다 */
  const L = relayList(), test = NV.basic('005930');
  let good = -1;
  for(let i=0;i<L.length;i++){
    try{
      let txt = await getText(L[i].f(test), isMine(i) ? 20000 : 8000);
      if(L[i].wrap) txt = JSON.parse(txt)[L[i].wrap];
      const j = JSON.parse(txt), b = parseBasic(j);
      if(has(b.price) && b.price>0){ dRow(L[i].n, '됨 — 삼성전자 ' + won(b.price), '', true); if(good<0) good = i; }
      else dRow(L[i].n, '응답은 왔는데 시세가 없어요', JSON.stringify(j).slice(0,60), false);
    }catch(e){ dRow(L[i].n, '막힘 — ' + e.message, L[i].n==='직접' ? '브라우저 보안 때문에 원래 막힙니다(정상)' : '', false); }
  }
  /* 시세가 되면 나머지 자료도 형태가 맞는지 봅니다 */
  if(good >= 0){
    state.settings.relay = good; save();
    const get = async u => { let t = await getText(L[good].f(u), isMine(good)?20000:8000); if(L[good].wrap) t = JSON.parse(t)[L[good].wrap]; return JSON.parse(t); };
    const step = async (name, u, check) => {
      try{ const j = await get(u); const r = check(j); dRow(name, r.s, r.tip||'', r.ok); }
      catch(e){ dRow(name, '막힘 — ' + e.message, '', false); }
    };
    await step('투자지표·컨센서스', NV.integ('005930'), j => { const I = parseInteg(j);
      const got = ['PER','PBR','목표주가'].filter((_,k)=>has([I.per,I.pbr,I.target][k]));
      return { ok: got.length>0, s: got.length ? '됨 — ' + got.join(', ') + ' 읽힘' : '왔지만 숫자를 못 읽었어요(형식이 다름)' }; });
    await step('연간 재무', NV.annual('005930'), j => { const f = parseFinance(j); const n = Object.keys(f.table).length;
      return { ok: n>0, s: n ? `됨 — 항목 ${n}개 · 열 ${f.cols.length}개` : '왔지만 표를 못 읽었어요(형식이 다름)' }; });
    await step('뉴스', NV.news('005930'), j => { const n = parseNews(j).length; return { ok: n>0, s: n ? `됨 — ${n}건` : '왔지만 기사를 못 읽었어요' }; });
    await step('일봉(차트)', NV.chart('005930'), j => { const n = parseChart(j).length; return { ok: n>0, s: n ? `됨 — ${n}일치` : '왔지만 못 읽었어요' }; });
    await step('🇺🇸 미국 시세(야후)', YH.chart('NVDA'), j => { const c = parseYhChart(j);
      return { ok: c.basic.price>0, s: `됨 — 엔비디아 ${usd(c.basic.price)} · 일봉 ${c.chart.length}일치` }; });
    await step('🇺🇸 미국 재무(야후)', YH.quote('NVDA'), j => { const q = parseYhQuote(j);
      const n = Object.keys(q.annual.table).length;
      return { ok: n>0 || has(q.integ.per), s: n ? `됨 — 항목 ${n}개 · PER ${has(q.integ.per)?q.integ.per.toFixed(1):'?'}` : (has(q.integ.per) ? '일부만 — PER 은 읽힘' : '왔지만 못 읽었어요') }; });
    if(!diag.rows.some(r=>r.n==='일봉(차트)' && r.ok)){
      try{ const n = parseChartXml(await relayText(NV.chart2('005930'))).length; dRow('일봉(예비 경로)', n ? `됨 — ${n}일치` : '못 읽었어요', '', n>0); }
      catch(e){ dRow('일봉(예비 경로)', '막힘 — ' + e.message, '', false); }
    }
  }
  diag.running = false; diag.done = true; diag.ok = good >= 0; drawDiag();
}

function readThesisForm(code, id){
  const lines = s => s.split('\n').map(x=>x.trim()).filter(Boolean);

  if(!title && !text){ toast('제목이나 내용을 적어 주세요'); return null; }

  const keep = (list, arr) => arr.map(tx => { const o = (list||[]).find(x=>x.text===tx); return { text:tx, keywords: o?.keywords?.length ? o.keywords : guessKeywords(tx) }; });
  return { id: id||uid(), code, title: title || text.slice(0,20), text, assumptions: keep(old?.assumptions, A), risks: keep(old?.risks, R),
    horizon: $('#thH').value.trim(), confidence: clamp(+$('#thC').value||70, 0, 100), createdAt: old?.createdAt||Date.now(), history: old?.history||[], lastCheck: old?.lastCheck||null };
}

          <div class="tiny muted">${esc(x.names.join(', '))} · ${won(x.value)}</div></div>`).join('')}
        <p class="tiny muted mt2">한 업종에 40% 넘게 몰려 있으면 같은 뉴스에 함께 움직입니다.</p>`); break; }
    case 'copyCrash': { const t = lastCrash ? `StockLens 오류\n${lastCrash.where}\n${lastCrash.msg}\n${lastCrash.stack}\n${navigator.userAgent}` : '오류 기록이 없어요';
      try{ await navigator.clipboard.writeText(t); toast('복사했어요 — 붙여넣어 보내 주세요'); }catch(_){ alert(t); } break; }
    case 'safeMode': { state.assets.mode = 'off'; state.ui.demo = false; state.ui.safe = true; save(); toast('안전 모드로 열었어요'); render(); break; }
    case 'diag': openDiag(); break;
    case 'relaySetup': openRelaySetup(); break;
    case 'testRelay': testRelay(); break;
    case 'saveRelay': {
      state.settings.relayUrl = normRelay($('#rUrl').value); state.settings.relay = 0; resetRelays(); save();
      closeModal(); toast('중계를 저장했어요 — 시세를 받아옵니다');
      if(state.watch.length) refreshAll(); else render();
      break; }
    case 'runDiag': runDiag(); break;
    case 'copyDiag': try{ await navigator.clipboard.writeText(diagText()); toast('복사했어요'); }catch(_){ toast('길게 눌러 복사해 주세요'); } break;
    case 'closeRefresh': closeModal(); refreshAll(); break;
    case 'search': doSearch(); break;
    case 'pick': addWatch(code, b.dataset.name, b.dataset.mk, b.dataset.sym); break;
    case 'open': state.ui.code = code; showTab('stock'); if(!state.data[code]) refreshStock(code); break;
    case 'refresh': resetRelays(); refreshStock(code); break;
    case 'refreshAll': refreshAll(); break;
    case 'unwatch': if(confirm('관심종목에서 뺄까요? (논리·기록은 남습니다)')){ state.watch = state.watch.filter(w=>w.code!==code); state.ui.code=''; save(); showTab('home'); } break;
    case 'finQ': state.ui.finQ = b.dataset.v==='1'; render(); break;
    case 'resetAdj': if(state.ui.adj) delete state.ui.adj[code]; save(); render(); break;
    case 'askAbout': state.ui.ctx = code; save(); showTab('ai'); break;
    case 'chip': state.ui.tab==='ai' ? sendChat(b.dataset.q) : null; break;
    case 'send': sendChat(); break;
    case 'clearChat': delete state.chats[state.ui.ctx||'*']; save(); renderAI(); break;
    case 'brief': {
      if(!aiReady()){ openSettings(); break; }
      busy.brief = true; render();
      try{ const text = await aiBriefing(); state.brief = { date: today(), text, model: aiModel() }; save(); }catch(err){ toast(err.message); }
      busy.brief = false; render(); break; }
    case 'explain': {
      if(!aiReady()){ openSettings(); break; }
      busy['e'+code] = true; render();
      try{ const text = await aiExplainStock(code); state.ui.explain = state.ui.explain||{}; state.ui.explain[code] = { text, date: today(), model: aiModel() }; save(); }catch(err){ toast(err.message); }
      busy['e'+code] = false; render(); break; }
    case 'newThesis': openThesisEditor(code); break;
    case 'editThesis': { const t = state.theses.find(x=>x.id===id); if(t) openThesisEditor(t.code, t); break; }
    case 'delThesis': if(confirm('이 투자 논리를 지울까요?')){ state.theses = state.theses.filter(x=>x.id!==id); save(); render(); } break;
    case 'thSave': {
      const t = readThesisForm(code, id); if(!t) break;
      /* AI가 다듬은 키워드가 있으면 그것을 씁니다 */
      try{ const ka = JSON.parse($('#thA').dataset.kw||'[]'), kr = JSON.parse($('#thR').dataset.kw||'[]');
        t.assumptions.forEach(a => { const m = ka.find(x=>x.text===a.text); if(m?.keywords?.length) a.keywords = m.keywords; });
        t.risks.forEach(a => { const m = kr.find(x=>x.text===a.text); if(m?.keywords?.length) a.keywords = m.keywords; }); }catch(_){}
      if(!t.history.length) t.history.push({ t: Date.now(), conf: t.confidence, reason: '작성' });
      const i = state.theses.findIndex(x=>x.id===t.id); if(i>=0) state.theses[i] = t; else state.theses.push(t);
      save(); closeModal(); render(); toast('논리를 저장했어요. 데이터가 바뀌면 점검합니다'); break; }
    case 'thAI': {
      const t = readThesisForm(code, ''); if(!t) break; busy.thAI = true; b.disabled = true; b.innerHTML = '<span class="spin dark"></span> 다듬는 중';
      try{ const j = await aiStructureThesis(code, [t.title, t.text, '가정: '+t.assumptions.map(a=>a.text).join(', '), '리스크: '+t.risks.map(a=>a.text).join(', ')].join('\n')); fillThesisForm(j); toast('AI가 가정·리스크를 정리했어요. 고친 뒤 저장하세요'); }
      catch(err){ toast(err.message); }
      busy.thAI = false; b.disabled = false; b.innerHTML = '✨ AI로 다듬기'; break; }
    case 'genThesis': {
      if(!aiReady()){ openSettings(); break; }
      busy['g'+code] = true; render();
      try{ const j = await aiGenerateThesis(code); openThesisEditor(code, { title:j.title, text:j.text, assumptions:j.assumptions||[], risks:j.risks||[], horizon:j.horizon, confidence:j.confidence }); fillThesisForm(j); }
      catch(err){ toast(err.message); }
      busy['g'+code] = false; render(); break; }
    case 'checkThesis': {
      if(!aiReady()){ openSettings(); break; }
      const t = state.theses.find(x=>x.id===id); if(!t) break;
      if(!state.data[t.code]){ toast('먼저 종목 데이터를 가져와 주세요'); break; }
      busy['c'+id] = true; render();
      try{ const j = await aiCheckThesis(t); const conf = clamp(Math.round(+j.confidence), 0, 100);
        if(has(conf)){ t.history.push({ t: Date.now(), conf, reason: j.delta_reason||'' }); t.confidence = conf; }
        t.lastCheck = { date: today(), verdict: j.verdict, summary: j.summary, affected: j.affected||[] }; t.lastChecked = Date.now(); save(); }
      catch(err){ toast(err.message); }
      busy['c'+id] = false; render(); break; }
    case 'newJournal': if(!state.watch.length){ toast('먼저 관심종목을 넣어 주세요'); break; } openJournal(); break;
    case 'jSave': {
      const c = $('#jCode').value, price = +$('#jPrice').value; if(!(price>0)){ toast('매수가를 넣어 주세요'); break; }
      state.journal.push({ id: uid(), code: c, name: W(c)?.name||c, price, qty: +$('#jQty').value||0, reason: $('#jReason').value.trim(), horizon: $('#jH').value.trim(), expect: $('#jE').value.trim(), stop: $('#jStop').value.trim(), t: Date.now() });
      save(); closeModal(); render(); toast('기록했어요'); break; }
    case 'delJournal': if(confirm('이 기록을 지울까요?')){ state.journal = state.journal.filter(x=>x.id!==id); save(); render(); } break;
    case 'reviewJournal': {
      if(!aiReady()){ openSettings(); break; } if(!state.journal.length){ toast('복기할 기록이 없어요'); break; }
      busy.review = true; render();
      try{ const text = await aiJournalReview(); state.ui.review = { text, date: today(), model: aiModel() }; save(); }catch(err){ toast(err.message); }
      busy.review = false; render(); break; }
    case 'export': { const blob = new Blob([JSON.stringify(state, null, 1)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `stocklens-${today()}.json`; a.click(); break; }
    case 'import': { const f = $('#impFile'); f.onchange = () => { const r = new FileReader(); r.onload = () => { try{ const s = JSON.parse(r.result); if(!s.watch) throw 0; state = Object.assign(state, s); save(); closeModal(); render(); toast('불러왔어요'); }catch(_){ toast('파일을 읽지 못했어요'); } }; r.readAsText(f.files[0]); }; f.click(); break; }
    case 'reset': if(confirm('관심종목·논리·일지·설정을 모두 지울까요?')){ localStorage.removeItem(KEY); location.reload(); } break;
  }
});
document.addEventListener('input', e => {
  const r = e.target.closest('input[data-adj]'); if(!r) return;
  const code = r.dataset.code; state.ui.adj = state.ui.adj||{}; state.ui.adj[code] = state.ui.adj[code]||{};
  state.ui.adj[code][r.dataset.adj] = +r.value;
  /* 슬라이더는 다시 그리지 않고 숫자만 바꿉니다 */
  const d = state.data[code]; const sn = scenarios(d, state.ui.adj[code]);
  r.parentElement.querySelector('.v').textContent = /eps/.test(r.dataset.adj) ? ((+r.value>0?'+':'')+r.value+'%') : (r.value+'배');
  const cards = document.querySelectorAll('.scen .c');
  if(cards.length===3){
    cards[0].innerHTML = `<div class="t up">Bull</div><div class="p">${px$(sn.bull, code)}</div><div class="d">EPS ${sn.adj.epsBull>0?'+':''}${sn.adj.epsBull}% × ${sn.adj.perBull}배<br>${pct(sn.upBull)}</div>`;
    cards[1].innerHTML = `<div class="t">Base</div><div class="p">${px$(sn.base, code)}</div><div class="d">EPS 그대로 × ${sn.adj.perBase}배<br>${pct(sn.upBase)}</div>`;
    cards[2].innerHTML = `<div class="t down">Bear</div><div class="p">${px$(sn.bear, code)}</div><div class="d">EPS ${sn.adj.epsBear}% × ${sn.adj.perBear}배<br>${pct(sn.upBear)}</div>`;
  }
  clearTimeout(window._adjT); window._adjT = setTimeout(save, 400);
});
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

/* ---------- 시작 ---------- */
/* 저장된 기록이 이상해도 앱이 안 열리는 일이 없게 합니다 */
try{ load(); }
catch(e){ console.error('저장된 기록 읽기', e); toast('저장된 기록을 읽지 못해 초기값으로 엽니다'); }
try{ showTab(state.ui.tab && TABS.includes(state.ui.tab) ? state.ui.tab : 'home'); }
catch(e){ const el = $('#tab-home'); if(el){ el.classList.remove('hidden'); el.innerHTML = crashHtml(e, '앱 시작'); } }
(async () => {
  await loadAssets({quiet:true});
  if(state.assets.mode !== 'off'){ render(); refreshOther().then(render); }
  const stale = state.watch.filter(w => !state.data[w.code] || Date.now() - state.data[w.code].t > 6*3600000);
  if(stale.length){ busy.refreshAll = true; render(); for(const w of stale) await refreshStock(w.code, {quiet:true}); busy.refreshAll = false; save(); render(); }
})();
</script>
</body>
</html>
