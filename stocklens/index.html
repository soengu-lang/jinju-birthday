<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#274b6d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StockLens">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>StockLens AI — 투자 논리를 검증하는 AI 애널리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ed; --card:#fffdf8; --ink:#1e2430; --muted:#6f7683;
  --brand:#274b6d; --brand-d:#1c3750; --soft:#e6edf4; --soft-d:#c7d6e5;
  --up:#d1453b; --up-s:#fdeceb;      /* 국내 관례: 오르는 쪽 = 빨강 */
  --down:#2f62c4; --down-s:#eaf0fd;  /* 내려가는 쪽 = 파랑 */
  --flat:#6f7683; --flat-s:#eeeeee;
  --gold:#c9862b; --gold-s:#fdf2e2;
  --green:#3f7d4f; --green-s:#e8f3ea;
  --line:#e5e2d8; --shadow:0 1px 2px rgba(30,36,48,.06), 0 8px 22px rgba(30,36,48,.06);
  --r:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--soft-d);outline-offset:1px}
textarea{min-height:88px;resize:vertical;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
.hidden{display:none !important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.tiny{font-size:11.5px}
.small{font-size:12.5px}
.mt{margin-top:10px}
.mt2{margin-top:16px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.right{text-align:right}
.center{text-align:center}
.b{font-weight:800}
a{color:var(--brand)}

header{background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.head-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 10px}
.brand{font-size:11.5px;font-weight:700;color:var(--gold);letter-spacing:.04em}
h1{font-size:clamp(18px,5vw,22px);font-weight:900;letter-spacing:-.03em;margin-top:1px;white-space:nowrap}
.head-note{font-size:11px;color:var(--muted);line-height:1.5;text-align:right;white-space:nowrap}
.gear{font-size:20px;padding:6px 8px;border-radius:10px}
.gear:active{background:var(--soft)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs-in{display:flex;gap:4px;max-width:640px;margin:0 auto}
.tabs button{flex:1;padding:6px 2px 4px;border-radius:12px;font-size:10.5px;font-weight:700;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs button .ic{font-size:20px;line-height:1.2}
.tabs button.on{color:var(--brand);background:var(--soft)}

section.tab{padding-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;box-shadow:var(--shadow);margin-bottom:12px}
.card > h2, .card .h2{font-size:15px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
.card > h2 .sub{font-size:11px;font-weight:500;color:var(--muted);margin-left:auto}
.desc{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:6px}
.desc b{color:var(--ink);font-weight:700}
.divider{height:1px;background:var(--line);margin:12px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--brand);color:#fff;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:800;width:100%}
.btn:active{background:var(--brand-d)}
.btn.ghost{background:var(--soft);color:var(--brand)}
.btn.ghost:active{background:var(--soft-d)}
.btn.warn{background:var(--up-s);color:var(--up)}
.btn.sm{padding:7px 11px;font-size:12.5px;width:auto;border-radius:10px;white-space:nowrap}
.btn.xs{padding:4px 9px;font-size:11.5px;width:auto;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn-row .btn{flex:1}

.pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px;line-height:1.4;vertical-align:1px}
.pill.up{background:var(--up-s);color:var(--up)}
.pill.down{background:var(--down-s);color:var(--down)}
.pill.flat{background:var(--flat-s);color:var(--flat)}
.pill.gold{background:var(--gold-s);color:var(--gold)}
.pill.green{background:var(--green-s);color:var(--green)}
.pill.brand{background:var(--soft);color:var(--brand)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

/* 리스트 */
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.item{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);
  border-radius:13px;padding:11px 12px;text-align:left;width:100%}
.item:active{background:var(--soft)}
.item .nm{font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.item .cd{font-size:11px;color:var(--muted)}
.item .px{font-size:14px;font-weight:800}
.item .chg{font-size:11.5px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.up{background:var(--up)} .dot.down{background:var(--down)} .dot.flat{background:#c8c5bb}

/* 점수 */
.score-hero{display:flex;align-items:center;gap:16px}
.score-big{font-size:44px;font-weight:900;letter-spacing:-.04em;line-height:1}
.score-big small{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:0}
.bar{height:9px;border-radius:6px;background:#ebe8df;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:6px;background:var(--brand)}
.bars{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.bars .r{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:9px;font-size:12.5px}
.bars .r .v{font-weight:800;text-align:right}
.why{font-size:12px;color:var(--muted);line-height:1.65;margin-top:8px;padding:9px 11px;background:#faf8f3;border-radius:10px}
.why li{margin-left:15px}

/* 시나리오 */
.scen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.scen .c{border-radius:12px;padding:10px 8px;text-align:center;border:1px solid var(--line)}
.scen .c .t{font-size:11px;font-weight:800}
.scen .c .p{font-size:16px;font-weight:900;margin-top:2px;letter-spacing:-.02em}
.scen .c .d{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.scen .bull{background:var(--up-s)} .scen .base{background:#faf8f3} .scen .bear{background:var(--down-s)}
.slider{display:grid;grid-template-columns:86px 1fr 60px;gap:8px;align-items:center;font-size:12px;margin-top:8px}
.slider input[type=range]{padding:0;border:none;background:none}
.slider .v{text-align:right;font-weight:800}

/* 표 */
table.tb{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
table.tb th,table.tb td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.tb th{font-weight:700;color:var(--muted);font-size:11px}
table.tb td:first-child,table.tb th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.tbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* 변화 */
.chg-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.chg-item:last-child{border-bottom:none}
.chg-item .ico{font-size:18px;flex:none;width:24px;text-align:center}
.chg-item .t{font-size:13.5px;font-weight:800;letter-spacing:-.02em}
.chg-item .d{font-size:12px;color:var(--muted);line-height:1.55;margin-top:2px}
.lv{font-size:10px;font-weight:800;border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.lv.high{background:var(--up-s);color:var(--up)} .lv.mid{background:var(--gold-s);color:var(--gold)} .lv.low{background:var(--flat-s);color:var(--flat)}

/* 리스크 */
.risk{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line)}
.risk:last-child{border-bottom:none}
.stars{font-size:11px;letter-spacing:1px;color:var(--gold);margin-left:auto;white-space:nowrap}

/* thesis */
.assump{display:flex;gap:8px;align-items:flex-start;padding:7px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.assump:last-child{border-bottom:none}
.assump .k{flex:none;width:18px;text-align:center}
.assump .kw{font-size:10.5px;color:var(--muted);margin-top:2px}
.conf{display:flex;align-items:center;gap:10px;margin-top:10px}
.conf .bar{flex:1}
.conf .n{font-size:20px;font-weight:900;letter-spacing:-.03em;min-width:60px;text-align:right}

/* 채팅 */
.chat{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.msg{max-width:92%;padding:10px 12px;border-radius:14px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ai .src{font-size:10.5px;color:var(--muted);margin-top:6px;border-top:1px dashed var(--line);padding-top:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11.5px;font-weight:700;background:var(--soft);color:var(--brand);border-radius:20px;padding:5px 10px}
.chip:active{background:var(--soft-d)}
.ask{display:flex;gap:6px;margin-top:10px;align-items:flex-end}
.ask textarea{min-height:44px;max-height:120px}
.ask .btn{width:auto;padding:11px 13px;flex:none}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(20,24,32,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:20px;max-height:84vh}}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mhead h3{font-size:16px;font-weight:900;letter-spacing:-.02em}
.mhead .x{font-size:18px;padding:4px 8px;border-radius:8px}
.f{margin-top:10px}
.f label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.note{background:var(--gold-s);border:1px solid #f0dcbb;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.7;color:#7a5518}
.note b{font-weight:800}
.err{background:var(--up-s);border:1px solid #f3c9c5;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.6;color:#8d2b23}
.ok{background:var(--green-s);border:1px solid #c7e1cd;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.6;color:#2c5d3a}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#1e2430;color:#fff;font-size:12.5px;padding:9px 14px;border-radius:20px;z-index:99;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
.spin.dark{border-color:var(--brand);border-top-color:transparent}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 10px;line-height:1.8}
.empty .em{font-size:34px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.kv .c{background:#faf8f3;border-radius:10px;padding:8px 6px;text-align:center}
.kv .c .k{font-size:10.5px;color:var(--muted)} .kv .c .v{font-size:13.5px;font-weight:800;margin-top:1px}
.tagline{font-size:12px;color:var(--muted);line-height:1.7}
.sec-t{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em;margin:14px 0 4px}
details summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--brand)}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
pre{white-space:pre-wrap;word-break:break-all;background:#f3f1ea;border-radius:10px;padding:10px}
.newsl{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.newsl a{display:block;font-size:12.5px;line-height:1.5;color:var(--ink);text-decoration:none;padding:6px 0;border-bottom:1px solid var(--line)}
.newsl a:last-child{border-bottom:none}
.newsl .m{font-size:10.5px;color:var(--muted)}
.newsl .new{color:var(--up);font-weight:800;font-size:10px;margin-right:4px}
</style>
</head>
<body>
<header><div class="wrap head-in">
  <div>
    <div class="brand">STOCKLENS AI</div>
    <h1>투자 논리를 검증하는 AI</h1>
  </div>
  <div class="row">
    <div class="head-note">찍어 주지 않고<br>검증합니다</div>
    <button class="gear" data-act="settings" title="설정">⚙️</button>
  </div>
</div></header>

<main class="wrap">
  <section class="tab" id="tab-home"></section>
  <section class="tab hidden" id="tab-search"></section>
  <section class="tab hidden" id="tab-stock"></section>
  <section class="tab hidden" id="tab-thesis"></section>
  <section class="tab hidden" id="tab-ai"></section>
</main>

<nav class="tabs"><div class="tabs-in">
  <button data-tab="home" class="on"><span class="ic">🏠</span>홈</button>
  <button data-tab="search"><span class="ic">🔍</span>검색</button>
  <button data-tab="stock"><span class="ic">📊</span>종목</button>
  <button data-tab="thesis"><span class="ic">🧭</span>논리</button>
  <button data-tab="ai"><span class="ic">💬</span>AI</button>
</div></nav>
<div id="modal-root"></div>
<div id="toast"></div>

<!-- 맨 먼저 실행되는 감시기 — 아래 코드가 아예 못 읽히는 경우까지 화면에 보여 줍니다 (옛 문법만 씁니다) -->
<script>
window.addEventListener('error', function(ev){
  try{
    var el = document.getElementById('tab-' + ((window.state && state.ui && state.ui.tab) || 'home')) || document.getElementById('tab-home');
    if(!el || el.innerHTML.replace(/\s/g,'') !== '') return;      /* 이미 뭔가 그려졌으면 그대로 둡니다 */
    var msg = String((ev && ev.message) || '알 수 없는 오류');
    var at = String((ev && ev.filename) || '').split('/').pop() + ' ' + ((ev && ev.lineno) || '') + ':' + ((ev && ev.colno) || '');
    el.innerHTML = '<div class="card" style="border-color:#f3c9c5">'
      + '<h2>⚠️ 앱을 여는 중 문제가 생겼어요</h2>'
      + '<p class="desc">아래 글자를 그대로 찍어서 보내 주시면 고칠 수 있습니다.</p>'
      + '<div class="err">' + msg.replace(/</g,'&lt;') + '<br><span class="tiny">' + at + '</span></div>'
      + '<div class="btn-row"><button class="btn sm" onclick="location.reload()">다시 열기</button>'
      + '<button class="btn sm ghost" onclick="try{localStorage.removeItem(\'stockLens.v1\')}catch(e){};location.reload()">기록 지우고 열기</button></div>'
      + '<p class="tiny muted mt">기록 지우고 열기는 이 앱의 관심종목·논리·일지를 지웁니다. 자산 앱은 건드리지 않습니다.</p></div>';
  }catch(e){}
});
</script>

<script>
/* ============================================================
   StockLens AI — 단일 파일 앱
   ------------------------------------------------------------
   원칙: 재무데이터 → 계산 모델 → 점수 → AI 설명.
   점수·목표가는 아래 순수 함수가 계산하고, AI는 그 결과를 "설명"만 합니다.
   저장은 이 폰(브라우저)의 localStorage 에만 됩니다.
   ============================================================ */
const KEY = 'stockLens.v1';
const DAY = 86400000;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d=0) => (n==null || !isFinite(n)) ? '–' : Number(n).toLocaleString('ko-KR', {maximumFractionDigits:d, minimumFractionDigits:d});
const pct = (n, d=1) => (n==null || !isFinite(n)) ? '–' : (n>0?'+':'') + Number(n).toFixed(d) + '%';
const won = n => (n==null || !isFinite(n)) ? '–' : '₩' + fmt(Math.round(n));
const usd = n => (n==null || !isFinite(n)) ? '–' : '$' + fmt(n, Math.abs(n) < 1000 ? 2 : 0);
/* 종목이 미국이면 달러로 적습니다 */
const px$ = (n, code) => (state.data[code]?.ccy === 'USD' || W(code)?.mk === 'us') ? usd(n) : won(n);
/* 시가총액 — 국내는 억원, 미국은 달러 절대값으로 옵니다 */
const capS = (v, us) => !has(v) ? '–'
  : us ? (v >= 1e12 ? (v/1e12).toFixed(2)+'조$' : v >= 1e9 ? (v/1e9).toFixed(0)+'십억$' : fmt(v/1e6)+'백만$')
       : (v >= 10000 ? (v/10000).toFixed(1)+'조' : fmt(v)+'억');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const iso = d => { const x = new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
const today = () => iso(Date.now());
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
/* "1,234" "12.3%" "-5" 같은 문자열을 숫자로. 못 읽으면 NaN */
function num(v){
  if(v==null) return NaN;
  if(typeof v === 'number') return v;
  const s = String(v).replace(/,/g,'').replace(/%/g,'').replace(/[^\d.\-]/g,'');
  if(s==='' || s==='-' || s==='.') return NaN;
  return Number(s);
}
const has = v => v!=null && isFinite(v);

/* ---------- 상태 ---------- */
let state = {
  watch: [],          /* [{code,name,addedAt,market}] */
  data: {},           /* code → 마지막으로 받은 원본 데이터(가공 후) */
  snaps: {},          /* code → [{t, ...핵심지표}] 날짜별 스냅샷(변화 감지용) */
  theses: [],         /* [{id,code,title,text,assumptions:[{text,keywords}],risks:[...],confidence,createdAt,history:[{t,conf,reason}],lastChecked}] */
  journal: [],        /* 투자일지 */
  chats: {},          /* code('*'=포트폴리오) → [{role,text,t}] */
  seenNews: {},       /* code → {articleId:true} 이미 본 뉴스 */
  brief: null,        /* 오늘의 AI 브리핑 캐시 {date,text} */

const GAS_CODE = `function doGet(e) {
  var url = e.parameter.url;
  if (!url) return ContentService.createTextOutput('{"error":"no url"}')
    .setMimeType(ContentService.MimeType.JSON);
  var r = UrlFetchApp.fetch(url, {
    muteHttpExceptions: true,
    followRedirects: true,
    headers: { 'User-Agent': 'Mozilla/5.0', 'Referer': 'https://finance.naver.com/' }
  });
  return ContentService.createTextOutput(r.getContentText())
    .setMimeType(ContentService.MimeType.JSON);
}`;
function normRelay(u){
  u = String(u||'').trim();
  if(!u) return '';
  if(u.includes('{url}')) return u;
  if(/script\.google\.com/.test(u)) return u.replace(/[?#].*$/,'') + '?url={url}';
  return u;
}
function relayList(){
  const mine = String(state.settings.relayUrl||'').trim();
  if(!mine) return RELAYS;
  const f = mine.includes('{url}') ? u => mine.replace('{url}', encodeURIComponent(u)) : u => mine.replace(/\/+$/,'') + '/' + u;
  return [{ n:'내 중계', f }, ...RELAYS];
}
/* 경로별 실패 횟수와 최근 시도 기록 — 🩺 시세 점검에서 그대로 보여 줍니다 */
let relayFail = {}, relayLog = [];
function resetRelays(){ relayFail = {}; relayLog = []; }
const myRelay = () => String(state.settings.relayUrl||'').trim();
const isMine = i => !!myRelay() && i === 0;
function logRelay(name, url, msg, ok){
  relayLog.unshift({ t: Date.now(), name, url: String(url).replace(/^https?:\/\//,'').slice(0,70), msg, ok });
  if(relayLog.length > 40) relayLog.pop();
}
const allDead = () => relayList().every((_,i) => (relayFail[i]||0) >= 2);
async function getText(url, ms=8000){
  const ac = new AbortController(); const t = setTimeout(()=>ac.abort(), ms);
  let r;
  try{ r = await fetch(url, { signal:ac.signal, cache:'no-store' }); }
  catch(e){ const err = new Error(ac.signal.aborted ? `시간 초과(${ms/1000}초)` : '연결 실패'); err.net = true; throw err; }
  finally{ clearTimeout(t); }
  if(!r.ok){ const err = new Error('HTTP '+r.status); err.http = r.status; throw err; }
  const txt = await r.text();
  if(!txt || !txt.trim()){ const err = new Error('빈 응답'); err.empty = true; throw err; }
  return txt;
}
/* 중계를 돌아가며 시도합니다.
   · 내 중계(구글 스크립트)는 느릴 수 있어 넉넉히 기다리고 한 번 더 시도합니다
   · 공개 중계는 두 번 실패하면 이번 새로고침 동안 건너뜁니다 */
async function relayText(url){
  if(allDead()) throw new Error('중계 서버에 모두 닿지 못했어요');
  const L = relayList();
  const first = Math.min(state.settings.relay|0, L.length-1);
  let order = [first, ...L.map((_,i)=>i).filter(i=>i!==first)].filter(i => isMine(i) || (relayFail[i]||0) < 2);
  if(!order.length) order = [0];
  let lastErr = null, mineErr = null;
  for(const i of order){
    const tries = isMine(i) ? 2 : 1, ms = isMine(i) ? 20000 : 12000;   /* LTE 에서는 8초로 모자랍니다 */
    for(let k=0; k<tries; k++){
      try{
        let txt = await getText(L[i].f(url), ms);
        if(L[i].wrap){ txt = JSON.parse(txt)[L[i].wrap]; if(!txt) throw new Error('중계가 빈 내용을 줬어요'); }
        if(L[i].json){ const m = txt.match(/[\[{][\s\S]*[\]}]/); if(!m) throw new Error('JSON 을 못 찾았어요'); txt = m[0]; }
        logRelay(L[i].n, url, 'OK', true);
        relayFail[i] = 0;
        if(state.settings.relay !== i){ state.settings.relay = i; save(); }
        return txt;
      }catch(e){
        lastErr = e; logRelay(L[i].n, url, e.message, false);
        if(isMine(i)) mineErr = new Error('내 중계가 막혔어요 (' + e.message + ')');
        if(k === tries-1) relayFail[i] = (relayFail[i]||0) + 1;
      }
    }
  }
  throw mineErr || lastErr || new Error('가져오지 못했어요');
}
async function relayJSON(url){
  const t = await relayText(url);
  try{ return JSON.parse(t); }
  catch(e){ throw new Error(/^\s*</.test(t) ? '네이버가 아닌 페이지가 왔어요(중계가 막힘)' : '응답이 JSON이 아니에요'); }
}

const FOREIGN = /나스닥|뉴욕|아멕스|나스닥|상해|상하이|심천|선전|홍콩|도쿄|일본|자카르타|인도네시아|인니|베트남|호치민|하노이|대만|싱가포르|런던|프랑크푸르트|인도|NASDAQ|NYSE|AMEX|HKEX|TSE|SSE|SZSE|IDX|HOSE|HNX/i;
const isKr = x => {

  if(nation && !/^(KOR|KR|국내|대한민국|한국)$/i.test(nation)) return false;

  return US_MK.test(String(x.typeName || x.typeCode || x.marketType || x.exchDisp || x.exchange || ''));

async function searchStocks(q){

  let out = [], other = 0;
  try{
    const j = await withTimeout(relayJSON(NV.search(q)), 6000);
    const items = j?.items || j?.result?.items || (Array.isArray(j)? j : []);
    for(const x of items){
      const code = String(x.code || x.symbolCode || x.itemCode || '');
      const mkName = x.typeName || x.typeCode || x.marketType || '';
      if(/^\d{6}$/.test(code) && isKr(x)){ out.push({ code, mk:'kr', name: x.name || x.itemName || x.stockName || code, market: mkName }); continue; }
      if(isUsItem(x) && /^[A-Za-z.\-]{1,6}$/.test(code)){
        out.push({ code: code.toUpperCase(), mk:'us', sym: x.reutersCode || '', name: x.name || x.stockName || code, market: mkName || '미국' }); continue; }
      other++;
    }
  }catch(e){}
  /* 네이버가 막히거나 영어로 찾을 때는 야후에서도 찾아봅니다 */
  if(out.length < 3 && /[A-Za-z]/.test(q)){

  }
  if(!out.length) out = searchBuiltin(q);
  searchForeign = other;
  return out.slice(0, 15);
}
const withTimeout = (pr, ms) => Promise.race([pr, new Promise((_,rej)=>setTimeout(()=>rej(new Error('시간 초과')), ms))]);

/* ---------- 응답을 우리 형식으로 다듬기 (모두 방어적으로) ---------- */
function parseBasic(j){
  const b = j?.datas?.[0] || j || {};
  const price = num(b.closePrice);
  let diff = num(b.compareToPreviousClosePrice);
  const down = String(b?.compareToPreviousPrice?.code||'') === '5';
  if(has(diff) && diff>0 && down) diff = -diff;
  const prev = has(diff) ? price - diff : NaN;
  return { price, prev, name: b.stockName || b.itemName || '', market: b.stockExchangeType?.name || b.stockExchangeName || '',
           marketCap: num(b.marketValue), volume: num(b.accumulatedTradingVolume) };
}
/* integration: totalInfos 에 시가총액/PER/PBR/EPS/BPS/배당/52주 등이 code 또는 key(한글) 로 들어 있습니다 */
function parseInteg(j){
  const out = {};
  const infos = j?.totalInfos || j?.stockInfos || [];
  const map = {
    marketValue:'marketCap', 시가총액:'marketCap', per:'per', PER:'per', pbr:'pbr', PBR:'pbr', eps:'eps', EPS:'eps', bps:'bps', BPS:'bps',
    dividendYieldRatio:'divYield', 배당수익률:'divYield', highPriceOf52Weeks:'high52', '52주최고':'high52', lowPriceOf52Weeks:'low52', '52주최저':'low52',
    industryPer:'indPer', 동일업종PER:'indPer', foreignRatio:'foreignRatio', 외국인소진율:'foreignRatio', cnsEps:'epsE', cnsPer:'perE',
  };
  for(const it of infos){
    const k = map[it.code] || map[String(it.key||'').replace(/\s/g,'')];
    if(k) out[k] = num(it.value);
  }
  const c = j?.consensusInfo || j?.consensus || {};
  out.target = num(c.priceTargetMean ?? c.targetPrice ?? c.priceTargetAvg);
  out.recomm = num(c.recommMean ?? c.recommendation);
  out.epsE = has(out.epsE) ? out.epsE : num(c.eps ?? c.epsMean);
  out.industry = j?.industryCompareInfo?.industryName || j?.industryInfo?.industryName || j?.industryName || '';
  out.corpSummary = j?.corporationSummary || j?.stockInfo?.corporationSummary || '';
  return out;
}
/* 재무제표: rowList[{title, columns:{'2023.12':{value}}}], trTitleList 로 열 순서 */
/* [키, 화면에 쓸 이름, 네이버가 쓰는 이름들]
   '영업이익률'이 '영업이익'으로 잘못 들어가지 않도록 이름이 정확히 같은 것을 먼저 찾습니다 */
const FIN_ROWS = [
  ['revenue','매출액',      ['매출액','수익(매출액)','매출','영업수익']],
  ['op',     '영업이익',    ['영업이익','영업이익(발표기준)']],
  ['ni',     '당기순이익',  ['당기순이익','당기순이익(지배)','지배주주순이익']],
  ['opm',    '영업이익률',  ['영업이익률']],
  ['npm',    '순이익률',    ['순이익률']],
  ['roe',    'ROE',        ['ROE(%)','ROE','자기자본이익률']],
  ['debt',   '부채비율',    ['부채비율']],
  ['quick',  '당좌비율',    ['당좌비율']],
  ['reserve','유보율',      ['자본유보율','유보율']],
  ['eps',    'EPS',        ['EPS(원)','EPS']],
  ['per',    'PER',        ['PER(배)','PER']],
  ['bps',    'BPS',        ['BPS(원)','BPS']],
  ['pbr',    'PBR',        ['PBR(배)','PBR']],
  ['dps',    '주당배당금',  ['현금DPS(원)','주당배당금','DPS(원)','DPS']],
  ['divy',   '배당수익률',  ['현금배당수익률','배당수익률']],
];
function finKey(title){
  const t = String(title||'').replace(/\s/g,'');
  if(!t) return null;
  for(const [k,,alias] of FIN_ROWS) if(alias.includes(t)) return k;      /* 이름이 똑같은 것 먼저 */
  let best = null, len = 0;                                             /* 없으면 가장 길게 겹치는 것 */
  for(const [k,,alias] of FIN_ROWS) for(const a of alias)
    if(t.startsWith(a) && a.length > len){ best = k; len = a.length; }
  return best;
}
function parseFinance(j){
  const fi = j?.financeInfo || j || {};
  const rows = fi.rowList || fi.rows || [];
  let cols = (fi.trTitleList || fi.titleList || []).map(t => ({ key: t.key || t.code || t.title, title: t.title || t.key, est: /E|예상|추정/.test(String(t.title||t.key)) }));
  const table = {};
  for(const r of rows){
    const key = finKey(r.title || r.name);
    if(!key || table[key]) continue;              /* 같은 항목이 두 줄이면 먼저 나온 것을 씁니다 */
    const vals = {};
    const colsObj = r.columns || r.values || {};
    for(const [ck, cv] of Object.entries(colsObj)){ vals[ck] = num(cv?.value ?? cv); }
    table[key] = vals;
    if(!cols.length) cols = Object.keys(colsObj).map(k => ({ key:k, title:k, est:/E/.test(k) }));
  }
  /* 열 키가 trTitleList 와 다를 수 있어 title 로도 맞춰 봅니다 */
  cols = cols.filter(c => Object.values(table).some(v => v[c.key] != null));
  return { cols, table };
}
function parseChart(j){
  let arr = Array.isArray(j) ? j : (j?.priceInfos || j?.result || []);
  const out = arr.map(x => ({ d: String(x.localDate || x.date || ''), c: num(x.closePrice ?? x.close), v: num(x.accumulatedTradingVolume ?? x.volume) })).filter(x => has(x.c) && x.d);
  return out;
}
function parseChartXml(txt){
  const out = [];
  const re = /data="([^"]+)"/g; let m;
  while((m = re.exec(txt))){ const p = m[1].split('|'); if(p.length>=5) out.push({ d:p[0], c:num(p[4]), v:num(p[5]) }); }
  return out.filter(x => has(x.c));
}
function parseNews(j){
  let groups = Array.isArray(j) ? j : (j?.items ? [j] : []);
  const items = [];
  for(const g of groups){
    const arr = g.items || (g.title ? [g] : []);
    for(const a of arr){
      const id = String(a.articleId || a.id || (a.officeId+'-'+a.title));
      items.push({ id, title: decodeEnt(a.title || ''), office: a.officeName || '', dt: String(a.datetime || a.date || ''), body: decodeEnt(a.body || ''),
        url: (a.officeId && a.articleId) ? `https://n.news.naver.com/mnews/article/${a.officeId}/${a.articleId}` : (a.url || '') });
    }
  }
  const seen = new Set();
  return items.filter(x => { if(seen.has(x.id)) return false; seen.add(x.id); return true; }).slice(0, 30);
}
function decodeEnt(s){ const t = document.createElement('textarea'); t.innerHTML = String(s).replace(/<[^>]+>/g,''); return t.value; }

/* 한 종목의 데이터를 전부 모아 옵니다. 하나가 막혀도 나머지는 살립니다 */

const YH = {

const raw = v => (v && typeof v === 'object') ? num(v.raw ?? v.fmt) : num(v);
const isUs = code => (W(code)?.mk || state.data[code]?.mk) === 'us';

/* 야후 차트 하나로 시세·전일·52주·일봉을 모두 얻습니다 */
function parseYhChart(j){
  const r = j?.chart?.result?.[0]; if(!r) throw new Error('시세를 못 찾았어요');
  const m = r.meta || {};
  const price = num(m.regularMarketPrice);
  if(!(price > 0)) throw new Error('시세 값이 없어요');
  const closes = (r.indicators?.quote?.[0]?.close) || [];
  const stamps = r.timestamp || [];
  const chart = [];
  for(let i=0;i<stamps.length;i++){
    const c = num(closes[i]); if(!has(c)) continue;
    chart.push({ d: iso(stamps[i]*1000).replace(/-/g,''), c, v: num(r.indicators?.quote?.[0]?.volume?.[i]) });
  }
  const prev = num(m.chartPreviousClose ?? m.previousClose ?? (chart.length>1 ? chart[chart.length-2].c : price));
  return { basic: { price, prev: has(prev)&&prev>0 ? prev : price, name: m.longName || m.shortName || m.symbol || '', market: m.fullExchangeName || m.exchangeName || '' },
           chart, high52: num(m.fiftyTwoWeekHigh), low52: num(m.fiftyTwoWeekLow), ccy: m.currency || 'USD' };
}
/* 야후 요약 — PER·PBR·목표가·마진·ROE 등 */
function parseYhQuote(j){
  const r = j?.quoteSummary?.result?.[0] || {};
  const sd = r.summaryDetail || {}, ks = r.defaultKeyStatistics || {}, fd = r.financialData || {}, pr = r.price || {};
  const I = {
    per: raw(sd.trailingPE) || raw(ks.trailingEps) && NaN, pbr: raw(ks.priceToBook), eps: raw(ks.trailingEps),
    epsE: raw(ks.forwardEps), perE: raw(sd.forwardPE), divYield: has(raw(sd.dividendYield)) ? raw(sd.dividendYield)*100 : NaN,
    high52: raw(sd.fiftyTwoWeekHigh), low52: raw(sd.fiftyTwoWeekLow), marketCap: raw(sd.marketCap ?? pr.marketCap),
    target: raw(fd.targetMeanPrice), recomm: has(raw(fd.recommendationMean)) ? 6 - raw(fd.recommendationMean) : NaN,   /* 야후는 1이 강력매수라 국내(5점 만점)와 방향을 맞춥니다 */
    industry: r.assetProfile?.industry || r.assetProfile?.sector || '',
    corpSummary: r.assetProfile?.longBusinessSummary || '',
  };
  if(!has(I.per)) I.per = raw(sd.trailingPE);
  /* 연간 재무: 손익계산서 + 재무상태표에서 필요한 줄만 만들어 씁니다 (단위: 백만) */
  const inc = (r.incomeStatementHistory?.incomeStatementHistory || []).slice().reverse();
  const bal = (r.balanceSheetHistory?.balanceSheetStatements || []).slice().reverse();
  const cols = [], table = {};
  const put = (k, col, v) => { if(has(v)){ (table[k] = table[k] || {})[col] = v; } };
  inc.forEach((x, i) => {
    const col = String(x.endDate?.fmt || '').slice(0,4) || String(i);
    if(!col || cols.some(c=>c.key===col)) return;
    cols.push({ key: col, title: col, est: false });
    const rev = raw(x.totalRevenue), op = raw(x.operatingIncome), ni = raw(x.netIncome);
    put('revenue', col, has(rev)? rev/1e6 : NaN); put('op', col, has(op)? op/1e6 : NaN); put('ni', col, has(ni)? ni/1e6 : NaN);
    if(has(rev) && rev>0){ put('opm', col, has(op)? op/rev*100 : NaN); put('npm', col, has(ni)? ni/rev*100 : NaN); }
    const b = bal[i];
    if(b){
      const eq = raw(b.totalStockholderEquity), li = raw(b.totalLiab);
      if(has(eq) && eq>0){ put('roe', col, has(ni)? ni/eq*100 : NaN); put('debt', col, has(li)? li/eq*100 : NaN); }
    }
  });
  /* 최근 해의 ROE·부채비율은 야후 요약 값이 더 정확합니다 */
  const lastCol = cols.length ? cols[cols.length-1].key : null;
  if(lastCol){
    if(has(raw(fd.returnOnEquity))) put('roe', lastCol, raw(fd.returnOnEquity)*100);
    if(has(raw(fd.debtToEquity))) put('debt', lastCol, raw(fd.debtToEquity));
    if(has(raw(fd.operatingMargins))) put('opm', lastCol, raw(fd.operatingMargins)*100);
    if(has(raw(fd.profitMargins))) put('npm', lastCol, raw(fd.profitMargins)*100);
  }
  /* 내년 추정 영업이익·EPS (증권사 추정)  */
  const tr = (r.earningsTrend?.trend || []).find(t => t.period === '+1y');
  if(tr && lastCol){
    const y = String(+lastCol + 1);
    if(!cols.some(c=>c.key===y)){
      const e = raw(tr.earningsEstimate?.avg), rv = raw(tr.revenueEstimate?.avg);
      if(has(e) || has(rv)){
        cols.push({ key:y, title:y+'(E)', est:true });
        if(has(rv)) put('revenue', y, rv/1e6);
        if(has(e)) put('eps', y, e);
      }
    }
  }
  return { integ: I, annual: { cols, table } };
}

/* ============================================================
   2. 계산 모델 — 점수 (0~100) · 시나리오 · 변화 감지
   ------------------------------------------------------------
   모두 순수 함수. 입력은 위의 data 한 덩어리, 출력은 숫자와 '왜' 목록입니다.
   ============================================================ */
/* 구간 보간: pts=[[x,y],...] 오름차순 x */
function interp(x, pts){
  if(!has(x)) return NaN;
  if(x <= pts[0][0]) return pts[0][1];
  for(let i=1;i<pts.length;i++){ if(x <= pts[i][0]){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; return y0 + (y1-y0)*(x-x0)/(x1-x0); } }
  return pts[pts.length-1][1];
}
const avg = a => { const b = a.filter(has); return b.length ? b.reduce((s,v)=>s+v,0)/b.length : NaN; };
/* 중앙값 — 한 해만 크게 튄 값에 휘둘리지 않습니다 */
const median = a => { const b = a.filter(has).sort((x,y)=>x-y); if(!b.length) return NaN;
  const m = b.length>>1; return b.length%2 ? b[m] : (b[m-1]+b[m])/2; };

/* 연간 재무표에서 실적(A) 열과 추정(E) 열을 나눠 시계열로 */
function series(fin, key){
  const row = fin?.table?.[key]; if(!row) return { a:[], e:[] };
  const cols = fin.cols.length ? fin.cols : Object.keys(row).map(k=>({key:k,title:k,est:/E/.test(k)}));
  const a=[], e=[];
  for(const c of cols){ const v = row[c.key]; if(!has(v)) continue; (c.est ? e : a).push({ k:c.title, v }); }
  return { a, e };
}
const last = arr => arr.length ? arr[arr.length-1].v : NaN;
/* growth(지금, 기준) = 기준 대비 몇 % 인가. 순서를 바꾸면 부호가 뒤집힙니다 */
const growth = (cur, prev) => (has(cur) && has(prev) && prev !== 0) ? (cur-prev)/Math.abs(prev)*100 : NaN;
function cagr(arr, n){ if(arr.length < n+1) return NaN; const a = arr[arr.length-1-n].v, b = arr[arr.length-1].v; if(!(a>0) || !(b>0)) return NaN; return (Math.pow(b/a, 1/n)-1)*100; }

function computeScore(d){
  const A = d.annual, why = {}, s = {};
  const rev = series(A,'revenue'), op = series(A,'op'), opm = series(A,'opm'), roe = series(A,'roe'), debt = series(A,'debt'), quick = series(A,'quick');
  const per = series(A,'per'), pbr = series(A,'pbr'), eps = series(A,'eps');
  const price = d.basic.price, I = d.integ;

  /* 성장성: 3년 매출 CAGR, 최근 영업이익 증가율, 다음 해 추정 영업이익 증가율 */
  {
    const r3 = cagr(rev.a, Math.min(3, rev.a.length-1));
    const g1 = growth(last(op.a), op.a.length>1 ? op.a[op.a.length-2].v : NaN);
    const gE = op.e.length ? growth(op.e[0].v, last(op.a)) : NaN;
    const parts = [interp(r3, [[-10,15],[0,40],[5,55],[10,68],[20,82],[35,95]]), interp(g1, [[-40,15],[-10,35],[0,48],[20,65],[50,80],[100,95]]), interp(gE, [[-30,20],[0,45],[15,65],[40,85],[80,95]])];
    s.growth = Math.round(avg(parts));
    why.growth = [ has(r3)&&`최근 ${Math.min(3,rev.a.length-1)}년 매출 연평균 ${pct(r3)}`, has(g1)&&`직전 연도 영업이익 ${pct(g1)}`, has(gE)&&`올해 추정 영업이익 ${pct(gE)} (증권사 추정)` ].filter(Boolean);
  }
  /* 수익성: 영업이익률 수준, ROE, 마진 추세 */
  {
    const m = last(opm.a), r = last(roe.a), mt = opm.a.length>1 ? m - opm.a[opm.a.length-2].v : NaN;
    const parts = [interp(m, [[-5,10],[0,30],[5,48],[10,62],[20,80],[35,95]]), interp(r, [[-5,10],[0,30],[5,45],[10,62],[15,78],[25,92]]), interp(mt, [[-10,25],[-3,40],[0,50],[3,62],[10,80]])];
    s.profit = Math.round(avg(parts));
    why.profit = [ has(m)&&`영업이익률 ${m.toFixed(1)}%`, has(r)&&`ROE ${r.toFixed(1)}%`, has(mt)&&`영업이익률 전년 대비 ${(mt>0?'+':'')+mt.toFixed(1)}%p` ].filter(Boolean);
  }
  /* 밸류에이션: PER vs 자기 과거 평균, PER vs 업종, PBR, 배당 */
  {
    const perNow = has(I.per) ? I.per : last(per.a);
    const perHist = median(per.a.map(x=>x.v).filter(v=>v>0 && v<200));
    const perE = has(I.perE) ? I.perE : (eps.e.length && eps.e[0].v>0 ? price/eps.e[0].v : NaN);
    const rel = (has(perNow) && has(perHist) && perNow>0) ? perNow/perHist : NaN;
    const relInd = (has(perNow) && has(I.indPer) && I.indPer>0 && perNow>0) ? perNow/I.indPer : NaN;
    const pbrNow = has(I.pbr) ? I.pbr : last(pbr.a);
    const parts = [ interp(rel, [[0.5,90],[0.8,72],[1,55],[1.3,40],[2,20]]), interp(relInd, [[0.5,85],[0.8,68],[1,52],[1.5,35],[2.5,18]]),
      interp(pbrNow, [[0.5,85],[1,68],[2,52],[4,35],[8,18]]), interp(perE, [[5,90],[10,72],[15,58],[25,42],[40,25],[80,10]]), interp(I.divYield, [[0,45],[2,55],[4,68],[6,80]]) ];
    s.value = Math.round(avg(parts));
    why.value = [ has(perNow)&&`PER ${perNow.toFixed(1)}배` + (has(perHist)?` (과거 중앙값 ${perHist.toFixed(1)}배)`:''), has(perE)&&`추정 PER ${perE.toFixed(1)}배`, has(I.indPer)&&`동일업종 PER ${I.indPer.toFixed(1)}배`, has(pbrNow)&&`PBR ${pbrNow.toFixed(2)}배`, has(I.divYield)&&`배당수익률 ${I.divYield.toFixed(2)}%` ].filter(Boolean);
    if(has(perNow) && perNow < 0) why.value.push('적자여서 PER 로 평가하기 어려움');
  }
  /* 재무건전성: 부채비율, 당좌비율, 순이익 흑자 여부 */
  {
    const dr = last(debt.a), qr = last(quick.a), ni = last(series(A,'ni').a);
    const parts = [interp(dr, [[20,95],[50,85],[100,68],[200,42],[300,22],[500,8]]), interp(qr, [[30,20],[70,45],[100,65],[150,82],[250,95]]), has(ni) ? (ni>0 ? 75 : 25) : NaN];
    s.health = Math.round(avg(parts));
    why.health = [ has(dr)&&`부채비율 ${dr.toFixed(0)}%`, has(qr)&&`당좌비율 ${qr.toFixed(0)}%`, has(ni)&&(ni>0?'당기순이익 흑자':'당기순이익 적자') ].filter(Boolean);
  }
  /* 모멘텀: 20/60/120일 이평 대비, 3개월 수익률, 52주 위치 */
  {
    const ch = d.chart || [], n = ch.length;
    const ma = k => n>=k ? avg(ch.slice(n-k).map(x=>x.c)) : NaN;
    const m20 = ma(20), m60 = ma(60), m120 = ma(120);
    const r3m = n>63 ? growth(price, ch[n-64].c) : NaN;
    const hi = I.high52, lo = I.low52;
    const pos52 = (has(hi)&&has(lo)&&hi>lo) ? (price-lo)/(hi-lo)*100 : NaN;
    const above = [m20,m60,m120].filter(has).map(m => price>m ? 1 : 0);
    const parts = [ above.length ? 30 + avg(above)*50 : NaN, interp(r3m, [[-30,15],[-10,35],[0,50],[10,65],[30,82],[60,95]]), interp(pos52, [[0,25],[30,45],[60,62],[90,78],[100,85]]) ];
    s.momentum = Math.round(avg(parts));
    why.momentum = [ above.length&&`20·60·120일선 중 ${above.filter(x=>x).length}/${above.length}개 위`, has(r3m)&&`3개월 수익률 ${pct(r3m)}`, has(pos52)&&`52주 범위의 ${pos52.toFixed(0)}% 위치` ].filter(Boolean);
    s._mas = {m20,m60,m120,r3m,pos52};
  }
  const W = { growth:.25, profit:.25, value:.2, health:.15, momentum:.15 };
  let tot=0, wsum=0;
  for(const [k,w] of Object.entries(W)){ if(has(s[k])){ tot += s[k]*w; wsum += w; } }
  s.total = wsum ? Math.round(tot/wsum) : NaN;
  s.coverage = Math.round(wsum/1*100);
  return { s, why };
}

/* 시나리오 — EPS × PER. adj = {epsBull, epsBear, perBull, perBase, perBear} 사용자가 슬라이더로 바꿀 수 있습니다 */
function scenarios(d, adj={}){
  const A = d.annual, I = d.integ, price = d.basic.price;
  const eps = series(A,'eps'), per = series(A,'per');
  const epsA = last(eps.a), epsE = has(I.epsE) ? I.epsE : (eps.e.length ? eps.e[0].v : NaN);
  const base = has(epsE) ? epsE : epsA;
  /* 이익이 급감한 해에는 PER 이 수십 배로 튑니다. 평균 대신 중앙값을 쓰고,
     동일업종 PER · 지금 PER 과 함께 견줘서 범위를 다듬습니다 */
  const hist = per.a.map(x=>x.v).filter(v=>v>0 && v<150);
  const medHist = median(hist);
  const perNow = (has(base) && base>0) ? price/base : NaN;
  const anchors = [medHist, (has(I.indPer)&&I.indPer>0) ? I.indPer : NaN, perNow].filter(has);
  const perAvg = anchors.length ? median(anchors) : 12;
  const perHi = hist.length ? Math.min(Math.max(...hist), perAvg*1.4) : perAvg*1.4;
  const perLo = hist.length ? Math.max(Math.min(...hist), perAvg*0.7) : perAvg*0.7;
  const a = Object.assign({ epsBull: 15, epsBear: -20, perBull: +perHi.toFixed(1), perBase: +perAvg.toFixed(1), perBear: +perLo.toFixed(1) }, adj);
  const px = (e, p) => (has(e) && e>0) ? Math.round(e*p) : NaN;
  const out = {
    epsBase: base, epsSrc: has(epsE) ? '증권사 추정 EPS' : '최근 연간 EPS', perAvg, perLo, perHi, adj:a,
    bull: px(base*(1+a.epsBull/100), a.perBull), base: px(base, a.perBase), bear: px(base*(1+a.epsBear/100), a.perBear),
    target: I.target,
  };
  out.perNow = perNow;
  out.noHist = !hist.length;   /* 과거 PER 을 모르면 Base 는 지금 가격과 비슷할 수밖에 없습니다 */
  out.upBull = growth(out.bull, price); out.upBase = growth(out.base, price); out.upBear = growth(out.bear, price);
  if(has(base) && base <= 0) out.note = '이익이 적자(또는 없음)라 EPS×PER 방식이 맞지 않습니다. PBR·매출 기준으로 따로 봐야 합니다.';
  return out;
}

/* 리스크 모니터 — 데이터로 잴 수 있는 것만 별 개수로 */
function riskMonitor(d, sc, sn){
  const A = d.annual, I = d.integ, price = d.basic.price, out = [];
  const add = (name, lv, why) => out.push({ name, lv, why });     /* lv 1~5 */
  const per = series(A,'per'), debt = series(A,'debt'), opm = series(A,'opm'), rev = series(A,'revenue');
  const perNow = has(I.per)?I.per:last(per.a), perAvg = avg(per.a.map(x=>x.v).filter(v=>v>0&&v<150));
  if(has(perNow) && has(perAvg)) add('밸류에이션 부담', clamp(Math.round(interp(perNow/perAvg, [[0.6,1],[0.9,2],[1.2,3],[1.6,4],[2.2,5]])),1,5), `PER ${perNow.toFixed(1)}배 vs 과거 평균 ${perAvg.toFixed(1)}배`);
  else if(has(perNow) && perNow<0) add('적자 지속', 4, 'PER 이 음수 — 이익이 나지 않고 있습니다');
  const dr = last(debt.a); if(has(dr)) add('재무 레버리지', clamp(Math.round(interp(dr, [[50,1],[100,2],[150,3],[250,4],[400,5]])),1,5), `부채비율 ${dr.toFixed(0)}%`);
  const m = opm.a.map(x=>x.v); if(m.length>=3){ const sd = Math.sqrt(avg(m.map(v=>(v-avg(m))**2))); add('이익 변동성(경기민감)', clamp(Math.round(interp(sd,[[1,1],[3,2],[6,3],[10,4],[15,5]])),1,5), `영업이익률 표준편차 ${sd.toFixed(1)}%p`); }
  const r = rev.a; if(r.length>=2){ const g = growth(last(r), r[r.length-2].v); if(has(g) && g<0) add('매출 역성장', clamp(Math.round(interp(-g,[[0,2],[5,3],[15,4],[30,5]])),2,5), `직전 연도 매출 ${pct(g)}`); }
  const pos = sc?.s?._mas?.pos52; if(has(pos)) add(pos>85?'단기 과열(52주 고점권)':'가격 위치', clamp(Math.round(interp(pos,[[0,3],[30,2],[60,1],[85,3],[100,4]])),1,5), `52주 범위 ${pos.toFixed(0)}% 위치`);
  if(!has(I.target)) add('증권사 커버리지 부족', 3, '목표주가 컨센서스가 없습니다 — 정보가 적은 종목');
  const w = weightOf(d.code);
  if(w && has(w.inKr)) add('내 포트폴리오 집중도', clamp(Math.round(interp(w.inKr, [[5,1],[15,2],[25,3],[40,4],[60,5]])),1,5), `주식 전체의 ${w.inKr.toFixed(0)}%가 이 종목 (전체 자산의 ${has(w.inAll)?w.inAll.toFixed(1):'?'}%)`);
  return out.sort((a,b)=>b.lv-a.lv).slice(0,6);
}

/* 스냅샷 — 변화 감지용으로 하루 하나씩 남깁니다 */
function makeSnap(d, sc, sn){
  const A = d.annual, opE = series(A,'op').e, epsE = series(A,'eps').e;
  return { t: d.t, date: iso(d.t), code: d.code, price: d.basic.price, per: d.integ.per, pbr: d.integ.pbr, target: d.integ.target, recomm: d.integ.recomm,
    epsE: has(d.integ.epsE)?d.integ.epsE:(epsE[0]?.v), opE: opE[0]?.v, opEk: opE[0]?.k, score: sc.s.total, sub: {growth:sc.s.growth, profit:sc.s.profit, value:sc.s.value, health:sc.s.health, momentum:sc.s.momentum},
    base: sn.base, newsIds: (d.news||[]).slice(0,20).map(n=>n.id), latestCol: A.cols.length ? A.cols[A.cols.length-1].title : '' };
}
/* 두 스냅샷을 비교해 "투자 판단에 영향을 줄 만한" 변화만 뽑습니다 */
function detectChanges(prev, cur, news, seen){
  const out = [];
  const add = (impact, level, title, detail, kind) => out.push({ impact, level, title, detail, kind });
  const d = (a,b) => growth(b,a);
  if(prev){
    const days = Math.max(1, Math.round((cur.t - prev.t)/DAY));
    const pc = d(prev.price, cur.price);
    if(has(pc) && Math.abs(pc) >= (days<=1 ? 4 : 8)) add(pc>0?'up':'down', Math.abs(pc)>=10?'high':'mid', `주가 ${pct(pc)} (${days}일)`, `${px$(prev.price, cur.code)} → ${px$(cur.price, cur.code)}`, 'price');
    const tc = d(prev.target, cur.target);
    if(has(tc) && Math.abs(tc) >= 2) add(tc>0?'up':'down', Math.abs(tc)>=5?'high':'mid', `목표주가 컨센서스 ${pct(tc)}`, `${px$(prev.target, cur.code)} → ${px$(cur.target, cur.code)} — 증권사 평균 목표가가 바뀌었습니다`, 'target');
    const oc = d(prev.opE, cur.opE);
    if(has(oc) && Math.abs(oc) >= 2 && prev.opEk === cur.opEk) add(oc>0?'up':'down', Math.abs(oc)>=5?'high':'mid', `${cur.opEk||'올해'} 영업이익 추정 ${pct(oc)}`, `${fmt(prev.opE)}억 → ${fmt(cur.opE)}억 — 실적 전망이 바뀌었습니다`, 'estimate');
    const ec = d(prev.epsE, cur.epsE);
    if(has(ec) && Math.abs(ec) >= 3 && !(has(oc)&&Math.abs(oc)>=2)) add(ec>0?'up':'down', 'mid', `추정 EPS ${pct(ec)}`, `${fmt(prev.epsE)}원 → ${fmt(cur.epsE)}원`, 'estimate');
    if(has(prev.recomm) && has(cur.recomm) && Math.abs(cur.recomm-prev.recomm) >= 0.2) add(cur.recomm>prev.recomm?'up':'down', 'mid', `투자의견 평균 ${prev.recomm.toFixed(2)} → ${cur.recomm.toFixed(2)}`, '증권사 투자의견 평균이 바뀌었습니다', 'recomm');
    if(prev.latestCol && cur.latestCol && prev.latestCol !== cur.latestCol) add('flat', 'high', `새 재무제표 반영 (${cur.latestCol})`, '연간 재무 데이터가 새로 나왔습니다. 점수와 시나리오가 다시 계산됐습니다', 'filing');
    const scd = (has(prev.score)&&has(cur.score)) ? cur.score - prev.score : NaN;
    if(has(scd) && Math.abs(scd) >= 4){
      const keys = {growth:'성장성',profit:'수익성',value:'밸류에이션',health:'재무건전성',momentum:'모멘텀'};
      let big = null, bigD = 0;
      for(const k of Object.keys(keys)){ const dd = (cur.sub?.[k]??0) - (prev.sub?.[k]??0); if(Math.abs(dd) > Math.abs(bigD)){ bigD = dd; big = k; } }
      add(scd>0?'up':'down', Math.abs(scd)>=8?'high':'mid', `AI 점수 ${prev.score} → ${cur.score}`, big ? `가장 크게 움직인 항목: ${keys[big]} (${bigD>0?'+':''}${bigD})` : '', 'score');
    }
    const pcc = d(prev.per, cur.per);
    if(has(pcc) && Math.abs(pcc) >= 8 && !(has(pc)&&Math.abs(pc)>=4)) add(pcc>0?'down':'up', 'low', `PER ${prev.per.toFixed(1)} → ${cur.per.toFixed(1)}배`, '이익 기준이 바뀌었을 수 있습니다', 'valuation');
  }
  /* 새 뉴스 — 처음 보는 기사만, 중요 키워드가 있으면 등급을 올립니다 */
  const HOT = /실적|영업이익|매출|가이던스|컨센서스|목표주가|투자의견|공시|수주|계약|유상증자|무상증자|자사주|배당|합병|인수|분할|소송|리콜|규제|제재|관세|파업|화재|점유율|증설|투자 계획|CEO|대표이사|상향|하향/;
  const fresh = (news||[]).filter(n => !seen?.[n.id]);
  const hot = fresh.filter(n => HOT.test(n.title));
  if(hot.length) add('flat', hot.length>=3?'mid':'low', `주요 뉴스 ${hot.length}건`, hot.slice(0,3).map(n=>'· '+n.title).join('\n'), 'news');
  else if(fresh.length >= 5) add('flat', 'low', `새 뉴스 ${fresh.length}건`, '기업가치에 직접 닿는 키워드는 없었습니다', 'news');
  const rank = {high:3, mid:2, low:1};
  return out.sort((a,b)=>rank[b.level]-rank[a.level]);
}

/* 투자 논리(Thesis) — 가정·리스크 키워드와 새 뉴스·변화를 맞춰 봅니다 */
function thesisCheck(th, changes, news){
  const hits = [];
  const text = (n) => n.title + ' ' + (n.body||'');
  const scan = (list, kind) => list.forEach((a, i) => {
    const kws = (a.keywords||[]).filter(Boolean);
    if(!kws.length) return;
    const m = (news||[]).filter(n => kws.some(k => text(n).includes(k)));
    if(m.length) hits.push({ kind, i, text:a.text, n:m.length, titles:m.slice(0,3).map(x=>x.title) });
  });
  scan(th.assumptions||[], 'assumption'); scan(th.risks||[], 'risk');
  const bad = (changes||[]).filter(c => c.impact==='down' && c.level!=='low');
  const good = (changes||[]).filter(c => c.impact==='up' && c.level!=='low');
  return { hits, bad, good, needsReview: bad.length>0 || hits.some(h=>h.kind==='risk') };
}
/* 문장에서 키워드를 뽑는 아주 단순한 방법 (AI 없이 쓸 때) */
function guessKeywords(s){
  const stop = /^(것|수|등|및|대한|위한|통해|따라|으로|에서|이다|있다|한다|된다|같은|더|매우|계속|향후|앞으로|시장|기업|회사|성장|증가|감소|유지|전망|가능|예상|기대|리스크|위험|가정|투자|주가|실적)$/;
  const w = String(s).replace(/[^\w가-힣A-Za-z0-9 ]/g,' ').split(/\s+/).map(x=>x.replace(/(은|는|이|가|을|를|의|도|에|로|과|와|이다|입니다)$/,'')).filter(x => x.length>=2 && !stop.test(x));
  return [...new Set(w)].slice(0,4);
}
</script>

<script>
/* ============================================================
   3. 샘플 데이터 — 데이터 서버가 막혔거나 PC에서 둘러볼 때
   (실제 값이 아닙니다. 형태만 진짜와 같습니다)
   ============================================================ */
function demoStock(code){
  const us = (W(code)?.mk || state.data[code]?.mk) === 'us';
  const name = (BUILTIN.find(([c])=>c===code) || US_BUILTIN.find(([c])=>c===code) || [code,code])[1];
  const seed = [...code].reduce((a,c)=>a+c.charCodeAt(0),0);
  const rnd = (i, a=0, b=1) => { const x = Math.sin(seed*7 + i*13) * 10000; return a + (x - Math.floor(x))*(b-a); };
  const price = us ? Math.round(rnd(1, 30, 400)*100)/100 : Math.round(rnd(1, 20000, 200000)/100)*100;
  const yrs = ['2022.12','2023.12','2024.12','2025.12','2026.12(E)'];
  const cols = yrs.map(k => ({ key:k, title:k, est:/E/.test(k) }));
  const rev0 = rnd(2, 20000, 3000000);
  const g = rnd(3, -0.05, 0.25);
  const revs = yrs.map((_,i) => Math.round(rev0 * Math.pow(1+g, i)));
  const opm = yrs.map((_,i) => +(rnd(4, 3, 25) + rnd(10+i, -4, 4)).toFixed(1));
  const ops = revs.map((r,i) => Math.round(r*opm[i]/100));
  const shares = rnd(5, 5e7, 6e9);
  const eps = ops.map(o => Math.round(o*0.75*1e8/shares));
  const table = {};
  const row = arr => Object.fromEntries(yrs.map((k,i)=>[k, arr[i]]));
  table.revenue = row(revs); table.op = row(ops); table.ni = row(ops.map(o=>Math.round(o*0.75))); table.opm = row(opm);
  table.npm = row(opm.map(m=>+(m*0.75).toFixed(1))); table.roe = row(yrs.map((_,i)=>+(rnd(6,4,18)+rnd(20+i,-3,3)).toFixed(1)));
  table.debt = row(yrs.map((_,i)=>Math.round(rnd(7,30,180)+rnd(30+i,-10,10)))); table.quick = row(yrs.map((_,i)=>Math.round(rnd(8,60,200))));

const PROVIDERS = {
  anthropic: { name:'Anthropic Claude', models:['claude-opus-5','claude-sonnet-5','claude-haiku-4-5'], hint:'console.anthropic.com 에서 키 발급 (sk-ant-…)' },

const SYSTEM = `당신은 StockLens 의 AI 애널리스트입니다. 한국 개인투자자를 돕습니다.
원칙:
- 사라/팔라 같은 매매 지시를 하지 않습니다. 대신 "이 논리가 맞으려면 무엇이 사실이어야 하고, 무엇이 그것을 깨뜨릴 수 있는지"를 밝힙니다.
- 반드시 함께 제공된 데이터(JSON)에 근거해 말하고, 데이터에 없는 숫자는 지어내지 않습니다. 데이터에 없으면 "데이터에 없음"이라고 말합니다.
- 점수·목표가는 앱의 계산 모델이 낸 값입니다. 당신은 그 계산을 바꾸지 말고 해석·설명합니다. 사용자가 가정을 바꾸면(예: 영업이익 -20%) 제공된 EPS·PER 값으로 간단히 산수해서 보여 주되 계산식을 함께 적습니다.
- 낙관과 비관을 같은 무게로 다룹니다. 확신하는 말투를 피하고 불확실한 것은 불확실하다고 씁니다.

- 마지막 줄에 "근거:" 뒤에 어떤 데이터 항목을 썼는지 한 줄로 적습니다.`;

/* 공통 호출: messages=[{role:'user'|'assistant', text}], system 문자열 → 답 텍스트 */
async function aiChat(messages, system=SYSTEM, opt={}){
  const { provider, apiKey } = state.settings;
  if(!apiKey) throw new Error('AI 키가 없어요. ⚙️ 설정에서 API 키를 넣어 주세요.');
  const model = aiModel();
  const maxTok = opt.maxTokens || 4000;
  let url, headers, body, pick;
  if(provider === 'anthropic'){
    url = 'https://api.anthropic.com/v1/messages';
    headers = { 'content-type':'application/json', 'x-api-key': apiKey, 'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true', 'anthropic-beta':'server-side-fallback-2026-07-01' };
    body = { model, max_tokens: maxTok, system, fallbacks:'default',
      output_config: { effort: state.settings.effort || 'medium' },
      messages: messages.map(m => ({ role: m.role, content: m.text })) };
    pick = j => {
      if(j.stop_reason === 'refusal') throw new Error('AI 가 이 요청에 답하지 않았어요 (' + (j.stop_details?.category||'refusal') + ')');
      return (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    };
  }else if(provider === 'openai'){
    url = 'https://api.openai.com/v1/chat/completions';
    headers = { 'content-type':'application/json', 'authorization':'Bearer '+apiKey };
    body = { model, max_completion_tokens: maxTok, messages: [{role:'system', content: system}, ...messages.map(m=>({role:m.role, content:m.text}))] };
    pick = j => j.choices?.[0]?.message?.content || '';
  }else{
    url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
    headers = { 'content-type':'application/json' };
    body = { systemInstruction: { parts:[{text: system}] }, contents: messages.map(m => ({ role: m.role==='assistant'?'model':'user', parts:[{text:m.text}] })), generationConfig:{ maxOutputTokens: maxTok } };
    pick = j => (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
  }
  const ac = new AbortController(); const t = setTimeout(()=>ac.abort(), 180000);
  let r, j;
  try{ r = await fetch(url, { method:'POST', headers, body: JSON.stringify(body), signal: ac.signal }); }
  catch(e){ throw new Error('AI 서버에 연결하지 못했어요 (네트워크 또는 브라우저 차단)'); }
  finally{ clearTimeout(t); }
  try{ j = await r.json(); }catch(e){ throw new Error('AI 응답을 읽지 못했어요 (HTTP '+r.status+')'); }
  if(!r.ok){ const m = j?.error?.message || j?.error?.type || ('HTTP '+r.status); throw new Error('AI 오류: ' + m); }
  const text = pick(j);
  if(!text) throw new Error('AI 가 빈 답을 보냈어요');
  return text;
}
/* 답 속에서 JSON 한 덩어리만 꺼냅니다 (코드펜스·앞뒤 설명 무시) */
function pickJSON(text){
  const m = String(text).match(/\{[\s\S]*\}/);
  if(!m) throw new Error('AI 답에서 JSON 을 찾지 못했어요');
  return JSON.parse(m[0]);
}

{"confidence":0~100 정수,"delta_reason":"확신도가 오르거나 내린 가장 큰 이유 한 문장","affected":[{"item":"가정 또는 리스크 원문","direction":"support|weaken|neutral","evidence":"근거가 된 데이터/뉴스 한 줄"}],"summary":"3~4문장 요약. 논리를 다시 검토해야 하는지, 어떤 데이터가 결정적인지","verdict":"유지|재검토|약화"}
이전 확신도: ${th.confidence}. 확신도는 뚜렷한 근거가 있을 때만 크게 바꾸세요.

투자 논리: ${JSON.stringify({ 제목:th.title, 원문:th.text, 가정:(th.assumptions||[]).map(a=>a.text), 리스크:(th.risks||[]).map(a=>a.text), 작성일: iso(th.createdAt) })}
키워드 매칭 결과: ${JSON.stringify(chk.hits)}
데이터: ${JSON.stringify(p)}` }], SYSTEM, { maxTokens: 2500 });
  return pickJSON(raw);

function detectChangesFor(code){

  const prev = snaps.length>1 ? snaps[snaps.length-2] : null;

}

}

<script>
/* ============================================================
   4.5 우리집 자산 앱 연동 — 읽기만 합니다
   ------------------------------------------------------------
   · 같은 폰: 자산 앱과 주소가 같아서 localStorage(myAssets.v1)를 그대로 읽습니다
   · 다른 폰: 자산 앱이 배우자와 공유하는 Firestore 방을 읽습니다
     (자산 앱이 가계부 방을 읽는 것과 같은 방식. 상대 방에는 아무것도 쓰지 않습니다)
   보유 수량·평단가가 붙으면 점수와 시나리오가 '내 계좌 기준 손익'으로 바뀝니다.
   ============================================================ */
const MA_KEY = 'myAssets.v1';
const MA_CATS = { kr:'국내주식·ETF', us:'미국주식·ETF', coin:'코인', gold:'금', fx:'달러·외화', real:'부동산', cash:'예적금·현금', etc:'연금·펀드·기타', debt:'대출·부채' };
const pad6 = c => String(c||'').replace(/\D/g,'').padStart(6,'0');

let _maCache = { at:0, v:null };
function readLocalAssets(force){
  if(!force && Date.now() - _maCache.at < 5000) return _maCache.v;
  try{
    const d = JSON.parse(localStorage.getItem(MA_KEY)||'null');
    if(!d || !Array.isArray(d.holdings)) return null;
    _maCache = { at: Date.now(), v: { holdings: d.holdings, accts: d.accts||{}, px: d.px||{}, fx: +d.fx?.v||0, sync: d.sync||{}, at: Date.now() } };
    return _maCache.v;
  }catch(e){ _maCache = { at: Date.now(), v: null }; return null; }
}
/* Firestore 방 읽기 — 자산 앱이 저장해 둔 core 문서 안에 holdings 가 들어 있습니다 */
async function readCloudAssets(cfg){
  const { projectId, apiKey, room } = cfg;
  if(!projectId || !apiKey || !room) throw new Error('방 정보가 모자라요 (프로젝트·키·방 이름)');
  const u = `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(projectId)}`
          + `/databases/(default)/documents/rooms/${encodeURIComponent(room)}/assets/core?key=${encodeURIComponent(apiKey)}`;
  const r = await fetch(u);
  if(r.status === 404) throw new Error('그 방에 아직 자산이 없어요');
  if(!r.ok){ let m=''; try{ m = (await r.json())?.error?.message||''; }catch(_){} throw new Error(m || ('HTTP '+r.status)); }
  const core = JSON.parse((await r.json()).fields?.json?.stringValue || '{}');
  if(!Array.isArray(core.holdings)) throw new Error('자산 목록을 찾지 못했어요');
  /* 시세 캐시는 공유되지 않습니다 — 국내주식은 이 앱이 직접 가져오고, 나머지는 평가액을 모릅니다 */
  return { holdings: core.holdings, accts: core.accts||{}, px: {}, fx: 0, sync: cfg, at: Date.now() };
}
/* 연동해 두면 보유 종목을 알아서 담습니다 — 하나하나 찾아 넣지 않아도 됩니다 */
async function autoImport(){
  if(state.assets.mode === 'off' || state.assets.auto === false) return [];
  const miss = missingWatch();
  if(!miss.length) return [];
  for(const p of miss) state.watch.push({ code:p.code, name:p.name, mk:p.mk||'kr', sym:p.sym||'', addedAt: Date.now(), fromAssets:true });
  save();
  return miss;
}
async function loadAssets(opts={}){
  const A = state.assets;
  if(A.mode === 'off') return;
  try{
    let got;
    if(A.mode === 'local'){
      got = readLocalAssets(true);
      if(!got) throw new Error('이 폰의 자산 앱에서 자료를 찾지 못했어요');
    }else{
      got = await readCloudAssets(A);
    }
    Object.assign(A, { holdings: got.holdings, accts: got.accts, px: got.px, fx: got.fx, at: got.at, err:'' });
    if(A.mode === 'local' && got.sync?.room && !A.room){ A.room = got.sync.room; A.projectId = got.sync.projectId||''; A.apiKey = got.sync.apiKey||''; }
    save();
    await autoImport();
  }catch(e){ A.err = e.message; save(); if(!opts.quiet) toast(e.message); }
}
const assetsOn = () => !state.ui?.safe && state.assets && state.assets.mode !== 'off' && (state.assets.holdings||[]).length>0;
const liveHoldings = () => (state.assets?.holdings||[]).filter(h => h && !h.hide);

/* 같은 종목이 계좌 여러 곳에 있으면 한 줄로 합칩니다 (국내·미국 모두) */
const FX = () => +state.assets?.fx || 0;
function krPositions(){
  const map = {}, fx = FX();
  for(const h of liveHoldings()){
    if(h.cat !== 'kr' && h.cat !== 'us') continue;
    const code = h.cat === 'kr' ? pad6(h.code) : String(h.code || h.sym || '').toUpperCase();
    if(!code) continue;
    const m = map[code] = map[code] || { code, mk: h.cat, name: h.name||code, qty:0, cost:0, costKrw:0, accts:[], owners:[], target:0, stop:0, sym: h.nsym||'' };
    const q = +h.qty||0, avg = +h.avg||0;
    m.qty += q; m.cost += q*avg;
    m.costKrw += h.cat === 'us' ? q*avg*((+h.avgFx>0 ? +h.avgFx : fx) || 0) : q*avg;
    if(h.nsym && !m.sym) m.sym = h.nsym;
    if(h.acct && !m.accts.includes(h.acct)) m.accts.push(h.acct);
    const ow = h.owner||'공동'; if(!m.owners.includes(ow)) m.owners.push(ow);
    if(+h.target>0) m.target = Math.max(m.target, +h.target);
    if(+h.stop>0) m.stop = m.stop ? Math.min(m.stop, +h.stop) : +h.stop;
  }
  for(const m of Object.values(map)) m.avg = m.qty>0 ? m.cost/m.qty : NaN;
  return map;
}
/* 한 종목의 내 보유 — 평가액은 이 앱이 방금 받은 시세로 계산합니다 (자산 앱보다 최신) */
function positionOf(code){
  const p = krPositions()[code];
  if(!p || !(p.qty>0)) return null;
  const d = state.data[code];
  const price = d?.basic.price, prev = d?.basic.prev;
  const value = has(price) ? price*p.qty : NaN;
  const pl = has(value) && p.cost>0 ? value - p.cost : NaN;
  const plRate = has(pl) && p.cost>0 ? pl/p.cost*100 : NaN;
  const day = (has(price)&&has(prev)) ? (price-prev)*p.qty : NaN;
  const k = p.mk === 'us' ? FX() : 1;                    /* 비중은 원화로 견줍니다 */
  return Object.assign({}, p, { price, value, pl, plRate, day, ccy: p.mk==='us' ? 'USD' : 'KRW',
    valueKrw: (has(value) && k>0) ? value*k : (p.mk==='kr' ? value : NaN),
    dayKrw: (has(day) && k>0) ? day*k : (p.mk==='kr' ? day : NaN) });
}
/* 자산 앱 한 줄의 원화 평가액 — 자산 앱 calc() 과 같은 규칙 */
function maValue(h){
  const A = state.assets || {}, q = +h.qty||0;
  if(h.cat === 'debt') return 0;
  if(h.cat === 'kr' && h.code && state.data[pad6(h.code)]) return state.data[pad6(h.code)].basic.price * q;
  if(h.cat === 'us'){                                   /* 우리가 받아 온 달러 시세 × 환율 */
    const c = String(h.code || h.sym || '').toUpperCase(), d = state.data[c];
    if(d && has(d.basic.price) && FX() > 0) return d.basic.price * q * FX();
  }
  const px = priceOfHolding(h);                          /* 코인·금·달러, 직접 적은 값, 자산 앱 캐시 */
  if(px && +px.p > 0) return (+px.p) * q;
  return NaN;
}
/* 전체 자산 합계 — 값을 모르는 줄은 세지 않고 몇 개인지 알려 줍니다 */
function assetTotals(){
  if(!assetsOn()) return null;
  let total=0, debt=0, unknown=0;
  const byCat = {};
  for(const h of liveHoldings()){
    if(h.cat === 'debt'){ debt += +h.loan||0; continue; }
    const v = maValue(h);
    if(!has(v)){ unknown++; continue; }
    total += v; byCat[h.cat] = (byCat[h.cat]||0) + v;
  }
  /* 주식(국내+미국)은 우리가 받은 시세로 따로 계산합니다 — 원화 기준 */
  let kr=0, krCost=0, nUs=0, noFx=0;
  for(const c of Object.keys(krPositions())){
    const p = positionOf(c); if(!p) continue;
    if(p.mk === 'us') nUs++;
    if(!has(p.valueKrw)){ if(p.mk==='us') noFx++; continue; }
    kr += p.valueKrw; krCost += p.costKrw || 0;
  }
  return { total, debt, net: total-debt, unknown, byCat, kr, krCost, nUs, noFx,
    krPl: krCost>0 ? kr-krCost : NaN, krPlRate: krCost>0 ? (kr-krCost)/krCost*100 : NaN };
}
/* 국내주식 안에서의 비중 · 전체 자산 안에서의 비중 */
function weightOf(code){
  const t = assetTotals(), p = positionOf(code);
  if(!t || !p || !has(p.valueKrw)) return null;
  return { inKr: t.kr>0 ? p.valueKrw/t.kr*100 : NaN, inAll: t.total>0 ? p.valueKrw/t.total*100 : NaN };
}
/* 업종이 얼마나 겹쳐 있는지 — 데이터를 받아 온 종목만 셉니다 */
function industryMix(){
  const t = assetTotals(); if(!t || !(t.kr>0)) return [];
  const by = {};
  for(const code of Object.keys(krPositions())){
    const p = positionOf(code); if(!p || !has(p.valueKrw)) continue;
    const ind = state.data[code]?.integ.industry || '업종 모름';
    (by[ind] = by[ind] || { industry:ind, value:0, names:[] }).value += p.valueKrw;
    by[ind].names.push(state.data[code]?.basic.name || code);
  }
  return Object.values(by).map(x => Object.assign(x, { pct: x.value/t.kr*100 })).sort((a,b)=>b.value-a.value);
}
/* 보유 중인데 관심종목에 없는 국내주식 */
function missingWatch(){ return Object.values(krPositions()).filter(p => !W(p.code)); }
/* 보유 중인데 투자 논리를 안 적어 둔 종목 */
function noThesis(){ return Object.values(krPositions()).filter(p => W(p.code) && !state.theses.some(t=>t.code===p.code)); }

async function importHoldings(){
  const miss = missingWatch();
  if(!miss.length){ toast('이미 다 담겨 있어요'); return; }
  for(const p of miss) if(!W(p.code)) state.watch.push({ code:p.code, name:p.name, mk:p.mk||'kr', sym:p.sym||'', addedAt: Date.now(), fromAssets:true });
  save(); closeModal(); showTab('home');
  busy.refreshAll = true; render();
  for(const p of miss) await refreshStock(p.code, {quiet:true});
  busy.refreshAll = false; save(); render();
  toast(`보유 종목 ${miss.length}개를 담았어요`);
}

/* ============================================================
   5. 화면
   ============================================================ */
const TABS = ['home','search','stock','thesis','ai'];
function showTab(t){
  state.ui.tab = t; save();
  TABS.forEach(x => { $('#tab-'+x).classList.toggle('hidden', x!==t); });
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab===t));
  render(); window.scrollTo(0,0);
}
let lastCrash = null;
/* 한 조각이 터져도 화면 전체가 비지 않게 — 그 자리에만 이유를 적습니다 */
function safe(label, fn){
  try{ return fn(); }
  catch(e){
    lastCrash = { where: label, msg: String(e && e.message || e), stack: String(e && e.stack || '').split('\n').slice(0,4).join('\n'), t: Date.now() };
    console.error('[StockLens]', label, e);
    return `<div class="err mt">⚠️ <b>${esc(label)}</b> 부분을 그리다 문제가 생겨 건너뛰었습니다 — ${esc(lastCrash.msg)}
      <div class="btn-row"><button class="btn xs ghost" data-act="copyCrash">📋 오류 복사</button></div></div>`;
  }
}
function crashHtml(e, where){
  lastCrash = { where, msg: String(e && e.message || e), stack: String(e && e.stack || '').split('\n').slice(0,5).join('\n'), t: Date.now() };
  console.error('[StockLens]', where, e);
  return `<div class="card" style="border-color:#f3c9c5">
    <h2>⚠️ 화면을 그리다 멈췄어요</h2>
    <p class="desc">${esc(where)}에서 문제가 생겼습니다. 아래 오류를 복사해서 보내 주시면 고칠 수 있습니다.</p>
    <div class="err">${esc(lastCrash.msg)}</div>
    <pre class="tiny mt">${esc(lastCrash.stack)}</pre>
    <div class="btn-row"><button class="btn sm" data-act="copyCrash">📋 오류 복사</button><button class="btn sm ghost" data-act="safeMode">🛟 안전 모드</button></div>
    <p class="tiny muted mt">안전 모드는 자산 연동과 최근 기능을 끄고 최소한의 화면만 그립니다. 담아 둔 종목·논리·일지는 지워지지 않습니다.</p>
    <div class="btn-row"><button class="btn xs ghost" data-act="settings">⚙️ 설정</button><button class="btn xs warn" data-act="reset">전부 지우기</button></div>
  </div>`;
}
function render(){
  const fn = ({home:renderHome, search:renderSearch, stock:renderStock, thesis:renderThesis, ai:renderAI})[state.ui.tab];
  const el = $('#tab-' + state.ui.tab);
  try{ fn(); }
  catch(e){ if(el) el.innerHTML = crashHtml(e, state.ui.tab + ' 화면'); }
}
/* 화면 밖(비동기)에서 터진 것도 놓치지 않습니다 */
addEventListener('error', ev => {
  const el = $('#tab-' + state.ui.tab);
  if(el && !el.innerHTML.trim()) el.innerHTML = crashHtml(ev.error || { message: ev.message + ' @' + (ev.filename||'') + ':' + (ev.lineno||'') }, '앱 시작');
});
addEventListener('unhandledrejection', ev => {
  const el = $('#tab-' + state.ui.tab);
  if(el && !el.innerHTML.trim()) el.innerHTML = crashHtml(ev.reason || {message:'알 수 없는 오류'}, '데이터 가져오기');
});
const W = code => state.watch.find(w=>w.code===code);
const chgOf = code => { const d = state.data[code]; return d ? growth(d.basic.price, d.basic.prev) : NaN; };
const cls = v => !has(v) || Math.abs(v)<0.005 ? 'flat' : v>0 ? 'up' : 'down';
const levelLabel = { high:'HIGH', mid:'MED', low:'LOW' };
const impIcon = c => c.impact==='up' ? '🟢' : c.impact==='down' ? '🔴' : '🟡';
const stars = n => '★'.repeat(n) + '☆'.repeat(5-n);
const lvWord = n => n>=5?'매우 높음':n>=4?'높음':n>=3?'보통':n>=2?'낮음':'매우 낮음';
let busy = {};
const spinBtn = (id, on) => { busy[id]=on; };

/* 홈 — 내 자산 요약 (자산 앱에서 읽어 온 보유 기준) */
function assetCard(){
  const A = state.assets;
  if(A.mode === 'off'){
    const local = readLocalAssets();
    if(!local || !local.holdings.some(h=>h.cat==='kr'||h.cat==='us')) return '';
    return `<div class="card"><h2>📊 우리집 자산 연동</h2>
      <p class="desc">이 폰의 <b>우리집 자산</b> 앱에 <b>${local.holdings.filter(h=>!h.hide).length}개</b>가 담겨 있습니다
      (주식 ${local.holdings.filter(h=>(h.cat==='kr'||h.cat==='us')&&!h.hide).length}개, 그 밖에 코인·금·달러·부동산 등).<br>
      연동을 누르면 <b>보유 주식을 알아서 다 담고</b>, 수량·평단이 붙어 내 계좌 기준 손익·비중으로 보여 드립니다.
      코인·금·달러도 시세를 받아 <b>자산 구성</b>에 함께 나옵니다. 하나하나 찾아 넣지 않으셔도 됩니다.</p>
      <div class="btn-row"><button class="btn" data-act="linkLocal">🔗 자산 앱과 연동하기</button></div>
      <div class="btn-row"><button class="btn sm ghost" data-act="settings">다른 폰·배우자 방으로 연동</button></div></div>`;
  }
  const t = assetTotals();
  if(!t) return `<div class="card"><h2>📊 우리집 자산</h2><p class="desc">${esc(A.err||'보유 자료를 읽지 못했어요.')}</p><div class="btn-row"><button class="btn sm ghost" data-act="reloadAssets">다시 읽기</button></div></div>`;
  const miss = missingWatch(), mix = industryMix(), top = mix[0];
  const day = Object.keys(krPositions()).reduce((sk,c)=>{ const p = positionOf(c); return sk + (has(p?.dayKrw)?p.dayKrw:0); }, 0);
  const nonKr = liveHoldings().filter(h=>h.cat!=='kr'&&h.cat!=='us'&&h.cat!=='debt').length;
  return `<div class="card">
    <h2>📊 내 주식 <span class="sub">${A.mode==='local'?'이 폰의 자산 앱':'공유 방 '+esc(A.room)} · ${A.at?new Date(A.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):''}</span></h2>

/* ============================================================
   4.6 주식이 아닌 자산 — 코인·금·달러도 함께 봅니다
   ------------------------------------------------------------
   자산 앱과 같은 출처를 씁니다. 업비트·환율은 브라우저에서 바로 열려서
   중계가 막혀 있어도 대개 붙습니다.
   ============================================================ */
const OZ_G = 31.1034768;
const CATS = { kr:'국내주식', us:'미국주식', coin:'코인', gold:'금', fx:'달러·외화', real:'부동산', cash:'예적금·현금', etc:'연금·펀드·기타', debt:'대출' };
const CAT_EMO = { kr:'🇰🇷', us:'🇺🇸', coin:'🪙', gold:'🥇', fx:'💵', real:'🏠', cash:'💰', etc:'💼', debt:'💳' };

async function fetchFxRate(){
  for(const f of [
    async()=>+(JSON.parse(await getText('https://open.er-api.com/v6/latest/USD', 8000))?.rates?.KRW),
    async()=>+(JSON.parse(await getText('https://api.frankfurter.app/latest?from=USD&to=KRW', 8000))?.rates?.KRW),
    async()=>{ const j = JSON.parse(await getText('https://quotation-api-cdn.dunamu.com/v1/forex/recent?codes=FRX.KRWUSD', 8000));
      return +(Array.isArray(j) ? j[0]?.basePrice : j?.basePrice); },
    async()=>num((await relayJSON('https://m.stock.naver.com/api/marketindex/exchange/FX_USDKRW'))?.closePrice),
  ]){ try{ const v = await f(); if(v > 0) return v; }catch(e){} }
  return NaN;
}
async function fetchCoinPrices(codes){
  if(!codes.length) return {};
  const u = 'https://api.upbit.com/v1/ticker?markets=' + encodeURIComponent(codes.map(c=>'KRW-'+c).join(','));
  let arr;
  try{ arr = JSON.parse(await getText(u, 8000)); }catch(e){ arr = await relayJSON(u); }
  const out = {};
  (arr||[]).forEach(t => { const c = String(t.market||'').replace('KRW-','');
    out[c] = { p: +t.trade_price, prev: +(t.prev_closing_price || t.trade_price), src:'업비트' }; });
  return out;
}
async function fetchGoldPrice(fx){
  const per = x => x * (fx||0) / OZ_G;                     /* 달러/트로이온스 → 원/g */
  try{
    const c = parseYhChart(await relayJSON(YH.chart('GC=F')));
    return { p: per(c.basic.price), prev: per(c.basic.prev), src:'국제 금시세' };
  }catch(e){
    const j = await relayJSON('https://m.stock.naver.com/api/marketindex/metals/CMDT_GC');
    const p = num(j?.closePrice); if(!(p>0)) throw new Error('금 시세 없음');
    return { p: per(p), prev: per(p), src:'네이버 금' };
  }
}
/* 주식이 아닌 자산의 시세를 받아 옵니다 (하루에 한 번 어제 값을 남겨 둡니다) */
async function refreshOther(){
  if(!assetsOn()) return;
  const A = state.assets; if(!A) return;
  const hs = liveHoldings();
  const px2 = A.px2 = A.px2 || {};
  const fx = await fetchFxRate();
  if(fx > 0){ A.fx = fx; px2['fx:USD'] = { p: fx, at: Date.now(), src:'환율' }; }
  const coins = [...new Set(hs.filter(h=>h.cat==='coin').map(h=>String(h.code||h.sym||'').toUpperCase()).filter(Boolean))];
  if(coins.length){ try{ const m = await fetchCoinPrices(coins);
    for(const [c,q] of Object.entries(m)) px2['coin:'+c] = Object.assign({ at: Date.now() }, q); }catch(e){} }
  if(hs.some(h=>h.cat==='gold')){ try{ const g = await fetchGoldPrice(A.fx); px2['gold:GOLD'] = Object.assign({ at: Date.now() }, g); }catch(e){} }
  /* 어제와 견주려고 하루 한 줄씩 남깁니다 */
  const day = today(), hist = A.hist = A.hist || [];
  const row = { date: day, fx: A.fx, gold: px2['gold:GOLD']?.p, coin: Object.fromEntries(Object.entries(px2).filter(([k])=>k.startsWith('coin:')).map(([k,v])=>[k.slice(5), v.p])) };
  if(hist.length && hist[hist.length-1].date === day) hist[hist.length-1] = row; else hist.push(row);
  if(hist.length > 60) hist.splice(0, hist.length-60);
  save();
}
/* 어제(마지막으로 다른 날) 기록 */
const otherPrev = () => { const h = state.assets?.hist || []; return h.length > 1 ? h[h.length-2] : null; };
/* 자산 한 줄의 지금 시세 (우리가 받은 것 → 자산 앱 캐시 → 직접 적은 값) */
function priceOfHolding(h){
  const A = state.assets || {}, px2 = A.px2 || {};
  const code = String(h.code || h.sym || '').toUpperCase();
  if(h.cat === 'coin' && px2['coin:'+code]) return px2['coin:'+code];
  if(h.cat === 'gold' && px2['gold:GOLD']) return px2['gold:GOLD'];
  if(h.cat === 'fx' && px2['fx:USD']) return px2['fx:USD'];
  if(h.mp !== undefined && h.mp !== null && h.mp !== '') return { p:+h.mp, prev:+h.mp, src:'직접 입력' };
  const c = A.px?.[h.cat + ':' + (h.code || h.sym || h.id)];
  if(c && +c.p > 0) return { p: +c.p * (c.ccy === 'USD' ? (A.fx||0) : 1), prev: +(c.prev||c.p) * (c.ccy === 'USD' ? (A.fx||0) : 1), src:'자산 앱' };
  return null;
}
/* 종류별로 묶은 자산 구성 */
function assetMix(){
  if(!assetsOn()) return [];
  const by = {}, prev = otherPrev();
  for(const h of liveHoldings()){
    const cat = h.cat === 'debt' ? 'debt' : h.cat;
    const g = by[cat] = by[cat] || { cat, label: CATS[cat]||cat, emo: CAT_EMO[cat]||'📦', value:0, day:0, n:0, unknown:0, items:[] };
    g.n++;
    if(cat === 'debt'){ g.value -= (+h.loan||0); continue; }
    const v = maValue(h);
    if(!has(v)){ g.unknown++; continue; }
    g.value += v;
    g.items.push({ name: h.name, value: v });
    /* 오늘 변동 — 주식은 아래에서 종목 단위로 한 번만 */
    if(h.cat !== 'kr' && h.cat !== 'us'){
      const px = priceOfHolding(h);
      if(px && has(px.prev) && px.prev>0 && has(px.p)) g.day += (px.p - px.prev) * (+h.qty||0);
    }
  }
  for(const code of Object.keys(krPositions())){
    const p = positionOf(code); if(!p || !has(p.dayKrw)) continue;
    const g = by[p.mk]; if(g) g.day += p.dayKrw;
  }
  const tot = Object.values(by).filter(g=>g.cat!=='debt').reduce((s,g)=>s+g.value, 0);
  return Object.values(by).map(g => Object.assign(g, { pct: tot>0 ? g.value/tot*100 : NaN }))
    .sort((a,b)=> Math.abs(b.value) - Math.abs(a.value));
}
/* 주식이 아닌 자산에서 오늘 눈에 띄게 움직인 것 */
function otherChanges(){
  if(!assetsOn()) return [];
  const out = [], prev = otherPrev(), A = state.assets || {}, px2 = A.px2 || {};
  const add = (impact, level, title, detail) => out.push({ impact, level, title, detail, kind:'asset', code:'' });
  for(const h of liveHoldings()){
    if(h.cat !== 'coin') continue;
    const c = String(h.code||h.sym||'').toUpperCase(), q = px2['coin:'+c];
    if(!q || !(q.prev>0)) continue;
    const d = growth(q.p, q.prev);
    if(has(d) && Math.abs(d) >= 5) add(d>0?'up':'down', Math.abs(d)>=10?'high':'mid', `${esc(h.name||c)} ${pct(d)}`, `${won(q.prev)} → ${won(q.p)} (하루)`);
  }
  const g = px2['gold:GOLD'], gp = prev?.gold;
  if(g && has(gp) && gp>0){ const d = growth(g.p, gp); if(has(d) && Math.abs(d) >= 3) add(d>0?'up':'down','mid', `금 ${pct(d)}`, `1g ${won(gp)} → ${won(g.p)}`); }
  const fxNow = A.fx, fxPrev = prev?.fx;
  if(has(fxNow) && has(fxPrev) && fxPrev>0){ const d = growth(fxNow, fxPrev);
    if(has(d) && Math.abs(d) >= 1.5) add(d>0?'up':'down','mid', `원/달러 ${pct(d)}`, `${fmt(fxPrev)}원 → ${fmt(fxNow)}원 — 미국주식·달러 자산에 영향`); }
  return out;
}

let searchT, searchRes = [], searchQ = '', searchSeq = 0, searchForeign = 0;
function renderSearch(){
  const el = $('#tab-search');
  el.innerHTML = `<div class="card">
    <h2>🔍 종목 검색</h2>
    <div class="row mt"><input id="q" placeholder="종목명 또는 6자리 코드 (예: 삼성전자, 005930)" value="${esc(searchQ)}" autocomplete="off"><button class="btn sm" data-act="search">찾기</button></div>
    <div id="sres" class="list"></div>
    <div id="sforeign"></div>
    <div class="sec-t">자주 찾는 종목</div>
    <div class="chips">${BUILTIN.slice(0,12).map(([c,n])=>`<button class="chip" data-act="pick" data-code="${c}" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>
    <p class="tiny muted mt"><b>지금은 국내 상장 주식·ETF만</b> 됩니다 (네이버증권 데이터). 미국 등 해외주식은 아직 읽지 못해서 검색에서 걸러 냅니다.<br>시세가 안 붙으면 ⚙️에서 <b>구글 스크립트 중계</b>를 만들어 주세요.</p>
  </div>`;
  const q = $('#q');
  q.addEventListener('input', () => { searchQ = q.value; clearTimeout(searchT); searchT = setTimeout(doSearch, 350); });
  q.addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
  drawSearch();
}
async function doSearch(){
  const q = searchQ.trim(); const box = $('#sres'); if(!box) return;
  if(!q){ searchRes = []; drawSearch(); return; }
  searchRes = searchBuiltin(q); drawSearch();            /* 내장 목록은 바로, 네이버 검색 결과는 오면 갈아끼웁니다 */
  if(!searchRes.length) box.innerHTML = `<div class="empty"><span class="spin dark"></span> 찾는 중</div>`;
  const mine = ++searchSeq;
  try{ const r = await searchStocks(q); if(mine===searchSeq && r.length) { searchRes = r; drawSearch(); } else if(mine===searchSeq && !searchRes.length) drawSearch(); }
  catch(e){ if(mine===searchSeq) drawSearch(); }
}
function drawSearch(){
  const box = $('#sres'); if(!box) return;
  if(!searchQ.trim()){ box.innerHTML = ''; return; }
  if(!searchRes.length){ box.innerHTML = `<div class="empty">찾은 종목이 없어요.<br><span class="tiny">${searchForeign?'해외 종목만 나왔습니다 — 이 앱은 아직 <b>국내 주식·ETF</b>만 읽습니다.':'6자리 코드를 직접 넣어도 됩니다'}</span></div>`; return; }
  const fb = $('#sforeign');
  if(fb) fb.innerHTML = searchForeign ? `<p class="tiny muted mt">해외 종목 ${searchForeign}개는 뺐습니다 — 이 앱은 아직 국내 주식·ETF만 읽습니다.</p>` : '';
  box.innerHTML = searchRes.map(r => `<button class="item" data-act="pick" data-code="${r.code}" data-name="${esc(r.name)}" data-mk="${r.mk||'kr'}" data-sym="${esc(r.sym||'')}">
    <div class="grow"><div class="nm">${esc(r.name)} ${r.mk==='us'?'<span class="pill brand">🇺🇸</span>':''}</div><div class="cd">${esc(r.code)} ${esc(r.market||'')}</div></div>
    <div class="pill ${W(r.code)?'flat':'brand'}">${W(r.code)?'담김':'＋ 담기'}</div></button>`).join('');
}
async function addWatch(code, name, mk, sym){
  if(!W(code)){ state.watch.push({ code, name: name||code, mk: mk||'kr', sym: sym||'', addedAt: Date.now() }); save(); }
  state.ui.code = code;
  showTab('stock');
  await refreshStock(code);
  if(W(code) && state.data[code]?.basic.name && W(code).name === code){ W(code).name = state.data[code].basic.name; save(); }
  render();
}

/* ---------- 데이터 새로고침 ---------- */
async function refreshStock(code, opts={}){
  busy['r'+code] = true; if(!opts.quiet) render();
  try{
    const w = W(code);
    const d = state.ui.demo ? demoStock(code)
      : (w?.mk === 'us' ? await fetchStockUs(code, w.sym) : await fetchStock(code));
    if(!d.basic.name && W(code)) d.basic.name = W(code).name;
    state.data[code] = d;
    if(w && d.sym && !w.sym){ w.sym = d.sym; }
    const sc = computeScore(d), sn = scenarios(d, state.ui.adj?.[code]);
    const snap = makeSnap(d, sc, sn);
    const arr = state.snaps[code] = state.snaps[code] || [];
    if(arr.length && arr[arr.length-1].date === snap.date) arr[arr.length-1] = snap; else arr.push(snap);
    if(arr.length > 90) arr.splice(0, arr.length-90);
    if(!state.seenNews[code]){ state.seenNews[code] = {}; d.news.forEach(n => state.seenNews[code][n.id] = 1); }   /* 처음 담을 때 있던 뉴스는 '이미 본 것'으로. 그 뒤 새로 뜨는 기사만 변화로 칩니다 */
    save();
    if(d.errs.length && !opts.quiet) toast('일부 데이터를 못 가져왔어요: ' + d.errs[0]);
  }catch(e){ if(!opts.quiet) toast(e.message); state.ui.lastErr = e.message; }
  busy['r'+code] = false; if(!opts.quiet) render();
}
async function refreshAll(){
  if(busy.refreshAll) return;
  busy.refreshAll = true; resetRelays(); render();
  await loadAssets({quiet:true});
  const added = await autoImport();
  for(const w of state.watch){ await refreshStock(w.code, {quiet:true}); }
  await refreshOther();
  if(added.length) toast(`자산 앱에서 ${added.length}개를 새로 담았어요`);
  busy.refreshAll = false; save(); render();
  toast(state.ui.demo ? '샘플 데이터를 다시 만들었어요' : '새로고침 완료');
}
function markSeen(code){
  const d = state.data[code]; if(!d) return;
  const s = state.seenNews[code] = state.seenNews[code] || {};
  d.news.forEach(n => s[n.id] = 1);
}

function thesisCard(t, compact=false){
  const d = state.data[t.code];
  const fresh = (d?.news||[]).filter(n=>!state.seenNews[t.code]?.[n.id]);
  const chk = thesisCheck(t, detectChangesFor(t.code), d?.news||[]);           /* 표시용: 지금 있는 뉴스 전부와 맞춰 봅니다 */
  const need = thesisCheck(t, detectChangesFor(t.code), fresh).needsReview;   /* 경고용: 새로 뜬 뉴스·변화만 */
  const hist = t.history||[];
  const col = t.confidence>=70?'var(--green)':t.confidence>=45?'var(--gold)':'var(--up)';
  return `<div class="${compact?'mt':'card'}" data-thesis="${t.id}">
    <div class="row"><div class="grow"><div class="b" style="font-size:15px">${esc(t.title)}</div><div class="tiny muted">${esc(W(t.code)?.name||t.code)} · ${iso(t.createdAt)} 작성${t.horizon?' · '+esc(t.horizon):''}</div></div>
      ${need?'<span class="pill up">점검 필요</span>':''}</div>
    ${t.text?`<p class="desc" style="margin-top:6px">"${esc(t.text)}"</p>`:''}
    <div class="conf"><span class="tiny muted">확신도</span><div class="bar"><i style="width:${t.confidence}%;background:${col}"></i></div><span class="n num">${t.confidence}%</span></div>
    ${hist.length>1?`<div class="tiny muted">${hist.slice(-4).map(h=>h.conf).join(' → ')}${hist.length>1?' · '+esc(hist[hist.length-1].reason||''):''}</div>`:''}
    <div class="sec-t">핵심 가정</div>
    ${(t.assumptions||[]).map((a,i)=>{ const h = chk.hits.find(x=>x.kind==='assumption'&&x.i===i); return `<div class="assump"><span class="k">✓</span><div class="grow">${esc(a.text)}${h?`<div class="kw">📰 관련 뉴스 ${h.n}건: ${esc(h.titles[0])}</div>`:(a.keywords?.length?`<div class="kw">키워드: ${esc(a.keywords.join(', '))}</div>`:'')}</div></div>`; }).join('')}
    <div class="sec-t">깨뜨릴 수 있는 것</div>
    ${(t.risks||[]).map((a,i)=>{ const h = chk.hits.find(x=>x.kind==='risk'&&x.i===i); return `<div class="assump"><span class="k">⚠</span><div class="grow">${esc(a.text)}${h?`<div class="kw up">📰 관련 뉴스 ${h.n}건: ${esc(h.titles[0])}</div>`:(a.keywords?.length?`<div class="kw">키워드: ${esc(a.keywords.join(', '))}</div>`:'')}</div></div>`; }).join('')}
    ${t.lastCheck?`<div class="msg ai mt" style="max-width:100%"><b>${esc(t.lastCheck.verdict||'')}</b> ${esc(t.lastCheck.summary||'')}${(t.lastCheck.affected||[]).length?'\n'+t.lastCheck.affected.map(a=>(a.direction==='weaken'?'↓ ':a.direction==='support'?'↑ ':'· ')+a.item+' — '+a.evidence).join('\n'):''}<div class="src">${t.lastCheck.date} AI 점검</div></div>`:''}
