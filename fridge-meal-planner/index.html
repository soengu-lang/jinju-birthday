<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f4a34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="냉장고 식단표">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>우리집 냉장고 식단표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f0e7; --card:#fffdf6; --ink:#1d2a20; --muted:#6d7c6f;
  --green:#2f4a34; --green-d:#24382a; --lime:#e7efdf; --lime-d:#cfdec3;
  --orange:#ef7620; --orange-s:#fdf0e2; --red:#cf4b3c; --blue:#3f6fa8;
  --line:#e3e0d2; --shadow:0 1px 2px rgba(30,45,32,.06), 0 8px 22px rgba(30,45,32,.06);
  --r:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5;
  padding-bottom:calc(40px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;
}
input:focus,select,textarea:focus{outline:2px solid var(--lime-d);outline-offset:1px}
textarea{resize:vertical;min-height:80px}
.wrap{max-width:920px;margin:0 auto;padding:0 14px}
.hidden{display:none !important}

/* ---------- header ---------- */
header{background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.head-in{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:14px 0 12px}
.brand{font-size:12px;font-weight:700;color:var(--orange);letter-spacing:.02em}
h1{font-size:clamp(17px,4.6vw,22px);font-weight:900;letter-spacing:-.03em;margin-top:2px;white-space:nowrap}
.head-meta{text-align:right;font-size:clamp(9.5px,2.6vw,11.5px);color:var(--muted);white-space:nowrap}
.head-meta b{color:var(--green);font-weight:700}
.gear{font-size:18px;padding:4px 6px;border-radius:8px}
.gear:hover{background:var(--lime)}

/* ---------- tabs ---------- */
nav.tabs{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 0 8px;
  box-shadow:0 6px 14px -12px rgba(0,0,0,.4)}
.tabbar{display:flex;gap:4px;background:var(--lime);border-radius:14px;padding:4px}
.tabbar button{flex:1;padding:9px 4px;border-radius:11px;font-size:12.5px;font-weight:700;color:var(--green-d);
  white-space:nowrap;transition:.15s}
.tabbar button.on{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(47,74,52,.3)}

/* ---------- generic ---------- */
main{padding-top:6px}
section.pane{padding-bottom:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px}
.stack>*+*{margin-top:12px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 2px 8px}
.sec-title h2{font-size:15px;font-weight:900}
.sec-title p{font-size:11.5px;color:var(--muted);font-weight:400}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{background:var(--green);color:#fff;border-radius:11px;padding:10px 14px;font-size:13px;font-weight:700;
  display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:.15s}
.btn:hover{background:var(--green-d)}
.btn.orange{background:var(--orange)}.btn.orange:hover{background:#dc650f}
.btn.ghost{background:#fff;color:var(--green);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--lime)}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:9px}
.btn.block{width:100%}
.chip{background:var(--lime);color:var(--green-d);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700}
.chip.on{background:var(--green);color:#fff}
.chip.line{background:#fff;border:1px solid var(--line)}
.tag{background:var(--lime);color:var(--green-d);border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:700}
.tag.warn{background:#fdeceb;color:var(--red)}
.tag.soon{background:var(--orange-s);color:#c25c0c}
.tag.ok{background:#e6f0e4;color:#3f6b45}
.muted{color:var(--muted)}
.tiny{font-size:11px}
.empty{text-align:center;color:var(--muted);font-size:12.5px;padding:26px 10px;line-height:1.7}
.banner{background:var(--green);color:#fff;border-radius:var(--r);padding:14px 16px}
.banner .b1{font-size:11.5px;opacity:.8;font-weight:700}
.banner .b2{font-size:17px;font-weight:900;margin-top:3px}
.banner .b3{font-size:12px;opacity:.85;margin-top:5px}
.banner b{color:#ffd9a8}

/* ---------- fridge ---------- */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi .n{font-size:19px;font-weight:900}
.kpi .l{font-size:11px;color:var(--muted);margin-top:1px}
.kpi .n.red{color:var(--red)}.kpi .n.orange{color:var(--orange)}
.add-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:7px}
.add-grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:7px;margin-top:7px}
.grp-title{font-size:12px;font-weight:800;color:var(--muted);margin:14px 2px 6px}
.item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .nm{font-size:13.5px;font-weight:700}
.item .sub{font-size:11px;color:var(--muted);margin-top:1px}
.qbtn{width:28px;height:28px;border-radius:8px;background:var(--lime);font-weight:900;color:var(--green-d);
  display:grid;place-items:center;flex:none}
.qbtn:hover{background:var(--lime-d)}
.del{color:#b9b6a6;font-size:15px;padding:2px 4px;flex:none}
.del:hover{color:var(--red)}
.qty{font-size:12.5px;font-weight:800;min-width:56px;text-align:right}

/* ---------- week ---------- */
.wknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.wknav .t{font-size:14px;font-weight:900}
.arrow{width:32px;height:32px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;font-size:14px;flex:none}
.tray{display:grid;grid-template-columns:repeat(7,minmax(132px,1fr));gap:8px;overflow-x:auto;
  padding:2px 2px 8px;scroll-snap-type:x proximity}
.tray::-webkit-scrollbar{height:6px}.tray::-webkit-scrollbar-thumb{background:var(--lime-d);border-radius:3px}
.day{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px;scroll-snap-align:start;
  display:flex;flex-direction:column;gap:5px;min-height:132px}
.day.today{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-s)}
.day .dh{display:flex;justify-content:space-between;align-items:center}
.day .dw{font-size:11.5px;font-weight:800;color:var(--muted)}
.day.today .dw{color:var(--orange)}
.day .em{font-size:19px;line-height:1}
.day .mn{font-size:12.5px;font-weight:800;letter-spacing:-.02em}
.day .kc{font-size:10.5px;color:var(--muted)}
.day select{padding:5px 6px;font-size:11px;border-radius:8px;margin-top:auto}
.today-card{display:flex;align-items:center;gap:11px;padding:13px 14px}
.today-card .em{font-size:26px}
.prep-line{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.prep-line:last-child{border-bottom:none}
.num{width:22px;height:22px;border-radius:7px;background:var(--lime);color:var(--green-d);font-size:11px;
  font-weight:900;display:grid;place-items:center;flex:none}

/* ---------- menu board ---------- */
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column}
.mcard .thumb{height:104px;background:var(--lime);display:grid;place-items:center;font-size:34px;position:relative}
.mcard .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mcard .fav{position:absolute;top:7px;right:7px;background:rgba(255,255,255,.92);border-radius:999px;
  width:27px;height:27px;display:grid;place-items:center;font-size:13px}
.mcard .cnt{position:absolute;top:7px;left:7px;background:rgba(47,74,52,.9);color:#fff;font-size:10px;
  font-weight:700;border-radius:999px;padding:3px 8px}
.mcard .body{padding:11px;display:flex;flex-direction:column;gap:6px;flex:1}
.mcard h3{font-size:13.5px;font-weight:800;letter-spacing:-.02em}
.mcard .meta{font-size:11px;color:var(--muted)}
.links{display:flex;gap:5px}
.ilink{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:13px;
  background:var(--lime);flex:none}
.ilink.yt{background:#fdecec}.ilink.ig{background:#fdeef6}

/* ---------- shopping ---------- */
.shop-line{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
.shop-line:last-child{border-bottom:none}
.shop-line.done .nm{text-decoration:line-through;color:var(--muted)}
.cb{width:21px;height:21px;border-radius:6px;border:2px solid var(--lime-d);flex:none;display:grid;place-items:center;
  font-size:12px;color:#fff;background:#fff}
.cb.on{background:var(--green);border-color:var(--green)}

/* ---------- money ---------- */
.big-won{font-size:30px;font-weight:900;letter-spacing:-.03em}
.bar{height:9px;border-radius:99px;background:var(--lime);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--green)}
.bar>i.over{background:var(--red)}
.catrow{display:flex;align-items:center;gap:9px;margin-top:9px}
.catrow .cl{font-size:11.5px;font-weight:700;width:74px;flex:none;white-space:nowrap}
.catrow .cv{font-size:12px;font-weight:800;width:78px;text-align:right;flex:none}
.wkbars{display:flex;align-items:flex-end;gap:7px;height:82px;margin-top:6px}
.wkbars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.wkbars .bb{width:100%;background:var(--lime-d);border-radius:6px 6px 0 0;min-height:3px}
.wkbars .bb.max{background:var(--green)}
.exp-line{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.exp-line:last-child{border-bottom:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(24,34,26,.55);backdrop-filter:blur(2px);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.mask{align-items:center;padding:20px}}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;max-height:92vh;
  overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@media(min-width:640px){.modal{border-radius:20px;max-height:88vh}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.mhead h3{font-size:18px;font-weight:900;letter-spacing:-.02em}
.x{font-size:19px;color:var(--muted);padding:2px 6px;line-height:1}
.field{margin-top:10px}
.field label{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;align-items:center;margin-top:6px}
.ing-box{background:#fbfaf3;border:1px solid var(--line);border-radius:12px;padding:11px}
.ing-line{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0}
.ing-line b{font-weight:800}
.step{background:var(--green);color:#fff;border-radius:14px;padding:14px}
.step .sn{font-size:10.5px;opacity:.75;font-weight:800;letter-spacing:.06em}
.step .st{font-size:15px;font-weight:900;margin:5px 0 6px}
.step .sb{font-size:12.5px;opacity:.92;line-height:1.65;min-height:52px}
.dots{display:flex;gap:5px;justify-content:center;margin-top:11px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots i.on{background:var(--orange);width:16px;border-radius:99px}
.swap{background:var(--orange-s);border-radius:10px;padding:9px 11px;font-size:11.5px;font-weight:700;color:#a8541a}
.swap b{color:var(--orange)}
.linkbtn{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;width:100%;margin-top:8px;text-decoration:none;color:inherit}
.linkbtn .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;flex:none}
.linkbtn .t1{font-size:12.5px;font-weight:800}
.linkbtn .t2{font-size:10.5px;color:var(--muted)}
.drop{border:2px dashed var(--lime-d);border-radius:14px;padding:20px 12px;text-align:center;background:#fbfaf3}
.drop.over{border-color:var(--orange);background:var(--orange-s)}
.drop .di{font-size:26px}
.drop .dt{font-size:12.5px;font-weight:700;margin-top:6px}
.drop .ds{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.6}
.preview{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.preview img{width:100%;display:block;max-height:260px;object-fit:contain;background:#f4f2ea}
.preview .rm{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;
  width:26px;height:26px;display:grid;place-items:center;font-size:13px}
.prog{height:5px;border-radius:99px;background:var(--lime);overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:var(--orange);transition:width .2s}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));
  background:var(--green-d);color:#fff;padding:11px 18px;border-radius:999px;font-size:12.5px;font-weight:700;
  z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;
  box-shadow:0 8px 20px rgba(239,118,32,.4)}
</style>
</head>
<body>

<header>
  <div class="wrap head-in">
    <div>
      <div class="brand">우리집 저당 식탁</div>
      <h1>냉장고 다이어트 식단표</h1>
    </div>
    <div class="row" style="gap:4px">
      <div class="head-meta" id="headMeta"></div>
      <button class="gear" data-act="settings" title="설정">⚙️</button>
    </div>
  </div>
</header>

<nav class="tabs">
  <div class="wrap">
    <div class="tabbar" id="tabbar">
      <button data-tab="fridge">🧊 냉장고</button>
      <button data-tab="week">🍱 이번 주</button>
      <button data-tab="menu">📖 메뉴판</button>
      <button data-tab="shop">🛒 장보기</button>
      <button data-tab="money">💳 식비</button>
    </div>
  </div>
</nav>

<main class="wrap"><div id="view"></div></main>

<button class="btn orange fab hidden" id="fab">＋ 레시피</button>
<div id="modalRoot"></div>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   0. 기본 상수 / 유틸
   ============================================================ */
const KEY = 'fridgeMealPlanner.v1';
const WEEKDAYS = ['월','화','수','목','금','토','일'];
const CATS = ['단백질','채소','유제품·계란','면·곡물','소스·양념','기타'];
const UNITS = ['g','kg','ml','L','개','대','모','장','줌','컵','큰술','작은술','봉','팩','마리'];
const EXP_TYPES = {
  grocery:{label:'장보기', color:'#2f4a34', emoji:'🛒'},
  dining :{label:'외식',   color:'#ef7620', emoji:'🍽️'},
  delivery:{label:'배달',  color:'#cf4b3c', emoji:'🛵'},
  cafe   :{label:'카페·간식',color:'#3f6fa8', emoji:'☕'}
};
/* 재료명 → 분류 추정 사전 */
const CAT_HINTS = [
  [/소고기|우둔|안심|등심|돼지|삼겹|목살|닭|가슴살|다리살|새우|연어|참치|오징어|계란|달걀|두부(?!면)|콩(?!나물)|햄|어묵|훈제/, '단백질'],
  [/우유|치즈|요거트|버터|두유|생크림/, '유제품·계란'],
  [/간장|고추장|고춧가루|된장|쌈장|소스|다진마늘|간마늘|알룰로스|올리고당|설탕|참기름|들기름|올리브유|식용유|소금|후추|허브|케첩|마요|식초|굴소스|스리라차|스테비아|다시다|육수|드레싱/, '소스·양념'],
  [/파프리카|시금치|양배추|대파|쪽파|양파|마늘|버섯|애호박|당근|브로콜리|토마토|오이|상추|깻잎|고추|무|배추|야채|채소|숙주|콩나물|가지|감자|고구마|레몬/, '채소'],
  [/곤약|면|밥|쌀|오트밀|파스타|스파게티|빵|또띠아|현미|귀리|떡/, '면·곡물']
];
/* 재료명 → 이모지 */
const EMOJI_HINTS = [
  [/새우/,'🍤'],[/연어|생선|고등어|참치/,'🐟'],[/소고기|스테이크/,'🥩'],[/돼지|제육|삼겹/,'🐖'],
  [/닭|치킨/,'🍗'],[/계란|달걀/,'🍳'],[/파스타|면|잡채/,'🍝'],[/밥|덮밥|볶음밥/,'🍚'],
  [/죽|스프|수프/,'🥣'],[/샐러드/,'🥗'],[/두부/,'🍲'],[/도시락/,'🍱']
];
/* 분류별 기본 소비기한(일) */
const SHELF = {'단백질':3,'채소':6,'유제품·계란':14,'면·곡물':60,'소스·양념':180,'기타':30};

const $ = s => document.querySelector(s);
const el = (h) => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstElementChild; };
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const won = n => (Math.round(n)||0).toLocaleString('ko-KR')+'원';
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO = s => { const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const startOfWeek = d => { const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const dayDiff = (a,b) => Math.round((parseISO(a)-parseISO(b))/86400000);
const nice = n => { const r=Math.round(n*10)/10; return (r%1===0? r : r.toFixed(1)); };
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2200); }
function guessCat(name){ for(const [re,c] of CAT_HINTS) if(re.test(name)) return c; return '기타'; }
function guessEmoji(name){ for(const [re,e] of EMOJI_HINTS) if(re.test(name)) return e; return '🍽️'; }
/* 같은 재료로 볼지 판단 (공백/괄호 제거 후 포함관계) */
const normName = s => String(s||'').replace(/\s|\(.*?\)/g,'').toLowerCase();
function sameItem(a,b){ const x=normName(a), y=normName(b); return x===y || (x.length>1&&y.length>1&&(x.includes(y)||y.includes(x))); }
/* 단위 정규화: kg→g, L→ml */
function normUnit(qty,unit){
  if(unit==='kg') return [qty*1000,'g'];
  if(unit==='L') return [qty*1000,'ml'];
  if(unit==='작은술') return [qty/3,'큰술'];   // 1큰술 = 3작은술 (같은 재료가 두 줄로 갈라지지 않게)
  return [qty,unit];
}
function stepOf(unit){ return unit==='g'?50 : unit==='ml'?100 : unit==='큰술'||unit==='작은술'?1 : 1; }
function roundBuy(q,unit){
  if(unit==='g'||unit==='ml') return Math.ceil(q/10)*10;
  if(unit==='큰술'||unit==='작은술'||unit==='컵') return Math.ceil(q*2)/2;
  return Math.ceil(q);
}

/* ============================================================
   2. 계산 로직 (재고 · 식단 · 장보기)
   ============================================================ */
function weekDates(offset=ui.weekOffset){
  const s = addDays(startOfWeek(today()), offset*7);
  return Array.from({length:7},(_,i)=>iso(addDays(s,i)));
}
const recipeById = id => state.recipes.find(r=>r.id===id);
const planOf = d => state.plan[d] || null;

/* 냉장고 재고를 {name, qty, unit, expDate} 배열로 (단위 정규화) */
function stockList(){
  return state.fridge.map(f=>{ const [q,u]=normUnit(f.qty,f.unit); return {name:f.name,qty:q,unit:u,expDate:f.expDate}; });
}
function findStock(list, name, unit){
  return list.find(s=>sameItem(s.name,name) && s.unit===unit);
}
/* 레시피 1개가 지금 재고로 얼마나 커버되는지 (0~1) + 부족 재료 수 */
function coverage(recipe, list, servings){
  const f = servings/(recipe.servings||2);
  let total=0, have=0, missing=0, urgent=0;
  for(const ing of recipe.ingredients){
    const [need,u] = normUnit(ing.qty*f, ing.unit);
    const s = findStock(list, ing.name, u);
    const w = 1;
    total += w;
    if(s && s.qty>0){
      const ratio = Math.min(1, s.qty/need);
      have += w*ratio;
      if(ratio < 0.999) missing++;
      const dd = dayDiff(s.expDate, iso(today()));
      if(dd<=2) urgent++;
    } else missing++;
  }
  return { ratio: total? have/total : 0, missing, urgent };
}
/* 재고에서 차감(가상) */
function consume(list, recipe, servings){
  const f = servings/(recipe.servings||2);
  for(const ing of recipe.ingredients){
    const [need,u] = normUnit(ing.qty*f, ing.unit);
    const s = findStock(list, ing.name, u);
    if(s) s.qty = Math.max(0, s.qty-need);
  }
}
/* 냉장고 우선 + 로테이션 자동 식단 */
function autoPlan(dates, overwrite){
  if(!state.recipes.length){ toast('메뉴판에 레시피를 먼저 추가해 주세요.'); return; }
  const list = stockList();
  const people = state.settings.people||2;
  const used = {}; let prev = null;
  for(const d of dates){
    if(!overwrite && planOf(d)) { const p=planOf(d); prev=p.recipeId; used[p.recipeId]=(used[p.recipeId]||0)+1; continue; }
    const scored = state.recipes.map(r=>{
      const c = coverage(r, list, people);
      let s = c.ratio*2.4 + c.urgent*0.45 - (used[r.id]||0)*0.9 + (r.fav?0.25:0) + Math.random()*0.18;
      if(r.id===prev) s -= 1.2;
      return {r, s};
    }).sort((a,b)=>b.s-a.s);
    const pick = scored[0].r;
    state.plan[d] = { recipeId: pick.id, servings: people };
    consume(list, pick, people);
    used[pick.id]=(used[pick.id]||0)+1; prev=pick.id;
  }
  save();
}
/* 단순 순환(로테이션) */
function rotate(dates){
  if(!state.recipes.length) return;
  const pool = state.recipes.filter(r=>r.fav).length>=3 ? state.recipes.filter(r=>r.fav) : state.recipes;
  const start = Math.floor(Math.random()*pool.length);
  dates.forEach((d,i)=>{ state.plan[d] = {recipeId: pool[(start+i)%pool.length].id, servings: state.settings.people||2}; });
  save();
}
/* 이번 주 필요량 - 재고 = 장보기 목록 */
function shoppingNeeds(dates){
  const need = {};   // key: name|unit
  for(const d of dates){
    const p = planOf(d); if(!p) continue;
    const r = recipeById(p.recipeId); if(!r) continue;
    const f = (p.servings||2)/(r.servings||2);
    for(const ing of r.ingredients){
      const [q,u] = normUnit(ing.qty*f, ing.unit);
      const k = normName(ing.name)+'|'+u;
      if(!need[k]) need[k] = {name:ing.name, unit:u, need:0, cat:guessCat(ing.name)};
      need[k].need += q;
    }
  }
  const list = stockList();
  return Object.values(need).map(n=>{
    const s = findStock(list, n.name, n.unit);
    const have = s? s.qty : 0;
    return {...n, have, short: Math.max(0, n.need-have)};
  }).sort((a,b)=> CATS.indexOf(a.cat)-CATS.indexOf(b.cat) || b.short-a.short);
}
/* 이번 주 평균 kcal/단백질 */
function weekAvg(dates){
  const rs = dates.map(d=>planOf(d)).filter(Boolean).map(p=>recipeById(p.recipeId)).filter(Boolean);
  if(!rs.length) return null;
  return { kcal: Math.round(rs.reduce((a,r)=>a+(+r.kcal||0),0)/rs.length),
           protein: Math.round(rs.reduce((a,r)=>a+(+r.protein||0),0)/rs.length), n: rs.length };
}

/* ============================================================
   3. 캡처 / 캡션 자동 인식 파서
   ============================================================ */
const UNIT_RE = '(?:kg|g|ml|mL|L|개|장|줌|컵|큰술|작은술|대|봉|팩|모|마리|쪽)';
function parseRecipeText(raw){
  const text = String(raw||'').replace(/\r/g,'');
  const lines = text.split('\n').map(s=>s.trim()).filter(Boolean);
  const out = { name:'', kcal:'', protein:'', minutes:'', servings:2, tags:[], ingredients:[], steps:[], youtube:'', instagram:'' };

  const yt = text.match(/https?:\/\/[^\s"']*(?:youtube\.com|youtu\.be)[^\s"']*/i);
  const ig = text.match(/https?:\/\/[^\s"']*instagram\.com[^\s"']*/i);
  if(yt) out.youtube = yt[0];
  if(ig) out.instagram = ig[0];

  const mk = text.match(/(\d{2,4})\s*(?:kcal|킬로칼로리|칼로리)/i);      if(mk) out.kcal = +mk[1];
  const mp = text.match(/단백질\s*[:·]?\s*(\d+(?:\.\d+)?)\s*g/);          if(mp) out.protein = Math.round(+mp[1]);
  const mt = text.match(/(?:^|[^\d])(\d{1,3})\s*분(?![야])/);              if(mt) out.minutes = +mt[1];
  // 인분: "재료 (4인분 환산)"이 최우선. "1인분 기준 360kcal"의 1인분은 영양성분 기준이라 제외
  const ms = text.match(/재료\s*\(?\s*(\d+)\s*인분/) || text.match(/(\d+)\s*인분(?!\s*기준)/);
  if(ms) out.servings = +ms[1];

  // 제목: 칼로리·시간이 적힌 줄이 곧 메뉴 제목 아래라는 점을 이용
  const bad = /^(재료|만드는|조리|레시피|순서|step|요리|이번|오늘|밀프렙|장보기|인분|https?:)|식단표|메뉴판|식탁|다이어트\s*식단/i;
  const clean = l => l.replace(/^[^\wㄱ-힣]+/,'').replace(/\s*레시피$/,'').trim();
  const okTitle = c => c && !bad.test(c) && !/^\d/.test(c) && c.length>=2 && c.length<=28;
  const metricRe = /\d+\s*(?:kcal|칼로리)|단백질\s*\d|\d+\s*분(?![야])/i;
  const mi = lines.findIndex(l=>metricRe.test(l));
  if(mi>=0){
    const self = clean(lines[mi].replace(/\d+\s*(?:kcal|칼로리)|단백질\s*[\d.]+\s*g|\d+\s*분|\d+인분\s*기준|[·|]/gi,''));
    if(okTitle(self)) out.name = self;
    else for(let i=mi-1;i>=0;i--){ const c=clean(lines[i]); if(okTitle(c)){ out.name=c; break; } }
  }
  if(!out.name) for(const l of lines){ const c=clean(l); if(okTitle(c)){ out.name=c; break; } }
  // 이모지 그대로 쓰기
  const em = text.match(/[\u{1F300}-\u{1FAFF}]/u);
  out.emoji = em? em[0] : guessEmoji(out.name);

  // 재료 구간
  const startI = lines.findIndex(l=>/^재료/.test(l));
  const stopRe = /^(만드는\s*법|조리\s*(순서|법|방법)|요리\s*모드|레시피\s*(순서|방법)|순서|step|과정|tip)/i;
  let ingLines = [];
  if(startI>=0){
    for(let i=startI; i<lines.length; i++){
      if(i>startI && stopRe.test(lines[i])) break;
      ingLines.push(lines[i].replace(/^재료[^\n]*?\)?\s*/,''));
    }
  } else {
    ingLines = lines.filter(l=> new RegExp('\\d+(?:[./]\\d+)?\\s*'+UNIT_RE+'\\b').test(l));
  }
  // 한 줄에 2열(캡처 OCR)로 붙어 나와도 모두 잡아낸다
  const re = new RegExp('([가-힣A-Za-z][가-힣A-Za-z0-9 ·\\-()]*?)\\s*(\\d+(?:[./]\\d+)?)\\s*('+UNIT_RE+')(?![가-힣])','g');
  for(const line of ingLines){
    let m; re.lastIndex = 0;
    while((m = re.exec(line))){
      let nm = m[1].replace(/^[^가-힣A-Za-z]+/,'').trim();
      nm = nm.replace(/^(재료|기준|약)\s*/,'').trim();
      if(!nm || nm.length>14) continue;
      let q = m[2];
      q = q.includes('/') ? (parseInt(q.split('/')[0])/parseInt(q.split('/')[1])) : parseFloat(q);
      if(!isFinite(q)||q<=0) continue;
      let u = m[3]==='mL' ? 'ml' : m[3];
      if(out.ingredients.some(x=>sameItem(x.name,nm)&&x.unit===u)) continue;
      out.ingredients.push({name:nm, qty:q, unit:u});
    }
  }
  // 조리 단계
  const stopI = lines.findIndex(l=>stopRe.test(l));
  if(stopI>=0){
    for(let i=stopI+1;i<lines.length;i++){
      const s = lines[i].replace(/^step\s*\d+\s*\/?\s*\d*\s*/i,'').replace(/^\d+[).\s]\s*/,'').trim();
      if(!s || /^(다음|이전)\s*단계/.test(s) || s.length<4) continue;
      out.steps.push(s);
    }
  }
  // 태그 후보
  ['저탄수','고단백','밀프렙','다이어트','저당','한식','양식','아침','15분완성']
    .forEach(t=>{ if(text.includes(t)) out.tags.push(t); });
  return out;
}

/* 이미지 축소 (localStorage 용량 절약) */
function shrinkImage(file, max=760, q=0.62){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = () => { const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max/Math.max(img.width,img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
/* OCR (필요할 때만 내려받음) */
function loadScript(src){
  return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
}
async function runOCR(dataUrl, onProgress){
  if(!window.Tesseract){
    await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  }
  const { data } = await window.Tesseract.recognize(dataUrl, 'kor+eng', {
    logger: m => { if(m.status==='recognizing text') onProgress(m.progress); }
  });
  return data.text || '';
}

function viewMoney(){

  const inMonth = e => { const d=parseISO(e.date); return d.getFullYear()===y && d.getMonth()===m; };
  const rows = state.expenses.filter(inMonth).sort((a,b)=>b.date.localeCompare(a.date));
  const total = rows.reduce((a,e)=>a+(+e.amount||0),0);

  const prev = new Date(y,m-1,1);
  const prevTotal = state.expenses.filter(e=>{ const d=parseISO(e.date);
    return d.getFullYear()===prev.getFullYear() && d.getMonth()===prev.getMonth(); })
    .reduce((a,e)=>a+(+e.amount||0),0);
  const diff = total - prevTotal;

  const budget = +state.settings.budget||0;
  const pct = budget? Math.min(100, total/budget*100) : 0;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const isThisMonth = ui.monthOffset===0;
  const dayN = isThisMonth? new Date().getDate() : daysInMonth;
  const pace = dayN? Math.round(total/dayN*daysInMonth) : 0;

  const byCat = Object.keys(EXP_TYPES).map(k=>({k, sum: rows.filter(e=>e.type===k).reduce((a,e)=>a+(+e.amount||0),0)}))
                 .sort((a,b)=>b.sum-a.sum);
  const maxCat = Math.max(1, ...byCat.map(c=>c.sum));

  // 주차별
  const weeks = [0,0,0,0,0];
  rows.forEach(e=>{ const d=parseISO(e.date).getDate(); weeks[Math.min(4,Math.floor((d-1)/7))] += (+e.amount||0); });
  const maxW = Math.max(1,...weeks);

let cookStep = 0, cookServings = 2;
function openRecipe(id){
  const r = recipeById(id); if(!r) return;
  cookStep = 0; cookServings = state.settings.people||2;
  drawRecipe(r);
}
function drawRecipe(r){
  const f = cookServings/(r.servings||2);
  const steps = (r.steps||[]).map(s=>{
    const i = s.indexOf('|'); return i>0? {t:s.slice(0,i), b:s.slice(i+1)} : {t:'', b:s};
  });
  const st = steps[cookStep];
  const ytLink = r.youtube || `https://www.youtube.com/results?search_query=${encodeURIComponent(r.name+' 레시피')}`;
  const igLink = r.instagram;
  const list = stockList();
  openModal(`<div class="modal">
    <div class="mhead">
      <div>
        <div style="font-size:22px">${r.emoji||'🍽️'}</div>
        <h3>${esc(r.name)}</h3>
        <div class="tiny muted">1인분 기준 ${r.kcal||'-'}kcal · 단백질 ${r.protein||'-'}g · ⏱ ${r.minutes||'-'}분</div>
      </div>
      <button class="x" data-act="close">✕</button>
    </div>

    <div class="row wrap">
      <span class="tiny" style="font-weight:800">인분</span>
      <button class="qbtn" data-act="serv" data-d="-1">−</button>
      <b style="min-width:22px;text-align:center">${cookServings}</b>
      <button class="qbtn" data-act="serv" data-d="1">＋</button>
      <button class="chip ${cookServings===(state.settings.people||2)?'on':'line'}" data-act="servSet" data-v="${state.settings.people||2}">오늘 저녁 ${state.settings.people||2}인</button>
      <button class="chip line" data-act="servSet" data-v="${(state.settings.people||2)*5}">밀프렙 5일치</button>
    </div>

    ${r.image? `<div class="preview" style="margin-top:11px"><img src="${r.image}" alt=""></div>`:''}

    <div class="swap" style="margin-top:11px">🧂 설탕·물엿 → <b>알룰로스</b>, 진간장 → <b>저염간장</b>으로 바꾸면 같은 맛에 당이 확 줄어요</div>

    <a class="linkbtn" href="${esc(ytLink)}" target="_blank" rel="noopener">
      <span class="ic" style="background:#fdecec">▶</span>
      <span class="grow"><span class="t1">레시피 영상 보기</span><br><span class="t2">${r.youtube? '저장된 유튜브 링크':'유튜브에서 '+esc(r.name)+' 검색'}</span></span>
      <span class="muted">↗</span>
    </a>
    ${igLink? `<a class="linkbtn" href="${esc(igLink)}" target="_blank" rel="noopener">
      <span class="ic" style="background:#fdeef6">📷</span>
      <span class="grow"><span class="t1">인스타그램에서 보기</span><br><span class="t2">저장된 게시물로 바로 이동</span></span>
      <span class="muted">↗</span></a>`:''}

    <div class="field"><label>재료 (${cookServings}인분 환산)</label>
      <div class="ing-box">${r.ingredients.map(i=>{
        const [q,u] = normUnit(i.qty*f, i.unit);
        const s = findStock(list, i.name, u);
        const ok = s && s.qty >= q-0.001;
        return `<div class="ing-line"><span>${esc(i.name)} ${ok?'':'<span class="tag soon">부족</span>'}</span>
          <b>${nice(i.qty*f)}${i.unit}</b></div>`;
      }).join('')}</div>
    </div>

    ${steps.length? `<div class="field"><label>요리 모드</label>
      <div class="step">
        <div class="sn">STEP ${cookStep+1} / ${steps.length}</div>
        <div class="st">${esc(st.t||'조리')}</div>
        <div class="sb">${esc(st.b)}</div>
        <div class="row" style="margin-top:10px">
          <button class="btn ghost sm grow" data-act="cook" data-d="-1" ${cookStep===0?'disabled style="opacity:.45"':''}>← 이전</button>
          <button class="btn orange sm grow" data-act="cook" data-d="1" ${cookStep===steps.length-1?'disabled style="opacity:.45"':''}>다음 단계 →</button>
        </div>
        <div class="dots">${steps.map((_,i)=>`<i class="${i===cookStep?'on':''}"></i>`).join('')}</div>
      </div></div>`:''}

    <div class="row" style="margin-top:14px">

}

    drop.addEventListener('drop', e=>{ e.preventDefault(); drop.classList.remove('over');
      if(e.dataTransfer.files[0]) acceptImage(e.dataTransfer.files[0]); });
  }
  fileInput.addEventListener('change', e=>{ if(e.target.files[0]) acceptImage(e.target.files[0]); });

    for(const it of items){ if(it.type.startsWith('image/')){ const f=it.getAsFile(); if(f){ e.preventDefault(); acceptImage(f); return; } } }

      if(/instagram/.test(txt)) $('#rIg').value = txt.trim(); else $('#rYt').value = txt.trim();

    }
  });
  if(captureMode) setTimeout(()=>{ if(drop) drop.classList.add('over'); setTimeout(()=>drop&&drop.classList.remove('over'),700); },150);

async function acceptImage(file){
  try{
    collectForm();
    draft.image = await shrinkImage(file);
    drawRecipeForm();
    toast('사진을 넣었어요. OCR 버튼으로 글자를 읽어올 수 있어요');
  }catch(e){ toast('이미지를 읽지 못했어요'); }
}
/* 폼 → draft */
function collectForm(){
  if(!$('#rform')) return;
  draft.name = $('#rName').value.trim();
  draft.emoji = $('#rEmoji').value.trim() || guessEmoji(draft.name);
  draft.kcal = +$('#rKcal').value||'';
  draft.protein = +$('#rProtein').value||'';
  draft.minutes = +$('#rMin').value||'';
  draft.servings = +$('#rServ').value||2;
  draft.tags = $('#rTags').value.split(',').map(s=>s.trim()).filter(Boolean);
  draft.youtube = $('#rYt').value.trim();
  draft.instagram = $('#rIg').value.trim();
  draft.steps = $('#rSteps').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const rows = [...document.querySelectorAll('#ingList .g4')];
  draft.ingredients = rows.map(row=>({
    name: row.querySelector('[data-ing="name"]').value.trim(),
    qty: parseFloat(row.querySelector('[data-ing="qty"]').value)||0,
    unit: row.querySelector('[data-ing="unit"]').value
  })).filter(i=>i.name);
}
/* 파싱 결과 → draft 병합 */
function applyParsed(p){
  collectForm();
  if(p.name && !draft.name) draft.name = p.name;
  if(p.emoji && !draft.emoji) draft.emoji = p.emoji;
  if(p.kcal) draft.kcal = p.kcal;
  if(p.protein) draft.protein = p.protein;
  if(p.minutes) draft.minutes = p.minutes;
  if(p.servings) draft.servings = p.servings;
  if(p.youtube) draft.youtube = p.youtube;
  if(p.instagram) draft.instagram = p.instagram;
  if(p.tags.length) draft.tags = [...new Set([...draft.tags, ...p.tags])];
  if(p.ingredients.length){
    const cur = draft.ingredients.filter(i=>i.name);
    p.ingredients.forEach(i=>{ if(!cur.some(c=>sameItem(c.name,i.name))) cur.push(i); });
    draft.ingredients = cur;
  }
  if(p.steps.length && !draft.steps.length) draft.steps = p.steps;
  drawRecipeForm();
  toast(`자동 인식 완료 · 재료 ${p.ingredients.length}개, 단계 ${p.steps.length}개`);
}

  $('#impFile').addEventListener('change', e=>{
    const f = e.target.files[0]; if(!f) return;
    const fr = new FileReader();

      if(!data.recipes) throw 0;
      state = Object.assign(blankState(), data); save(); closeModal(); render(); toast('백업을 불러왔어요');
    }catch(err){ toast('올바른 백업 파일이 아니에요'); } };
    fr.readAsText(f);
  });
}

document.addEventListener('click', async (e)=>{
  const b = e.target.closest('[data-act], [data-tab]');
  if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;

  if(b.dataset.tab){ ui.tab = b.dataset.tab; render(); window.scrollTo(0,0); return; }

  switch(act){
  /* ---- 냉장고 ---- */
  case 'addFridge': {
    const name = $('#fName').value.trim();
    const qty = parseFloat($('#fQty').value);
    if(!name){ toast('재료 이름을 적어 주세요'); return; }
    const unit = $('#fUnit').value;
    const cat = $('#fCat').value || guessCat(name);
    const exp = $('#fExp').value || iso(addDays(today(), SHELF[cat]||14));
    addToFridge({name, qty: isFinite(qty)&&qty>0? qty:1, unit, cat, expDate:exp});
    save(); render(); toast(`${name} 담았어요`); break;
  }
  case 'quickadd': {
    const name = b.dataset.name, cat = guessCat(name);
    addToFridge({name, qty:1, unit: /계란/.test(name)?'개':(guessCat(name)==='채소'?'개':'g'), cat, expDate: iso(addDays(today(), SHELF[cat]||14))});
    save(); render(); toast(`${name} 담았어요`); break;
  }
  case 'qty': {
    const it = state.fridge.find(f=>f.id===id); if(!it) break;
    it.qty = Math.max(0, +(it.qty + stepOf(it.unit)*(+b.dataset.d)).toFixed(2));
    if(it.qty===0) state.fridge = state.fridge.filter(f=>f.id!==id);
    save(); render(); break;
  }
  case 'delFridge': state.fridge = state.fridge.filter(f=>f.id!==id); save(); render(); break;

  /* ---- 주간 ---- */
  case 'week': ui.weekOffset += +b.dataset.d; render(); break;
  case 'autoplan': autoPlan(weekDates(), true); render(); toast('냉장고 재료를 우선해서 짰어요'); break;
  case 'rotate': rotate(weekDates()); render(); toast('메뉴를 순환시켰어요'); break;
  case 'clearWeek': weekDates().forEach(d=>delete state.plan[d]); save(); render(); break;
  case 'planToday': {
    state.plan[iso(today())] = {recipeId:id, servings: state.settings.people||2};
    save(); closeModal(); ui.tab='week'; render(); toast('오늘 메뉴로 넣었어요'); break;
  }

  /* ---- 메뉴판 ---- */
  case 'filter': ui.menuFilter = b.dataset.t; render(); break;
  case 'fav': { const r=recipeById(id); r.fav=!r.fav; save(); render(); break; }
  case 'openRecipe': openRecipe(id); break;
  case 'addRecipe': openRecipeForm(null,false); break;
  case 'addByCapture': openRecipeForm(null,true); break;
  case 'editRecipe': openRecipeForm(recipeById(id)); break;
  case 'delRecipe': {
    if(!confirm('이 레시피를 지울까요?')) break;
    state.recipes = state.recipes.filter(r=>r.id!==id);
    Object.keys(state.plan).forEach(d=>{ if(state.plan[d].recipeId===id) delete state.plan[d]; });
    save(); closeModal(); render(); break;
  }
  case 'serv': cookServings = Math.max(1, cookServings + (+b.dataset.d)); drawRecipe($('#modalRoot .modal').__recipe); break;
  case 'servSet': cookServings = +b.dataset.v; drawRecipe($('#modalRoot .modal').__recipe); break;
  case 'cook': {
    const r = $('#modalRoot .modal').__recipe;
    cookStep = Math.max(0, Math.min((r.steps||[]).length-1, cookStep + (+b.dataset.d)));
    drawRecipe(r); break;
  }

  /* ---- 레시피 폼 ---- */
  case 'addIng': collectForm(); draft.ingredients.push({name:'',qty:'',unit:'g'}); drawRecipeForm(); break;
  case 'delIng': collectForm(); draft.ingredients.splice(+b.dataset.k,1); drawRecipeForm(); break;
  case 'rmImg': collectForm(); draft.image=''; drawRecipeForm(); break;
  case 'parse': {
    const raw = $('#rawText').value.trim();
    if(!raw){ toast('붙여넣은 텍스트가 없어요'); break; }
    applyParsed(parseRecipeText(raw)); break;
  }
  case 'ocr': {
    const msg = $('#ocrMsg'), pr = $('#prog');
    pr.classList.remove('hidden'); msg.textContent = '글자 인식 준비 중... (처음 한 번은 한국어 데이터를 내려받아 20~30초 걸려요)';
    b.disabled = true; b.style.opacity = .6;
    try{
      const text = await runOCR(draft.image, p=>{ pr.firstElementChild.style.width = Math.round(p*100)+'%';
        msg.textContent = `글자 읽는 중 ${Math.round(p*100)}%`; });
      collectForm();
      const ta = $('#rawText'); ta.value = (ta.value? ta.value+'\n':'') + text;
      applyParsed(parseRecipeText(ta.value));
    }catch(err){
      msg.textContent = '자동 인식에 실패했어요(인터넷 연결 필요). 캡션을 복사해 아래 칸에 붙여넣어 주세요.';
      b.disabled = false; b.style.opacity = 1;
    }
    break;
  }
  case 'saveRecipe': {
    collectForm();
    if(!draft.name){ toast('메뉴 이름을 적어 주세요'); break; }
    if(draft.id){ const i = state.recipes.findIndex(r=>r.id===draft.id); state.recipes[i] = draft; }
    else { draft.id = uid(); draft.createdAt = Date.now(); state.recipes.push(draft); }
    save(); closeModal(); ui.tab='menu'; render(); toast('메뉴판에 저장했어요'); break;
  }

  /* ---- 장보기 ---- */
  case 'check': { const k=b.dataset.k; state.checked[k] = !state.checked[k]; save(); render(); break; }
  case 'addExtra': {
    const name = $('#xName').value.trim(); if(!name){ toast('이름을 적어 주세요'); break; }
    state.extras.push({id:uid(), name, qty: parseFloat($('#xQty').value)||1, unit:$('#xUnit').value, done:false});
    save(); render(); break;
  }
  case 'toggleExtra': { const x=state.extras.find(e=>e.id===id); x.done=!x.done; save(); render(); break; }
  case 'delExtra': state.extras = state.extras.filter(e=>e.id!==id); save(); render(); break;
  case 'copyShop': {
    const needs = shoppingNeeds(weekDates()).filter(n=>n.short>0.001);
    const text = '🛒 이번 주 장보기\n' + needs.map(n=>`· ${n.name} ${nice(roundBuy(n.short,n.unit))}${n.unit}`).join('\n')
      + (state.extras.filter(e=>!e.done).length? '\n'+state.extras.filter(e=>!e.done).map(e=>`· ${e.name} ${nice(e.qty)}${e.unit}`).join('\n') : '');
    try{ await navigator.clipboard.writeText(text); toast('장보기 목록을 복사했어요'); }
    catch{ prompt('복사해서 쓰세요', text); }
    break;
  }
  case 'buyDone': {
    const needs = shoppingNeeds(weekDates()).filter(n=>n.short>0.001);
    let n = 0;
    needs.forEach(x=>{ const k = normName(x.name)+'|'+x.unit;
      if(state.checked[k]){
        const cat = x.cat;
        addToFridge({name:x.name, qty: roundBuy(x.short,x.unit), unit:x.unit, cat,
                     expDate: iso(addDays(today(), SHELF[cat]||14))});
        delete state.checked[k]; n++;
      }});
    state.extras.filter(e=>e.done).forEach(e=>{
      const cat = guessCat(e.name);
      addToFridge({name:e.name, qty:e.qty, unit:e.unit, cat, expDate: iso(addDays(today(), SHELF[cat]||14))}); n++;
    });
    state.extras = state.extras.filter(e=>!e.done);
    if(!n){ toast('먼저 산 재료에 체크해 주세요'); break; }
    save(); render(); openExpenseQuick('', ''); toast(`${n}가지를 냉장고에 넣었어요`); break;
  }

  /* ---- 식비 ---- */
  case 'month': ui.monthOffset += +b.dataset.d; render(); break;
  case 'addExpense': {
    const amt = parseInt($('#eAmt').value,10);
    if(!amt){ toast('금액을 적어 주세요'); break; }
    state.expenses.push({id:uid(), date:$('#eDate').value||iso(today()), type:$('#eType').value, amount:amt, memo:$('#eMemo').value.trim()});
    save(); render(); toast('기록했어요'); break;
  }
  case 'quickExpense': {
    const amt = parseInt($('#qAmt').value,10);
    if(amt) state.expenses.push({id:uid(), date:iso(today()), type:'grocery', amount:amt, memo:$('#qMemo').value.trim()||'장보기'});
    save(); closeModal(); render(); if(amt) toast('식비에 기록했어요'); break;
  }
  case 'delExpense': state.expenses = state.expenses.filter(x=>x.id!==id); save(); render(); break;

  /* ---- 설정 ---- */
  case 'settings': openSettings(); break;
  case 'saveSettings': {
    state.settings.people = Math.max(1, +$('#sPeople').value||2);
    state.settings.budget = Math.max(0, +$('#sBudget').value||0);
    save(); closeModal(); render(); toast('저장했어요'); break;
  }
  case 'export': {
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `식단표백업_${iso(today())}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000); break;
  }
  case 'importBtn': $('#impFile').click(); break;
  case 'copyBackup': {
    let payload = JSON.stringify(state), note = '백업 내용을 복사했어요';
    if(payload.length > 800000){        // 사진까지 넣으면 붙여넣기 어려울 만큼 커질 때
      payload = JSON.stringify({ ...state, recipes: state.recipes.map(r=>({...r, image:''})) });
      note = '내용이 커서 레시피 사진은 빼고 복사했어요';
    }
    await copyText(payload, note); break;
  }
  case 'pasteRestore': openPasteRestore(); break;
  case 'selectFallback': {
    const t = $('#fallbackBox'); t.focus(); t.select(); t.setSelectionRange(0, 999999999);
    toast('선택했어요 — 길게 눌러 복사하세요'); break;
  }
  case 'doPasteRestore': {
    const txt = $('#restoreBox').value.trim();
    if(!txt){ toast('붙여넣은 내용이 없어요'); break; }
    let data;
    try{ data = JSON.parse(txt); }catch(e){ toast('올바른 백업 내용이 아니에요'); break; }
    if(!data || !Array.isArray(data.recipes)){ toast('올바른 백업 내용이 아니에요'); break; }
    if(!confirm('이 브라우저의 현재 기록을 덮어씁니다. 계속할까요?')) break;
    state = Object.assign(blankState(), data);
    if(!state.sync) state.sync = { enabled:false };
    writeLocal(); closeModal(); render(); syncStart();
    toast(`복원했어요 · 재료 ${state.fridge.length}개, 레시피 ${state.recipes.length}개`); break;
  }

  /* ---- 가족과 공유 ---- */
  case 'syncSetup': openSyncSetup(); break;
  case 'copyRules': await copyText($('#rulesBox').value, '보안 규칙을 복사했어요'); break;
  case 'copyInvite': await copyText($('#inviteBox').value, '초대 링크를 복사했어요'); break;
  case 'syncConnect': {
    const cfg = parseFbConfig($('#fbBox').value);
    if(!cfg){ toast('설정값에서 apiKey와 projectId를 찾지 못했어요'); break; }
    state.sync = { enabled:true, ...cfg, room: randId(20), rev:0, imgs:{}, error:'' };
    writeLocal();
    b.disabled = true; b.textContent = '연결 중...';
    await syncPush();
    if(state.sync.error){
      const msg = state.sync.error;
      state.sync = { enabled:false }; writeLocal();
      toast(msg); openSyncSetup(); break;
    }
    syncStart(); closeModal(); render(); openSyncInvite(); break;
  }
  case 'syncInvite': openSyncInvite(); break;
  case 'syncNow': await syncPull(); await syncPush();
    toast(state.sync.error || '동기화했어요'); closeModal(); render(); break;
  case 'syncOff': {
    if(!confirm('이 폰에서만 공유를 끕니다. 지금까지 받은 기록은 그대로 남아요.')) break;
    state.sync = { enabled:false }; clearInterval(syncTimer); syncTimer=null;
    writeLocal(); closeModal(); render(); toast('공유를 껐어요'); break;
  }
  case 'joinTake': case 'joinPush': {
    state.sync = { enabled:true, apiKey:pendingInvite.k, projectId:pendingInvite.p,
                   room:pendingInvite.r, rev:0, imgs:{}, error:'' };
    writeLocal(); pendingInvite = null;
    if(act==='joinTake'){
      const doc = await fsGet(`rooms/${state.sync.room}/state/core`).catch(e=>({err:e.message}));
      if(doc && doc.err){ state.sync={enabled:false}; writeLocal(); toast(doc.err); closeModal(); break; }
      if(doc){ applyingRemote=true; applyCore(doc.json); applyingRemote=false; state.sync.rev = doc.rev; writeLocal(); pullImages(); }
    } else await syncPush();
    syncStart(); closeModal(); render();
    toast(state.sync.error || '가족 방에 연결됐어요'); break;
  }
  case 'reset': {
    if(!confirm('모든 기록(냉장고·식단·레시피·식비)을 지울까요?')) break;
    state = blankState(); save(); closeModal(); render(); toast('초기화했어요'); break;
  }
  case 'close': closeModal(); break;
  }
});

document.addEventListener('change', (e)=>{
  const s = e.target.closest('[data-act="setDay"]');
  if(s){
    const d = s.dataset.date;
    if(s.value) state.plan[d] = {recipeId:s.value, servings: state.settings.people||2};
    else delete state.plan[d];
    save(); render();
  }
});
$('#fab').addEventListener('click', ()=>openRecipeForm(null,true));

/* 냉장고 병합 담기 */
function addToFridge({name,qty,unit,cat,expDate}){
  const hit = state.fridge.find(f=>sameItem(f.name,name) && f.unit===unit);
  if(hit){ hit.qty = +(hit.qty+qty).toFixed(2); if(expDate) hit.expDate = expDate; }
  else state.fridge.push({id:uid(), name, cat: cat||guessCat(name), qty, unit, buyDate: iso(today()), expDate});
}

/* ============================================================
   7. 가족과 함께 쓰기 — Firebase Firestore REST 동기화
   ------------------------------------------------------------
   · SDK 없이 fetch만 씁니다(외부 스크립트 로딩 없음).
   · rooms/{방}/state/core  = 사진을 뺀 전체 데이터(JSON 한 덩어리)
   · rooms/{방}/img/{레시피id} = 레시피 사진(용량이 커서 따로 보관)
   · 15초마다 core 문서 1건만 확인 → 바뀌었을 때만 내려받음(무료 한도 안에서 여유)
   ============================================================ */
const DEVICE = (()=>{ let d=localStorage.getItem('fmp.device');
  if(!d){ d=uid(); localStorage.setItem('fmp.device',d); } return d; })();
let syncTimer=null, pushTimer=null, syncBusy=false, pendingInvite=null;

const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
const randId = n => { const a=new Uint8Array(n); crypto.getRandomValues(a);
  return [...a].map(x=>'abcdefghijkmnpqrstuvwxyz23456789'[x%32]).join(''); };

function fsUrl(path){
  const c = state.sync;
  return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(c.projectId)}`
       + `/databases/(default)/documents/${path}?key=${encodeURIComponent(c.apiKey)}`;
}
async function fsErr(r){
  let m=''; try{ m=(await r.json()).error?.message||''; }catch(e){}
  if(r.status===403) return '권한이 거부됐어요 — Firestore 보안 규칙을 확인해 주세요';
  if(r.status===400) return 'API 키나 프로젝트 ID가 올바르지 않아요';
  if(r.status===404) return '프로젝트를 찾을 수 없어요 (Firestore 데이터베이스를 만들었는지 확인)';
  return `오류 ${r.status} ${m}`.trim();
}
async function fsGet(path){
  const r = await fetch(fsUrl(path));
  if(r.status===404) return null;
  if(!r.ok) throw new Error(await fsErr(r));
  const d = await r.json();
  return { json:d.fields?.json?.stringValue||'', rev:+(d.fields?.rev?.integerValue||0), by:d.fields?.by?.stringValue||'' };
}
async function fsPut(path, json, rev){
  const r = await fetch(fsUrl(path), { method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ fields:{ json:{stringValue:json}, rev:{integerValue:String(rev)}, by:{stringValue:DEVICE} } }) });
  if(!r.ok) throw new Error(await fsErr(r));
}

/* 사진을 뺀 전체 데이터 (사진은 별도 문서로) */
function corePayload(){
  return JSON.stringify({
    fridge:state.fridge, plan:state.plan, extras:state.extras, checked:state.checked,
    expenses:state.expenses, settings:state.settings,
    recipes: state.recipes.map(r=>{ const {image, ...rest}=r; return {...rest, hasImage: !!image}; })
  });
}
function applyCore(txt){
  const d = JSON.parse(txt);
  const keepImg = {}; state.recipes.forEach(r=>{ if(r.image) keepImg[r.id]=r.image; });
  state.fridge = d.fridge||[];   state.plan = d.plan||{};
  state.extras = d.extras||[];   state.checked = d.checked||{};
  state.expenses = d.expenses||[]; state.settings = d.settings||state.settings;
  state.recipes = (d.recipes||[]).map(r=>({ ...r, image: keepImg[r.id]||'' }));
}
/* 내 폰에 없는 사진만 뒤늦게 받아오기 */
async function pullImages(){
  const c = state.sync; let got = 0;
  for(const r of state.recipes){
    if(!r.hasImage || r.image) continue;
    try{ const doc = await fsGet(`rooms/${c.room}/img/${r.id}`);
      if(doc && doc.json){ r.image = doc.json; got++; } }catch(e){ break; }
  }
  if(got){ writeLocal(); render(); }
}

function schedulePush(){
  if(!state.sync?.enabled) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(syncPush, 1200);   // 연달아 누를 때 한 번만 올리기
}
async function syncPush(){
  const c = state.sync;
  if(!c?.enabled || syncBusy) return;
  syncBusy = true;
  try{
    const rev = Date.now();
    await fsPut(`rooms/${c.room}/state/core`, corePayload(), rev);
    c.rev = rev; c.lastAt = rev; c.error = '';
    for(const r of state.recipes){                       // 새로 추가된 사진만 올림
      if(r.image && (c.imgs?.[r.id] !== r.image.length)){
        await fsPut(`rooms/${c.room}/img/${r.id}`, r.image, rev);
        (c.imgs = c.imgs||{})[r.id] = r.image.length;
      }
    }
  }catch(e){ c.error = e.message; }
  finally{ syncBusy=false; writeLocal(); renderHeadMeta(); }
}
async function syncPull(){
  const c = state.sync;
  if(!c?.enabled || syncBusy) return;
  syncBusy = true;
  try{
    const doc = await fsGet(`rooms/${c.room}/state/core`);
    if(doc && doc.rev > (c.rev||0) && doc.by !== DEVICE){
      applyingRemote = true; applyCore(doc.json); applyingRemote = false;
      c.rev = doc.rev; writeLocal(); render();
      pullImages();
      toast('가족이 바꾼 내용을 받아왔어요');
    }
    c.lastAt = Date.now(); c.error = '';
  }catch(e){ c.error = e.message; }
  finally{ syncBusy=false; writeLocal(); renderHeadMeta(); }
}
function syncStart(){
  clearInterval(syncTimer); syncTimer = null;
  if(!state.sync?.enabled) return;
  syncPull();
  syncTimer = setInterval(()=>{ if(!document.hidden) syncPull(); }, 15000);
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncPull(); });

/* 붙여넣은 Firebase 설정에서 필요한 두 값만 뽑기 */
function parseFbConfig(text){
  const t = String(text||'');
  const api = t.match(/apiKey["'\s:]+([A-Za-z0-9_\-]{20,})/);
  const pid = t.match(/projectId["'\s:]+([a-z0-9\-]{4,})/i);
  if(!api || !pid) return null;
  return { apiKey: api[1], projectId: pid[1] };
}
function inviteLink(){
  const c = state.sync;
  return location.href.split('#')[0] + '#join='
       + b64e(JSON.stringify({ k:c.apiKey, p:c.projectId, r:c.room }));
}
/* 주소에 초대 코드가 붙어 있으면 받아 두기 */
(function readInvite(){
  const m = location.hash.match(/join=([A-Za-z0-9_\-]+)/);
  if(!m) return;
  try{ const v = JSON.parse(b64d(m[1]));
    if(v.k && v.p && v.r) pendingInvite = v; }catch(e){}
  history.replaceState(null, '', location.pathname + location.search);
})();

/* ============================================================
   8. 시작
   ============================================================ */
async function copyText(text, okMsg){
  try{ await navigator.clipboard.writeText(text); toast(okMsg); }
  catch(e){ openCopyFallback(text); }   // 인앱 브라우저에서 복사가 막힐 때
}

state = load() || blankState();
if(!state.sync) state.sync = { enabled:false };      // 예전 버전에서 넘어온 경우
if(!state.seeded && !state.recipes.length) { seed(); writeLocal(); }
ui.tab = 'week';
render();
syncStart();
if(pendingInvite) openJoinPrompt();
</script>
