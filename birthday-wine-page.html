<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🍷</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --wine: #E88FA8;
    --wine-deep: #1A2A3D;
    --gold: #87CEEB;
    --gold-light: #C8E9F7;
    --cream: #FFF0F5;
    --text: #1A1A2A;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--wine-deep);
    font-family: 'Jost', sans-serif;
    overflow-x: hidden;
    color: var(--cream);
  }

  /* ── GRAIN OVERLAY ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999; opacity: 0.35;
  }

  /* ── INTRO SCREEN ── */
  #intro {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--wine-deep);
    z-index: 100;
    transition: opacity 1s ease, visibility 1s ease;
  }
  #intro.hidden { opacity: 0; visibility: hidden; }

  .intro-year {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(40px, 10vw, 90px);
    font-weight: 300;
    color: var(--wine);
    line-height: 1;
    letter-spacing: 0.05em;
    animation: fadeUp 1.2s ease forwards;
    opacity: 0;
  }
  .intro-label {
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 12px;
    animation: fadeUp 1.2s 0.4s ease forwards;
    opacity: 0;
  }
  .intro-btn {
    margin-top: 48px;
    padding: 14px 40px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold-light);
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.3s, color 0.3s;
    animation: fadeUp 1.2s 0.8s ease forwards;
    opacity: 0;
  }
  .intro-btn:hover { background: var(--gold); color: var(--wine-deep); }

  /* ── MAIN ── */
  #main {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center;
  }

  /* ── HERO ── */
  .hero {
    width: 100%; padding: 80px 24px 40px;
    text-align: center;
    position: relative;
  }
  .hero-line {
    width: 1px; height: 60px;
    background: linear-gradient(to bottom, transparent, var(--gold));
    margin: 0 auto 32px;
  }
  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(36px, 10vw, 72px);
    font-weight: 300;
    font-style: italic;
    line-height: 1.1;
    color: var(--cream);
    margin-bottom: 16px;
  }
  .hero-sub {
    font-size: 11px;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
  }
  .hero-divider {
    display: flex; align-items: center; gap: 16px;
    width: min(400px, 90%);
    margin: 32px auto 0;
    color: var(--gold);
  }
  .hero-divider span { flex: 1; height: 1px; background: var(--gold); opacity: 0.4; }

  /* ── SLIDESHOW ── */
  .slideshow-section {
    width: 100%; max-width: 900px;
    padding: 48px 24px;
  }
  .slideshow-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16/10;
    background: #0d1a2a;
    overflow: hidden;
    border: 1px solid rgba(135,206,235,0.2);
  }
  .slide {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .slide.active { opacity: 1; }
  .slide img, .slide video {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  /* placeholder slides */
  .slide-placeholder {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    background: linear-gradient(135deg, #1a2a3d 0%, #0d1a2a 50%, #2a1a3d 100%);
  }
  .slide-placeholder .icon { font-size: 48px; opacity: 0.3; }
  .slide-placeholder .label {
    font-size: 11px; letter-spacing: 0.25em;
    text-transform: uppercase; color: var(--gold); opacity: 0.6;
  }

  /* slide caption */
  .slide-caption {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 40px 24px 20px;
    background: linear-gradient(to top, rgba(10,20,35,0.85), transparent);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--gold-light);
    opacity: 0;
    transition: opacity 0.5s 0.5s;
    pointer-events: none;
  }
  .slide.active .slide-caption { opacity: 1; }

  /* controls */
  .slide-controls {
    display: flex; align-items: center; justify-content: center;
    gap: 24px; margin-top: 20px;
  }
  .ctrl-btn {
    background: none; border: 1px solid rgba(201,169,110,0.3);
    color: var(--gold); width: 40px; height: 40px;
    cursor: pointer; font-size: 16px;
    transition: border-color 0.2s, background 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .ctrl-btn:hover { border-color: var(--gold); background: rgba(135,206,235,0.1); }
  .slide-dots { display: flex; gap: 8px; align-items: center; }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold); opacity: 0.25;
    cursor: pointer; transition: opacity 0.2s, transform 0.2s;
    border: none;
  }
  .dot.active { opacity: 1; transform: scale(1.4); }

  /* ── MESSAGE ── */
  .message-section {
    width: min(640px, 90%);
    padding: 0 0 80px;
    text-align: center;
  }
  .msg-ornament {
    font-size: 24px; color: var(--gold); opacity: 0.4;
    margin-bottom: 24px;
  }
  .msg-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(18px, 4vw, 26px);
    font-weight: 300;
    font-style: italic;
    line-height: 1.8;
    color: var(--cream);
    opacity: 0.9;
    margin-bottom: 40px;
  }
  .msg-from {
    font-size: 11px; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--gold);
  }
  .footer-line {
    width: 1px; height: 60px;
    background: linear-gradient(to top, transparent, var(--gold));
    margin: 40px auto 0; opacity: 0.4;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── HOW TO USE (hidden comment in source) ── */
  /*
    사진 추가: slides 배열에 { type:'image', src:'파일명.jpg', caption:'캡션' } 추가
    영상 추가: { type:'video', src:'파일명.mp4', caption:'캡션' }
    메시지 수정: .msg-text 안의 텍스트 변경
    이름 수정: .msg-from 안의 텍스트 변경
  */
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
  <div class="intro-year">2026.06.14</div>
  <div class="intro-label">Happy Birthday, Jinju</div>
  <button class="intro-btn" onclick="enterMain()">Open ✦</button>
</div>

<!-- MAIN -->
<div id="main">
  <section class="hero">
    <div class="hero-line"></div>
    <h1 class="hero-title">For You,<br>LEE Jinju</h1>
    <p class="hero-sub">A Collection of Our Moments</p>
    <div class="hero-divider">
      <span></span>
      <span style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;white-space:nowrap;opacity:0.6">✦</span>
      <span></span>
    </div>
  </section>

  <section class="slideshow-section">
    <div class="slideshow-wrapper" id="slideshow">

      <!-- 슬라이드 1: 결혼식 -->
      <div class="slide active" data-index="0">
        <img src="1.jpg" alt="결혼식">
        <div class="slide-caption">그날, 우린 하나가 됐어</div>
      </div>

      <!-- 슬라이드 2: 웨딩 촬영 -->
      <div class="slide" data-index="1">
        <img src="2.jpg" alt="웨딩 촬영">
        <div class="slide-caption">세상에서 제일 예쁜 날</div>
      </div>

      <!-- 슬라이드 3: 여행 -->
      <div class="slide" data-index="2">
        <img src="3.jpg" alt="여행">
        <div class="slide-caption">어디든, 네 옆이면 충분해</div>
      </div>

      <!-- 슬라이드 4: 카페 셀카 -->
      <div class="slide" data-index="3">
        <img src="4.jpg" alt="카페">
        <div class="slide-caption">평범한 날도 네 덕에 빛나</div>
      </div>

      <!-- 슬라이드 5: 공연장 -->
      <div class="slide" data-index="4">
        <img src="5.jpg" alt="공연">
        <div class="slide-caption">앞으로도, 계속 함께</div>
      </div>

    </div>

    <div class="slide-controls">
      <button class="ctrl-btn" onclick="changeSlide(-1)">←</button>
      <div class="slide-dots" id="dots"></div>
      <button class="ctrl-btn" onclick="changeSlide(1)">→</button>
    </div>
  </section>

  <section class="message-section">
    <div class="msg-ornament">✦ ✦ ✦</div>
    <p class="msg-text">
      벌써 네 번째 생일인데,<br>
      올해는 남편 자격으로 처음 축하하네.<br><br>
      앞으로 수십 번 더, 내가 꼭 옆에서 챙길게.
    </p>
    <div class="msg-from">
      From. Sungwoo &nbsp;✦&nbsp; 2026.06.14
    </div>
    <div class="footer-line"></div>
  </section>
</div>

<script>
  // ── Intro ──
  function enterMain() {
    document.getElementById('intro').classList.add('hidden');
  }

  // ── Slideshow ──
  const slides = document.querySelectorAll('.slide');
  const dotsEl = document.getElementById('dots');
  let current = 0;
  let autoTimer;

  // build dots
  slides.forEach((_, i) => {
    const d = document.createElement('button');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.onclick = () => goTo(i);
    dotsEl.appendChild(d);
  });

  function goTo(idx) {
    slides[current].classList.remove('active');
    dotsEl.children[current].classList.remove('active');
    current = (idx + slides.length) % slides.length;
    slides[current].classList.add('active');
    dotsEl.children[current].classList.add('active');
    resetAuto();
  }

  function changeSlide(dir) { goTo(current + dir); }

  function resetAuto() {
    clearInterval(autoTimer);
    autoTimer = setInterval(() => changeSlide(1), 5000);
  }

  resetAuto();

  // keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') changeSlide(1);
    if (e.key === 'ArrowLeft') changeSlide(-1);
  });

  // touch swipe
  let tx = 0;
  const sw = document.getElementById('slideshow');
  sw.addEventListener('touchstart', e => tx = e.touches[0].clientX);
  sw.addEventListener('touchend', e => {
    const diff = tx - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 40) changeSlide(diff > 0 ? 1 : -1);
  });
</script>
</body>
</html>
