<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --wine: #E88FA8;
    --wine-deep: #1A2A3D;
    --gold: #87CEEB;
    --gold-light: #C8E9F7;
    --cream: #FFF0F5;
  }
  html, body {
    width: 100%; height: 100%;
    background: var(--wine-deep);
    font-family: 'Jost', sans-serif;
    overflow-x: hidden;
    color: var(--cream);
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999; opacity: 0.35;
  }
  #intro {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--wine-deep);
    z-index: 100;
    transition: opacity 1s ease, visibility 1s ease;
  }
  #intro.hidden { opacity: 0; visibility: hidden; }
  .intro-year {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(40px, 10vw, 90px);
    font-weight: 300;
    color: var(--wine);
    line-height: 1;
    letter-spacing: 0.05em;
    animation: fadeUp 1.2s ease forwards;
    opacity: 0;
  }
  .intro-label {
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 12px;
    animation: fadeUp 1.2s 0.4s ease forwards;
    opacity: 0;
  }
  .intro-btn {
    margin-top: 48px;
    padding: 14px 40px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold-light);
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.3s, color 0.3s;
    animation: fadeUp 1.2s 0.8s ease forwards;
    opacity: 0;
  }
  .intro-btn:hover { background: var(--gold); color: var(--wine-deep); }
  .intro-hint {
    margin-top: 16px;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(135,206,235,0.5);
    text-transform: uppercase;
    animation: fadeUp 1.2s 1s ease forwards;
    opacity: 0;
  }
  #main {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center;
  }
  .hero {
    width: 100%; padding: 80px 24px 40px;
    text-align: center;
  }
  .hero-line {
    width: 1px; height: 60px;
    background: linear-gradient(to bottom, transparent, var(--gold));
    margin: 0 auto 32px;
  }
  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(36px, 10vw, 72px);
    font-weight: 300;
    font-style: italic;
    line-height: 1.1;
    color: var(--cream);
    margin-bottom: 16px;
  }
  .hero-sub {
    font-size: 11px;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
  }
  .hero-divider {
    display: flex; align-items: center; gap: 16px;
    width: min(400px, 90%);
    margin: 32px auto 0;
    color: var(--gold);
  }
  .hero-divider span { flex: 1; height: 1px; background: var(--gold); opacity: 0.4; }
  .slideshow-section {
    width: 100%; max-width: 500px;
    padding: 48px 24px;
  }
  .slideshow-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 3/4;
    background: #0d1a2a;
    overflow: hidden;
    border: 1px solid rgba(135,206,235,0.2);
  }
  .slide {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .slide.active { opacity: 1; }
  .slide img, .slide video {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .slide-controls {
    display: flex; align-items: center; justify-content: center;
    gap: 24px; margin-top: 20px;
  }
  .ctrl-btn {
    background: none; border: 1px solid rgba(201,169,110,0.3);
    color: var(--gold); width: 40px; height: 40px;
    cursor: pointer; font-size: 16px;
    transition: border-color 0.2s, background 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .ctrl-btn:hover { border-color: var(--gold); background: rgba(135,206,235,0.1); }
  .slide-dots { display: flex; gap: 8px; align-items: center; }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold); opacity: 0.25;
    cursor: pointer; transition: opacity 0.2s, transform 0.2s;
    border: none;
  }
  .dot.active { opacity: 1; transform: scale(1.4); }
  .message-section {
    width: min(640px, 90%);
    padding: 0 0 80px;
    text-align: center;
  }
  .msg-ornament {
    font-size: 24px; color: var(--gold); opacity: 0.4;
    margin-bottom: 24px;
  }
  .msg-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(18px, 4vw, 26px);
    font-weight: 300;
    font-style: italic;
    line-height: 1.8;
    color: var(--cream);
    opacity: 0.9;
    margin-bottom: 40px;
  }
  .msg-from {
    font-size: 11px; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--gold);
  }
  .footer-line {
    width: 1px; height: 60px;
    background: linear-gradient(to top, transparent, var(--gold));
    margin: 40px auto 0; opacity: 0.4;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .music-btn {
    position: fixed;
    bottom: 24px; right: 24px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(232,143,168,0.15);
    border: 1px solid rgba(232,143,168,0.4);
    color: #E88FA8;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    transition: background 0.3s;
    backdrop-filter: blur(6px);
  }
  .music-btn:hover { background: rgba(232,143,168,0.25); }
</style>
</head>
<body>

<div id="intro">
  <div class="intro-year">2026.06.14</div>
  <div class="intro-label">Happy Birthday, Jinju</div>
  <button class="intro-btn" onclick="enterMain(); startMusic()">Open ✦</button>
  <div class="intro-hint">🎵 음악은 우측 하단 버튼으로 조절하세요</div>
</div>

<div id="main">
  <section class="hero">
    <div class="hero-line"></div>
    <h1 class="hero-title">For You,<br>LEE Jinju</h1>
    <p class="hero-sub">A Collection of Our Moments</p>
    <div class="hero-divider">
      <span></span>
      <span style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;white-space:nowrap;opacity:0.6">✦</span>
      <span></span>
    </div>
  </section>

  <section class="slideshow-section">
    <div class="slideshow-wrapper" id="slideshow">
      <div class="slide active" data-index="0"><img src="r4.jpg" alt=""></div>
      <div class="slide" data-index="1"><img src="r5.jpg" alt=""></div>
      <div class="slide" data-index="2"><img src="q16.jpg" alt=""></div>
      <div class="slide" data-index="3"><img src="q8.jpg" alt=""></div>
      <div class="slide" data-index="4"><img src="q3.jpg" alt=""></div>
      <div class="slide" data-index="5"><img src="q9.jpg" alt=""></div>
      <div class="slide" data-index="6"><img src="q10.jpg" alt=""></div>
      <div class="slide" data-index="7"><img src="q6.jpg" alt=""></div>
      <div class="slide" data-index="8"><img src="5.jpg" alt=""></div>
      <div class="slide" data-index="9"><img src="q11.jpg" alt=""></div>
      <div class="slide" data-index="10"><img src="r2.jpg" alt=""></div>
      <div class="slide" data-index="11"><img src="r3.jpg" alt=""></div>
      <div class="slide" data-index="12"><img src="q1.jpg" alt=""></div>
      <div class="slide" data-index="13"><img src="q13.jpg" alt=""></div>
      <div class="slide" data-index="14"><img src="q14.jpg" alt=""></div>
      <div class="slide" data-index="15"><img src="q15.jpg" alt=""></div>
      <div class="slide" data-index="16"><img src="q4.jpg" alt=""></div>
      <div class="slide" data-index="17"><img src="q7.jpg" alt=""></div>
      <div class="slide" data-index="18"><img src="q12.jpg" alt=""></div>
      <div class="slide" data-index="19"><img src="r9.jpg" alt=""></div>
      <div class="slide" data-index="20"><img src="r8.jpg" alt=""></div>
      <div class="slide" data-index="21"><img src="r10.jpg" alt=""></div>
      <div class="slide" data-index="22"><img src="r11.jpg" alt=""></div>
      <div class="slide" data-index="23"><img src="r6.jpg" alt=""></div>
      <div class="slide" data-index="24"><img src="r7.jpg" alt=""></div>
      <div class="slide" data-index="25"><img src="4.jpg" alt=""></div>
      <div class="slide" data-index="26"><img src="q5.jpg" alt=""></div>
      <div class="slide" data-index="27"><img src="2.jpg" alt=""></div>
      <div class="slide" data-index="28"><img src="q17.jpg" alt=""></div>
      <div class="slide" data-index="29"><img src="r1.jpg" alt=""></div>
      <div class="slide" data-index="30"><img src="p11.jpg" alt=""></div>
      <div class="slide" data-index="31"><img src="1.jpg" alt=""></div>
      <div class="slide" data-index="32"><img src="p12.jpg" alt=""></div>
    </div>
    <div class="slide-controls">
      <button class="ctrl-btn" onclick="changeSlide(-1)">←</button>
      <div class="slide-dots" id="dots"></div>
      <button class="ctrl-btn" onclick="changeSlide(1)">→</button>
    </div>
  </section>

  <section class="message-section">
    <div class="msg-ornament">✦ ✦ ✦</div>
    <p class="msg-text">
      벌써 네 번째 생일인데,<br>
      올해는 남편 자격으로 처음 축하하네.<br><br>
      앞으로 수십 번 더, 내가 꼭 옆에서 챙길게.
    </p>
    <div class="msg-from">
      From. Sungwoo &nbsp;✦&nbsp; 2026.06.14
    </div>
    <div class="footer-line"></div>
  </section>
</div>

<audio id="bgm" src="music.mp3" loop preload="auto"></audio>
<button class="music-btn" id="musicBtn" onclick="toggleMusic()" title="음악 켜기/끄기">♪</button>

<script>
  function enterMain() {
    document.getElementById('intro').classList.add('hidden');
  }

  const slides = document.querySelectorAll('.slide');
  const dotsEl = document.getElementById('dots');
  let current = 0;
  let autoTimer;

  slides.forEach((_, i) => {
    const d = document.createElement('button');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.onclick = () => goTo(i);
    dotsEl.appendChild(d);
  });

  function goTo(idx) {
    slides[current].classList.remove('active');
    dotsEl.children[current].classList.remove('active');
    current = (idx + slides.length) % slides.length;
    slides[current].classList.add('active');
    dotsEl.children[current].classList.add('active');
    resetAuto();
  }

  function changeSlide(dir) { goTo(current + dir); }

  function resetAuto() {
    clearInterval(autoTimer);
    autoTimer = setInterval(() => changeSlide(1), 5000);
  }

  resetAuto();

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') changeSlide(1);
    if (e.key === 'ArrowLeft') changeSlide(-1);
  });

  let tx = 0;
  const sw = document.getElementById('slideshow');
  sw.addEventListener('touchstart', e => tx = e.touches[0].clientX);
  sw.addEventListener('touchend', e => {
    const diff = tx - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 40) changeSlide(diff > 0 ? 1 : -1);
  });

  const bgm = document.getElementById('bgm');
  const btn = document.getElementById('musicBtn');

  function startMusic() {
    bgm.play().catch(() => {});
  }

  function toggleMusic() {
    if (bgm.paused) {
      bgm.play();
      btn.textContent = '♪';
      btn.style.opacity = '1';
    } else {
      bgm.pause();
      btn.textContent = '♩';
      btn.style.opacity = '0.4';
    }
  }
</script>
</body>
</html>
