<script>
  // ── Intro ──
  function enterMain() {
    document.getElementById('intro').classList.add('hidden');
  }

  // ── Slideshow ──
  const slides = document.querySelectorAll('.slide');
  const dotsEl = document.getElementById('dots');
  let current = 0;
  let autoTimer;

  // build dots
  slides.forEach((_, i) => {
    const d = document.createElement('button');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.onclick = () => goTo(i);
    dotsEl.appendChild(d);
  });

  function goTo(idx) {
    slides[current].classList.remove('active');
    dotsEl.children[current].classList.remove('active');
    current = (idx + slides.length) % slides.length;
    slides[current].classList.add('active');
    dotsEl.children[current].classList.add('active');
    resetAuto();
  }

  function changeSlide(dir) { goTo(current + dir); }

  function resetAuto() {
    clearInterval(autoTimer);
    autoTimer = setInterval(() => changeSlide(1), 5000);
  }

  resetAuto();

  // keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') changeSlide(1);
    if (e.key === 'ArrowLeft') changeSlide(-1);
  });

  // touch swipe
  let tx = 0;
  const sw = document.getElementById('slideshow');
  sw.addEventListener('touchstart', e => tx = e.touches[0].clientX);
  sw.addEventListener('touchend', e => {
    const diff = tx - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 40) changeSlide(diff > 0 ? 1 : -1);
  });
</script>

<script>
  let muted = false;
  const iframe = document.getElementById('yt-audio');
  const btn = document.getElementById('musicBtn');

  function toggleMusic() {
    muted = !muted;
    const src = iframe.src;
    if (muted) {
      iframe.src = src.replace('mute=0', 'mute=1');
      btn.textContent = '♩';
      btn.style.opacity = '0.4';
    } else {
      iframe.src = src.replace('mute=1', 'mute=0');
      btn.textContent = '♪';
      btn.style.opacity = '1';
    }
  }

  // 인트로 버튼 클릭시 음악 시작 유도
  document.querySelector('.intro-btn').addEventListener('click', () => {
    iframe.src = iframe.src; // reload to trigger autoplay after interaction
  });

  function startMusic() {
    const yt = document.getElementById('yt-audio');
    yt.src = "https://www.youtube.com/embed/UxSKsvd_4jw?autoplay=1&mute=0&loop=1&playlist=UxSKsvd_4jw&controls=0&showinfo=0&rel=0&enablejsapi=1";
  }
</script>
