<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d4b46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="우리집 자산">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>우리집 자산</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ed; --card:#fffdf8; --ink:#1e2430; --muted:#6f7683;
  --brand:#1d4b46; --brand-d:#153833; --soft:#e3eeea; --soft-d:#c9ded7;
  --up:#d1453b; --up-s:#fdeceb;      /* 국내 관례: 상승 = 빨강 */
  --down:#2f62c4; --down-s:#eaf0fd;  /* 하락 = 파랑 */
  --gold:#c9862b; --gold-s:#fdf2e2;
  --line:#e5e2d8; --shadow:0 1px 2px rgba(30,36,48,.06), 0 8px 22px rgba(30,36,48,.06);
  --r:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--soft-d);outline-offset:1px}
textarea{resize:vertical;min-height:70px}
.wrap{max-width:920px;margin:0 auto;padding:0 14px}
.hidden{display:none !important}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.head-in{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:14px 0 12px}
.brand{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.02em}
h1{font-size:clamp(17px,4.6vw,22px);font-weight:900;letter-spacing:-.03em;margin-top:2px;white-space:nowrap}
.head-right{display:flex;align-items:center;gap:8px}
.head-meta{text-align:right;font-size:clamp(9.5px,2.6vw,11.5px);color:var(--muted);white-space:nowrap;line-height:1.35}
.head-meta b{color:var(--brand);font-weight:700}
.gear{font-size:18px;padding:4px 6px;border-radius:8px}
.gear:hover{background:var(--soft)}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- tabs ---------- */
nav.tabs{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 0 8px;
  box-shadow:0 6px 14px -12px rgba(0,0,0,.4)}
.tabbar{display:flex;gap:4px;background:var(--soft);border-radius:14px;padding:4px}
.tabbar button{flex:1;padding:9px 4px;border-radius:11px;font-size:12.5px;font-weight:700;color:var(--brand-d);
  white-space:nowrap;transition:.15s}
.tabbar button.on{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(29,75,70,.3)}

/* ---------- card ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:14px;margin-bottom:12px}
.card.tight{padding:12px}
.card h2{font-size:13.5px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;
  justify-content:space-between;gap:8px;margin-bottom:10px}
.card h2 .sub{font-size:11px;font-weight:500;color:var(--muted)}
.tiny{font-size:11px}
.muted{color:var(--muted)}
.center{text-align:center}
.right{text-align:right}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt{margin-top:10px}
.up{color:var(--up)}
.down{color:var(--down)}
.flat{color:var(--muted)}

/* ---------- hero ---------- */
.hero{background:linear-gradient(160deg,var(--brand) 0%,var(--brand-d) 100%);color:#fff;border:none;
  border-radius:var(--r);padding:18px 16px 16px;margin-bottom:12px;box-shadow:0 10px 26px -12px rgba(21,56,51,.8)}
.hero .lab{font-size:11.5px;opacity:.72;font-weight:500}
.hero .big{font-size:clamp(26px,8vw,38px);font-weight:900;letter-spacing:-.04em;margin-top:2px;line-height:1.15}
.hero .sub2{font-size:12px;opacity:.85;margin-top:6px}
.hero .pill{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);
  border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700}
.hero .pill.u{background:rgba(255,190,185,.24)}
.hero .pill.d{background:rgba(185,210,255,.24)}
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hero-grid div{background:rgba(255,255,255,.1);border-radius:12px;padding:9px 8px;text-align:center}
.hero-grid .k{font-size:10.5px;opacity:.75}
.hero-grid .v{font-size:14px;font-weight:800;margin-top:2px;letter-spacing:-.02em}

/* ---------- 종목 줄 ---------- */
.hold{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.hold:last-child{border-bottom:none}
.hold .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:none;
  background:var(--soft);font-weight:800}
.hold .mid{flex:1;min-width:0}
.hold .nm{font-size:13.5px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hold .sb{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.hold .rt{text-align:right;flex:none}
.hold .amt{font-size:13.5px;font-weight:800;letter-spacing:-.02em}
.hold .pl{font-size:11px;font-weight:700;margin-top:1px}
.badge{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:5px;
  background:var(--gold-s);color:var(--gold);margin-left:4px;vertical-align:middle}
.badge.err{background:#f7e7e5;color:var(--up)}
.badge.man{background:var(--soft);color:var(--brand)}
.badge.tgt{background:#e4f1ec;color:#2e7d6b}
.mbar{display:flex;align-items:flex-end;gap:3px;height:64px;margin:8px 0 4px}
.mbar > div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.mbar i{display:block;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
.mbar i.on{background:var(--brand)}
.mlab{display:flex;gap:3px;font-size:9px;color:var(--muted);text-align:center}
.mlab > span{flex:1}
.mlab > span.on{color:var(--brand);font-weight:800}
.diary{border-left:3px solid var(--soft-d);padding:2px 0 2px 11px;margin-bottom:14px}
.diary .d1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.diary .dt{font-size:11.5px;font-weight:800;color:var(--brand)}
.diary .dn{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.diary .dx{font-size:13px;line-height:1.65;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.diary .dm{font-size:10.5px;color:var(--muted);margin-top:4px}

/* ---------- 그룹 헤더 ---------- */
.ghead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px 8px}
.ghead .gl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:900;letter-spacing:-.02em}
.ghead .gr{font-size:12px;font-weight:800}
.dot{width:9px;height:9px;border-radius:3px;flex:none}

/* ---------- chips / buttons ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);color:var(--brand-d);
  border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip.line{background:#fff;border:1px solid var(--line)}
.chip.on{background:var(--brand);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chips.scroll::-webkit-scrollbar{display:none}
.btn{background:var(--brand);color:#fff;border-radius:12px;padding:11px 16px;font-size:13.5px;font-weight:800;
  box-shadow:0 3px 10px -4px rgba(29,75,70,.7)}
.btn.block{display:block;width:100%;text-align:center}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--soft-d);box-shadow:none}
.btn.sm{padding:8px 12px;font-size:12px;border-radius:10px}
.btn.warn{background:var(--up)}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:40;border-radius:999px;
  padding:13px 20px;font-size:14px;box-shadow:0 8px 22px -6px rgba(29,75,70,.8)}

/* ---------- 도넛 · 막대 ---------- */
.donut-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.donut{width:132px;height:132px;flex:none}
.legend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:5px}
.legend div{display:flex;align-items:center;gap:6px;font-size:11.5px}
.legend .lname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .lval{font-weight:800;font-variant-numeric:tabular-nums}
.legend .lpct{color:var(--muted);width:38px;text-align:right}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px}

/* ---------- 검색 ---------- */
.srch{position:relative}
.srch input{padding-left:34px;font-size:14px;padding-top:11px;padding-bottom:11px}
.srch .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5}
.res{margin-top:8px;max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.res .r{display:flex;align-items:center;gap:9px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.res .r:active{background:var(--soft)}
.res .r .tag{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--soft);
  color:var(--brand-d);flex:none}
.res .r .n{flex:1;min-width:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .r .c{font-size:11px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);font-size:12.5px;padding:26px 10px;line-height:1.7}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(20,24,30,.44);z-index:60;display:flex;align-items:flex-end;
  justify-content:center;padding:0}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;
  overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(18px);opacity:.4}}
@media(min-width:620px){.mask{align-items:center;padding:20px}.modal{border-radius:20px}}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mhead h3{font-size:15.5px;font-weight:900;letter-spacing:-.03em}
.mhead .x{font-size:19px;color:var(--muted);padding:2px 6px}
.f{margin-bottom:10px}
.f label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.f .hint{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:11px;padding:3px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:11.5px;font-weight:700;color:var(--brand-d)}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:12.5px;font-weight:600;
  z-index:80;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center}
#toast.on{opacity:.96}

/* ---------- 표 ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:10.5px;color:var(--muted);font-weight:700;text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* ---------- 붙여넣기 미리보기 ---------- */
.prow{border-bottom:1px solid var(--line);padding:9px 2px}
.prow:last-child{border-bottom:none}
.prow.off{opacity:.4}
.prow .p1{display:flex;align-items:center;gap:7px}
.prow .p1 input[type=checkbox]{width:17px;height:17px;flex:none;accent-color:var(--brand)}
.prow .p1 .pn{flex:1;min-width:0;font-size:13px;font-weight:700;border:none;background:transparent;padding:2px 0}
.prow .p1 select{width:auto;flex:none;font-size:11px;padding:4px 6px;border-radius:8px;max-width:38%}
.prow .p2{display:flex;gap:6px;margin-top:5px;padding-left:24px}
.prow .p2 label{flex:1;font-size:10px;color:var(--muted);font-weight:700}
.prow .p2 input{font-size:12.5px;padding:6px 8px;margin-top:2px}
.prow .warn{font-size:10.5px;color:var(--up);padding-left:24px;margin-top:3px;font-weight:700}
.prow .dup{font-size:10.5px;color:var(--gold);padding-left:24px;margin-top:4px;font-weight:700;
  display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.prow .dup .chip{padding:3px 9px;font-size:10px}
.acct{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:5px;
  background:var(--soft);color:var(--brand);margin-right:4px}
.praw{font-size:10.5px;color:var(--muted);white-space:pre-wrap;word-break:break-all;
  background:#faf8f2;border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-height:120px;overflow-y:auto}
.note{background:var(--gold-s);border:1px solid #f0dcbb;border-radius:12px;padding:10px 12px;font-size:11.5px;
  line-height:1.6;color:#7a5518}
.note.info{background:var(--soft);border-color:var(--soft-d);color:var(--brand-d)}
.note b{font-weight:800}
</style>
</head>
<body>

<header>
  <div class="wrap head-in">
    <div>
      <div class="brand">OUR ASSETS</div>
      <h1>우리집 자산</h1>
    </div>
    <div class="head-right">
      <div class="head-meta" id="headMeta"></div>
      <button class="gear" id="btnRefresh" data-act="refresh" title="시세 새로고침">🔄</button>
      <button class="gear" data-act="tab" data-tab="set">⚙️</button>
    </div>
  </div>
</header>

<nav class="tabs">
  <div class="wrap">
    <div class="tabbar" id="tabbar"></div>
  </div>
</nav>

<main class="wrap"><div id="view"></div></main>

<button class="btn fab" id="fab" data-act="tab" data-tab="add">＋ 담기</button>
<div id="modalRoot"></div>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   0. 상수 · 유틸
   ============================================================ */
const KEY = 'myAssets.v1';

/* 자산 종류 — auto:true 는 시세를 자동으로 가져오는 것들 */
const CATS = [
  { k:'kr',   label:'국내주식·ETF', emo:'🇰🇷', unit:'주', ccy:'KRW', auto:true,  color:'#d0729a' },
  { k:'us',   label:'미국주식·ETF', emo:'🇺🇸', unit:'주', ccy:'USD', auto:true,  color:'#3f6fa8' },
  { k:'coin', label:'코인',        emo:'🪙', unit:'개', ccy:'KRW', auto:true,  color:'#e08b2e' },
  { k:'gold', label:'금',          emo:'🥇', unit:'g',  ccy:'KRW', auto:true,  color:'#c9a227' },
  { k:'fx',   label:'달러·외화',    emo:'💵', unit:'달러',  ccy:'KRW', auto:true,  color:'#2e7d6b' },
  { k:'real', label:'부동산',       emo:'🏠', unit:'채', ccy:'KRW', auto:false, color:'#5a6dab' },
  { k:'cash', label:'예적금·현금',  emo:'💰', unit:'',   ccy:'KRW', auto:false, color:'#7c8390' },
  { k:'etc',  label:'연금·펀드·기타',emo:'💼', unit:'',  ccy:'KRW', auto:false, color:'#9b5aa8' }
];
const CAT = k => CATS.find(c=>c.k===k) || CATS[6];
const catLabel = k => { const c=CAT(k); return c.emo+' '+c.label; };
/* 수량 없이 '금액'만 적는 종류 */
const isAmountCat = k => k==='cash' || k==='etc' || k==='real';

/* 계좌 종류 — 세금·인출 규칙이 달라서 따로 봅니다 */
const ACCT_TYPES = [
  { k:'일반',    label:'일반·위탁',   emo:'📋', color:'#5a6dab' },
  { k:'ISA',     label:'ISA',        emo:'🧾', color:'#2e7d6b' },
  { k:'연금저축', label:'연금저축',    emo:'🌱', color:'#7aa03f' },
  { k:'IRP',     label:'IRP·퇴직연금', emo:'🏦', color:'#9b5aa8' },
  { k:'기타',    label:'기타',        emo:'📦', color:'#7c8390' }
];
const ACCT_T = k => ACCT_TYPES.find(x=>x.k===k) || ACCT_TYPES[0];
/* 세금 혜택이 있는(=바로 못 빼는) 계좌 */
const isPension = t => t==='연금저축' || t==='IRP';
const isTaxAcct = t => isPension(t) || t==='ISA';

/* 자산 성격 — '무엇에 투자했나'.
   금을 현물로 갖든 금 ETF로 갖든 '금'이고,
   달러를 외화예금으로 갖든 미국채 ETF로 갖든 성격이 다릅니다. */
const KINDS = [
  { k:'stock', label:'주식',      emo:'🏢', color:'#d0729a' },
  { k:'bond',  label:'채권',      emo:'📜', color:'#5a6dab' },
  { k:'gold',  label:'금·원자재',  emo:'🥇', color:'#c9a227' },
  { k:'fx',    label:'달러·외화',  emo:'💵', color:'#2e7d6b' },
  { k:'real',  label:'부동산',    emo:'🏠', color:'#7a6a55' },
  { k:'cash',  label:'현금성',    emo:'💰', color:'#7c8390' },
  { k:'coin',  label:'코인',      emo:'🪙', color:'#e08b2e' },
  { k:'etc',   label:'기타',      emo:'📦', color:'#9b5aa8' }
];
const KIND = k => KINDS.find(x=>x.k===k) || KINDS[7];
const kindLabel = k => { const x = KIND(k); return x.emo+' '+x.label; };
/* 이름·티커를 보고 성격을 짐작합니다 (언제든 직접 바꿀 수 있어요) */
const GOLD_RE = /골드(?!만)|금현물|금선물|\bGLD\b|\bIAU\b|\bGC=F\b|원자재|\bDBC\b|은현물|\bSLV\b|팔라듐|백금/i;
const BOND_RE = /채권|국채|회사채|\bBOND\b|\bTLT\b|\bIEF\b|\bSHY\b|\bAGG\b|\bBND\b|\bTIPS\b|\bLQD\b|만기매칭|종합채/i;
const REIT_RE = /리츠|\bREIT\b|\bVNQ\b/i;
const DOLL_RE = /달러|\bUUP\b|외화예금|외화/i;
const CASH_RE = /예금|적금|예치|파킹|\bMMF\b|\bCMA\b|비상금|통장/i;
function guessKind(h){

function bigWon(n){
  n = Math.round(n||0); const neg = n<0; n = Math.abs(n);
  const eok = Math.floor(n/100000000), man = Math.floor((n%100000000)/10000);
  let s;
  if(eok) s = `${eok}억${man? ' '+num(man)+'만' : ''}`;
  else if(man) s = `${num(man)}만`;
  else s = num(n);
  return (neg?'-':'')+s;
}
function shortWon(n){
  const neg = (n||0)<0; n = Math.round(Math.abs(n||0));
  let s;
  if(n >= 100000000) s = Math.round(n/10000000)/10+'억';
  else if(n >= 10000) s = (n%10000===0 ? n/10000 : Math.round(n/1000)/10)+'만';
  else s = String(n);
  return (neg?'-':'')+s;
}

/* '1억 2,000' · '3.5억' · '1,250만' 같은 입력도 알아듣게 */
/* '350000000' · '3.5억' · '3억 5000' · '3억 5000만' · '1,250만' 모두 알아듣습니다.
   억 뒤에 붙은 숫자는 만 단위로 봅니다 — '3억 5000' = 3억 5000만 = 350,000,000 */
function parseAmount(s){
  if(typeof s === 'number') return s;
  let t = String(s??'').trim();
  if(!t) return NaN;
  const neg = /^\(.*\)$/.test(t) || /^-/.test(t);
  t = t.replace(/[()\s,원]/g,'').replace(/^-/,'');
  if(!t) return NaN;
  let v;
  if(/[억만]/.test(t)){
    let sum = 0, rest = t;
    const e = rest.match(/^([0-9.]+)억/);
    if(e){ sum += parseFloat(e[1])*100000000; rest = rest.slice(e[0].length); }
    const m = rest.match(/^([0-9.]+)만/);
    if(m){ sum += parseFloat(m[1])*10000; rest = rest.slice(m[0].length); }
    else if(e && /^[0-9.]+$/.test(rest)){ sum += parseFloat(rest)*10000; rest = ''; }
    if(/^[0-9.]+$/.test(rest)) sum += parseFloat(rest);
    v = sum;
  } else {
    v = parseFloat(t.replace(/[^0-9.]/g,''));
  }
  if(!isFinite(v)) return NaN;
  v = Math.abs(v);
  return neg ? -v : v;
}
const parseQty = s => { const v = parseFloat(String(s??'').replace(/[,\s]/g,'')); return isFinite(v)? v : NaN; };

  if(s < 86400) return Math.floor(s/3600)+'시간 전';
  return Math.floor(s/86400)+'일 전';
}

const RELAYS = [
  { n:'직접',        f:u=>u },
  { n:'allorigins',  f:u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u) },

/* 구글 앱스 스크립트로 만드는 '내 전용 중계' — 한 번만 만들면 그 뒤로 손댈 게 없습니다.
   구글 서버가 대신 네이버·야후를 불러 주므로 브라우저의 CORS 제약을 받지 않습니다. */
const GAS_CODE = `function doGet(e) {
  var url = e.parameter.url;
  if (!url) return ContentService.createTextOutput('{"error":"no url"}')
    .setMimeType(ContentService.MimeType.JSON);

    muteHttpExceptions: true,
    followRedirects: true,
    headers: { 'User-Agent': 'Mozilla/5.0', 'Referer': 'https://finance.naver.com/' }
  });
  return ContentService.createTextOutput(r.getContentText())
    .setMimeType(ContentService.MimeType.JSON);
}`;
/* 붙여넣은 주소를 쓸 수 있는 형태로 다듬습니다 */
function normRelay(u){
  u = String(u||'').trim();
  if(!u) return '';
  if(u.includes('{url}')) return u;
  if(/script\.google\.com/.test(u)) return u.replace(/[?#].*$/,'') + '?url={url}';
  return u;
}
const gasOn = () => /script\.google\.com/.test(state.relayUrl||'');

/* ⚙️에서 직접 넣은 중계 주소가 있으면 그걸 맨 앞에 씁니다 ({url} 자리에 주소가 들어갑니다) */
function relayList(){
  const mine = String(state.relayUrl||'').trim();
  if(!mine) return RELAYS;
  const f = mine.includes('{url}')
    ? u => mine.replace('{url}', encodeURIComponent(u))
    : u => mine.replace(/\/+$/,'') + '/' + u;
  return [{ n: gasOn()? '내 구글 스크립트' : '내 중계', f }, ...RELAYS];
}
/* 이번 새로고침에서 막힌 경로 — 종목마다 다시 헤매지 않도록 기억합니다 */
let relayBad = new Set(), relayDead = false;
function resetRelays(){ relayBad = new Set(); relayDead = false; }

/* 실패를 두 가지로 나눕니다
   · net  — 중계 서버 자체에 못 닿음 (그 경로를 접습니다)
   · http — 중계는 살아 있는데 그쪽 주소가 없거나 오류 (다른 주소로 이어서 시도) */
async function getText(url, ms=6000){
  const ac = new AbortController();
  const t = setTimeout(()=>ac.abort(), ms);
  let r;
  try{ r = await fetch(url, { signal:ac.signal, cache:'no-store' }); }
  catch(e){ const err = new Error('연결 실패'); err.net = true; throw err; }
  finally{ clearTimeout(t); }
  if(!r.ok){ const err = new Error('HTTP '+r.status); err.http = r.status; throw err; }
  return await r.text();
}
async function getJSON(url, ms=6000){ return JSON.parse(await getText(url, ms)); }

/* 중계 서버를 돌려가며 시도합니다.
   · 성공한 경로를 기억해 다음엔 그것부터
   · 이번 새로고침에서 죽은 경로는 건너뛰고, 전부 죽었으면 곧바로 포기
     (예전에는 종목마다 5곳 × 9초씩 기다려서 2분 넘게 멈춘 것처럼 보였습니다) */
async function relayJSON(url){
  if(relayDead) throw new Error('시세 서버에 닿지 못했어요');
  const L = relayList();
  const first = Math.min(state.relay|0, L.length-1);
  const order = [first, ...L.map((_,i)=>i).filter(i=>i!==first)].filter(i=>!relayBad.has(i));
  if(!order.length){ relayDead = true; throw new Error('시세 서버에 닿지 못했어요'); }
  let netFail = 0, lastErr = null;
  for(const i of order){
    try{
      const txt = await getText(L[i].f(url));
      let j = JSON.parse(txt);
      if(L[i].wrap) j = JSON.parse(j[L[i].wrap]);             /* 껍데기에 담아 주는 곳 */
      if(state.relay !== i){ state.relay = i; writeLocal(); }
      return j;
    }catch(e){
      lastErr = e;
      if(e && e.net){ relayBad.add(i); netFail++; }           /* 이 경로만 접습니다 */
    }
  }
  /* 모든 경로가 '연결 실패'였을 때만 정말 막힌 것으로 봅니다 */
  if(netFail === order.length) relayDead = true;
  throw lastErr || new Error('시세 서버에 닿지 못했어요');
}

/* ---------- 네이버 금융 (국내주식 기본 출처) ---------- */
const numFrom = v => {
  if(typeof v === 'number') return v;
  const n = parseFloat(String(v??'').replace(/,/g,'').replace(/[^0-9.\-]/g,''));
  return isFinite(n) ? n : NaN;
};
/* 어제 종가 되짚기 — 등락률이 있으면 그걸로, 없으면 전일대비로 */
function naverPrev(p, j){
  const down = String(j?.compareToPreviousPrice?.code||'') === '5';   /* 5 = 하락 */
  /* 전일대비 금액이 정확합니다 (등락률은 소수점에서 반올림돼 있어요) */
  let d = numFrom(j?.compareToPreviousClosePrice);
  if(isFinite(d)){
    if(d > 0 && down) d = -d;
    if(p - d > 0) return p - d;
  }
  let ratio = numFrom(j?.fluctuationsRatio);
  if(isFinite(ratio) && ratio > -100){
    if(ratio > 0 && down) ratio = -ratio;
    const prev = p / (1 + ratio/100);
    if(prev > 0) return prev;
  }
  return p;
}
/* 국내주식·ETF — 증권사 앱과 같은 값이 나옵니다 */
async function naverKr(code){
  const tries = [
    `https://m.stock.naver.com/api/stock/${encodeURIComponent(code)}/basic`,
    `https://polling.finance.naver.com/api/realtime/domestic/stock/${encodeURIComponent(code)}`
  ];
  let last;
  for(const u of tries){
    try{
      const raw = await relayJSON(u);
      const j = raw?.datas?.[0] || raw;                 /* polling 쪽은 datas 배열에 담겨 옵니다 */
      const p = numFrom(j?.closePrice);
      if(!(p > 0)) throw new Error('시세 없음');
      return { p, prev: naverPrev(p, j), ccy:'KRW',
               name: j?.stockName || j?.itemName || '', src:'네이버' };
    }catch(e){ last = e; if(relayDead) break; }
  }
  throw last || new Error('네이버에서 시세를 못 찾았어요');
}
/* 미국주식 — 네이버는 티커에 거래소 꼬리표가 붙습니다 (.O 나스닥 / .K 뉴욕) */
async function naverUs(h){
  const cands = h.nsym ? [h.nsym] : [h.code+'.O', h.code+'.K'];
  let last;
  for(const sym of cands){
    try{
      const j = await relayJSON(`https://api.stock.naver.com/stock/${encodeURIComponent(sym)}/basic`);
      const p = numFrom(j?.closePrice);
      if(!(p > 0)) throw new Error('시세 없음');
      h.nsym = sym;
      return { p, prev: naverPrev(p, j), ccy: j?.currencyType?.code || 'USD',
               name: j?.stockName || '', src:'네이버' };
    }catch(e){ last = e; if(relayDead) break; }
  }
  throw last || new Error('네이버에서 시세를 못 찾았어요');
}
/* 네이버 환율·금 */
async function naverIndex(code){
  const j = await relayJSON(`https://m.stock.naver.com/api/marketindex/${code}`);
  const p = numFrom(j?.closePrice ?? j?.now ?? j?.basePrice);
  if(!(p > 0)) throw new Error('시세 없음');
  return { p, prev: naverPrev(p, j) };
}

/* 환율을 넣을 때 '어제 값'을 같이 남겨 둡니다 (등락 표시용)
   · 출처가 전일 종가를 주면 그걸 쓰고
   · 아니면 날짜가 바뀐 순간의 값을 어제 값으로 삼습니다 */
function setFx(v, src, prevFromSrc){
  const today = iso(new Date());
  const old = state.fx || {};
  let prev = +old.prev || 0;
  if(+prevFromSrc > 0) prev = +prevFromSrc;
  else if(+old.v > 0 && old.day && old.day !== today) prev = +old.v;
  state.fx = { v, at:Date.now(), src, day:today, prev };
}
const fxRate = () => {
  const f = state.fx || {};
  return (+f.prev > 0 && +f.v > 0) ? (f.v - f.prev) / f.prev : 0;
};

/* ============================================================
   📗 구글시트로 시세 받기
   ------------------------------------------------------------
   공개 중계 서버들이 다 막혀서 네이버·야후에 못 닿을 때를 위한 길입니다.
   구글은 브라우저가 바로 부를 수 있고(CORS 열림), GOOGLEFINANCE 는
   KRX 시세를 정확히 줍니다. 시트 한 번만 만들면 그 뒤론 자동입니다.
   ============================================================ */
/* GOOGLEFINANCE 가 알아듣는 이름으로 */
function gfSymbol(h){
  if(h.cat==='kr') return 'KRX:'+h.code;
  if(h.cat==='us') return h.code.replace('-','.');     /* BRK-B → BRK.B */
  return '';
}
/* 담은 종목으로 시트에 붙여넣을 수식을 만들어 줍니다 */
function sheetFormula(){
  const seen = new Set(), rows = [];
  (state.holdings||[]).forEach(h=>{
    if(h.cat!=='kr' && h.cat!=='us') return;
    const key = h.cat+':'+h.code;
    if(seen.has(key)) return; seen.add(key);
    const g = gfSymbol(h); if(!g) return;
    rows.push(`"${key}",IFERROR(GOOGLEFINANCE("${g}","price"),""),IFERROR(GOOGLEFINANCE("${g}","closeyest"),"")`);
  });
  rows.push('"fx:USD",IFERROR(GOOGLEFINANCE("CURRENCY:USDKRW"),""),""');
  /* 반드시 '한 줄'이어야 합니다 — 줄바꿈이 있으면 구글시트가 여러 칸으로 쪼개 넣습니다 */
  return '={"code","price","prev";' + rows.join(';') + '}';
}
/* 어떤 형태로 주소를 넣어도 CSV 주소로 바꿔 줍니다 */
function sheetCsvUrl(u){
  u = String(u||'').trim();
  if(!u) return '';
  if(/output=csv/.test(u)) return u;
  if(/\/spreadsheets\/d\/e\//.test(u)) return u.replace(/\/pub(html)?.*$/, '/pub?output=csv');
  const m = u.match(/\/spreadsheets\/d\/([a-zA-Z0-9\-_]+)/);
  if(m){
    const gid = (u.match(/[#&?]gid=(\d+)/)||[])[1] || '0';
    return `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv&gid=${gid}`;
  }
  return u;
}
function parseCsv(txt){
  return String(txt||'').split(/\r?\n/).filter(Boolean).map(line=>{
    const out = []; let cur = '', q = false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(q){ if(ch === '"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
      else if(ch === '"') q = true;
      else if(ch === ',') { out.push(cur); cur=''; }
      else cur += ch;
    }
    out.push(cur);
    return out.map(x=>x.trim());
  });
}
/* 시트에서 { 'kr:000660': {p, prev} } 를 만들어 옵니다 */
async function fetchSheet(){
  const url = sheetCsvUrl(state.sheet?.url);
  if(!url) return null;
  const txt = await getText(url, 8000);
  const rows = parseCsv(txt);
  const out = {};
  rows.forEach(r=>{
    const key = String(r[0]||'').trim();
    if(!/^(kr|us|fx):/.test(key)) return;
    const p = numFrom(r[1]);
    if(!(p>0)) return;
    const prev = numFrom(r[2]);
    out[key] = { p, prev: (isFinite(prev) && prev>0) ? prev : p };
  });
  if(!Object.keys(out).length) throw new Error('시트에서 시세를 못 읽었어요 — 수식과 게시 설정을 확인해 주세요');
  return out;
}

async function tryVia(i, url, ms){

async function runDiag(){
  if(diag.running) return;
  const L = relayList();
  diag = { running:true, at:Date.now(), good:-1,
           relays:L.map(r=>({ n:r.n, s:'기다리는 중' })),
           sources:DIAG_TARGETS.map(t=>({ n:t.n, s:'기다리는 중' })) };
  openDiag();
  /* ① 중계 경로 점검 */
  for(let i=0;i<L.length;i++){
    try{
      const j = await tryVia(i, DIAG_PROBE, 5000);
      const p = +(Array.isArray(j)? j[0]?.trade_price : 0);
      diag.relays[i].s = p>0 ? '✅ 됨' : '⚠️ 이상한 응답';
      if(p>0 && diag.good<0) diag.good = i;
    }catch(e){ diag.relays[i].s = '❌ '+errWord(e); }
    openDiag();
  }
  /* ② 시세 출처 점검 */
  for(let i=0;i<DIAG_TARGETS.length;i++){
    const t = DIAG_TARGETS[i];
    try{
      let j = null;
      if(t.direct){ try{ j = await getJSON(t.u, 5000); }catch(e){} }
      if(j === null){
        if(diag.good < 0) throw new Error('쓸 수 있는 중계 경로가 없음');
        j = await tryVia(diag.good, t.u, 6000);
      }
      const v = t.pick(j);
      diag.sources[i].s = (isFinite(v) && v>0) ? '✅ '+num(v) : '⚠️ 값을 못 읽음';
    }catch(e){ diag.sources[i].s = '❌ '+errWord(e); }
    openDiag();
  }
  /* ③ 구글시트를 연결해 뒀다면 그것도 */
  if(state.sheet?.url){
    diag.sources.push({ n:'📗 구글시트', s:'기다리는 중' });
    openDiag();
    try{
      const m = await fetchSheet();
      const n = Object.keys(m).length;
      diag.sources[diag.sources.length-1].s = n ? `✅ ${n}줄 읽음` : '⚠️ 비어 있음';
    }catch(e){ diag.sources[diag.sources.length-1].s = '❌ '+errWord(e); }
  }
  diag.running = false;
  openDiag();
}

/* ============================================================
   💰 배당
   ------------------------------------------------------------
   야후가 과거 배당 내역(날짜 + 1주당 금액)을 줍니다.
   여기서 '배당 월'과 '연 배당금'을 알아냅니다.
   ※ 날짜는 배당 기준일(배당락)입니다 — 실제 입금은 뒤에 옵니다.
      국내는 보통 2~3개월 뒤, 미국은 2~4주 뒤예요.
   ============================================================ */
async function fetchDivInfo(h){
  const sym = h.cat==='kr' ? (h.sym || h.code+'.KS') : (h.sym || h.code);
  const u = 'https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(sym)
          + '?range=3y&interval=1mo&events=div';
  const j = await relayJSON(u);
  const res = j?.chart?.result?.[0];
  const evs = res?.events?.dividends || {};
  const ccy = res?.meta?.currency || (h.cat==='kr' ? 'KRW' : 'USD');
  const list = Object.values(evs)
    .map(d=>({ ts:(+d.date||0)*1000, amount:+d.amount||0 }))
    .filter(d=>d.ts>0 && d.amount>0)
    .sort((a,b)=>a.ts-b.ts);
  const now = Date.now();
  const recent = list.filter(d=>d.ts > now - 2*365*86400000);
  const months = [...new Set(recent.map(d=>new Date(d.ts).getMonth()+1))].sort((a,b)=>a-b);
  const yearSum = list.filter(d=>d.ts > now - 370*86400000).reduce((s,d)=>s+d.amount, 0);
  return { at:now, ccy, months, yearSum, n:list.length,
           last: list.length ? list[list.length-1] : null };
}
const divKey = h => h.cat + ':' + (h.code || h.id);
const divInfoOf = h => (state.divInfo||{})[divKey(h)] || null;
/* 몇 번 주는지 */
function divFreq(info){
  const n = info?.months?.length || 0;
  return n >= 10 ? '월배당' : n >= 4 ? '분기 배당' : n >= 2 ? '반기 배당' : n === 1 ? '연 1회' : '';
}
/* 이번 달에 배당 기준일이 있는 종목 */
function divThisMonth(){
  const m = new Date().getMonth() + 1;
  return activeHoldings().filter(h=>{
    const i = divInfoOf(h);
    return i && (i.months||[]).includes(m);
  });
}
/* 배당 받은 기록 — 원화로 환산한 금액 */
function divKrw(d){
  const v = +d.amount || 0;
  return d.ccy === 'USD' ? v * (+state.fx?.v || 0) : v;
}
const divsOf = h => (state.divs||[]).filter(d=>d.code && d.code===h.code && d.cat===h.cat);
function divYearTotal(year){
  return (state.divs||[]).filter(d=>String(d.date||'').slice(0,4) === String(year))
    .reduce((s,d)=>s+divKrw(d), 0);
}
function divByMonth(year){
  const out = new Array(12).fill(0);
  (state.divs||[]).forEach(d=>{
    if(String(d.date||'').slice(0,4) !== String(year)) return;
    const m = +String(d.date).slice(5,7);
    if(m>=1 && m<=12) out[m-1] += divKrw(d);
  });
  return out;
}

/* 시세는 '종목' 기준으로 담습니다.
   예전에는 sym(000660.KS 같은 거래소 붙은 이름)으로 담아서,
   같은 종목이라도 계좌마다 다른 칸에 저장돼 시세가 어긋날 수 있었습니다. */
const pxKey = h => h.cat + ':' + (h.code || h.sym || h.id);
/* 같은 종목(같은 코드)인 자산들 — 계좌만 다른 것들 */
function sameStock(h){
  if(!h.code) return [h];
  return (state.holdings||[]).filter(x=>x.cat===h.cat && x.code===h.code);
}
/* 이 종목의 현재 시세 (직접 입력한 값이 있으면 그게 우선) */
function priceOf(h){
  const c = CAT(h.cat);
  if(h.mp !== undefined && h.mp !== null && h.mp !== '')
    return { p:+h.mp, prev:+h.mp, ccy:c.ccy, at:h.mpAt||0, src:'직접 입력', manual:true };
  if(!c.auto) return { p:0, prev:0, ccy:'KRW', at:0, src:'', manual:false, none:true };
  const q = state.px[pxKey(h)];
  if(!q) return { p:0, prev:0, ccy:c.ccy, at:0, src:'', manual:false, none:true };
  return { ...q, manual:false };
}

/* 원화 환산 계산 — 한 종목의 평가금액 · 원금 · 손익 */
function calc(h){
  const c = CAT(h.cat);
  const q = +h.qty || 0;
  const px = priceOf(h);
  const fx = +state.fx?.v || 0;
  const toKrw = v => (px.ccy==='USD' ? v*fx : v);

  const nowP = +px.p || 0;
  const prevP = +px.prev || nowP;
  const value = toKrw(nowP * q);                       /* 지금 평가금액(원) */
  const prevValue = toKrw(prevP * q);                  /* 어제 종가 기준(원) */

  const avg = +h.avg || 0;
  const avgFx = +h.avgFx || 0;                         /* 매수 당시 환율(있을 때만) */
  const cost = px.ccy==='USD' ? avg*q*(avgFx>0? avgFx : fx) : avg*q;

  const loan = +h.loan || 0;                           /* 부동산 대출 */
  const ready = !px.none && nowP>0;
  /* 시세를 못 받았으면 손익은 0 — 안 그러면 -100% 손실처럼 보입니다 */
  const pl = (ready && cost>0) ? value - cost : 0;
  const plRate = (ready && cost>0) ? pl/cost : 0;
  const day = (ready && prevValue>0) ? value - prevValue : 0;
  const dayRate = (ready && prevP>0) ? (nowP-prevP)/prevP : 0;
  return { px, value, cost, loan, net:value-loan, pl, plRate, day, dayRate, ready };
}
const activeHoldings = () => (state.holdings||[]).filter(h=>!h.hide);
/* 자동으로 받아올 수 있는데 직접 넣은 시세를 쓰고 있는 것들 */
const hasMp = h => h.mp !== undefined && h.mp !== null && h.mp !== '';
const manualPriced = () => activeHoldings().filter(h=>CAT(h.cat).auto && hasMp(h));
function inOwner(h){ return ui.owner==='전체' || (h.owner||'공동')===ui.owner; }
/* 전체 합계 */
function totals(list){
  list = list || activeHoldings().filter(inOwner);
  let value=0, cost=0, cval=0, loan=0, day=0, missing=0;
  list.forEach(h=>{
    const r = calc(h);
    value += r.value; loan += r.loan; day += r.day;
    if(!r.ready){ missing++; return; }
    /* 원금을 적어 둔 자산끼리만 견줘야 수익률이 맞습니다
       (원금 없이 금액만 적은 예적금이 섞이면 수익률이 부풀려집니다) */
    if(r.cost > 0){ cost += r.cost; cval += r.value; }
  });
  return { value, cost, cval, loan, net:value-loan, pl: cost>0? cval-cost : 0,
           plRate: cost>0? (cval-cost)/cost : 0, day, missing, n:list.length };
}
/* 같은 자산을 세 가지로 나눠 볼 수 있습니다
   · cat  어디에 담았나 (국내주식 · 코인 · 부동산 …)
   · kind 무엇에 투자했나 (주식 · 채권 · 금 · 달러 …)
   · acct 어느 계좌인가 (미래에셋 · ISA · IRP …) */
/* 시세를 얼마나 자주 다시 가져올지 */
const EVERY = [

];

const AXES = [

  { k:'kind', label:'성격별' },
  { k:'acct', label:'계좌별' }

function axisOf(h, mode){
  if(mode==='kind'){ const x = KIND(kindOf(h)); return { key:x.k, label:kindLabel(x.k), color:x.color }; }
  if(mode==='acct'){
    const name = h.acct || '계좌 안 적음';
    const t = acctTypeOf(h);

             label: (h.acct? ACCT_T(t).emo+' ' : '📭 ') + name + (h.acct && t!=='일반' ? ` · ${t}` : '') };
  }
  const c = CAT(h.cat); return { key:c.k, label:catLabel(c.k), color:c.color };
}
/* 축 하나로 묶어서 합계 내기 — 큰 것부터 */
function byAxis(list, mode){
  list = list || activeHoldings().filter(inOwner);
  const m = new Map();
  list.forEach(h=>{
    const a = axisOf(h, mode), r = calc(h);
    if(!m.has(a.key)) m.set(a.key, { ...a, value:0, cost:0, cval:0, loan:0, day:0, n:0, items:[] });
    const g = m.get(a.key);
    g.value += r.value; g.loan += r.loan; g.day += r.day; g.n++; g.items.push(h);
    if(r.ready && r.cost > 0){ g.cost += r.cost; g.cval += r.value; }
  });
  return [...m.values()].sort((a,b)=>b.value-a.value);
}
function axisChips(act, cur){
  return `<div class="chips" style="margin-bottom:10px">${AXES.map(a=>
    `<button class="chip ${cur===a.k?'on':'line'}" data-act="${act}" data-v="${a.k}">${a.label}</button>`
  ).join('')}</div>`;
}

/* 목표가·손절가에 닿았는지 */
function hitOf(h){
  const r = calc(h);
  if(!r.ready) return '';
  const p = +r.px.p || 0;
  if(+h.target > 0 && p >= +h.target) return 'target';
  if(+h.stop   > 0 && p <= +h.stop)   return 'stop';
  return '';
}
const alertList = () => activeHoldings().map(h=>({h, hit:hitOf(h)})).filter(x=>x.hit);

/* 가져온 시세가 내 평단과 5배 넘게 차이 나면 잘못 붙었을 가능성이 큽니다.
   (증권사와 시세 서버가 서로 다른 종목·다른 단위를 보고 있는 경우) */
function priceOdd(h){
  const avg = +h.avg || 0;
  if(!avg) return false;
  const r = calc(h);
  if(!r.ready || r.px.manual) return false;
  const k = r.px.p / avg;
  return k > 5 || k < 0.2;
}

/* 투자 일기 — 적을 때 그 순간의 순자산도 같이 남겨 둡니다 */
function addDiary(text, holdId){
  const t = String(text||'').trim(); if(!t) return null;
  const s = totals(activeHoldings());
  state.diary = state.diary || [];
  const e = { id:uid(), at:Date.now(), date:iso(new Date()), text:t,
              hold:holdId||'', net:Math.round(s.net), tot:Math.round(s.value) };
  state.diary.push(e);
  return e;
}

/* ------------------------------------------------------------
   같은 종목을 증권사 계좌마다 따로 담아 두면(수량·평단이 다르니까)
   화면에서는 하나로 묶어 보여줍니다.
   ------------------------------------------------------------ */
function groupOf(items){
  const m = new Map();
  (items||[]).forEach(h=>{
    const k = h.code ? h.cat+':'+h.code : 'id:'+h.id;   /* 코드가 없는 건 묶지 않습니다 */
    if(!m.has(k)) m.set(k, []);
    m.get(k).push(h);
  });
  return [...m.values()];
}
/* 묶인 종목의 합계 — 평단은 수량으로 가중평균 */
function calcGroup(list){
  let qty=0, value=0, cost=0, cval=0, loan=0, day=0, wSum=0, wQty=0, ready=false, px=null;
  list.forEach(h=>{
    const r = calc(h);
    qty += +h.qty||0; value += r.value; loan += r.loan; day += r.day;
    if(r.ready){ ready = true; if(r.cost>0){ cost += r.cost; cval += r.value; } }
    if((+h.avg||0) > 0){ wSum += (+h.qty||0)*(+h.avg); wQty += (+h.qty||0); }
    if(!px || px.none) px = r.px;
  });
  const prevValue = value - day;
  return { qty, avg: wQty>0 ? wSum/wQty : 0, value, cost, cval, loan, net:value-loan,
           pl: cost>0? cval-cost : 0, plRate: cost>0? (cval-cost)/cost : 0,
           day, dayRate: prevValue>0 ? day/prevValue : 0, px: px||{}, ready };
}
const acctLabel = h => h.acct || '';

/* ---------- 시세 새로고침 ---------- */
async function refreshPrices(manual){
  if(refreshing) return;
  const list = activeHoldings().filter(h=>CAT(h.cat).auto && !(h.mp!==undefined && h.mp!==null && h.mp!==''));
  refreshing = true; resetRelays(); renderHeadMeta();
  const startedAt = Date.now();
  const outOfTime = () => Date.now() - startedAt > 45000;   /* 너무 오래 붙들지 않습니다 */
  let ok=0, fail=0;
  const done = new Set();                                   /* 시트에서 이미 받은 것 */
  try{
    /* ⓪ 구글시트가 연결돼 있으면 여기서 주식·환율을 한 번에 받습니다 */
    if(state.sheet?.url){
      try{
        const m = await fetchSheet();
        if(m['fx:USD']?.p > 0){ setFx(m['fx:USD'].p, '구글시트', m['fx:USD'].prev); ok++; }
        list.forEach(h=>{
          if(h.cat!=='kr' && h.cat!=='us') return;
          const q = m[h.cat+':'+h.code]; if(!q) return;
          state.px[pxKey(h)] = { p:q.p, prev:q.prev, ccy: h.cat==='us' ? 'USD' : 'KRW',
                                 name:h.name, at:Date.now(), src:'구글시트' };
          done.add(h.id); ok++;
        });
        state.sheet.at = Date.now(); state.sheet.error = '';
        state.sheet.keys = Object.keys(m);
      }catch(e){ state.sheet.error = e.message; }
    }
    /* ① 환율 — 국내주식만 갖고 있어도 늘 새로 받습니다 (전에는 그럴 때 영영 안 바뀌었습니다) */
    if(state.fx?.src !== '구글시트'){
      try{ const f = await fetchFx(); setFx(f.v, f.src, f.prev); ok++; }
      catch(e){ fail++; }
    }
    /* ② 달러(현금) 는 환율이 곧 시세입니다 */
    list.filter(h=>h.cat==='fx').forEach(h=>{
      if(state.fx?.v>0) state.px[pxKey(h)] = { p:state.fx.v, prev:(+state.fx.prev || state.fx.v),
        ccy:'KRW', name:'원/달러', at:Date.now(), src:state.fx.src };
    });
    /* ③ 코인 — 한 번에 모아서 */
    const coins = [...new Set(list.filter(h=>h.cat==='coin').map(h=>h.code))];
    if(coins.length){
      try{
        const m = await fetchCoins(coins);
        list.filter(h=>h.cat==='coin').forEach(h=>{
          const q = m[h.code]; if(!q) return;
          state.px[pxKey(h)] = { ...q, name:h.name, at:Date.now() };
        });
        ok += Object.keys(m).length; fail += coins.length - Object.keys(m).length;
      }catch(e){ fail += coins.length; }
    }
    /* ④ 주식 — 야후에서 3개씩 나눠서 */
    const stocks = list.filter(h=>(h.cat==='kr'||h.cat==='us') && !done.has(h.id));
    for(let i=0;i<stocks.length;i+=3){
      if(relayDead || outOfTime()){ fail += stocks.length - i; break; }
      const part = stocks.slice(i,i+3);
      await Promise.all(part.map(async h=>{
        try{
          const q = await quoteStock(h);
          state.px[pxKey(h)] = { p:q.p, prev:q.prev, ccy:q.ccy, name:q.name||h.name,
                                 at:Date.now(), src:q.src || '야후' };
          if(q.name && !h.official){ h.official = q.name; }
          ok++;
        }catch(e){ fail++; state.px[pxKey(h)] = { ...(state.px[pxKey(h)]||{}), err:e.message }; }
      }));
    }
    /* ④-2 배당 정보 — 자주 바뀌지 않으니 일주일에 한 번, 한 번에 4종목까지만 */
    if(!relayDead && !outOfTime()){
      state.divInfo = state.divInfo || {};
      const stale = activeHoldings()
        .filter(h=>(h.cat==='kr'||h.cat==='us') && h.code)
        .filter(h=>{ const i = state.divInfo[divKey(h)];
                     return !i || Date.now() - (i.at||0) > 7*86400000; })
        .slice(0, 4);
      for(const h of stale){
        if(relayDead || outOfTime()) break;
        try{ state.divInfo[divKey(h)] = await fetchDivInfo(h); }
        catch(e){ state.divInfo[divKey(h)] = { at:Date.now(), months:[], yearSum:0, n:0, err:true }; }
      }
    }
    /* ⑤ 금 */
    if(list.some(h=>h.cat==='gold') && state.fx?.v>0){
      try{
        const g = await fetchGold(state.fx.v);
        list.filter(h=>h.cat==='gold').forEach(h=>{
          state.px[pxKey(h)] = { ...g, name:'금 1g', at:Date.now() };
        });
        ok++;
      }catch(e){ fail++; }
    }
    state.lastRefresh = Date.now();
    state.lastFail = fail;
    takeSnapshot();
    buildLedger();
    writeLocal();
    /* 배우자 방의 금액표도 가끔(10분에 한 번) 갱신해 둡니다 */
    if(state.sync?.enabled && Date.now() - (state.sync.ledAt||0) > 600000){
      state.sync.ledAt = Date.now(); schedulePush();
    }
  } finally {
    refreshing = false;
    render();
    if(manual) toast(
      relayDead ? '시세 서버에 닿지 못했어요 — 인터넷을 확인하거나 종목을 눌러 직접 넣어 주세요'
      : fail ? `${ok}건 갱신 · ${fail}건 실패 — 종목을 눌러 직접 넣을 수 있어요`
      : ok ? '시세를 새로 가져왔어요'
      : manualPriced().length
        ? `직접 넣은 시세를 쓰는 중이에요 (${manualPriced().length}개) — ⚙️에서 자동으로 되돌릴 수 있어요`
        : '가져올 시세가 없어요');
  }
}
/* 종목 하나의 시세
   · 국내는 네이버 금융을 먼저 봅니다 (증권사 앱과 같은 값)
   · 안 되면 야후로, 코스피(.KS) → 코스닥(.KQ) 순서로 붙여 보고 되는 쪽을 기억합니다
   · 미국은 야후를 먼저, 안 되면 네이버 해외주식 */
async function quoteStock(h){
  let last;
  if(h.cat==='kr'){
    try{ return await naverKr(h.code); }catch(e){ last = e; }
    if(!relayDead){
      for(const sym of [...new Set([h.sym || (h.code+'.KS'), h.code+'.KS', h.code+'.KQ'])]){
        try{ const q = await yahoo(sym); h.sym = sym; return q; }
        catch(e){ last = e; if(relayDead) break; }
      }
    }
    throw last || new Error('시세를 못 찾았어요');
  }
  try{ return await yahoo(h.sym || h.code); }catch(e){ last = e; }
  if(!relayDead){ try{ return await naverUs(h); }catch(e){ last = e; } }
  throw last || new Error('시세를 못 찾았어요');
}
const symOf = h => h.sym || (h.cat==='kr' ? h.code+'.KS' : h.code);
/* ------------------------------------------------------------
   가계부 앱이 읽어 갈 '계산이 끝난 금액표'를 만들어 둡니다.
   가계부에는 시세가 없으니, 원화로 환산된 값을 여기서 미리 적어 둡니다.
   ------------------------------------------------------------ */
function buildLedger(){
  state.led = {
    at: Date.now(),
    rows: activeHoldings().map(h=>{
      const r = calc(h);
      return { owner:h.owner||'공동', cat:h.cat, name:h.name,
               acct:h.acct||'', atype:acctTypeOf(h), kind:kindOf(h),
               value:Math.round(r.value), loan:Math.round(r.loan) };
    }).filter(r=>r.value>0 || r.loan>0)
  };
}
/* 예전 버전에서 계좌마다 따로 저장돼 어긋난 시세를 한 번 정리합니다 */
function healPrices(){
  if(state.pxV === 3) return;
  state.px = {};                                   /* 종목 기준으로, 새 출처(네이버)에서 다시 받습니다 */
  groupOf(state.holdings||[]).forEach(g=>{
    if(g.length < 2) return;
    const has = h => h.mp!==undefined && h.mp!==null && h.mp!=='';
    const one = g.find(has);                       /* 한쪽에만 적어 둔 시세가 있으면 */
    if(one) g.forEach(h=>{ h.mp = one.mp; h.mpAt = one.mpAt; });   /* 나머지도 맞춥니다 */
  });
  state.pxV = 3;
}
/* 하루 한 번 총자산을 적어 둡니다 (추이 그래프용) */
function takeSnapshot(){
  const t = totals(activeHoldings());
  if(!t.n || !t.value || t.missing) return;   /* 덜 붙은 시세로 추이를 망치지 않게 */
  state.snap = state.snap || {};
  state.snap[iso(new Date())] = { tot:Math.round(t.value), net:Math.round(t.net) };
  const keys = Object.keys(state.snap).sort();
  if(keys.length > 400) keys.slice(0, keys.length-400).forEach(k=>delete state.snap[k]);
}

/* 업비트에서 받아 둔 목록 + 내장 목록을 합친 것 */
function coinPool(){
  const seen = new Set(), out = [];
  [...(state.coins?.list||[]), ...COIN_SEED].forEach(c=>{
    if(seen.has(c.code)) return; seen.add(c.code); out.push(c);
  });
  return out;
}

const norm = s => String(s||'').toLowerCase().replace(/[\s.\-&']/g,'');
function localSearch(cat, q){
  const n = norm(q); if(!n) return [];
  const pool = cat==='kr' ? KR_LIST : US_LIST;
  const hit = pool.filter(x => norm(x.name).includes(n) || norm(x.code).includes(n));
  /* 이름이 앞에서부터 맞는 것을 위로 */
  hit.sort((a,b)=>{
    const A = norm(a.name).startsWith(n) || norm(a.code).startsWith(n) ? 0 : 1;
    const B = norm(b.name).startsWith(n) || norm(b.code).startsWith(n) ? 0 : 1;
    return A-B;
  });
  return hit.slice(0, 12);
}
async function coinSearch(q){
  try{ await loadCoinList(); }catch(e){ /* 인터넷이 막혀도 내장 목록으로 찾습니다 */ }
  const list = coinPool();
  const n = norm(q);
  const hit = !n ? list.slice(0, 20)
    : list.filter(c => norm(c.kn).includes(n) || norm(c.en).includes(n) || norm(c.code).includes(n));
  return hit.slice(0, 20).map(c=>({ cat:'coin', code:c.code, sym:c.code, name:c.kn || c.en }));
}
/* 앱 목록에 없으면 야후로 더 찾아봅니다 */
async function remoteSearch(cat, q){
  const qs = await yahooSearch(q);
  const out = [];
  qs.forEach(x=>{
    const sym = String(x.symbol);
    const isKr = /\.(KS|KQ)$/.test(sym);
    if(cat==='kr' && !isKr) return;
    if(cat==='us' && isKr) return;
    if(cat==='us' && /\.[A-Z]{1,2}$/.test(sym)) return;      /* 다른 나라 거래소는 뺍니다 */
    out.push({ cat, sym, code: isKr ? sym.replace(/\.(KS|KQ)$/,'') : sym,
               name: x.longname || x.shortname || sym,
               ex: x.exchDisp || '' });
  });
  return out.slice(0, 12);
}

/* ============================================================
   3-2. 📋 잔고 붙여넣기 — 증권사·거래소 화면을 통째로
   ------------------------------------------------------------
   증권사마다 화면이 다 달라서 '이 형식만' 받지 않습니다.
   줄마다 ① 종목처럼 보이는 말 ② 숫자를 찾아내고,
   '수량 / 평균 / 현재가' 같은 말이 있으면 그걸 힌트로 씁니다.
   알아들은 결과는 표로 보여주고, 고친 뒤에 담습니다.
   ============================================================ */
const cleanNum = t => parseFloat(String(t).replace(/,/g,''));
/* 종목 이름·코드·티커 알아보기 */
function findSym(tok){
  const t = String(tok||'').trim();
  if(!t || t.length > 30) return null;
  const n = norm(t);
  if(!n) return null;
  /* ① 국내 6자리 코드 */
  const code6 = t.match(/(?:^|\D)(\d{6})(?:\D|$)/);
  if(code6){
    const c = code6[1];
    const seed = KR_LIST.find(x=>x.code===c);
    return seed ? { ...seed } : { cat:'kr', code:c, sym:c+'.KS', name:c };
  }
  if(/^\d/.test(n)) return null;                       /* 숫자로 시작하면 이름이 아닙니다 */
  /* ② 국내 종목 이름 */
  let hit = KR_LIST.find(x=>norm(x.name)===n)
         || KR_LIST.find(x=>norm(x.name).split(/\s+/)[0]===n);
  if(hit) return { ...hit };
  /* ③ 코인 (심볼 · 한글 이름) */
  const up = t.toUpperCase().replace(/[^A-Z0-9]/g,'');
  const coin = coinPool().find(c=>c.code===up) || coinPool().find(c=>norm(c.kn)===n || norm(c.en)===n);
  if(coin) return { cat:'coin', code:coin.code, sym:coin.code, name:coin.kn || coin.en || coin.code };
  /* ④ 미국 티커 · 이름 */
  const us = US_LIST.find(x=>x.code===up) || US_LIST.find(x=>norm(x.name).includes(n) && n.length>=2);
  if(us) return { ...us };
  /* ⑤ 국내 종목 이름 일부만 적힌 경우 */
  hit = KR_LIST.find(x=>norm(x.name).includes(n) && n.length>=2);
  if(hit) return { ...hit };
  return null;
}
/* 숫자 하나가 무엇을 뜻하는지, 바로 앞에 있는 말로 짐작 */
function numTag(line, pos){
  const head = line.slice(0, pos);
  const last = arr => Math.max(...arr.map(w=>head.lastIndexOf(w)));
  const q = last(['수량','보유','잔고','주식수']);
  const a = last(['평균','평단','매입가','매수가','매입단가','평균단가']);
  const skip = last(['현재','종가','평가','손익','수익','비중','총액','매입금액','합계','금액']);
  const best = Math.max(q, a, skip);
  if(best < 0) return '';
  if(best === skip) return 'skip';
  if(best === a) return 'avg';
  return 'qty';
}
function collectNums(line){
  const out = [];
  const re = /(-?\d[\d,]*(?:\.\d+)?)\s*(주|개|좌|그램|g|G|%|퍼센트)?/g;
  let m;
  while((m = re.exec(line))){
    const v = cleanNum(m[1]);
    if(isFinite(v)) out.push({ v, unit:m[2]||'', at:m.index });
  }
  return out;
}
function applyNums(row, line, nums){
  const rest = [];
  nums.forEach(n=>{
    if(n.unit==='%' || n.unit==='퍼센트') return;                 /* 수익률은 버립니다 */
    if(/주|개|좌|그램|g|G/.test(n.unit)){ if(!isFinite(row.qty)) row.qty = n.v; return; }
    const t = numTag(line, n.at);
    if(t==='skip') return;
    if(t==='qty'){ if(!isFinite(row.qty)) row.qty = n.v; return; }
    if(t==='avg'){ if(!isFinite(row.avg)) row.avg = n.v; return; }
    rest.push(n.v);
  });
  rest.forEach(v=>{
    if(!isFinite(row.qty)) row.qty = v;
    else if(!isFinite(row.avg)) row.avg = v;
  });
}
const NOISE = /^(종목|종목명|종목코드|단축코드|코드|보유|잔고|수량|평균|평단|매입|매수|매도|현재가|현재가격|평가|손익|손익률|수익률|등락률|비중|계좌|합계|총계|주문|체결|가능|증거금|예수금|보유수량|보유량|보유주식|잔고수량|매수평균가|매입평균가|매입가|평균단가|평가금액|매입금액|평가손익|미실현손익|주문가능|전체|더보기|정렬|원화|KRW|USD|총자산|총평가금액)$/;
/* 낱말에서 숫자·기호를 뺀 알맹이 ('보유수량 0.05' → '보유수량') */
const nameCore = t => String(t||'').replace(/[\d,.\s%+\-원$()]/g,'');
/* '이건 종목 이름 같다' — 알맹이가 두 자 이상이고, 수량·평균 같은 말이 아닌 것 */
function isNameWord(t){
  const raw = String(t||'').trim();
  if(!raw || /^[\d$]/.test(raw)) return false;
  const w = nameCore(raw);
  return /[가-힣A-Za-z]{2,}/.test(w) && !NOISE.test(w);
}
function parsePaste(text){
  const rows = [], unknown = [];
  const lines = String(text||'').split(/\r?\n/).map(l=>l.replace(/ /g,' ').trim()).filter(Boolean);
  let cur = null;
  const flush = () => { if(cur){ rows.push(cur); cur = null; } };
  for(const line of lines){
    if(NOISE.test(line)) continue;
    const cells = line.split(/\t+|\s{2,}|\|/).map(c=>c.trim()).filter(Boolean);
    const toks = cells.length>1 ? cells : line.split(/\s+/);
    /* 표 머리글처럼 전부 '수량·평균·현재가' 같은 말뿐이면 건너뜁니다 */
    if(toks.length>1 && toks.every(t=>NOISE.test(t))) continue;
    let hit = null;
    for(const t of toks){ if(NOISE.test(t)) continue; const m = findSym(t); if(m){ hit = m; break; } }
    /* 코드가 이름 뒤 칸에 따로 있는 경우도 잡아 줍니다 */
    if(!hit) { const m = findSym(line); if(m) hit = m; }
    const nums = collectNums(hit && hit.cat==='kr' && hit.code ? line.replace(hit.code,' ') : line);
    if(hit){
      /* 같은 종목이 이름·코드로 두 줄에 걸쳐 있으면 한 줄로 봅니다 */
      if(cur && cur.cat===hit.cat && cur.code===hit.code){ applyNums(cur, line, nums); cur.raw += ' / ' + line; continue; }
      flush();
      cur = { ...hit, qty:NaN, avg:NaN, use:true, raw:line };
      applyNums(cur, line, nums);
      continue;
    }
    /* 이름은 모르겠지만 '이름 같은 말 + 숫자 2개' 면 새 종목 줄로 봅니다 */
    const word = toks.filter(isNameWord).sort((a,b)=>b.length-a.length)[0];
    if(word && nums.filter(n=>n.unit!=='%').length >= 2){
      flush();
      cur = { cat:'kr', code:'', sym:'', name:word.replace(/[\d,.%+\-$]/g,'').trim() || word,
              qty:NaN, avg:NaN, use:true, raw:line, guess:true };
      applyNums(cur, line, nums);
      continue;
    }
    /* 그 밖에 숫자만 있는 줄은 바로 위 종목에 이어 붙입니다 */
    if(cur && nums.length && !word){
      applyNums(cur, line, nums); cur.raw += ' / ' + line;
      continue;
    }
    if(word) unknown.push(line);
  }
  flush();
  return { rows: rows.filter(r=>isFinite(r.qty) && r.qty>0), unknown };
}
/* 이름만 알고 코드를 모르는 줄은 인터넷 검색으로 채워 봅니다 */
async function resolvePasteRows(rows){
  const todo = rows.filter(r=>r.guess).slice(0, 10);
  for(const r of todo){
    try{
      let out = await remoteSearch('kr', r.name);
      if(!out.length) out = await remoteSearch('us', r.name);
      const n = norm(r.name);
      const best = out.find(x=>norm(x.name).includes(n) || norm(x.code)===n) || out[0];
      if(best){ r.cat=best.cat; r.code=best.code; r.sym=best.sym; r.name=best.name; r.guess=false; r.found=true; }
    }catch(e){ /* 인터넷이 막히면 직접 적게 둡니다 */ }
  }
}
/* 같은 종목이라도 명의·계좌가 다르면 다른 줄로 봅니다 (증권사 두 곳에 같은 종목) */
const dupOf = (r, owner, acct) => (state.holdings||[]).find(h=>
  h.cat===r.cat && h.code && h.code===r.code &&
  (h.owner||'공동')===(owner||'') && (h.acct||'')===(acct||''));

/* 도넛 */
function donut(parts, total){
  const R = 52, C = 2*Math.PI*R;
  let acc = 0;
  const segs = parts.filter(p=>p.v>0).map(p=>{
    const frac = total>0 ? p.v/total : 0;
    const dash = `${(C*frac).toFixed(2)} ${(C*(1-frac)).toFixed(2)}`;
    const off = (-C*acc).toFixed(2);
    acc += frac;
    return `<circle cx="66" cy="66" r="${R}" fill="none" stroke="${p.c}" stroke-width="19"
             stroke-dasharray="${dash}" stroke-dashoffset="${off}"
             transform="rotate(-90 66 66)"></circle>`;
  }).join('');
  return `<svg class="donut" viewBox="0 0 132 132" aria-hidden="true">
    <circle cx="66" cy="66" r="${R}" fill="none" stroke="#eceae2" stroke-width="19"></circle>
    ${segs}</svg>`;
}
/* 추이 꺾은선 */
function spark(points, w=300, h=64){
  if(points.length < 2) return '';
  const vs = points.map(p=>p.v);
  const mn = Math.min(...vs), mx = Math.max(...vs), sp = (mx-mn) || 1;
  const X = i => (i/(points.length-1))*(w-6)+3;
  const Y = v => h-6 - ((v-mn)/sp)*(h-14);
  const d = points.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const area = d + `L${X(points.length-1).toFixed(1)},${h} L${X(0).toFixed(1)},${h} Z`;
  const rise = vs[vs.length-1] >= vs[0];
  const col = rise ? '#d1453b' : '#2f62c4';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px" preserveAspectRatio="none">
    <path d="${area}" fill="${col}" opacity=".08"></path>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
  </svg>`;
}
/* 종목 한 줄 */

function resultsHTML(){
  if(ui.qcat==='gold'){
    return `<div class="res"><div class="r" data-act="pick" data-json='${esc(JSON.stringify(
      {cat:'gold', code:'GOLD', sym:'GC=F', name:'금 (1g)'}))}'>
      <span class="tag">금</span><span class="n">금 — 국제시세 기준 1g</span><span class="c">원/g</span></div></div>`;
  }
  if(ui.searching) return '<div class="empty">찾는 중…</div>';
  if(!ui.q.trim() && ui.qcat!=='coin') return '<div class="empty">종목 이름이나 코드를 적어 주세요</div>';
  if(!ui.res.length) return `<div class="empty">못 찾았어요.<br>
    <button class="chip line" data-act="manualCode">코드로 직접 담기</button></div>`;
  return ui.res.map(r=>`<div class="r" data-act="pick" data-json='${esc(JSON.stringify(r))}'>
    <span class="tag">${r.remote?'검색':'추천'}</span>
    <span class="n">${esc(r.name||r.code)}</span>
    <span class="c">${esc(r.code)}${r.ex?' · '+esc(r.ex):''}</span></div>`).join('');
}
let searchSeq = 0;
async function doSearch(){
  const q = ui.q.trim(), cat = ui.qcat, seq = ++searchSeq;
  resetRelays();                    /* 시세가 막혔더라도 검색은 다시 시도해 봅니다 */
  if(cat==='gold'){ ui.res=[]; return paintRes(); }
  if(cat==='coin'){
    ui.searching = true; paintRes();
    try{ ui.res = await coinSearch(q); }catch(e){ ui.res = []; }
    if(seq!==searchSeq) return;
    ui.searching = false; paintRes(); return;
  }
  if(!q){ ui.res = []; ui.searching=false; return paintRes(); }
  ui.res = localSearch(cat, q); ui.searching = true; paintRes();
  try{
    const more = await remoteSearch(cat, q);
    if(seq!==searchSeq) return;
    const have = new Set(ui.res.map(r=>r.sym||r.code));
    ui.res = [...ui.res, ...more.filter(r=>!have.has(r.sym||r.code)).map(r=>({...r, remote:true}))].slice(0,16);
  }catch(e){ /* 인터넷이 막혀도 앱 안 목록은 그대로 보입니다 */ }
  if(seq!==searchSeq) return;
  ui.searching = false; paintRes();
}
function paintRes(){ const el = $('#res'); if(el) el.innerHTML = resultsHTML(); }

const acctTypeOfName = n => (state.accts||{})[n]?.type || '일반';
const acctTypeOf = h => h.acct ? acctTypeOfName(h.acct) : (h.cat==='etc' ? '기타' : '일반');
function setAcctType(name, type){
  if(!name) return;
  state.accts = state.accts || {};
  state.accts[name] = { ...(state.accts[name]||{}), type: type||'일반' };
}
/* 계좌 이름마다 색을 하나씩 (계좌별로 볼 때 씁니다) */
const ACCT_COLORS = ['#3f6fa8','#2e7d6b','#c9862b','#9b5aa8','#d0729a','#5a6dab','#7a6a55','#487f7a'];
function acctColor(name){
  let n = 0; for(const ch of String(name||'')) n = (n*31 + ch.charCodeAt(0)) >>> 0;
  return ACCT_COLORS[n % ACCT_COLORS.length];
}
const acctDatalist = () =>
  `<datalist id="acctList">${acctNames().map(a=>`<option value="${esc(a)}">`).join('')}</datalist>`;

/* 💰 배당 받은 것 적기 */
function openDivForm(divId, holdId){
  const d = (state.divs||[]).find(x=>x.id===divId) || null;
  const h = holdId ? (state.holdings||[]).find(x=>x.id===holdId) : null;
  const seen = new Set(), opts = [];
  activeHoldings().forEach(x=>{
    const k = x.cat + ':' + (x.code || x.id);
    if(seen.has(k)) return; seen.add(k);
    opts.push({ k, name:x.name, cat:x.cat, code:x.code || '' });
  });
  const curKey = d ? (d.cat + ':' + (d.code || '')) : (h ? h.cat + ':' + (h.code || h.id) : '');
  /* 새로 적을 때, 최근 배당 × 내 수량으로 예상 금액을 채워 둡니다 (세금 뺀 값) */
  let est = '';
  if(!d && h){
    const i = divInfoOf(h);
    if(i?.last?.amount > 0){
      const gross = i.last.amount * (+h.qty || 0);
      const net = gross * (h.cat==='kr' ? 0.846 : 0.85);
      est = h.cat==='us' ? (Math.round(net*100)/100) : Math.round(net);
    }
  }
  const name = d ? (d.name||'') : (h ? h.name : '');
  openModal(`
    <div class="mhead"><h3>${d? '배당 기록 고치기' : '💰 배당 받은 것 기록'}</h3>
      <button class="x" data-act="close">✕</button></div>
    <div class="grid2">
      <div class="f"><label>받은 날</label>
        <input id="dvDate" type="date" value="${esc(d? d.date : iso(new Date()))}"></div>
      <div class="f"><label>통화</label>
        <div class="seg" id="dvCcy">${['KRW','USD'].map((c,i)=>
          `<button class="${(d? d.ccy : (h?.cat==='us'?'USD':'KRW'))===c ? 'on':''}"
            data-act="segOwner" data-v="${c}">${c==='KRW'?'원':'달러 $'}</button>`).join('')}</div></div>
    </div>
    <div class="f"><label>어느 종목</label>
      <select id="dvItem" onchange="var o=this.selectedOptions[0];var n=document.getElementById('dvName');if(n)n.value=o.dataset.nm||'';">
        <option value="" data-nm="">직접 적기</option>
        ${opts.map(o=>`<option value="${esc(o.k)}" data-nm="${esc(o.name)}"
          ${o.k===curKey?'selected':''}>${esc(o.name)}</option>`).join('')}
      </select></div>
    <div class="f"><label>이름</label>
      <input id="dvName" value="${esc(name)}" placeholder="예: SK하이닉스 배당"></div>
    <div class="f"><label>실제 받은 금액 <span class="muted">(세금 뗀 뒤)</span></label>
      <input id="dvAmt" inputmode="decimal" value="${d? esc(d.amount) : esc(est)}"
             placeholder="통장에 들어온 금액">
      ${est!==''? `<div class="hint">최근 배당 × 내 수량으로 계산한 <b>예상 금액</b>이에요. 실제 입금액으로 고쳐 주세요.</div>`:''}</div>
    <div class="f"><label>메모 <span class="muted">선택</span></label>
      <input id="dvMemo" value="${esc(d? (d.memo||'') : '')}" placeholder="예: 2분기 배당"></div>
    <button class="btn block" data-act="divSave" data-id="${esc(divId||'')}">저장</button>
    ${d? `<button class="btn warn block mt" data-act="divDel" data-id="${d.id}">이 기록 지우기</button>`:''}`);
}

/* 종목 차트·뉴스로 바로 가기 */
function chartUrl(h){
  if(h.cat==='kr')   return 'https://m.stock.naver.com/domestic/stock/'+encodeURIComponent(h.code)+'/total';
  if(h.cat==='us')   return 'https://m.stock.naver.com/worldstock/stock/'+encodeURIComponent(h.code)+'/total';
  if(h.cat==='coin') return 'https://upbit.com/exchange?code=CRIX.UPBIT.KRW-'+encodeURIComponent(h.code);
  if(h.cat==='gold') return 'https://finance.naver.com/marketindex/goldDetail.naver';
  if(h.cat==='fx')   return 'https://finance.naver.com/marketindex/exchangeDetail.naver?marketindexCd=FX_USDKRW';
  return '';
}

/* ============================================================
   10. 부부 공유 (Firestore REST) — 가계부·냉장고와 같은 방식
   ============================================================ */
const DEVICE = (()=>{ let d=localStorage.getItem('ma.device');
  if(!d){ d=uid(); localStorage.setItem('ma.device',d); } return d; })();
const fsUrl = path => `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(state.sync.projectId)}`
  + `/databases/(default)/documents/${path}?key=${encodeURIComponent(state.sync.apiKey)}`;
async function fsErr(r){
  try{ const j = await r.json(); return j?.error?.message || ('오류 '+r.status); }
  catch(e){ return '오류 '+r.status; }
}
async function fsGet(path){
  const r = await fetch(fsUrl(path));
  if(r.status===404) return null;
  if(!r.ok) throw new Error(await fsErr(r));
  const d = await r.json();
  return { json:d.fields?.json?.stringValue||'', rev:+(d.fields?.rev?.integerValue||0), by:d.fields?.by?.stringValue||'' };
}
async function fsPut(path, json, rev){
  const r = await fetch(fsUrl(path), { method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ fields:{ json:{stringValue:json}, rev:{integerValue:String(rev)}, by:{stringValue:DEVICE} } }) });
  if(!r.ok) throw new Error(await fsErr(r));
}
/* 가계부 앱이 이 목록을 읽어 갑니다 — 이름을 바꾸지 마세요 */
const CORE_KEYS = ['settings','holdings','accts','diary','divs','memo','led'];
function corePayload(){
  const o = {}; CORE_KEYS.forEach(k=>o[k]=state[k]);
  return JSON.stringify(o);
}
function applyCore(txt){
  const d = JSON.parse(txt);
  CORE_KEYS.forEach(k=>{ if(d[k]!==undefined) state[k]=d[k]; });
}
function schedulePush(){
  if(!state.sync?.enabled) return;
  state.sync.dirty = true;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(syncPush, 1200);
}
async function syncPush(){
  const c = state.sync;
  if(!c?.enabled || syncBusy) return;
  syncBusy = true;
  try{
    const rev = Date.now();
    await fsPut(`rooms/${c.room}/assets/core`, corePayload(), rev);
    c.rev = rev; c.lastAt = rev; c.error = ''; c.dirty = false;
  }catch(e){ c.error = e.message; }
  finally{ syncBusy=false; writeLocal(); renderHeadMeta(); }
}
async function syncPull(){
  const c = state.sync;
  if(!c?.enabled || syncBusy) return;
  if(c.dirty){ await syncPush(); return; }
  syncBusy = true;
  try{
    const doc = await fsGet(`rooms/${c.room}/assets/core`);
    if(doc && doc.rev > (c.rev||0) && doc.by !== DEVICE){
      applyingRemote = true; applyCore(doc.json); applyingRemote = false;
      c.rev = doc.rev; writeLocal(); render();
      toast('배우자가 바꾼 내용을 받아왔어요');
      refreshPrices();
    }
    c.lastAt = Date.now(); c.error = '';
  }catch(e){ c.error = e.message; }
  finally{ syncBusy=false; writeLocal(); renderHeadMeta(); }
}
function syncStart(){
  clearInterval(syncTimer); syncTimer = null;
  if(!state.sync?.enabled) return;
  syncPull();
  syncTimer = setInterval(()=>{ if(!document.hidden) syncPull(); }, 20000);
}
function parseFbConfig(text){
  const t = String(text||'');
  const api = t.match(/apiKey["'\s:]+([A-Za-z0-9_\-]{20,})/);
  const pid = t.match(/projectId["'\s:]+([a-z0-9\-]{4,})/i);
  if(!api || !pid) return null;
  return { apiKey: api[1], projectId: pid[1] };
}
function inviteLink(){
  const c = state.sync || {};
  return location.href.split('#')[0] + '#join='
       + b64e(JSON.stringify({ k:c.apiKey, p:c.projectId, r:c.room }));
}
(function readInvite(){

  if(!m) return;
  try{ const v = JSON.parse(b64d(m[1])); if(v.k&&v.p&&v.r) pendingInvite = v; }catch(e){}
  history.replaceState(null, '', location.pathname + location.search);
})();
function openJoinPrompt(){
