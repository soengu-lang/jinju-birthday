  openModal(`<div class="mhead"><h3>배우자 초대</h3><button class="x" data-act="close">✕</button></div>
    <div class="note info">방 <b>${esc(v.r)}</b> 에 연결하면 두 사람이 <b>같은 자산 목록</b>을 보게 됩니다.
      이 폰에 담아 둔 내용은 방에 있는 내용으로 바뀝니다.</div>
    <button class="btn block mt" data-act="joinYes" data-json='${esc(JSON.stringify(v))}'>연결하기</button>
    <button class="btn ghost block mt" data-act="close">나중에</button>`);
}

/* ============================================================
   11. 그리기 · 손가락 동작
   ============================================================ */
function render(){
  renderTabs();
  const v = ui.tab==='home' ? viewHome()
          : ui.tab==='list' ? viewList()
          : ui.tab==='note' ? viewNote()
          : ui.tab==='add'  ? viewAdd()
          : viewSet();
  $('#view').innerHTML = v;
  $('#fab').classList.toggle('hidden', ui.tab==='add' || ui.tab==='set' || ui.tab==='note');
  renderHeadMeta();
  const q = $('#q');
  if(q){ q.oninput = e => { ui.q = e.target.value; clearTimeout(doSearch._t);
           doSearch._t = setTimeout(doSearch, 240); };
         if(ui.q) q.setSelectionRange(ui.q.length, ui.q.length); }
}
const segPick = (wrapId, def) => {
  const el = $('#'+wrapId); if(!el) return def;
  const on = el.querySelector('button.on');
  return on ? on.dataset.v : def;
};
function addHolding(o){
  state.holdings.push({ id:uid(), at:Date.now(), ...o });
  save();
}

document.addEventListener('click', async ev=>{
  const b = ev.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;

  switch(act){

  /* ---------- 이동 ---------- */
  case 'tab':
    ui.tab = b.dataset.tab;
    if(ui.tab==='add'){ ui.res = []; }
    render();
    if(ui.tab==='add' && ui.qcat==='coin') doSearch();
    window.scrollTo(0,0);
    break;
  case 'owner': ui.owner = b.dataset.o; render(); break;
  case 'slice': ui.slice = b.dataset.v; render(); break;
  case 'group': ui.group = b.dataset.v; render(); break;
  case 'qcat':
    ui.qcat = b.dataset.c; ui.q=''; ui.res=[]; render();
    if(ui.qcat==='coin' || ui.qcat==='gold') doSearch();
    break;
  case 'close': case 'maskClose':
    if(act==='maskClose' && ev.target !== b) break;
    closeModal(); break;

  /* ---------- 담기 ---------- */
  case 'pick': openPickForm(JSON.parse(b.dataset.json)); break;
  case 'manualCode': {
    const code = prompt(ui.qcat==='kr' ? '종목코드 6자리를 적어 주세요 (예: 005930)'
                                       : '티커를 적어 주세요 (예: AAPL)');
    if(!code) break;
    const cd = code.trim().toUpperCase();
    openPickForm({ cat:ui.qcat, code:cd, sym: ui.qcat==='kr'? cd+'.KS' : cd, name:cd });
    break; }
  case 'segOwner':
    [...b.parentElement.children].forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); break;
  /* 칩으로 고른 값을 숨은 칸에 적어 둡니다 */
  case 'segChip': {
    [...b.parentElement.children].forEach(x=>{ x.classList.remove('on'); x.classList.add('line'); });
    b.classList.add('on'); b.classList.remove('line');
    const box = $('#'+b.dataset.g); if(box) box.textContent = b.dataset.v;
    break; }
  case 'fillName': { const el=$('#mName'); if(el){ el.value = b.dataset.v; el.focus(); } break; }

  case 'savePick': {
    const p = JSON.parse(b.dataset.json);
    const qty = parseQty($('#pQty')?.value);
    if(!isFinite(qty) || qty<=0){ toast('수량을 적어 주세요'); break; }
    const avg = parseQty($('#pAvg')?.value);
    const avgFx = parseQty($('#pAvgFx')?.value);
    const acct = ($('#pAcct')?.value||'').trim();
    lastAcct = acct;
    if(acct) setAcctType(acct, $('#pAT')?.textContent.trim() || '일반');
    addHolding({ cat:p.cat, code:p.code, sym:p.sym, name:p.name || p.code, acct,
                 owner: segPick('pOwner', ownerList()[0]),
                 qty, avg: isFinite(avg)? avg : 0,
                 avgFx: isFinite(avgFx)? avgFx : 0 });
    closeModal(); ui.tab='list'; render();
    toast(`${p.name||p.code} 담았어요`);
    refreshPrices();
    break; }

  case 'saveManual': {
    const cat = b.dataset.c;
    const name = ($('#mName')?.value||'').trim();
    const val = parseAmount($('#mVal')?.value);
    if(!name){ toast('이름을 적어 주세요'); break; }
    if(!isFinite(val)){ toast('평가금액을 적어 주세요'); break; }
    const cost = parseAmount($('#mCost')?.value);
    const loan = parseAmount($('#mLoan')?.value);
    addHolding({ cat, code:'', sym:'', name,
                 owner: segPick('mOwner', ownerList()[0]),
                 qty:1, avg: isFinite(cost)? cost : 0,
                 loan: isFinite(loan)? loan : 0,
                 memo: ($('#mMemo')?.value||'').trim(),
                 mp: val, mpAt: Date.now() });
    ui.tab='list'; render(); toast(`${name} 담았어요`);
    break; }

  /* ---------- 📋 잔고 붙여넣기 ---------- */
  case 'pasteOpen': openPasteForm(); break;
  case 'pasteParse': {
    const txt = $('#pasteBox')?.value || '';
    const owner = segPick('pasteOwner', ownerList()[0]);
    if(!txt.trim()){ toast('붙여넣은 내용이 없어요'); break; }
    lastPasteOwner = owner;
    lastPasteAcct = ($('#pasteAcct')?.value||'').trim();
    lastAcct = lastPasteAcct;
    if(lastPasteAcct) setAcctType(lastPasteAcct, $('#pasteAT')?.textContent.trim() || '일반');
    try{ await loadCoinList(); }catch(e){ /* 내장 목록으로도 충분합니다 */ }
    const out = parsePaste(txt);
    pasteRows = out.rows; pasteUnknown = out.unknown;
    const need = pasteRows.some(r=>r.guess);
    openPastePreview(owner, need);
    if(need){ await resolvePasteRows(pasteRows); openPastePreview(owner, false); }
    break; }
  case 'pMode': {
    syncPasteInputs();
    const r = pasteRows[+b.dataset.i]; if(!r) break;
    r.mode = b.dataset.m;
    openPastePreview(lastPasteOwner, false);
    break; }
  case 'pasteSave': {
    syncPasteInputs();
    const owner = b.dataset.owner || lastPasteOwner || ownerList()[0];
    const acct = lastPasteAcct;
    let added=0, updated=0, merged=0, skipped=0;
    pasteRows.forEach(r=>{
      if(!r.use) return;
      if(!isFinite(r.qty) || r.qty<=0){ skipped++; return; }
      const c = CAT(r.cat);
      if(r.cat==='gold' && !r.code){ r.code='GOLD'; r.sym='GC=F'; }
      if(c.auto && !r.code){ skipped++; return; }
      if(!c.auto){
        /* 예적금·연금·부동산은 '수량' 칸에 적힌 금액을 평가액으로 봅니다 */
        addHolding({ cat:r.cat, code:'', sym:'', name:r.name||'이름 없음', owner, acct,
                     qty:1, avg:+r.avg||0, mp:r.qty, mpAt:Date.now() });
        added++; return;
      }
      const sym = r.cat==='kr'
        ? ((r.sym && r.sym.indexOf(r.code)===0) ? r.sym : r.code+'.KS')
        : (r.cat==='gold' ? (r.sym||'GC=F') : r.code);
      const dup = dupOf(r, owner, acct);
      if(dup && r.mode==='merge'){
        /* 수량은 더하고, 평단은 수량으로 가중평균 */
        const q1 = +dup.qty||0, a1 = +dup.avg||0, q2 = r.qty, a2 = +r.avg||0;
        const q = q1 + q2;
        dup.avg = (a1>0 && a2>0) ? Math.round(((q1*a1 + q2*a2)/q)*10000)/10000 : (a1>0? a1 : a2);
        dup.qty = q; dup.sym = sym; merged++;
      }
      else if(dup){ dup.qty = r.qty; dup.avg = +r.avg||0; dup.sym = sym;
                    dup.name = r.name || dup.name; updated++; }
      else { addHolding({ cat:r.cat, code:r.code, sym, name:r.name||r.code, owner, acct,
                          qty:r.qty, avg:+r.avg||0 }); added++; }
    });
    save(); closeModal(); ui.tab='list'; render();
    toast([added && `${added}개 담기`, updated && `${updated}개 갱신`, merged && `${merged}개 합침`,
           skipped && `${skipped}개 건너뜀`].filter(Boolean).join(' · ') || '담을 게 없었어요');
    if(added+updated+merged) refreshPrices();
    break; }

  /* ---------- 종목 상세 ---------- */
  case 'open': openHold(id); break;
  case 'openGroup': openGroupModal(b.dataset.ids); break;
  case 'fixPrice': {
    const h = state.holdings.find(x=>x.id===id); if(!h) break;
    const r = calc(h), isUs = h.cat==='us';
    const cur = r.ready ? r.px.p : '';
    const box = sameStock(h);
    const v = prompt(
      `${h.name} 의 지금 시세를 적어 주세요${isUs?' (달러)':' (원)'}\n`
      + `계좌 ${box.length}곳에 모두 적용됩니다.\n`
      + `비우고 확인을 누르면 다시 자동으로 가져옵니다.`, cur);
    if(v === null) break;
    const t = String(v).trim();
    if(t === ''){ box.forEach(x=>{ x.mp = ''; }); save(); closeModal(); render(); refreshPrices(true); break; }
    const n = parseQty(t);
    if(!isFinite(n) || n<=0){ toast('숫자로 적어 주세요'); break; }
    box.forEach(x=>{ x.mp = n; x.mpAt = Date.now(); });
    save(); closeModal(); render();
    toast(`${h.name} 시세를 ${priceS(n, isUs?'USD':'KRW')}로 맞췄어요`);
    break; }
  case 'mergeGroup': {
    const list = String(b.dataset.ids||'').split(',')
      .map(x=>state.holdings.find(h=>h.id===x)).filter(Boolean);
    if(list.length<2) break;
    const where = list.map(h=>h.acct||h.owner||'계좌').join(', ');
    if(!confirm(`${list[0].name} 을(를) 한 줄로 합칠까요?\n\n${where}\n\n계좌 구분은 사라지고 수량이 더해집니다.`)) break;
    const keep = list[0];
    let qty = 0, wSum = 0, wQty = 0;
    list.forEach(h=>{
      const q = +h.qty||0, a = +h.avg||0;
      qty += q;
      if(a>0){ wSum += q*a; wQty += q; }
    });
    keep.qty = qty;
    keep.avg = wQty>0 ? Math.round((wSum/wQty)*10000)/10000 : 0;
    keep.acct = '';
    const drop = new Set(list.slice(1).map(h=>h.id));
    state.holdings = state.holdings.filter(h=>!drop.has(h.id));
    save(); closeModal(); render();
    toast(`${keep.name} ${list.length}개를 한 줄로 합쳤어요`);
    break; }
  case 'saveHold': {
    const h = state.holdings.find(x=>x.id===id); if(!h) break;
    const amt = isAmountCat(h.cat);
    if(amt){
      const v = parseAmount($('#hMp')?.value);
      h.mp = isFinite(v)? v : ''; h.mpAt = Date.now();
      h.qty = 1;
      const a = parseAmount($('#hAvg')?.value); h.avg = isFinite(a)? a : 0;
      const l = parseAmount($('#hLoan')?.value); h.loan = isFinite(l)? l : 0;
    } else {
      const q = parseQty($('#hQty')?.value); if(isFinite(q)) h.qty = q;
      const a = parseQty($('#hAvg')?.value); h.avg = isFinite(a)? a : 0;
      const fxv = parseQty($('#hAvgFx')?.value); h.avgFx = isFinite(fxv)? fxv : 0;
      const raw = ($('#hMp')?.value||'').trim();
      if(raw===''){ h.mp = ''; }
      else { const v = parseQty(raw); if(isFinite(v)){ h.mp = v; h.mpAt = Date.now(); } }
    }
    h.owner = segPick('hOwner', h.owner||'공동');
    if($('#hAcct')){
      h.acct = ($('#hAcct').value||'').trim();
      if(h.acct) setAcctType(h.acct, $('#hAT')?.textContent.trim() || '일반');
    }
    if($('#hKind')) h.kind = $('#hKind').textContent.trim() || undefined;
    /* 시세는 종목 하나에 하나뿐이라, 직접 적은 값은 같은 종목 모든 계좌에 함께 적용합니다 */
    if(!amt) sameStock(h).forEach(x=>{ x.mp = h.mp; x.mpAt = h.mpAt; });
    h.memo = ($('#hMemo')?.value||'').trim();
    const tv = parseQty($('#hTarget')?.value); h.target = isFinite(tv)? tv : 0;
    const sv = parseQty($('#hStop')?.value);   h.stop   = isFinite(sv)? sv : 0;
    h.why = ($('#hWhy')?.value||'').trim();
    const note = ($('#hNote')?.value||'').trim();
    if(note){
      h.notes = h.notes || [];
      h.notes.push({ date: iso(new Date()), text: note });
      addDiary(note, h.id);
    }
    save(); closeModal(); render(); toast(note? '저장하고 기록에 남겼어요' : '저장했어요');
    break; }
  case 'delHold': {
    const h = state.holdings.find(x=>x.id===id); if(!h) break;
    if(!confirm(`'${h.name}' 을(를) 지울까요?`)) break;
    state.holdings = state.holdings.filter(x=>x.id!==id);
    save(); closeModal(); render(); toast('지웠어요');
    break; }
  case 'oneRefresh': {
    const h = state.holdings.find(x=>x.id===id); if(!h) break;
    b.innerHTML = '<span class="spin">↻</span> 가져오는 중';
    resetRelays();
    try{
      if(!state.fx?.v && (h.cat==='us'||h.cat==='gold'||h.cat==='fx')){
        const f = await fetchFx(); state.fx = { v:f.v, at:Date.now(), src:f.src };
      }
      let q;
      if(h.cat==='coin')      q = (await fetchCoins([h.code]))[h.code];
      else if(h.cat==='gold') q = await fetchGold(state.fx.v);
      else if(h.cat==='fx')   q = { p:state.fx.v, prev:state.fx.v, ccy:'KRW', src:state.fx.src };
      else { const y = await quoteStock(h); q = { p:y.p, prev:y.prev, ccy:y.ccy, src:y.src||'야후' }; h.official = y.name||h.official; }
      if(!q) throw new Error('시세를 못 찾았어요');
      state.px[pxKey(h)] = { ...q, name:h.name, at:Date.now() };
      save(); openHold(id); toast('시세를 가져왔어요');
    }catch(e){ toast(e.message + ' — 아래에 직접 적어 주세요'); b.innerHTML = '🔄 다시 시도'; }
    break; }
  case 'openChart': {
    const h = state.holdings.find(x=>x.id===id); if(!h) break;
    const u = chartUrl(h); if(u) window.open(u, '_blank', 'noopener');
    break; }

  /* ---------- 💰 배당 ---------- */
  case 'divAdd': openDivForm('', id); break;
  case 'divEdit': openDivForm(id, ''); break;
  case 'divSave': {
    const amt = parseAmount($('#dvAmt')?.value);
    if(!isFinite(amt) || amt <= 0){ toast('받은 금액을 적어 주세요'); break; }
    const sel = $('#dvItem');
    const key = sel?.value || '';
    const [kcat, kcode] = key ? key.split(':') : ['',''];
    const o = {
      date: ($('#dvDate')?.value || iso(new Date())),
      cat: kcat, code: kcode,
      name: ($('#dvName')?.value||'').trim() || '배당',
      amount: amt,
      ccy: segPick('dvCcy', 'KRW'),
      memo: ($('#dvMemo')?.value||'').trim()
    };
    state.divs = state.divs || [];
    const cur = state.divs.find(x=>x.id===id);
    if(cur) Object.assign(cur, o);
    else state.divs.push({ id:uid(), at:Date.now(), ...o });
    save(); closeModal(); ui.tab='note'; render();
    toast(cur? '고쳤어요' : `${o.name} 배당 ${won(divKrw(o))} 기록했어요`);
    break; }
  case 'divDel': {
    if(!confirm('이 배당 기록을 지울까요?')) break;
    state.divs = (state.divs||[]).filter(d=>d.id!==id);
    save(); closeModal(); render(); toast('지웠어요');
    break; }

  /* ---------- 📝 기록 ---------- */
  case 'dAdd': {
    const t = ($('#dText')?.value||'').trim();
    if(!t){ toast('적을 내용을 써 주세요'); break; }
    addDiary(t); save(); render(); toast('기록에 남겼어요');
    break; }
  case 'dDel': {
    if(!confirm('이 기록을 지울까요?')) break;
    state.diary = (state.diary||[]).filter(d=>d.id!==id);
    save(); render(); toast('지웠어요');
    break; }

  /* ---------- 시세 ---------- */
  case 'refresh': refreshPrices(true); break;

  /* ---------- 설정 ---------- */
  case 'setAcctType':
    setAcctType(b.dataset.a, b.dataset.t); save(); render();
    toast(`${b.dataset.a} → ${b.dataset.t}`); break;
  case 'setEvery':
    state.settings.every = +b.dataset.v; save(); startPriceTimer(); render();
    toast(everyMin()? `${EVERY.find(e=>e.v===everyMin())?.l}마다 가져옵니다` : '열 때만 가져옵니다');
    break;
  case 'diag': runDiag(); break;
  case 'autoAll': {
    const box = manualPriced();
    if(!box.length){ toast('직접 넣은 시세가 없어요'); break; }
    if(!confirm(`${box.length}개 종목의 직접 넣은 시세를 지우고 자동으로 되돌릴까요?`)) break;
    box.forEach(h=>{ h.mp = ''; });
    save(); closeModal(); render();
    toast('자동 시세로 되돌렸어요 — 지금 가져올게요');
    refreshPrices(true);
    break; }
  case 'copyGas': {
    try{ await navigator.clipboard.writeText(GAS_CODE); toast('코드를 복사했어요 — script.new 에 붙여넣으세요'); }
    catch(e){ prompt('이 코드를 script.new 에 붙여넣으세요', GAS_CODE); }
    break; }
  case 'gasSave': {
    const u = normRelay($('#gasUrl')?.value||'');
    if(!u){ toast('웹 앱 URL을 붙여넣어 주세요'); break; }
    if(!/script\.google\.com/.test(u)){ toast('script.google.com 으로 시작하는 주소여야 해요'); break; }
    state.relayUrl = u; save(); resetRelays(); state.relay = 0; render();
    toast('연결했어요 — 시세를 가져와 볼게요');
    refreshPrices(true);
    break; }
  case 'gasOff':
    if(!confirm('구글 스크립트 연결을 끊을까요?')) break;
    state.relayUrl = ''; save(); resetRelays(); state.relay = 0; render();
    break;
  case 'copyFormula': {
    const f = sheetFormula();
    try{ await navigator.clipboard.writeText(f); toast('수식을 복사했어요 — 시트 A1에 붙여넣으세요'); }
    catch(e){ prompt('이 수식을 시트 A1에 붙여넣으세요', f); }
    break; }
  case 'sheetSave': {
    const u = ($('#shUrl')?.value||'').trim();
    if(!u){ toast('게시된 주소를 붙여넣어 주세요'); break; }
    state.sheet = { url:u, at:0, error:'' };
    save(); render(); toast('연결했어요 — 시세를 가져와 볼게요');
    refreshPrices(true);
    break; }
  case 'sheetOff':
    if(!confirm('구글시트 연결을 끊을까요? 다시 네이버·야후에서 가져옵니다.')) break;
    state.sheet = { url:'', at:0, error:'' }; save(); render();
    break;
  case 'relaySave': {
    state.relayUrl = normRelay($('#myRelay')?.value||'');
    save(); resetRelays(); state.relay = 0; render();
    toast(state.relayUrl? '저장했어요 — 이 경로를 먼저 씁니다' : '내 중계 서버를 끕니다');
    if(state.relayUrl) refreshPrices(true);
    break; }
  case 'diagCopy': {
    const t = diagText();
    try{ await navigator.clipboard.writeText(t); toast('점검 결과를 복사했어요'); }
    catch(e){ prompt('이 내용을 붙여넣어 주세요', t); }
    break; }
  case 'saveSettings': {
    const list = ($('#sOwners')?.value||'').split(/[,·\s]+/).filter(Boolean).slice(0,2);
    if(list.length===2){
      const [o1,o2] = owners();
      state.holdings.forEach(h=>{ if(h.owner===o1) h.owner=list[0]; else if(h.owner===o2) h.owner=list[1]; });
      if(ui.owner===o1) ui.owner=list[0]; else if(ui.owner===o2) ui.owner=list[1];
      state.settings.owners = list;
    }
    const g = parseAmount($('#sGoal')?.value);
    state.settings.goal = isFinite(g)? g : 0;
    save(); render(); toast('저장했어요');
    break; }
  case 'syncOn': {
    const cfg = parseFbConfig($('#fbCfg')?.value);
    const room = ($('#fbRoom')?.value||'').trim().replace(/[^A-Za-z0-9_\-]/g,'');
    if(!cfg){ toast('firebaseConfig 를 통째로 붙여넣어 주세요'); break; }
    if(!room){ toast('방 이름을 적어 주세요'); break; }
    state.sync = { enabled:true, ...cfg, room, rev:0, lastAt:0, error:'', dirty:true };
    save(false); await syncPush(); render(); syncStart();
    toast('연결했어요 — 초대 링크를 배우자에게 보내세요');
    break; }
  case 'syncReuse': {
    const c = fbFromOtherApp(); if(!c){ toast('다른 앱 설정을 못 찾았어요'); break; }
    const room = prompt('방 이름 (두 사람이 같아야 합니다)', c.room || 'ourassets') || '';
    const r = room.trim().replace(/[^A-Za-z0-9_\-]/g,''); if(!r) break;
    state.sync = { enabled:true, apiKey:c.apiKey, projectId:c.projectId, room:r, rev:0, lastAt:0, error:'', dirty:true };
    save(false); await syncPush(); render(); syncStart();
    toast('연결했어요');
    break; }
  case 'syncOff':
    if(!confirm('연결을 끊을까요? 이 폰의 내용은 그대로 남습니다.')) break;
    clearInterval(syncTimer); syncTimer=null;
    state.sync = { enabled:false }; save(false); render();
    break;
  case 'copyInvite': {
    const link = inviteLink();
    try{ await navigator.clipboard.writeText(link); toast('초대 링크를 복사했어요'); }
    catch(e){ prompt('이 링크를 배우자에게 보내세요', link); }
    break; }
  case 'joinYes': {
    const v = JSON.parse(b.dataset.json);
    state.sync = { enabled:true, apiKey:v.k, projectId:v.p, room:v.r, rev:0, lastAt:0, error:'' };
    save(false); closeModal(); syncStart(); render();
    toast('연결했어요');
    break; }
  case 'exportJson': {
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `우리집자산-${iso(new Date())}.json`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
    break; }
  case 'importJson': {
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='.json,application/json';
    inp.onchange = () => {
      const f = inp.files?.[0]; if(!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try{
          const d = JSON.parse(rd.result);
          if(!Array.isArray(d.holdings)) throw 0;
          state = { ...blankState(), ...d, sync: state.sync };
          save(); render(); toast('불러왔어요'); refreshPrices();
        }catch(e){ toast('이 파일은 못 읽겠어요'); }
      };
      rd.readAsText(f);
    };
    inp.click();
    break; }
  case 'wipe':
    if(!confirm('담아 둔 자산을 전부 지울까요? 되돌릴 수 없습니다.')) break;
    state = { ...blankState(), sync: state.sync, settings: state.settings };
    save(); ui.tab='home'; render(); toast('처음으로 되돌렸어요');
    break;
  }
});
/* 미리보기 표에 손으로 고친 값을 읽어 옵니다 */
function syncPasteInputs(){
  const at = el => pasteRows[+el.dataset.i];
  $$('.prow .pn').forEach(el=>{ const r=at(el); if(r) r.name = el.value.trim(); });
  $$('.prow .pq').forEach(el=>{ const r=at(el); if(r){ const v=parseQty(el.value); r.qty = isFinite(v)? v : NaN; } });
  $$('.prow .pa').forEach(el=>{ const r=at(el); if(r){ const v=parseQty(el.value); r.avg = isFinite(v)? v : 0; } });
  $$('.prow .pk').forEach(el=>{ const r=at(el); if(r) r.code = el.value.trim().toUpperCase(); });
  $$('.prow .pc').forEach(el=>{ const r=at(el); if(r) r.cat = el.value; });
}
document.addEventListener('change', e=>{
  const el = e.target, r = pasteRows[+el.dataset?.i];
  if(!r) return;
  if(el.classList.contains('pc')) r.cat = el.value;
  if(el.dataset.act === 'pUse'){
    r.use = el.checked;
    el.closest('.prow')?.classList.toggle('off', !r.use);
    const btn = $('[data-act="pasteSave"]');
    if(btn) btn.textContent = pasteRows.filter(x=>x.use).length + '개 담기';
  }
});
/* 검색창에서 엔터 */
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.id==='q'){ e.preventDefault(); clearTimeout(doSearch._t); doSearch(); }
});

/* ============================================================
   12. 시작
   ============================================================ */
state = load() || blankState();
state.settings = state.settings || { owners:['진주','성우'], goal:0 };
state.settings.owners = state.settings.owners || ['진주','성우'];
state.px = state.px || {};
state.fx = state.fx || { v:0, at:0, src:'' };
state.snap = state.snap || {};
state.coins = state.coins || { list:[], at:0 };
state.accts = state.accts || {};
state.sheet = state.sheet || { url:'', at:0, error:'' };
state.divs = state.divs || [];
state.divInfo = state.divInfo || {};
state.diary = state.diary || [];
healPrices();
state.sync = state.sync || { enabled:false };
buildLedger();
writeLocal();
render();
syncStart();
if(pendingInvite) openJoinPrompt();
/* 열 때 한 번, 그리고 정해 둔 주기마다 (⚙️에서 바꿀 수 있습니다) */
function startPriceTimer(){
  clearInterval(priceTimer); priceTimer = null;
  const m = everyMin();
  if(!(m > 0)) return;
  priceTimer = setInterval(()=>{
    if(!document.hidden && state.holdings.length) refreshPrices();
  }, m*60000);
}
if(state.holdings.length) refreshPrices();
startPriceTimer();
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) return;
  syncPull();
  const gap = (everyMin() || 10) * 60000;
  if(Date.now() - (state.lastRefresh||0) > gap && state.holdings.length) refreshPrices();
});
</script>
